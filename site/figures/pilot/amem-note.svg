<svg xmlns="http://www.w3.org/2000/svg" width="736" height="520" viewBox="0 0 736 520" role="img" aria-labelledby="title desc">
<title id="title">A1  一张笔记，几种不同来源的字段</title><desc id="desc">原始内容与交互时间；模型生成关键词标签上下文；由文本计算向量；链接记录关联。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#586b67"/></marker></defs>
<rect width="736" height="520" fill="#fdfcf9"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="24" y="35" font-size="24" fill="#243735" font-weight="600">
<tspan x="24" dy="0">A1  一张笔记，几种不同来源的字段</tspan>
</text>
<text x="24" y="64" font-size="16" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">教学示意 · 人物、日期与结果为假设</tspan>
</text>
<rect x="24" y="100" width="204" height="256" rx="3" fill="#fff" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="38" y="132" font-size="20" fill="#243735" font-weight="600">
<tspan x="38" dy="0">原始记录</tspan>
</text>
<rect x="266" y="100" width="204" height="256" rx="3" fill="#edf4ef" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="280" y="132" font-size="20" fill="#243735" font-weight="600">
<tspan x="280" dy="0">模型补充的解释</tspan>
</text>
<rect x="508" y="100" width="204" height="256" rx="3" fill="#eff3f7" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="522" y="132" font-size="20" fill="#243735" font-weight="600">
<tspan x="522" dy="0">查找用的表示</tspan>
</text>
<text x="38" y="173" font-size="17" fill="#243735" font-weight="400">
<tspan x="38" dy="0">原文节选</tspan>
<tspan x="38" dy="26.35">“打算每天练半小时”</tspan>
<tspan x="38" dy="26.35"></tspan>
<tspan x="38" dy="26.35">交互时间</tspan>
<tspan x="38" dy="26.35">3 月 1 日</tspan>
</text>
<text x="280" y="173" font-size="17" fill="#243735" font-weight="400">
<tspan x="280" dy="0">关键词：吉他、练习</tspan>
<tspan x="280" dy="26.35">标签：兴趣、安排</tspan>
<tspan x="280" dy="26.35"></tspan>
<tspan x="280" dy="26.35">上下文描述：</tspan>
<tspan x="280" dy="26.35">开始建立练琴习惯</tspan>
</text>
<text x="522" y="173" font-size="17" fill="#243735" font-weight="400">
<tspan x="522" dy="0">向量 embedding</tspan>
<tspan x="522" dy="26.35"></tspan>
<tspan x="522" dy="26.35">原文＋关键词＋</tspan>
<tspan x="522" dy="26.35">标签＋上下文</tspan>
<tspan x="522" dy="26.35">编码成一串数字</tspan>
</text>
<line x1="230" y1="219" x2="260" y2="219" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="472" y1="219" x2="502" y2="219" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="338" font-size="16" fill="#235f55" font-weight="400">
<tspan x="280" dy="0">生成内容需要核对</tspan>
</text>
<rect x="24" y="386" width="688" height="104" rx="3" fill="#f5f2e9" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="40" y="416" font-size="19" fill="#243735" font-weight="600">
<tspan x="40" dy="0">还有一个字段：链接</tspan>
</text>
<text x="40" y="449" font-size="18" fill="#243735" font-weight="400">
<tspan x="40" dy="0">当前笔记</tspan>
</text>
<line x1="142" y1="443" x2="278" y2="443" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="449" font-size="18" fill="#243735" font-weight="400">
<tspan x="290" dy="0">另一条相关笔记</tspan>
</text>
<text x="40" y="477" font-size="16" fill="#586b67" font-weight="400">
<tspan x="40" dy="0">写入时判断关联；没有建立关联时，链接集合为空。</tspan>
</text>
</g></svg>