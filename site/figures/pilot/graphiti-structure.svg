<svg xmlns="http://www.w3.org/2000/svg" width="736" height="540" viewBox="0 0 736 540" role="img" aria-labelledby="title desc">
<title id="title">G1  从一条消息，到有出处的关系</title><desc id="desc">消息E2保存在图中，抽取为小林和杭州实体及居住关系；关系追溯到E2。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#586b67"/></marker></defs>
<rect width="736" height="540" fill="#fdfcf9"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="24" y="35" font-size="24" fill="#243735" font-weight="600">
<tspan x="24" dy="0">G1  从一条消息，到有出处的关系</tspan>
</text>
<text x="24" y="64" font-size="16" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">教学示意 · 人物、日期与结果为假设</tspan>
</text>
<rect x="24" y="94" width="652" height="111" rx="3" fill="#ffffff" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="42" y="126" font-size="20" fill="#243735" font-weight="600">
<tspan x="42" dy="0">原始消息 E2</tspan>
</text>
<text x="42" y="162" font-size="20" fill="#243735" font-weight="400">
<tspan x="42" dy="0">“我 5 月 1 日已经搬到杭州住了。”</tspan>
</text>
<text x="42" y="188" font-size="16" fill="#586b67" font-weight="400">
<tspan x="42" dy="0">5 月 3 日送入系统；保留原文供之后核对。</tspan>
</text>
<line x1="350" y1="208" x2="350" y2="270" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="372" y="246" font-size="17" fill="#586b67" font-weight="400">
<tspan x="372" dy="0">抽取实体与关系</tspan>
</text>
<rect x="76" y="284" width="168" height="70" rx="3" fill="#edf4ef" stroke="#235f55" stroke-width="1.3"/>
<rect x="450" y="284" width="168" height="70" rx="3" fill="#edf4ef" stroke="#235f55" stroke-width="1.3"/>
<text x="124" y="327" font-size="24" fill="#235f55" font-weight="600">
<tspan x="124" dy="0">小林</tspan>
</text>
<text x="500" y="327" font-size="24" fill="#235f55" font-weight="600">
<tspan x="500" dy="0">杭州</tspan>
</text>
<line x1="246" y1="319" x2="444" y2="319" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310" y="304" font-size="19" fill="#243735" font-weight="600">
<tspan x="310" dy="0">居住于</tspan>
</text>
<rect x="76" y="387" width="542" height="94" rx="3" fill="#eff3f7" stroke="#365e7c" stroke-width="1.3"/>
<text x="94" y="418" font-size="18" fill="#243735" font-weight="400">
<tspan x="94" dy="0">关系事实：小林从 5 月 1 日起住杭州</tspan>
</text>
<text x="94" y="452" font-size="18" fill="#365e7c" font-weight="400">
<tspan x="94" dy="0">来源列表中包含 E2</tspan>
</text>
<path d="M 620 433 H 699 V 151 H 679" fill="none" stroke="#586b67" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="620" y="376" font-size="16" fill="#365e7c" font-weight="400">
<tspan x="620" dy="0">来源</tspan>
</text>
<text x="24" y="514" font-size="16" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">实体与边是抽取结果；原始消息帮助核对结果是否忠实。</tspan>
</text>
</g></svg>