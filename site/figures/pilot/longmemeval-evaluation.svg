<svg xmlns="http://www.w3.org/2000/svg" width="736" height="660" viewBox="0 0 736 660" role="img" aria-labelledby="title desc">
<title id="title">L2  系统作答与评测，分别看什么</title><desc id="desc">历史问题日期进入受测系统，检索结果交给证据评测，系统回答交给答案评测；金标准留在评测端。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#586b67"/></marker></defs>
<rect width="736" height="660" fill="#fdfcf9"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="24" y="35" font-size="24" fill="#243735" font-weight="600">
<tspan x="24" dy="0">L2  系统作答与评测，分别看什么</tspan>
</text>
<text x="24" y="64" font-size="16" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">教学示意 · 人物、日期与结果为假设</tspan>
</text>
<text x="24" y="102" font-size="20" fill="#243735" font-weight="600">
<tspan x="24" dy="0">系统可见的输入</tspan>
</text>
<text x="267" y="102" font-size="20" fill="#243735" font-weight="600">
<tspan x="267" dy="0">受测系统</tspan>
</text>
<text x="508" y="102" font-size="20" fill="#365e7c" font-weight="600">
<tspan x="508" dy="0">仅评测端持有</tspan>
</text>
<line x1="491" y1="112" x2="491" y2="637" stroke="#cdd5cf" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="24" y="124" width="212" height="440" rx="3" fill="#ffffff" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="40" y="157" font-size="18" fill="#243735" font-weight="600">
<tspan x="40" dy="0">历史会话与日期</tspan>
</text>
<text x="40" y="193" font-size="17" fill="#243735" font-weight="400">
<tspan x="40" dy="0">A：苏州 600 元</tspan>
<tspan x="40" dy="26.35">B：杭州 900 元</tspan>
<tspan x="40" dy="26.35">其他历史……</tspan>
</text>
<line x1="40" y1="292" x2="220" y2="292" stroke="#cdd5cf" stroke-width="1"/>
<text x="40" y="324" font-size="18" fill="#243735" font-weight="600">
<tspan x="40" dy="0">问题 q</tspan>
</text>
<text x="40" y="358" font-size="18" fill="#243735" font-weight="400">
<tspan x="40" dy="0">两次旅行</tspan>
<tspan x="40" dy="27.900000000000002">一共花了多少？</tspan>
</text>
<text x="40" y="451" font-size="18" fill="#243735" font-weight="600">
<tspan x="40" dy="0">提问时间 tq</tspan>
</text>
<text x="40" y="484" font-size="18" fill="#243735" font-weight="400">
<tspan x="40" dy="0">6 月 20 日</tspan>
</text>
<rect x="262" y="161" width="212" height="102" rx="3" fill="#edf4ef" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="280" y="193" font-size="20" fill="#235f55" font-weight="600">
<tspan x="280" dy="0">检索历史</tspan>
</text>
<text x="280" y="229" font-size="17" fill="#243735" font-weight="400">
<tspan x="280" dy="0">输出前 k 条结果</tspan>
</text>
<line x1="238" y1="211" x2="256" y2="211" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="368" y1="267" x2="368" y2="303" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="262" y="312" width="212" height="98" rx="3" fill="#edf4ef" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="280" y="344" font-size="19" fill="#235f55" font-weight="600">
<tspan x="280" dy="0">组织本次输入</tspan>
</text>
<text x="280" y="380" font-size="17" fill="#243735" font-weight="400">
<tspan x="280" dy="0">把取回内容给模型</tspan>
</text>
<line x1="368" y1="414" x2="368" y2="463" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="262" y="473" width="212" height="90" rx="3" fill="#edf4ef" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="280" y="504" font-size="20" fill="#235f55" font-weight="600">
<tspan x="280" dy="0">生成回答</tspan>
</text>
<text x="280" y="539" font-size="17" fill="#243735" font-weight="400">
<tspan x="280" dy="0">例如：“1500 元”</tspan>
</text>
<rect x="508" y="124" width="204" height="108" rx="3" fill="#eff3f7" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="524" y="156" font-size="19" fill="#365e7c" font-weight="600">
<tspan x="524" dy="0">证据标签</tspan>
</text>
<text x="524" y="191" font-size="17" fill="#243735" font-weight="400">
<tspan x="524" dy="0">本题需要 A 与 B</tspan>
</text>
<line x1="610" y1="235" x2="610" y2="267" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="508" y="276" width="204" height="101" rx="3" fill="#eff3f7" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="524" y="307" font-size="19" fill="#365e7c" font-weight="600">
<tspan x="524" dy="0">检查检索结果</tspan>
</text>
<text x="524" y="339" font-size="17" fill="#243735" font-weight="400">
<tspan x="524" dy="0">至少命中？</tspan>
<tspan x="524" dy="26.35">是否取齐？</tspan>
</text>
<path d="M 477 214 H 484 V 324 H 505" fill="none" stroke="#586b67" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="508" y="408" width="204" height="72" rx="3" fill="#eff3f7" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="524" y="437" font-size="18" fill="#365e7c" font-weight="600">
<tspan x="524" dy="0">参考答案 a</tspan>
</text>
<text x="524" y="464" font-size="18" fill="#243735" font-weight="400">
<tspan x="524" dy="0">1500 元</tspan>
</text>
<line x1="610" y1="483" x2="610" y2="516" stroke="#586b67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="508" y="526" width="204" height="105" rx="3" fill="#eff3f7" stroke="#cdd5cf" stroke-width="1.3"/>
<text x="524" y="556" font-size="17" fill="#365e7c" font-weight="600">
<tspan x="524" dy="0">评分员按规则判分</tspan>
</text>
<text x="524" y="588" font-size="17" fill="#243735" font-weight="400">
<tspan x="524" dy="0">对照问题、答案</tspan>
<tspan x="524" dy="26.35">和系统回答</tspan>
</text>
<path d="M 477 520 H 484 V 579 H 505" fill="none" stroke="#586b67" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="24" y="614" font-size="17" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">参考答案与证据标签留在评测端。</tspan>
</text>
<text x="24" y="641" font-size="17" fill="#586b67" font-weight="400">
<tspan x="24" dy="0">它们不用于提示受测系统该去哪里找。</tspan>
</text>
</g></svg>