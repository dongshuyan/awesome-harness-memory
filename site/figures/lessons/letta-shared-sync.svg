<svg xmlns="http://www.w3.org/2000/svg" width="736" height="868" viewBox="0 0 736 868" role="img" aria-labelledby="title desc">
<title id="title">共享文件怎样到达另一位 Agent</title><desc id="desc">A 先改本地共享 checkout，再把提交推送到组织共享远端。B 需获取新提交，并通过文件线索实际读取正文，才能把新命令用于后续任务；仓库共享不意味着所有现有请求即时更新。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#798b85"/></marker></defs>
<rect width="736" height="868" fill="#fdfcf9"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="28" y="38" font-size="24" font-weight="600" fill="#243735">
<tspan x="28" dy="0">共享文件怎样到达另一位 Agent</tspan>
</text>
<text x="28" y="68" font-size="16" font-weight="400" fill="#586b67">
<tspan x="28" dy="0">来源规定的机制；小周或项目事件为教学假设</tspan>
</text>
<rect x="28" y="106" width="680" height="130" rx="3" fill="#f4f1e8" stroke="#c8d1ca"/>
<text x="46" y="138" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">Agent A 的共享工作副本</tspan>
</text>
<text x="46" y="167.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">把旧构建命令改成新命令</tspan>
</text>
<text x="46" y="196.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">先是本地文件变化</tspan>
</text>
<path d="M368,242 L368,282" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="390" y="266" font-size="16" font-weight="400" fill="#586b67">
<tspan x="390" dy="0">提交并推送；核对实际成功</tspan>
</text>
<rect x="28" y="296" width="680" height="130" rx="3" fill="#f4f1e8" stroke="#c8d1ca"/>
<text x="46" y="328" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">共享 Git 远端</tspan>
</text>
<text x="46" y="357.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">提交并成功推送新版本</tspan>
</text>
<text x="46" y="386.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">仓库属于组织</tspan>
</text>
<path d="M368,432 L368,472" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="390" y="456" font-size="16" font-weight="400" fill="#586b67">
<tspan x="390" dy="0">拉取或同步到本地</tspan>
</text>
<rect x="28" y="486" width="680" height="130" rx="3" fill="#f4f1e8" stroke="#c8d1ca"/>
<text x="46" y="518" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">Agent B 的工作副本</tspan>
</text>
<text x="46" y="547.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">获得远端的新提交</tspan>
</text>
<text x="46" y="576.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">拥有文件仍不等于读过正文</tspan>
</text>
<path d="M368,622 L368,662" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="390" y="646" font-size="16" font-weight="400" fill="#586b67">
<tspan x="390" dy="0">文件工具实际读取后提供内容</tspan>
</text>
<rect x="28" y="676" width="680" height="130" rx="3" fill="#edf4ef" stroke="#c8d1ca"/>
<text x="46" y="708" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">B 的下一次任务输入</tspan>
</text>
<text x="46" y="737.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">提示词有仓库路径和文件线索</tspan>
</text>
<text x="46" y="766.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">按需读取新命令正文</tspan>
</text>
<text x="28" y="838" font-size="16" font-weight="400" fill="#586b67">
<tspan x="28" dy="0">官方共享仓库面向 Cloud Agent；共享正文不自动全量常驻提示词。</tspan>
</text>
</g></svg>