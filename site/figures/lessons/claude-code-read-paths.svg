<svg xmlns="http://www.w3.org/2000/svg" width="736" height="916" viewBox="0 0 736 916" role="img" aria-labelledby="title desc">
<title id="title">同一约定的两条读取路径</title><desc id="desc">项目指令和自动记忆索引分别进入启动输入。索引只提供查找线索；模型在需要时调用文件工具读取主题笔记，工具返回正文再进入后续调用。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#798b85"/></marker></defs>
<rect width="736" height="916" fill="#fdfcf9"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="28" y="38" font-size="24" font-weight="600" fill="#243735">
<tspan x="28" dy="0">同一约定的两条读取路径</tspan>
</text>
<text x="28" y="68" font-size="16" font-weight="400" fill="#586b67">
<tspan x="28" dy="0">官方文档机制；小林的内容为假设示例</tspan>
</text>
<rect x="28" y="106" width="330" height="130" rx="3" fill="#f4f1e8" stroke="#c8d1ca"/>
<text x="46" y="138" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">项目指令</tspan>
</text>
<text x="46" y="167.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">按实际配置选择文件</tspan>
</text>
<text x="46" y="196.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">满足位置和加载条件</tspan>
</text>
<rect x="378" y="106" width="330" height="130" rx="3" fill="#f4f1e8" stroke="#c8d1ca"/>
<text x="396" y="138" font-size="20" font-weight="600" fill="#243735">
<tspan x="396" dy="0">自动记忆索引</tspan>
</text>
<text x="396" y="167.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="396" dy="0">MEMORY.md 启动首段</tspan>
</text>
<text x="396" y="196.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="396" dy="0">前 200 行或 25KB 先到者</tspan>
</text>
<rect x="28" y="260" width="680" height="130" rx="3" fill="#edf4ef" stroke="#c8d1ca"/>
<text x="46" y="292" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">启动时模型可读的内容</tspan>
</text>
<text x="46" y="321.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">已加载的项目指令＋索引首段</tspan>
</text>
<text x="46" y="350.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">索引提供主题笔记的查找线索</tspan>
</text>
<rect x="28" y="414" width="680" height="130" rx="3" fill="#f4eee7" stroke="#c8d1ca"/>
<text x="46" y="446" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">需要细节时读取主题笔记</tspan>
</text>
<text x="46" y="475.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">模型调用文件工具</tspan>
</text>
<text x="46" y="504.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">取回被选中笔记的正文</tspan>
</text>
<rect x="28" y="568" width="680" height="130" rx="3" fill="#edf4ef" stroke="#c8d1ca"/>
<text x="46" y="600" font-size="20" font-weight="600" fill="#243735">
<tspan x="46" dy="0">后续模型调用</tspan>
</text>
<text x="46" y="629.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">先前上下文＋工具返回内容</tspan>
</text>
<text x="46" y="658.0" font-size="18" font-weight="400" fill="#243735">
<tspan x="46" dy="0">模型现在可以结合具体笔记回答</tspan>
</text>
<path d="M193.0,239 L193.0,257" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="28" y="734" font-size="16" font-weight="400" fill="#365e7c">
<tspan x="28" dy="0">项目指令 → 启动时模型可读的内容：满足指令加载条件</tspan>
</text>
<path d="M543.0,239 L543.0,257" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="28" y="772.0" font-size="16" font-weight="400" fill="#365e7c">
<tspan x="28" dy="0">自动记忆索引 → 启动时模型可读的内容：启动时加载索引首段</tspan>
</text>
<path d="M368.0,393 L368.0,411" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="28" y="810.0" font-size="16" font-weight="400" fill="#365e7c">
<tspan x="28" dy="0">启动时模型可读的内容 → 需要细节时读取主题笔记：仅在需要更多细节时调用文件工具</tspan>
</text>
<path d="M368.0,547 L368.0,565" stroke="#798b85" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="28" y="848.0" font-size="16" font-weight="400" fill="#365e7c">
<tspan x="28" dy="0">需要细节时读取主题笔记 → 后续模型调用：工具返回所选笔记正文</tspan>
</text>
<text x="28" y="886.0" font-size="16" font-weight="400" fill="#586b67">
<tspan x="28" dy="0">文件存在不等于已读；文本指导仍不等于工具权限。</tspan>
</text>
</g></svg>