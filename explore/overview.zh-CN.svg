<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">记忆地图：三个视角，共享概念</title>
  <desc id="desc">连续性关注哪些信息会延续；记忆构建关注信息如何成为可用记忆；变化与控制关注事实、会话或访问条件变化时会发生什么。在交互地图中选择一个概念，即可阅读区别、关联和资源。这些视角相互重叠，仍是暂定安排。</desc>
  <rect width="1200" height="420" rx="18" fill="#f5f4ee"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243c37">
    <text x="36" y="42" font-size="11" letter-spacing="2" fill="#626f68">AWESOME HARNESS MEMORY</text>
    <text x="36" y="88" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="39">记忆地图。</text>
    <text x="1164" y="79" text-anchor="end" font-size="14" fill="#626f68">三个视角，共享同一组概念。</text>
    <rect x="36" y="116" width="360" height="212" rx="12" fill="#e5eee7" stroke="#c3d4c8"/>
    <rect x="420" y="116" width="360" height="212" rx="12" fill="#f1ead7" stroke="#ded2b3"/>
    <rect x="804" y="116" width="360" height="212" rx="12" fill="#e6edf0" stroke="#cbd9e1"/>
    <g font-size="12" letter-spacing="1.5">
      <text x="58" y="146" fill="#21594e">01 / 连续性</text>
      <text x="442" y="146" fill="#806022">02 / 记忆构建</text>
      <text x="826" y="146" fill="#3e657c">03 / 变化与控制</text>
    </g>
    <g font-family="Songti SC, Noto Serif CJK SC, serif" font-size="23">
      <text x="58" y="184">哪些信息会延续？</text>
      <text x="442" y="184">如何让记忆发挥作用？</text>
      <text x="826" y="184">信息变化时会发生什么？</text>
    </g>
    <g font-size="14" fill="#465b52">
      <text x="58" y="220">当前上下文 · 可恢复状态</text>
      <text x="58" y="247">用户信息 · 记录与衍生</text>
      <text x="58" y="274">可复用经验</text>
      <text x="442" y="220">记录与衍生 · 可复用经验</text>
      <text x="442" y="247">检索与使用 · 当前上下文</text>
      <text x="442" y="274">范围与来源</text>
      <text x="826" y="220">修订与遗忘 · 用户信息</text>
      <text x="826" y="247">可恢复状态 · 范围与来源</text>
      <text x="826" y="274">检索与使用</text>
    </g>
    <path d="M216 328v22h768v-22M600 328v22" fill="none" stroke="#a3b3a8"/>
    <text x="600" y="378" text-anchor="middle" font-size="15">选择概念 → 理解区别 → 查看关联与资源</text>
    <text x="600" y="403" text-anchor="middle" font-size="11" fill="#626f68">持续更新的阅读辅助图，包含文档记载的实例和编者归纳的关联。</text>
  </g>
</svg>
