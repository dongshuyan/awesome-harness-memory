  flex: none;

}

.text-warning,
.text-destructive {

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  globalThis.__tutorialInitialRoute = typeof initialGlobals.routeHash === &quot;string&quot; ? initialGlobals.routeHash : &quot;&quot;;
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;route-change&quot; &amp;&amp; typeof data.hash === &quot;string&quot;) {
              globalThis.dispatchEvent(new CustomEvent(&quot;codex-route-change&quot;, { detail: { hash: data.hash } }));
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

ot;title&quot;:&quot;记忆分类&quot;,&quot;en&quot;:&quot;Memory Types&quot;,&quot;intro&quot;:&quot;先看目前有来源的主流分类方式，再查看每套分类自己的类别、出处与限制。分类外另有待验证草案、典型内容索引和跨分类映射。&quot;,&quot;methods&quot;:[],&quot;sources&quot;:[&quot;coala&quot;,&quot;survey&quot;],&quot;boundary&quot;:&quot;四套主流分类方式是有来源的并列入口；待验证草案、索引和交叉映射属于分类外导航，不应被读成第五套已确立 taxonomy。&quot;,&quot;example&quot;:&quot;同一本实验笔记中，昨天的操作记录是经历，设备温度上限是知识，校准仪器的步骤是做法。做实验时拿来使用的那几页，又参与当前工作记忆。&quot;,&quot;enIntro&quot;:&quot;Start with named mainstream taxonomies, inspect each taxonomy on its own terms, then use the typical-content index for crosswalks.&quot;},{&quot;id&quot;:&quot;control&quot;,&quot;short&quot;:&quot;记忆的控制&quot;,&quot;title&quot;:&quot;记忆的控制方式&quot;,&quot;en&quot;:&quot;Memory Control&quot;,&quot;intro&quot;:&quot;谁决定何时写入、读取、修改或删除？决定者和执行者可以不同。&quot;,&quot;example&quot;:&quot;组员决定把会议结论记下来，秘书负责录入，档案系统保存。决定、执行、保存是三种职责。&quot;,&quot;boundary&quot;:&quot;控制方式回答“谁实际作决定”；权限回答“谁被允许这样做”。两者不能合成一个“管理者”。&quot;,&quot;methods&quot;:[{&quot;id&quot;:&quot;agent-control&quot;,&quot;zh&quot;:&quot;Agent 主动调用&quot;,&quot;en&quot;:&quot;Agent-directed control&quot;,&quot;definition&quot;:&quot;让 Agent 通过工具选择何时写入、读取或整理信息。&quot;,&quot;what&quot;:&quot;让 Agent 通过工具选择何时写入、读取或整理信息。&quot;,&quot;when&quot;:&quot;需要 Agent 按任务决定记什么或查什么时。&quot;,&quot;purpose&quot;:&quot;允许根据当前目标灵活选择记忆操作。&quot;,&quot;example&quot;:&quot;组员发现一个易错点，主动要求把它记进项目笔记。&quot;,&quot;boundary&quot;:&quot;适合需要灵活决策的任务；仍要检查工具权限、误写和遗漏。&quot;,&quot;resources&quot;:[&quot;letta-code&quot;,&quot;google-adk&quot;,&quot;claude-code&quot;],&quot;sources&quot;:[&quot;letta-code:0&quot;,&quot;google-adk:0&quot;,&quot;claude-code:0&quot;],&quot;legacy&quot;:[&quot;owner:0&quot;],&quot;enDefinition&quot;:&quot;The agent uses tools to decide when to write, retrieve, or organize information.&quot;},{&quot;id&quot;:&quot;harness-control&quot;,&quot;zh&quot;:&quot;Harness 自动维护&quot;,&quot;en&quot;:&quot;Harness-managed control&quot;,&quot;definition&quot;:&quot;运行环境保存对话或执行状态，并在后续运行时恢复、准备输入。&quot;,&quot;what&quot;:&quot;运行环境保存对话或执行状态，并在后续运行时恢复、准备输入。&quot;,&quot;when&quot;:&quot;每轮调用或运行结束都需要一致保存、恢复时。&quot;,&quot;purpose&quot;:&quot;把固定的记忆步骤交给运行程序。&quot;,&quot;example&quot;:&quot;会议系统每次散会自动保存记录，不需要参会者逐次提醒。&quot;,&quot;boundary&quot;:&quot;适合重复出现的保存与恢复流程；保存内容和后端配置仍需明确。&quot;,&quot;resources&quot;:[&quot;langgraph&quot;,&quot;openai-agents-sdk&quot;,&quot;pi&quot;,&quot;codex&quot;,&quot;microsoft-agent-framework&quot;],&quot;sources&quot;:[&quot;langgraph:0&quot;,&quot;openai-agents-sdk:0&quot;,&quot;pi:0&quot;,&quot;codex:0&quot;],&quot;legacy&quot;:[&quot;owner:1&quot;],&quot;enDefinition&quot;:&quot;The runtime saves conversation or execution state and restores it or prepares inputs for later calls.&quot;},{&quot;id&quot;:&quot;service-control&quot;,&quot;zh&quot;:&quot;独立或托管记忆服务&quot;,&quot;en&quot;:&quot;Memory service integration&quot;,&quot;definition&quot;:&quot;把存储、提取和检索封装成接口，接入现有 Agent 或应用。&quot;,&quot;what&quot;:&quot;把存储、提取和检索封装成接口，接入现有 Agent 或应用。&quot;,&quot;when&quot;:&quot;想把已有记忆服务接入 Agent 时。&quot;,&quot;purpose&quot;:&quot;分清调用方、服务和模型各自负责什么。&quot;,&quot;example&quot;:&quot;你把资料交给档案室整理；何时送交和准许谁查阅，仍需约定。&quot;,&quot;boundary&quot;:&quot;服务负责哪些工作、调用方还要负责什么，需要分别核对。&quot;,&quot;resources&quot;:[&quot;mem0&quot;,&quot;amazon-bedrock-agentcore-memory&quot;,&quot;google-agent-platform-memory-bank&quot;,&quot;hindsight&quot;,&quot;memobase&quot;,&quot;honcho&quot;,&quot;memos&quot;],&quot;sources&quot;:[&quot;mem0:0&quot;,&quot;amazon-bedrock-agentcore-memory:0&quot;,&quot;google-agent-platform-memory-bank:0&quot;,&quot;hindsight:0&quot;],&quot;legacy&quot;:[&quot;owner:2&quot;],&quot;enDefinition&quot;:&quot;A memory component exposes storage, extraction, and retrieval through an interface used by an agent or application.&quot;},{&quot;id&quot;:&quot;application-control&quot;,&quot;zh&quot;:&quot;应用决定组合与边界&quot;,&quot;en&quot;:&quot;Application-defined orchestration&quot;,&quot;definition&quot;:&quot;应用将多个组件接起来，确定用户、项目、存储后端和权限。&quot;,&quot;what&quot;:&quot;应用将多个组件接起来，确定用户、项目、存储后端和权限。&quot;,&quot;when&quot;:&quot;需要组合多种记忆组件或制定流程时。&quot;,&quot;purpose&quot;:&quot;由应用明确触发条件、边界和组件分工。&quot;,&quot;example&quot;:&quot;组长规定谁交记录、谁审核、档案放哪里，秘书按流程执行。&quot;,&quot;boundary&quot;:&quot;框架提供能力，不表示每个应用都已配置全部能力。&quot;,&quot;resources&quot;:[&quot;langgraph&quot;,&quot;deep-agents&quot;],&quot;sources&quot;:[&quot;langgraph:0&quot;,&quot;deep-agents:0&quot;],&quot;legacy&quot;:[&quot;owner:3&quot;],&quot;enDefinition&quot;:&quot;The application combines components and defines user, project, backend, and permission boundaries.&quot;}],&quot;sources&quot;:[&quot;langchain&quot;,&quot;context&quot;],&quot;enIntro&quot;:&quot;Who decides when memory is written, read, updated, or deleted? The decision-maker and executor may differ.&quot;},{&quot;id&quot;:&quot;scope&quot;,&quot;short&quot;:&quot;记忆的范围&quot;,&quot;title&quot;:&quot;记忆的组织范围&quot;,&quot;en&quot;:&quot;Memory Scope&quot;,&quot;intro&quot;:&quot;这份资料围绕哪个会话、任务、项目或身份组织？这里先讨论资料归组。&quot;,&quot;example&quot;:&quot;“实验 A 的进度”按项目归组；“小林的阅读偏好”按用户归组。谁负责写入这些资料，是控制方式的问题。&quot;,&quot;boundary&quot;:&quot;按团队分组不代表所有成员都有访问权；按会话分组也不代表会话结束就删除。&quot;,&quot;methods&quot;:[{&quot;id&quot;:&quot;thread&quot;,&quot;zh&quot;:&quot;同一次会话或执行线程&quot;,&quot;en&quot;:&quot;Thread-scoped memory&quot;,&quot;definition&quot;:&quot;围绕一段对话保存消息、状态和检查点。&quot;,&quot;what&quot;:&quot;围绕一段对话保存消息、状态和检查点。&quot;,&quot;when&quot;:&quot;需要保持一段对话或同一执行线程的连续性时。&quot;,&quot;purpose&quot;:&quot;把同一交互的消息和状态组织在一起。&quot;,&quot;example&quot;:&quot;把同一封邮件的所有回复放进一个邮件线程；保存多久是另一问题。&quot;,&quot;boundary&quot;:&quot;线程是否能在重启后恢复，取决于持久化配置。&quot;,&quot;resources&quot;:[&quot;langgraph&quot;,&quot;openai-agents-sdk&quot;,&quot;google-adk&quot;,&quot;pi&quot;],&quot;sources&quot;:[&quot;langgraph:0&quot;,&quot;openai-agents-sdk:0&quot;,&quot;google-adk:0&quot;,&quot;pi:0&quot;],&quot;legacy&quot;:[&quot;scope:0&quot;],&quot;enDefinition&quot;:&quot;Messages, state, and checkpoints organized around one conversation or execution thread.&quot;},{&quot;id&quot;:&quot;workspace&quot;,&quot;zh&quot;:&quot;任务、项目与工作区&quot;,&quot;en&quot;:&quot;Task / Project / Workspace scope&quot;,&quot;definition&quot;:&quot;把进度、文件和相关知识放在同一个任务或项目边界内。&quot;,&quot;what&quot;:&quot;把进度、文件和相关知识放在同一个任务或项目边界内。&quot;,&quot;when&quot;:&quot;跨会话、跨天或多人接手同一个项目时。&quot;,&quot;purpose&quot;:&quot;把目标、进度和项目材料归在一起。&quot;,&quot;example&quot;:&quot;毕业设计文件夹里放计划、实验日志、论文草稿和待办。&quot;,&quot;boundary&quot;:&quot;恢复状态与重新检索事实是不同需求，不能只靠一个“长期”标签判断。&quot;,&quot;resources&quot;:[&quot;deep-agents&quot;,&quot;letta-code&quot;],&quot;sources&quot;:[&quot;deep-agents:0&quot;,&quot;letta-code:0&quot;],&quot;legacy&quot;:[&quot;scope:1&quot;],&quot;enDefinition&quot;:&quot;Progress, files, and relevant knowledge organized within a task or project boundary.&quot;},{&quot;id&quot;:&quot;identity&quot;,&quot;zh&quot;:&quot;用户、Agent 与团队&quot;,&quot;en&quot;:&quot;User / Agent / Team scope&quot;,&quot;definition&quot;:&quot;围绕身份组织记忆，支持个人偏好、Agent 自有信息或协作共享。&quot;,&quot;what&quot;:&quot;围绕身份组织记忆，支持个人偏好、Agent 自有信息或协作共享。&quot;,&quot;when&quot;:&quot;需要按用户、Agent 身份或团队组织信息时。&quot;,&quot;purpose&quot;:&quot;使不同对象的资料可以分别查找与维护。&quot;,&quot;example&quot;:&quot;共享课题资料按团队归组，个人阅读偏好按成员归组；是否有权读还要另查。&quot;,&quot;boundary&quot;:&quot;组织范围和访问控制需分别检查，团队标签不等于安全边界。&quot;,&quot;resources&quot;:[&quot;mem0&quot;,&quot;crewai&quot;,&quot;collabmem&quot;],&quot;sources&quot;:[&quot;mem0:0&quot;,&quot;crewai:0&quot;,&quot;collabmem:0&quot;],&quot;legacy&quot;:[&quot;scope:2&quot;],&quot;enDefinition&quot;:&quot;Records organized around a user, an agent identity, or a collaborating team.&quot;}],&quot;sources&quot;:[&quot;langchain&quot;,&quot;cline&quot;],&quot;enIntro&quot;:&quot;Which conversation, task, project, or identity organizes these records?&quot;},{&quot;id&quot;:&quot;retention&quot;,&quot;short&quot;:&quot;记忆的保留&quot;,&quot;title&quot;:&quot;记忆的保留期限&quot;,&quot;en&quot;:&quot;Memory Retention&quot;,&quot;intro&quot;:&quot;资料保存到什么时候、在什么条件下清除？保留期与事实的有效期要分开。&quot;,&quot;example&quot;:&quot;会议通知保存一年，但其中“周五开会”只描述那个周五。保存多久，不等于这条信息一直有效。&quot;,&quot;boundary&quot;:&quot;这是保留政策；执行删除、压缩或更新，属于“写入与维护”。跨会话也不等于保留固定天数。&quot;,&quot;methods&quot;:[{&quot;id&quot;:&quot;persistence&quot;,&quot;zh&quot;:&quot;跨会话保留与可恢复&quot;,&quot;en&quot;:&quot;Persistence / Resumability&quot;,&quot;definition&quot;:&quot;让上一次交互留下的信息能进入后续工作。&quot;,&quot;what&quot;:&quot;让上一次交互留下的信息能进入后续工作。&quot;,&quot;when&quot;:&quot;结束会话或程序重启后还要继续工作时。&quot;,&quot;purpose&quot;:&quot;让保存的资料或执行状态在之后仍可访问。&quot;,&quot;example&quot;:&quot;下课后把草稿装进文件夹，第二天能继续；这并不决定文件夹属于哪个项目。&quot;,&quot;boundary&quot;:&quot;保留原始事件、检查点和提炼后的事实，是三种不同的延续方式。&quot;,&quot;resources&quot;:[&quot;langgraph&quot;,&quot;amazon-bedrock-agentcore-memory&quot;,&quot;codex&quot;,&quot;claude-mem&quot;,&quot;chatgpt-memory&quot;],&quot;sources&quot;:[&quot;langgraph:0&quot;,&quot;amazon-bedrock-agentcore-memory:0&quot;,&quot;codex:0&quot;,&quot;claude-mem:0&quot;],&quot;legacy&quot;:[&quot;scope:3&quot;],&quot;enDefinition&quot;:&quot;Information from a previous interaction remains available to support later work.&quot;},{&quot;id&quot;:&quot;expiry&quot;,&quot;zh&quot;:&quot;更新、失效与保留策略&quot;,&quot;en&quot;:&quot;Retention policy / Fact validity&quot;,&quot;definition&quot;:&quot;区分旧信息不再适用、仍保留历史，以及真正删除。&quot;,&quot;what&quot;:&quot;区分旧信息不再适用、仍保留历史，以及真正删除。&quot;,&quot;when&quot;:&quot;事实会变化，或系统规定数据何时清除时。&quot;,&quot;purpose&quot;:&quot;分别描述存多久、事实何时成立和何时不再使用。&quot;,&quot;example&quot;:&quot;会议通知留档一年，但“周五开会”只在那个周五有效；过期并不等于档案已删。&quot;,&quot;boundary&quot;:&quot;当前目录未逐一核验所有产品的保留期或删除语义。&quot;,&quot;resources&quot;:[&quot;graphiti&quot;,&quot;memora&quot;],&quot;sources&quot;:[&quot;graphiti:0&quot;,&quot;memora:0&quot;],&quot;legacy&quot;:[&quot;scope:4&quot;],&quot;enDefinition&quot;:&quot;Distinguish information becoming inapplicable, retaining a historical record, and actually deleting it.&quot;},{&quot;id&quot;:&quot;ttl&quot;,&quot;zh&quot;:&quot;到期清除&quot;,&quot;en&quot;:&quot;Time to Live · TTL&quot;,&quot;definition&q &quot;这是该综述的功能分类；不能直接把它等同于另一套分类中的 Semantic Memory。&quot;,&quot;resources&quot;:[&quot;mem0&quot;,&quot;graphiti&quot;,&quot;google-agent-platform-memory-bank&quot;],&quot;sources&quot;:[&quot;survey&quot;],&quot;enDefinition&quot;:&quot;In this survey, factual memory provides information about users, past interactions, and the environment.&quot;},&quot;experiential&quot;:{&quot;zh&quot;:&quot;经验记忆&quot;,&quot;en&quot;:&quot;Experiential Memory&quot;,&quot;def&quot;:&quot;这篇综述把可复用的案例、策略和技能，归为支持从经历中学习的记忆。&quot;,&quot;what&quot;:&quot;历史案例、经验教训、工作流和技能。&quot;,&quot;when&quot;:&quot;新任务与过去的经历存在可参考之处时。&quot;,&quot;use&quot;:&quot;复用已有做法，或避免再次踩同样的坑。&quot;,&quot;example&quot;:&quot;上次忘记备份原始数据导致返工，因此总结出“处理前先备份”的做法，并在下一次实验中采用。&quot;,&quot;steps&quot;:[&quot;尝试与反馈&quot;,&quot;总结做法&quot;,&quot;在新任务中复用&quot;],&quot;boundary&quot;:&quot;它与情景、程序性记忆会有交叉。这里展示的是另一套按功能组织的方法，不拼成统一的父子树。&quot;,&quot;resources&quot;:[&quot;reflexion&quot;,&quot;reasoningbank&quot;,&quot;hindsight&quot;],&quot;sources&quot;:[&quot;survey&quot;],&quot;enDefinition&quot;:&quot;In this survey, experiential memory supports learning from reusable cases, strategies, and skills.&quot;},&quot;working-functional&quot;:{&quot;zh&quot;:&quot;工作记忆&quot;,&quot;en&quot;:&quot;Working Memory&quot;,&quot;def&quot;:&quot;在这篇综述中，工作记忆指一次任务过程中主动管理上下文的机制，包括单轮与多轮场景。&quot;,&quot;what&quot;:&quot;当前任务需要的信息，以及维持这些信息的状态。&quot;,&quot;when&quot;:&quot;正在推理、规划或决定下一步行动时。&quot;,&quot;use&quot;:&quot;在有限上下文中维持任务连续性。&quot;,&quot;example&quot;:&quot;你正在做一道数学题：题目条件、刚算出的中间结果、下一步计划，都暂时放在草稿纸上。&quot;,&quot;steps&quot;:[&quot;当前问题&quot;,&quot;保留关键状态&quot;,&quot;决定下一步&quot;],&quot;boundary&quot;:&quot;这一功能视角讨论压缩、状态整理和规划；与 CoALA 的架构模块定义侧重点不同。&quot;,&quot;resources&quot;:[&quot;memoryos&quot;,&quot;pi&quot;,&quot;aider&quot;],&quot;sources&quot;:[&quot;survey&quot;],&quot;enDefinition&quot;:&quot;In this survey, working memory actively manages context during a task, including single-turn and multi-turn settings.&quot;}},&quot;terms&quot;:{&quot;context&quot;:{&quot;zh&quot;:&quot;上下文记忆&quot;,&quot;en&quot;:&quot;Context Memory&quot;,&quot;kind&quot;:&quot;常见工程叫法 · 本页按“上下文续接”解释&quot;,&quot;def&quot;:&quot;当对话越来越长、模型窗口装不下全部历史时，保住继续工作所需的信息，并在后续调用中重新提供。&quot;,&quot;what&quot;:&quot;可能包含历史事件、关键事实、任务进度和必要的操作说明。&quot;,&quot;when&quot;:&quot;长对话、上下文压缩、窗口重置或需要找回前文时。&quot;,&quot;use&quot;:&quot;窗口变化后，仍知道前面讨论了什么、现在应接着做什么。&quot;,&quot;example&quot;:&quot;你写报告写到一半，桌面已经堆满资料。先写一张交接便条：“已完成第一章，下一步核对图表”，清理桌面后，再凭便条继续。&quot;,&quot;steps&quot;:[&quot;历史越来越长&quot;,&quot;摘要或外部笔记&quot;,&quot;读回必要信息&quot;],&quot;boundary&quot;:&quot;这里是一种用途入口，不是新的内容类型。下方相关方法也不表示每个系统都同时采用。&quot;,&quot;methods&quot;:&quot;摘要压缩（Compaction）、外部笔记（Note-taking）、按需检索（Retrieval）。&quot;,&quot;relation&quot;:&quot;上下文续接 → 主要关联工作记忆的管理。它也可以从长期记忆中取回所需的事实或经历。&quot;,&quot;sources&quot;:[&quot;context&quot;,&quot;microsoft-memory&quot;,&quot;aws-agent-memory&quot;,&quot;coala&quot;],&quot;resources&quot;:[&quot;pi&quot;,&quot;codex&quot;,&quot;claude-code&quot;,&quot;claude-mem&quot;,&quot;aider&quot;],&quot;enDefinition&quot;:&quot;Here, Context Memory means preserving and recovering the information needed to continue when conversation history exceeds the model window.&quot;,&quot;evidenceLevel&quot;:&quot;中&quot;,&quot;standardization&quot;:&quot;常见工程入口，但“Context Memory”不是一套统一的标准分类名称&quot;,&quot;evidenceSummary&quot;:&quot;“working memory / active context / session memory”在 Microsoft、AWS、Anthropic 和研究综述中有相近用法；这里把 Context Memory 作为窗口受限后的续接问题入口，而不是声称它是独立的认知类型。&quot;},&quot;workspace&quot;:{&quot;zh&quot;:&quot;工作区记忆&quot;,&quot;en&quot;:&quot;Workspace Memory&quot;,&quot;kind&quot;:&quot;工程叫法 · 按项目或任务组织&quot;,&quot;def&quot;:&quot;围绕一个项目或任务保存资料，使下一次打开工作区时，能够接着原来的进度工作。&quot;,&quot;what&quot;:&quot;目标、进度、未决问题、项目事实、工作方法与历史记录。&quot;,&quot;when&quot;:&quot;任务暂停恢复、换会话、跨天工作或协作交接时。&quot;,&quot;use&quot;:&quot;知道做到哪一步、为什么这样做，以及下一步做什么。&quot;,&quot;example&quot;:&quot;一个实验项目文件夹里有进度表、实验日志、设备信息和操作手册。它们服务同一项目，但分别保存状态、经历、事实和方法。&quot;,&quot;steps&quot;:[&quot;任务或项目&quot;,&quot;分门别类记 ng of Long-term Memory depends on the framework: CoALA distinguishes its architectural role, while LangChain emphasizes cross-thread scope.&quot;,&quot;evidenceLevel&quot;:&quot;较高&quot;,&quot;standardization&quot;:&quot;广泛使用的术语族，但不同来源对内容、范围和持久时间的边界仍不完全相同&quot;,&quot;evidenceSummary&quot;:&quot;CoALA、Microsoft 参考架构、AWS 工程材料和 LangChain 文档都使用长期/跨会话的相近概念；它通常表示可跨 Session 取回的持久信息，不等于只保存用户偏好。&quot;}},&quot;frameworks&quot;:{&quot;coala&quot;:{&quot;order&quot;:1,&quot;name&quot;:&quot;CoALA：架构角色分类&quot;,&quot;en&quot;:&quot;CoALA: Architecture-role taxonomy&quot;,&quot;source&quot;:&quot;coala&quot;,&quot;sources&quot;:[&quot;coala&quot;],&quot;kind&quot;:&quot;研究框架论文&quot;,&quot;status&quot;:&quot;2023 arXiv / 2024 TMLR · 研究框架论文&quot;,&quot;confidence&quot;:&quot;较高&quot;,&quot;intro&quot;:&quot;从 Agent 架构中的角色区分记忆：当前活跃的工作记忆，以及可在后续取回的长期记忆。长期记忆再按经历、知识和做法细分。&quot;,&quot;rationale&quot;:&quot;它先回答“信息在架构中扮演什么角色”，再回答长期记忆里保存哪类内容；因此适合做本页的第一种主流入口。&quot;,&quot;limitation&quot;:&quot;这是架构角色视角，不是把每条记录放进唯一盒子。Working Memory、Context 和 Workspace 可能重叠。&quot;,&quot;roots&quot;:[&quot;working&quot;,&quot;longterm&quot;],&quot;children&quot;:{&quot;longterm&quot;:[&quot;episodic&quot;,&quot;semantic&quot;,&quot;procedural&quot;]},&quot;categories&quot;:[{&quot;id&quot;:&quot;working&quot;,&quot;zh&quot;:&quot;工作记忆&quot;,&quot;en&quot;:&quot;Working Memory&quot;,&quot;definition&quot;:&quot;当前推理与行动中保持活跃的信息；它回答“现在为了完成任务要暂时保留什么”。&quot;,&quot;example&quot;:&quot;解一道题时，题目条件、刚算出的中间结果和下一步计划都在草稿纸上。&quot;,&quot;typeId&quot;:&quot;working&quot;,&quot;dimension&quot;:&quot;架构角色&quot;},{&quot;id&quot;:&quot;longterm&quot;,&quot;zh&quot;:&quot;长期记忆&quot;,&quot;en&quot;:&quot;Long-term Memory&quot;,&quot;definition&quot;:&quot;能够在后续任务中再次取回的经历、知识与做法；在 CoALA 中它是一个上层架构角色。&quot;,&quot;example&quot;:&quot;实验笔记、已学公式和操作方法保存在资料夹里，需要时再取出。&quot;,&quot;typeId&quot;:&quot;longterm&quot;,&quot;dimension&quot;:&quot;架构角色&quot;},{&quot;id&quot;:&quot;episodic&quot;,&quot;zh&quot;:&quot;情景记忆&quot;,&quot;en&quot;:&quot;E ot;,&quot;experiential&quot;],&quot;children&quot;:{},&quot;categories&quot;:[{&quot;id&quot;:&quot;working&quot;,&quot;zh&quot;:&quot;工作记忆&quot;,&quot;en&quot;:&quot;Working Memory&quot;,&quot;definition&quot;:&quot;按功能看，负责在一次任务中主动管理当前上下文、目标和中间状态。&quot;,&quot;example&quot;:&quot;模型在有限窗口里保留当前问题、关键历史和下一步计划。&quot;,&quot;typeId&quot;:&quot;working-functional&quot;,&quot;dimension&quot;:&quot;功能&quot;},{&quot;id&quot;:&quot;factual&quot;,&quot;zh&quot;:&quot;事实记忆&quot;,&quot;en&quot;:&quot;Factual Memory&quot;,&quot;definition&quot;:&quot;按功能看，提供用户、历史互动和环境的事实背景。&quot;,&quot;example&quot;:&quot;“实验室周五关闭”“用户希望按月份统计”都可作为后续背景。&quot;,&quot;typeId&quot;:&quot;factual&quot;,&quot;dimension&quot;:&quot;功能&quot;},{&quot;id&quot;:&quot;experiential&quot;,&quot;zh&quot;:&quot;经验记忆&quot;,&quot;en&quot;:&quot;Experiential Memory&quot;,&quot;definition&quot;:&quot;按功能看，保存从过去经历中抽取的案例、策略和技能，以便迁移到相似任务。&quot;,&quot;example&quot;:&quot;上次忘记备份导致返工，于是形成“处理前先备份”的策略。&quot;,&quot;typeId&quot;:&quot;experiential&quot;,&quot;dimension&quot;:&quot;功能&quot;}],&quot;sourceFacts&quot;:{&quot;classificationBasis&quot;:&quot;按记忆在任务中的功能分为 working、factual 和 experiential：维持当前任务、提供事实背景、从过去经历中抽取可迁移经验。&quot;,&quot;categoryRelations&quot;:&quot;三类是同一功能层级的入口；综述还讨论经验记忆中的 case、strategy、skill 等子形态，不能与 CoALA 的树直接拼接。&quot;,&quot;structureEvidence&quot;:&quot;综述分类章节及其对 Agent memory 功能的概括；具体类别边界依赖综述的术语与引用来源。&quot;,&quot;empiricalSupport&quot;:&quot;这是综述型分类，原文未提供证明三类互斥或覆盖全部系统的 taxonomy 消融实验。&quot;,&quot;scope&quot;:&quot;适合从“我需要它完成什么”倒推记忆能力和实现路线。&quot;,&quot;limitations&quot;:&quot;功能随任务而变，同一条记录可以同时服务事实、工作或经验用途。&quot;},&quot;readerGuide&quot;:{&quot;scenarios&quot;:&quot;做方案选型、设计写入/读取流程，或需要把“保存内容”与“使用目的”联系起来时。&quot;,&quot;focus&quot;:&quot;记忆在任务中的作用，而不是它的物理位置。&quot;,&quot;advantages&quot;:&quot;更容易从工程需求出发比较方案。&quot;,&quot;tradeoffs&quot;:&quot;功能标签容易随任务变化，无法单独说明数据结构、主体范围或治理方式。&quot;},&quot;sourceScenarios&quot;:[{&quot;title&quot;:&quot;LangChain 文档例子：短期线程状态与长期用户/项目记忆分工&quot;,&quot;source&quot;:&quot;langchain&quot;, &quot;一次实验失败后总结“先备份原始数据”，下次遇到同类任务时参考。&quot;,&quot;boundary&quot;:&quot;反馈质量、额外尝试和迁移条件会影响收益。&quot;,&quot;resources&quot;:[&quot;reflexion&quot;,&quot;reasoningbank&quot;,&quot;hindsight&quot;,&quot;letta-code&quot;],&quot;sources&quot;:[&quot;survey&quot;,&quot;langchain&quot;,&quot;reflexion:0&quot;,&quot;reasoningbank:0&quot;],&quot;legacy&quot;:[&quot;content:3&quot;],&quot;enDefinition&quot;:&quot;Lessons and strategies drawn from previous attempts, together with conditions under which they may be useful.&quot;},{&quot;id&quot;:&quot;relations&quot;,&quot;zh&quot;:&quot;关系与时间事实&quot;,&quot;en&quot;:&quot;Relational \u0026 temporal facts&quot;,&quot;definition&quot;:&quot;记录谁与什么有关，以及一个事实在什么时候成立。&quot;,&quot;what&quot;:&quot;记录谁与什么有关，以及一个事实在什么时候成立。&quot;,&quot;when&quot;:&quot;需要区分关系和随时间变化的事实时。&quot;,&quot;purpose&quot;:&quot;让事实带上主体、关系与有效时间。&quot;,&quot;example&quot;:&quot;“小林在三月负责项目 A，四月交给小周。”关系和时间说明了事实适用范围。&quot;,&quot;boundary&quot;:&quot;用图表示是一种实现选择；关系存在不证明因果。&quot;,&quot;resources&quot;:[&quot;graphiti&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;graphiti:0&quot;],&quot;legacy&quot;:[&quot;content:4&quot;],&quot;enDefinition&quot;:&quot;Information about relationships and the periods during which a fact holds.&quot;},{&quot;id&quot;:&quot;rules&quot;,&quot;zh&quot;:&quot;规则与约束&quot;,&quot;en&quot;:&quot;Instructions / Constraints&quot;,&quot;definition&quot;:&quot;保存用户约定、任务限制或组织规则，供后续工作参考。&quot;,&quot;what&quot;:&quot;保存用户约定、任务限制或组织规则，供后续工作参考。&quot;,&quot;when&quot;:&quot;有需要沿用的行为要求或项目约定时。&quot;,&quot;purpose&quot;:&quot;为后续工作提供明确的规则。&quot;,&quot;example&quot;:&quot;“只读原始数据，清洗结果另存。”是约束；把它记下来并不自动限制文件权限。&quot;,&quot;boundary&quot;:&quot;保存了规则，不代表已经强制执行；权限与审计另见治理专题。&quot;,&quot;resources&quot;:[&quot;letta-code&quot;,&quot;collabmem&quot;,&quot;claude-code&quot;,&quot;gemini-cli&quot;,&quot;cline&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;letta-code:0&quot;,&quot;collabmem:0&quot;],&quot;legacy&quot;:[&quot;content:5&quot;],&quot;enDefinition&quot;:&quot;User agreements, task constraints, and organizational rules retained for later work.&quot;}]}}&lt;/script&gt;
&lt;script type=&quot;application/json&quot; id=&quot;tutorial-data&quot;&gt;{&quot;version&quot;:1,&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;title&quot;:&quot;Agent Memory 教程&quot;,&quot;intro&quot;:&quot;从六个问题建立共同观察方法，再读 Research、工程、Benchmark 和文化类比。&quot;,&quot;comparisonCategories&quot;:[&quot;research&quot;,&quot;engineering&quot;,&quot;benchmarks&quot;,&quot;culture&quot;],&quot;questions&quot;:[{&quot;id&quot;:&quot;content&quot;,&quot;short&quot;:&quot;内容角色&quot;,&quot;title&quot;:&quot;Q1 · 保存的是什么？&quot;,&quot;en&quot;:&quot;Content role&quot;,&quot;what&quot;:&quot;识别 Memory 里保存的内容和它承担的认知或任务角色：事件、事实、偏好、流程、经验、关系、规则，或当前任务的派生材料。&quot;,&quot;why&quot;:&quot;同一段对话既可以留下原始事件，也可以被提炼成事实或流程。若不先分清内容角色，读者很容易把“保存了什么”和“放在哪里”混成一个问题。&quot;,&quot;how&quot;:&quot;面对新系统，先找写入对象的 schema、示例记录和作者对用途的描述；记录内容粒度、来源、是否会被提炼，以及它是否会改变后续决策。&quot;,&quot;example&quot;:&quot;“上周五开过会”是事件；“用户偏好上午开会”是事实/偏好；“会前先发议程”是流程。三者可以来自同一条消息，却有不同的更新和失效方式。&quot;,&quot;evidence&quot;:&quot;CoALA 将工作记忆与 episodic、semantic、procedural memory 放进认知架构；Foundation Agent Memory 摘要同时列出感觉、工作、情景、语义、程序性机制；工程文档也分别描述消息、用户事实、经验或规则。这里把它们抽象成跨系统的内容问题，是综合推断。&quot;,&quot;check&quot;:&quot;能否举例说明一个事件怎样被提炼成事实或流程？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;storage-experience&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;substrate&quot;,&quot;short&quot;:&quot;载体与表示&quot;,&quot;title&quot;:&quot;Q2 · 它以什么形式、放在哪里？&quot;,&quot;en&quot;:&quot;Substrate and representation&quot;,&quot;what&quot;:&quot;区分内容语义与承载方式：文本、结构化字段、向量索引、图、文件、数据库、检查点、参数或模型内部状态。&quot;,&quot;why&quot;:&quot;同一事实可以同时存在于原始日志、摘要字段、向量索引和关系图中。把表示方式误当成记忆类型，会把“图”误解成一种内容，把“数据库”误解成一种认知功能。&quot;,&quot;how&quot;:&quot;分别记录原始载体、派生表示、索引方式和物理/逻辑位置；再确认哪些是权威记录，哪些只是为了检索或恢复而生成的副本。&quot;,&quot;example&quot;:&quot;“项目使用 Python 3.12”可以写在 MEMORY.md，也可以抽成 JSON 字段并建立向量索引；索引帮助找到它，却不自动保证它是最新或有权被使用。&quot;,&quot;evidence&quot;:&quot;Forms–Functions–Dynamics 与多篇 Agent Memory survey 都把形式/承载与功能、动态分开讨论；LangGraph 将 state/checkpoint/store 分开；Graphiti 以时序知识图组织实体、事实和来源。由此可见载体是独立观察角度，但不等于内容分类。&quot;,&quot;check&quot;:&quot;能否指出一个系统的权威记录和检索索引分别是什么？&quot;,&quot;sources&quot;:[&quot;survey&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;langgraph&quot;,&quot;graphiti&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;scope&quot;,&quot;short&quot;:&quot;主体与范围&quot;,&quot;title&quot;:&quot;Q3 · 这份 Memory 归谁、服务谁、谁可以共享？&quot;,&quot;en&quot;:&quot;Subjects, scope, and sharing topology&quot;,&quot;what&quot;:&quot;确定 Memory 围绕哪个主体或边界组织：一次线程、任务、项目、用户、Agent、团队、租户或环境；同时记录共享和隔离关系。&quot;,&quot;why&quot;:&quot;“跨会话”只说明时间上持续，不说明它属于谁；按用户分组也不自动等于权限隔离。主体、范围和共享拓扑决定了同一条记忆会被哪些后续任务看到。&quot;,&quot;how&quot;:&quot;从 namespace、thread/user/project ID、tenant 配置、共享接口和权限文档中核对范围；把归属、可见性和授权分开记录。&quot;,&quot;example&quot;:&quot;项目团队的会议摘要可以属于项目空间、供多个 Agent 读取；用户的饮食偏好只应在用户授权的范围内使用。两者都可能跨会话保留，但共享拓扑不同。&quot;,&quot;evidence&quot;:&quot;CoALA 以单个语言 Agent 的认知架构为主要主体；工程系统的官方文档普遍用 thread、user、namespace、tenant 或 team 组织数据；COLLABMEM 等评测把协作共享作为单独问题。它们共同支持把主体与范围列为独立问题。&quot;,&quot;check&quot;:&quot;能否区分“属于谁”“谁看得到”“谁有权使用”三个句子？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;collabmem&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;lifecycle&quot;,&quot;short&quot;:&quot;生命周期&quot;,&quot;title&quot;:&quot;Q4 · 它如何形成、更新、失效和遗忘？&quot;,&quot;en&quot;:&quot;Lifecycle and dynamics&quot;,&quot;what&quot;:&quot;追踪写入、提取、反思、合并、修订、冲突解决、过期、删除和遗忘的全过程。&quot;,&quot;why&quot;:&quot;Memory 不是只写一次的静态仓库。旧事实会失效，摘要会丢失细节，经验可能被反思更新；“不再检索”与“已经删除”也不是同一件事。&quot;,&quot;how&quot;:&quot;画出从事件到长期记录的状态变化，标出触发主体、版本、冲突策略、TTL/删除语义和失败后的回滚或保留。&quot;,&quot;example&quot;:&quot;用户把会议时间从上午改为下午：系统可能追加新事实、覆盖旧字段、保留带时间戳的历史，或在冲突时让 Agent 决定。只有查看更新和删除语义，才能知道下一次会读到什么。&quot;,&quot;evidence&quot;:&quot;Storage→Reflection→Experience 把记忆演化描述为存储、反思和经验形成；多项 benchmark 测试新增信息、时间变化、冲突解决或长期交互；官方服务文档也把写入策略、更新和保留作为配置。&quot;,&quot;check&quot;:&quot;能否说明一条错误记忆从发现到停止影响答案的完整路径？&quot;,&quot;sources&quot;:[&quot;storage-experience&quot;,&quot;longmemeval&quot;,&quot;memoryagentbench&quot;,&quot;google-agent-platform-memory-bank&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;exposure&quot;,&quot;short&quot;:&quot;暴露方式&quot;,&quot;title&quot;:&quot;Q5 · 后续调用如何获得并使用它？&quot;,&quot;en&quot;:&quot;Exposure and use path&quot;,&quot;what&quot;:&quot;拆开“已经保存”“被检索/选择”“进入当前输入”“改变了行动”四个阶段，描述后续调用实际能看到什么。&quot;,&quot;why&quot;:&quot;外部存储里有记录，不代表当前模型已经看到；检索到也不代表被采用。很多 benchmark 测最终回答，却不能仅凭结果证明内部检索或注入路径。&quot;,&quot;how&quot;:&quot;沿着一次调用记录读取触发、查询、排序/过滤、上下文拼接、工具返回和最终决策，标出自动注入与 Agent 主动读取的差异。&quot;,&quot;example&quot;:&quot;文件中有“使用 Python 3.12”的记录；调用前检索没有命中，模型仍会忘记；命中并注入后，模型知道它，但若来源过期仍可能误用。&quot;,&quot;evidence&quot;:&quot;CoALA 的长期记忆通过 retrieval 进入 working memory；LongMemEval、LoCoMo 和 MemoryAgentBench 主要观察取回后的任务结果；LangGraph/OpenAI/Google 文档展示状态或服务如何进入后续运行。&quot;,&quot;check&quot;:&quot;能否把一条“保存了但没有被使用”的失败例子说清楚？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;longmemeval&quot;,&quot;locomo&quot;,&quot;langgraph&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;governance&quot;,&quot;short&quot;:&quot;控制与治理&quot;,&quot;title&quot;:&quot;Q6 · 谁能读、写、改、删，并承担什么责任？&quot;,&quot;en&quot;:&quot;Control and governance&quot;,&quot;what&quot;:&quot;核对控制主体、权限、同意、来源追溯、审计、投毒防护、删除请求和成本/延迟约束。&quot;,&quot;why&quot;:&quot;同一个 Memory 功能可以由 Agent 主动调用、Harness 自动维护或托管服务完成；权限和审计决定它是否能在真实环境安全工作。&quot;,&quot;how&quot;:&quot;分别检查读/写/改/删权限、批准流程、来源和版本、审计记录、数据隔离、失败处理及资源预算；没有证据就写“未说明”。&quot;,&quot;example&quot;:&quot;用户允许系统记住语言偏好，但不允许把工作项目内容共享给其他 Agent。系统需要记录谁写入、谁读取、如何撤回和如何证明删除已传播。&quot;,&quot;evidence&quot;:&quot;安全、隐私和协作评测把访问控制、共享和投毒作为独立风险；工程文档通常把身份、权限、保留和审计放在服务配置里；研究框架较少完整覆盖这些治理细节，因此教程把它们保留为必答问题并标注证据边界。&quot;,&quot;check&quot;:&quot;能否判断一个“支持 Memory”的声明是否同时说明了权限和删除？&quot;,&quot;sources&quot;:[&quot;collabmem&quot;,&quot;agentpoison&quot;,&quot;google-agent-platform-memory-bank&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;}],&quot;sources&quot;:{&quot;coala&quot;:{&quot;label&quot;:&quot;CoALA · §4.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2309.02427v3#S4.SS1&quot;,&quot;year&quot;:&quot;2023 arXiv / 2024 TMLR&quot;,&quot;evidence&quot;:&quot;研究框架论文；arXiv v3（2024-03）为 TMLR camera-ready；架构分类章节已核&quot;},&quot;survey&quot;:{&quot;label&quot;:&quot;Memory in the Age of AI Agents · §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.13564v2#S4&quot;,&quot;year&quot;:&quot;2025/2026&quot;,&quot;evidence&quot;:&quot;arXiv 综述；v1/v2 元数据与分类章节已核&quot;},&quot;langchain&quot;:{&quot;label&quot;:&quot;LangChain · Memory overview&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/concepts/memory&quot;,&quot;year&quot;:&quot;2026&quot;,&quot;evidence&quot;:&quot;官方概念文档；短期/长期记忆边界已核&quot;},&quot;context&quot;:{&quot;label&quot;:&quot;Anthropic · Context engineering&quot;,&quot;url&quot;:&quot;https://www.anthropic.com/research/effective-context-engineering-for-ai-agents&quot;,&quot;year&quot;:&quot;2025&quot;,&quot;evidence&quot;:&quot;Anthropic 官方研究文章；上下文工程说明已核&quot;},&quot;cline&quot;:{&quot;label&quot;:&quot;功能原始来源&quot;,&quot;url&quot;:&quot;https://docs.cline.bot/prompting/cline-memory-bank&quot;,&quot;year&quot;:&quot;2026-11-06 UTC&quot;,&quot;evidence&quot;:&quot;已读官方文档或项目 README 的相关段落；未验证运行效果&quot;},&quot;langgraph:0&quot;:{&quot;label&quot;:&quot;LangGraph · 项目仓库&quot;,&quot;url&quot;:&quot;https://github.com/langchain-ai/langgraph&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;langgraph:1&quot;:{&quot;label&quot;:&quot;LangGraph · 记忆概念&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/concepts/memory&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;deep-agents:0&quot;:{&quot;label&quot;:&quot;Deep Agents · 项目仓库&quot;,&quot;url&quot;:&quot;https://github.com/langchain-ai/deepagents&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;deep-agents:1&quot;:{&quot;label&quot;:&quot;Deep Agents · 记忆文档&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/deepagents/memory&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;deep-agents:2&quot;:{&quot;label&quot;:&quot;Deep Agents · 后端文档&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/deepagents/backends&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;mem0:0&quot;:{&quot;label&quot;:&quot;Mem0 · 仓库与文档&quot;,&quot;url&quot;:&quot;https://github.com/mem0ai/mem0&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;graphiti:0&quot;:{&quot;label&quot;:&quot;Graphiti · 仓库与文档&quot;,&quot;url&quot;:&quot;https://github.com/getzep/graphiti&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-agent-platform-memory-bank:0&quot;:{&quot;label&quot;:&quot;Google Agent Platform Memory Bank · 官方概览&quot;,&quot;url&quot;:&quot;https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-agent-platform-memory-bank:1&quot;:{&quot;label&quot;:&quot;Google Agent Platform Memory Bank · 记忆生成&quot;,&quot;url&quot;:&quot;https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/generate-memories&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-adk:0&quot;:{&quot;label&quot;:&quot;Google ADK · 项目仓库&quot;,&quot;url&quot;:&quot;https://github.com/google/adk-python&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-adk:1&quot;:{&quot;label&quot;:&quot;Google ADK · 记忆服务指南&quot;,&quot;url&quot;:&quot;https://github.com/google/adk-python/b a-ready 的原始论文与章节已核；作者提出的是架构视角，不是行业统一标准。&quot;,&quot;limitations&quot;:&quot;没有完整规定工程权限、删除、租户隔离或 benchmark 协议；四类不能被画成同层并列。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;questions&quot;:[{&quot;answer&quot;:&quot;CoALA 把 Memory 作为语言 Agent 的信息存储模块。Working memory 是当前决策循环直接操作的短期工作区；long-term memory 再分为 episodic（经历）、semantic（事实或知识）和 procedural（做事方式或规则）三类。因此四个名称不是四个同层并列槽位，而是“working memory + long-term memory 下三类”的层级。论文还描述长期记忆经 retrieval 进入工作记忆，学习动作可以把新内容写回长期记忆。&quot;,&quot;trace&quot;:&quot;CoALA §4.1 的 Memory 图和文字；论文明确把 working memory 与 long-term memory 分开，并在长期记忆下列出 episodic、semantic、procedural。retrieval 与 learning 的桥接关系见同节后续描述。&quot;},{&quot;answer&quot;:&quot;CoALA 更关心认知角色和信息存储层，没有把每类记忆绑定到一种物理数据库。工作记忆可以由当前输入、内部状态或上下文承载；长期记忆可以由外部模块承载，程序性记忆还可能体现在模型参数、Agent 代码或工具能力中。这里的分类不能被误读成“文件、向量库、图数据库”三选一，具体载体必须回到实现或方法论文核对。&quot;,&quot;trace&quot;:&quot;论文的 Memory 模块以及对 external memory、model parameters、programs/tools 的讨论。论文给出的是架构层含义，未规定某个具体数据库或部署拓扑。&quot;},{&quot;answer&quot;:&quot;主要主体是单个语言 Agent 的认知架构：它描述该 Agent 如何在一个决策循环里读写自己的 Memory。论文的目标不是团队资料库或多租户服务，所以没有给出项目、用户、团队共享的完整拓扑，也没有定义谁拥有一条记忆。把这些缺口写出来，是理解 CoALA 边界的一部分。&quot;,&quot;trace&quot;:&quot;论文摘要和 §4 将 CoALA 定义为 language agent 的 conceptual framework；共享主体、租户隔离和删除权并非该框架的完整目标。&quot;},{&quot;answer&quot;:&quot;长期记忆通过 retrieval action 进入 working memory，learning action 则可以把交互中的新信息、反馈或技能写回长期记忆。论文给出的是操作关系和架构位置，不是通用的 TTL、版本、冲突覆盖或删除传播协议。因此“能学习、能检索”不能直接推出“有完整生命周期管理”。&quot;,&quot;trace&quot;:&quot;CoALA §4.1 及 Memory operations 的 retrieval/learning 描述；TTL、版本、冲突和删除协议在论文中未被定义，故标为未说明。&quot;},{&quot;answer&quot;:&quot;在 CoALA 的循环里，后续决策先选择 retrieval action，从长期记忆取回相关内容，再把它放入 working memory，供 reasoning 和 decision 使用。论文用这个 bridge 解释 Memory 怎样影响行动，但没有规定 embedding、排序、上下文预算或检索失败回退。回答这一问时要把架构路径和工程实现分开。&quot;,&quot;trace&quot;:&quot;论文 §4.1 的 retrieval bridge 与 §4.3 Retrieval actions；具体索引、排序和注入策略不属于 CoALA taxonomy 的规定。&quot;},{&quot;answer&quot;:&quot;CoALA 是概念框架和研究组织方式，不是访问控制或合规规范。它没有完整规定谁能读写、怎样审计来源、怎样抵抗投毒，以及用户要求删除后如何证明传播停止。这里的结论是“论文未规定这些治理机制”，不是“ tbench&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/HUST-AI-HYZ/MemoryAgentBench&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;timl-membench&quot;,&quot;title&quot;:&quot;TimlMemBench&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;近期的长程/时间变化 Memory benchmark 线索。&quot;,&quot;why&quot;:&quot;提供时间和动态维度的候选评测。&quot;,&quot;boundary&quot;:&quot;当前条目依赖资源目录线索，详细协议待补。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;s012&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.findings-emnlp.507/&quot;,&quot;coverage&quot;:[&quot;lifecycle&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;utilmem&quot;,&quot;title&quot;:&quot;UTILMEM&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;近期 Memory utility 评测线索。&quot;,&quot;why&quot;:&quot;可用于讨论有用性指标与六问设计层的差异。&quot;,&quot;boundary&quot;:&quot;当前只保留论文入口和候选状态。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;s014&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.emnlp-main.1639/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;longmemeval&quot;,&quot;title&quot;:&quot;LongMemEval&quot;,&quot;date&quot;:&quot;2025&quot;,&quot;summary&quot;:&quot;评估聊天助手长期交互中的信息提取、推理、时间变化、知识更新和 abstention。&quot;,&quot;why&quot;:&quot;任务定义清晰，是分析“结果能力”和“Memory 设计”差异的核心样板。&quot;,&quot;boundary&quot;:&quot;结果依赖模型、历史长度、任务子集、预算和评审协议；不做跨 benchmark 排名。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;longmemeval&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;selectionEvidence&quot;:&quot;论文身份、任务说明和公开入口可定位；纳入依据是长期交互与多类任务覆盖，不把得分当成系统完整性证明。&quot;,&quot;limitations&quot;:&quot;不直接测权限、审计、物理删除、成本和内部检索路径；需要与其他 benchmark 组合。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;questions&quot;:[{&quot;answer&quot;:&quot;LongMemEval 的任务围绕长期对话中的事实、偏好、事件和知识变化，测五类结果能力：信息提取、多会话推理、时间推理、知识更新和 abstention。它测的是系统能否在新问题中给出正确回答或承认不知道，不规定某一种 Memory taxonomy。&quot;,&quot;trace&quot;:&quot;论文摘要和任务章节列出的五类能力、500 个问题与长期 user-assistant history 设置；内容类别是任务设计，不是系统内部 schema。&quot;},{&quot;answer&quot;:&quot;Benchmark 的输入协议提供对话历史与查询，论文还把设计拆为 indexing、retrieval、reading 三阶段，但不把文件、向量库、图或参数记忆作为必须的控制变量。因此一个分数只能说明在给定协议下得到的结果，不能证明某种载体本身更好，也不能判断系统是否保留了可审计的权威记录。&quot;,&quot;trace&quot;:&quot;论文摘要对三阶段设计的概括、数据输入和 baseline 设置；内部存储形式属于被测系统实现。&quot;},{&quot;answer&quot;:&quot;评测范围由对话历史、用户/助手交互和任务实例定义，主要面向单个助手的长期交互。题目可以包含用户偏好和时间变化，但没有把团队共享、租户隔离、不同主体的可见性或权限错误作为核心指标。&quot;,&quot;trace&quot;:&quot;论文的数据构造和任务分类；协作共享与租户治理不在 LongMemEval 的核心协议中，故标为 not_assessed。&quot;},{&quot;answer&quot;:&quot;新信息、时间变化和知识更新任务让我们能观察部分生命周期结果，例如旧事实被新事实替换后是否回答正确；abstention 还可以观察系统是否避免无依据作答。它仍不直接验证写入日志、版本迁移、物理删除、删除传播或错误记忆的回滚路径。&quot;,&quot;trace&quot;:&quot;论文对 temporal reasoning、knowledge updates 和 abstention 的任务说明；缺失的是实现层生命周期协议。&quot;},{&quot;answer&quot;:&quot;它观察系统在给定历史与查询下能否取回并使用相关信息，最终以回答或判断结果计分。论文的 indexing/retrieval/reading 分解帮助我们分析路径，但黑盒结果仍不能单独证明触发条件、排序、上下文注入位置或模型是否绕过 Memory 直接利用了其他输入。&quot;,&quot;trace&quot;:&quot;论文摘要和评测协议对三阶段设计与任务输出的描述；内部调用链未被结果分数固定。&quot;},{&quot;answer&quot;:&quot;权限、同意、来源追溯、审计、投毒、物理删除、成本和延迟不是 LongMemEval 的主要测量维度。因此它是长期 Memory 结果能力的切片，不能作为完整系统验收；要回答 Q6，需要额外的安全、隐私和治理测试。&quot;,&quot;trace&quot;:&quot;论文任务和指标范围；这里明确记录未评估项，而不是把“没有测”解释成“系统没有”。&quot;}],&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2410.10813&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;profile&quot;:{&quot;kind&quot;:&quot;长期交互 Memory benchmark&quot;,&quot;authors&quot;:&quot;Di Wu, Hongwei Wang, Wenhao Yu, Yuwei Zhang, Kai-Wei Chang, Dong Yu&quot;,&quot;venue&quot;:&quot;ICLR 2025；arXiv v1 2024-10-14、v2 202 function renderCompare(){return `${crumbs(&#x27;系统比较&#x27;)}&lt;h1&gt;看不同系统如何组合记忆能力。&lt;/h1&gt;&lt;p class=&quot;kn-note&quot;&gt;这里保留原始资料中的七组组合属性；“范围与期限”“表示与存储”等尚未逐系统拆核，不能把它们直接视为九个学习专题的独立能力声明。&lt;/p&gt;&lt;p class=&quot;kn-lead&quot;&gt;一次展开多个视角，查看真实文档描述。更完整的功能、限制和来源放在系统详情里；本页不把功能数量当成质量分数。&lt;/p&gt;&lt;div class=&quot;kn-filter&quot;&gt;&lt;label&gt;系统类别&lt;select id=&quot;kn-compare-group&quot;&gt;${options({all:&#x27;全部已核系统&#x27;,...Object.fromEntries(Object.entries(groupNames).filter(([g])=&gt;resources.some(r=&gt;r.status===&#x27;documented&#x27;&amp;&amp;r.group===g)))},state.compareGroup)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;fieldset class=&quot;kn-axis-select&quot;&gt;&lt;legend&gt;同时查看哪些视角&lt;/legend&gt;${axes.map(a=&gt;`&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-compare-axis=&quot;${a.id}&quot; ${state.compareAxes.includes(a.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${esc(a.name)}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/fieldset&gt;&lt;div id=&quot;kn-compare-results&quot;&gt;${compareTable()}&lt;/div&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;layers&quot;&gt;查看 Harness / Agent 记忆切片 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-status-filter=&quot;pending&quot;&gt;查看待核对象 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;立体图仅比较 Harness 与 Agent；独立记忆层、插件和框架继续保留在本目录。图中逐格附依据，未核属性显示问号。&lt;/p&gt;`;}
function renderLayers(){const graph={dimensions:navigation.graphDimensions};return `${crumbs(&#x27;图解探索&#x27;)}&lt;h1&gt;比较真实 Harness / Agent 的记忆组合。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;使用七组已有证据的属性切片比较真实对象。这是系统资料的选定投影，与学习导航的九个问题分别组织。勾选多个对象和维度、调整角度与间距，再点击格子查看条件与来源。独立记忆服务、插件和纯框架不作为这张图的主体。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;图中的七组属性，对应哪些学习专题？&lt;/summary&gt;${graph.dimensions.map(a=&gt;`&lt;div class=&quot;kn-projection-row&quot;&gt;&lt;strong&gt;${esc(a.name)}&lt;/strong&gt;&lt;div class=&quot;kn-actions&quot;&gt;${navigation.graphTopics[a.id].map(id=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-topic=&quot;${esc(id)}&quot;&gt;${esc(topicBy(id).title)} →&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;kn-note&quot;&gt;图中只展示已有逐格来源的属性，未覆盖全部理论分类。合并属性在专题中拆开解释；不据此补造系统能力。&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;查看完整系统目录与说明 →&lt;/button&gt;&lt;/div&gt;`;}
function renderAbout(){return `${crumbs(&#x27;来源与收录说明&#x27;)}&lt;h1&gt;让入口有依据，也让边界看得见。&lt;/h1&gt;&lt;div class=&quot;kn-detail-body&quot;&gt;&lt;h2&gt;本轮覆盖&lt;/h2&gt;&lt;p&gt;${coverageText()}&lt;/p&gt;&lt;p&gt;资源目录核对至 ${esc(catalogue.checked_utc)}，专题说明更新于 ${esc(knowledge.checked)}，结合此前目录、候选池、中文报告、用户提名和补充系统核对；不声称穷尽全部记忆系统。&lt;/p&gt;&lt;h2&gt;四种状态怎么读&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;基础资料已核：读过可定位的原始文档、README 或作品介绍，支持这里的基础说明；不代表运行验证或安全认证。&lt;/li&gt;&lt;li&gt;研究阅读入口：论文身份、摘要或相关章节已核，完整方法和实验还需继续阅读。&lt;/li&gt;&lt;li&gt;待核线索：名称、当前机制、证据深度或已知问题仍需查清，不计入已核系统。&lt;/li&gt;&lt;li&gt;历史资料：有参考价值，但不作为当前维护方案推荐。&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;分类与图解&lt;/h2&gt;&lt;p&gt;九个问题是编者阅读导航；分类树明确标出研究来源，不是唯一分类。资料共同出现不表示存在实际数据流。立体切片展示真实 Harness 与 Agent，按属性标注公开资料依据和配置条件；没有依据的格子保留问号。&lt;/p&gt;&lt;h2&gt;占比和效果&lt;/h2&gt;&lt;p&gt;精选目录不能代表研究或商业市场分布。比例统计还需要可复现的采样范围、时间、检索式、分母和重叠规则。本轮没有运行 Benchmark，也没有生成统一效果排名。&lt;/p&gt;&lt;h2&gt;README 与交互页&lt;/h2&gt;&lt;p&gt;README 保留研究问题导航、按需路线、对象目录和静态图片，可以独立阅读；完整交互可部署到 GitHub Pages 或独立站点。在线入口由 GitHub Pages 提供。&lt;/p&gt;&lt;/div&gt;`;}
function renderNotFound(){return `${crumbs(&#x27;页面不存在&#x27;)}&lt;div class=&quot;kn-empty&quot;&gt;&lt;h1&gt;找不到这个课程页面&lt;/h1&gt;&lt;p&gt;链接 &lt;code&gt;${esc(state.routePath||&#x27;&#x27;)}&lt;/code&gt; 没有对应的课程章节或条目。页面不会默默跳到另一个对象。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn kn-tutorial-primary&quot; data-go=&quot;tutorial-home&quot;&gt;回到课程首页 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-research&quot;&gt;浏览 Research →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}

function topicBy(id){return knowledge.topics.find(t=&gt;t.id===(knowledge.aliases[id]||id))||knowledge.topics[0];}
function sourceLinks(ids){return `&lt;ul class=&quot;kn-source-links&quot;&gt;${[...new Set((ids||[]).filter(Boolean))].map(id=&gt;{const s=knowledge.sources[id];if(!s)return &#x27;&#x27;;const meta=[s.year,s.evidence].filter(Boolean).join(&#x27; · &#x27;);return `&lt;li&gt;&lt;a href=&quot;${esc(s.url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;${esc(s.label)} ↗&lt;/a&gt;${meta?`&lt;small&gt;${esc(meta)}&lt;/small&gt;`:&#x27;&#x27;}&lt;/li&gt;`;}).join(&#x27;&#x27;)}&lt;/ul&gt;`;}
function flow(steps){return `&lt;ol class=&quot;kn-flow&quot; aria-label=&quot;帮助理解的示意&quot;&gt;${steps.map(s=&gt;`&lt;li&gt;${esc(s)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;`;}
function comicStrip(t){const steps=(t.steps||[t.what,t.when,t.use||t.purpose,t.example]).filter(Boolean).slice(0,4);const icons=[&#x27;✍&#x27;,&#x27;🧠&#x27;,&#x27;↗&#x27;,&#x27;✓&#x27;];return `&lt;ol class=&quot;kn-comic&quot; aria-label=&quot;漫画式理解示意&quot;&gt;${steps.map((s,i)=&gt;`&lt;li class=&quot;kn-comic-panel&quot;&gt;&lt;span class=&quot;kn-comic-icon&quot; aria-hidden=&quot;true&quot;&gt;${icons[i%icons.length]}&lt;/span&gt;&lt;span class=&quot;kn-comic-step&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;p&gt;${esc(s)}&lt;/p&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;`;}
function explanation(t,{type=false,heading=&#x27;h2&#x27;}={}){
 const titleTag=heading===&#x27;h3&#x27;?&#x27;h3&#x27;:&#x27;h2&#x27;;
 return `&lt;article class=&quot;kn-explanation&quot;&gt;&lt;header&gt;&lt;p class=&quot;kn-kicker&quot;&gt;${esc(t.en)}&lt;/p&gt;&lt;${titleTag}&gt;${esc(t.zh)}&lt;/${titleTag}&gt;&lt;/header&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(t.def||t.definition)}&lt;/p&gt;${t.enDefinition?`&lt;p class=&quot;kn-english&quot;&gt;${esc(t.enDefinition)}&lt;/p&gt;`:&#x27;&#x27;}&lt;details class=&quot;kn-expand&quot;&gt;&lt;summary&gt;展开解释与具体例子&lt;/summary&gt;&lt;dl class=&quot;kn-explain-fields&quot;&gt;${t.what?`&lt;dt&gt;${type?&#x27;记录什么&#x27;:&#x27;涉及什么&#x27;}&lt;/dt&gt;&lt;dd&gt;${esc(t.what)}&lt;/dd&gt;`:&#x27;&#x27;}${t.when?`&lt;dt&gt;什么时候用&lt;/dt&gt;&lt;dd&gt;${esc(t.when)}&lt;/dd&gt;`:&#x27;&#x27;}${(t.use||t.purpose)?`&lt;dt&gt;用来做什么&lt;/dt&gt;&lt;dd&gt;${esc(t.use||t.purpose)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;&lt;div class=&quot;kn-example&quot;&gt;&lt;h3&gt;用一个例子理解&lt;/h3&gt;&lt;p&gt;${esc(t.example)}&lt;/p&gt;${comicStrip(t)}&lt;small&gt;帮助理解的例子，由编者构造；不作为系统效果证据。&lt;/small&gt;&lt;/div&gt;&lt;p class=&quot;kn-boundary&quot;&gt;&lt;strong&gt;容易混淆的地方：&lt;/strong&gt;${esc(t.boundary)}&lt;/p&gt;&lt;/details&gt;&lt;details class=&quot;kn-expand&quot;&gt;&lt;summary&gt;定义依据与原始来源&lt;/summary&gt;${sourceLinks(t.sources)}&lt;/details&gt;${t.resources?.length?`&lt;div class=&quot;kn-section&quot;&gt;&lt;h3&gt;继续看方法与实现&lt;/h3&gt;${refs(t.resources)}&lt;p class=&quot;kn-note&quot;&gt;这些是相关阅读入口。具体能力、配置条件与核对程度见每条资料，不表示它们实现了本专题的所有做法。&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/article&gt;`;
}
function frameworkList(){return Object.entries(knowledge.frameworks||{}).sort((a,b)=&gt;(a[1].order||99)-(b[1].order||99));}
function frameworkCategories(id){const f=knowledge.frameworks[id]||{};if(Array.isArray(f.categories))return f.categories;return [];}
function frameworkCategoryIds(id){return frameworkCategories(id).map(c=&gt;c.id);}
function frameworkCategoryData(cat){if(cat?.typeId)return knowledge.types[cat.typeId]||cat;if(cat?.term)return knowledge.terms[cat.term]||cat;return cat||{};}
function contentMethods(){return Object.fromEntries((knowledge.draftTaxonomy?.items||[]).map(m=&gt;[m.id,m]));}
function contentMethod(id){const methods=contentMethods();return methods[id]||Object.values(methods)[0];}
function frameworkSummary(f){return `&lt;span class=&quot;kn-framework-meta&quot;&gt;&lt;span&gt;${esc(f.status||&#x27;&#x27;)}&lt;/span&gt;&lt;span&gt;证据：${esc(f.confidence||&#x27;待定&#x27;)}&lt;/span&gt;&lt;span&gt;${esc(f.kind||&#x27;&#x27;)}&lt;/span&gt;&lt;/span&gt;`;}
function frameworkChooser(){return `&lt;div class=&quot;kn-framework-chooser&quot; role=&quot;group&quot; aria-label=&quot;主流分类方式&quot;&gt;${frameworkList().map(([id,f],i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-framework-card ${state.framework===id?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-framework=&quot;${esc(id)}&quot; aria-pressed=&quot;${state.framework===id}&quot;&gt;&lt;span class=&quot;kn-framework-index&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span class=&quot;kn-framework-card-copy&quot;&gt;&lt;strong&gt;${esc(f.name)}&lt;/strong&gt;&lt;small&gt;${esc(f.en)}&lt;/small&gt;${frameworkSummary(f)}&lt;/span&gt;&lt;span class=&quot;kn-framework-arrow&quot; aria-hidden=&quot;true&quot;&gt;${state.framework===id?&#x27;●&#x27;:&#x27;→&#x27;}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function categoryView(cat,selected){const raw=frameworkCategoryData(cat);const definition=cat.definition||raw.def||raw.definition||&#x27;&#x27;;const example=cat.example||raw.example||&#x27;&#x27;;const boundary=cat.boundary||raw.boundary||&#x27;&#x27;;const detail={...raw,zh:cat.zh||raw.zh,en:cat.en||raw.en,def:definition,example};const open=selected&amp;&amp;state.categoryOpen;return `&lt;details class=&quot;kn-framework-category&quot; ${open?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary data-framework-category=&quot;${esc(cat.id)}&quot; aria-current=&quot;${selected?&#x27;true&#x27;:&#x27;false&#x27;}&quot;&gt;&lt;span&gt;&lt;strong&gt;${esc(cat.zh||raw.zh||cat.id)}&lt;/strong&gt;&lt;small&gt;${esc(cat.en||raw.en||&#x27;&#x27;)}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;kn-category-marker&quot; aria-hidden=&quot;true&quot;&gt;${selected?&#x27;●&#x27;:&#x27;＋&#x27;}&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;kn-framework-category-body&quot;&gt;&lt;p&gt;${esc(definition)}&lt;/p&gt;${raw.what||raw.when||raw.use?`&lt;dl class=&quot;kn-explain-fields&quot;&gt;${raw.what?`&lt;dt&gt;记录什么&lt;/dt&gt;&lt;dd&gt;${esc(raw.what)}&lt;/dd&gt;`:&#x27;&#x27;}${raw.when?`&lt;dt&gt;什么时候用&lt;/dt&gt;&lt;dd&gt;${esc(raw.when)}&lt;/dd&gt;`:&#x27;&#x27;}${raw.use?`&lt;dt&gt;用来做什么&lt;/dt&gt;&lt;dd&gt;${esc(raw.use)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;`:&#x27;&#x27;}&lt;div class=&quot;kn-example&quot;&gt;&lt;strong&gt;教学例子&lt;/strong&gt;&lt;p&gt;${esc(example)}&lt;/p&gt;&lt;/div&gt;${boundary?`&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;边界：&lt;/strong&gt;${esc(boundary)}&lt;/p&gt;`:&#x27;&#x27;}${raw.evidenceLevel||raw.standardization?`&lt;dl class=&quot;kn-term-evidence&quot;&gt;&lt;dt&gt;证据等级&lt;/dt&gt;&lt;dd&gt;${esc(raw.evidenceLevel||&#x27;未分级&#x27;)}&lt;/dd&gt;&lt;dt&gt;标准化状态&lt;/dt&gt;&lt;dd&gt;${esc(raw.standardization||&#x27;原文未说明&#x27;)}&lt;/dd&gt;${raw.evidenceSummary?`&lt;dt&gt;来源说明&lt;/dt&gt;&lt;dd&gt;${esc(raw.evidenceSummary)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;`:&#x27;&#x27;}${(cat.sources||raw.sources)?.length?`&lt;details class=&quot;kn-category-sources&quot;&gt;&lt;summary&gt;查看该类别的来源&lt;/summary&gt;${sourceLinks(cat.sources||raw.sources)}&lt;/details&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/details&gt;`;}
function frameworkCategoryTree(f){const by=Object.fromEntries(frameworkCategories(state.framework).map(c=&gt;[c.id,c]));if(f.dimensions)return f.dimensions.map(dim=&gt;`&lt;section class=&quot;kn-dimension&quot;&gt;&lt;div class=&quot;kn-dimension-head&quot;&gt;&lt;h4&gt;${esc(dim.zh)} &lt;small&gt;${esc(dim.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(dim.description)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;例子：${esc(dim.example)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-framework-category-grid&quot;&gt;${dim.categories.map(c=&gt;categoryView(c,state.frameworkCategory===c.id)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;);return f.roots.map(id=&gt;{const root=by[id];const childIds=f.children?.[id]||[];return `&lt;div class=&quot;kn-category-branch&quot;&gt;${categoryView(root,state.frameworkCategory===root.id)}${childIds.length?`&lt;div class=&quot;kn-category-children&quot; aria-label=&quot;${esc(root.zh)}的子类别&quot;&gt;${childIds.map(cid=&gt;categoryView(by[cid],state.frameworkCategory===cid)).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}).join(&#x27;&#x27;);}
function frameworkFacts(f){const facts=f.sourceFacts||{};const guide=f.readerGuide||{};return `&lt;div class=&quot;kn-framework-evidence&quot;&gt;&lt;section&gt;&lt;h4&gt;来源事实&lt;/h4&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;分类依据&lt;/dt&gt;&lt;dd&gt;${esc(facts.classificationBasis||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;内部关系&lt;/dt&gt;&lt;dd&gt;${esc(facts.categoryRelations||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;结构证据&lt;/dt&gt;&lt;dd&gt;${esc(facts.structureEvidence||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;实证支持&lt;/dt&gt;&lt;dd&gt;${esc(facts.empiricalSupport||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;原文声称的适用范围&lt;/dt&gt;&lt;dd&gt;${esc(facts.scope||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;原文声称的限制&lt;/dt&gt;&lt;dd&gt;${esc(facts.limitations||&#x27;&#x27;)}&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;&lt;section&gt;&lt;h4&gt;编者解释&lt;/h4&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;适用场景&lt;/dt&gt;&lt;dd&gt;${esc(guide.scenarios||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;侧重点&lt;/dt&gt;&lt;dd&gt;${esc(guide.focus||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;优势&lt;/dt&gt;&lt;dd&gt;${esc(guide.advantages||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;代价&lt;/dt&gt;&lt;dd&gt;${esc(guide.tradeoffs||&#x27;&#x27;)}&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;&lt;/div&gt;`;}
function sourceScenarioCard(s){return `&lt;details class=&quot;kn-source-scenario&quot;&gt;&lt;summary&gt;${esc(s.title)} &lt;small&gt;${esc(s.location)}&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;kn-scenario-body&quot;&gt;&lt;div class=&quot;kn-note&quot;&gt;来源：${sourceLinks([s.source])}&lt;/div&gt;&lt;dl class=&quot;kn-scenario-facts&quot;&gt;&lt;dt&gt;场景背景&lt;/dt&gt;&lt;dd&gt;${esc(s.background)}&lt;/dd&gt;&lt;dt&gt;记忆内容&lt;/dt&gt;&lt;dd&gt;${esc(s.memory)}&lt;/dd&gt;&lt;dt&gt;承载与表示&lt;/dt&gt;&lt;dd&gt;${esc(s.storage)}&lt;/dd&gt;&lt;dt&gt;写入触发与主体&lt;/dt&gt;&lt;dd&gt;${esc(s.write)}&lt;/dd&gt;&lt;dt&gt;读取与注入&lt;/dt&gt;&lt;dd&gt;${esc(s.read)}&lt;/dd&gt;&lt;dt&gt;更新、压缩或遗忘&lt;/dt&gt;&lt;dd&gt;${esc(s.maintenance)}&lt;/dd&gt;&lt;dt&gt;原文效果或定性结论&lt;/dt&gt;&lt;dd&gt;${esc(s.effect)}&lt;/dd&gt;&lt;dt&gt;与相邻类别的区别&lt;/dt&gt;&lt;dd&gt;${esc(s.contrast)}&lt;/dd&gt;&lt;dt&gt;证据性质&lt;/dt&gt;&lt;dd&gt;${esc(s.evidence)}&lt;/dd&gt;&lt;/dl&gt;&lt;/div&gt;&lt;/details&gt;`;}
function selectedFrameworkDetail(){const f=knowledge.frameworks[state.framework];return `&lt;section class=&quot;kn-selected-framework&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(f.name)}&lt;/h3&gt;&lt;p&gt;${esc(f.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-selected-badge&quot;&gt;当前查看&lt;/span&gt;&lt;/div&gt;${frameworkSummary(f)}&lt;p class=&quot;kn-framework-intro&quot;&gt;${esc(f.intro)}&lt;/p&gt;${frameworkFacts(f)}&lt;details class=&quot;kn-framework-sources&quot;&gt;&lt;summary&gt;查看出处、年份与证据说明&lt;/summary&gt;${sourceLinks(f.sources||[f.source])}&lt;/details&gt;&lt;div class=&quot;kn-category-heading&quot;&gt;&lt;h4&gt;这套分类方式自己的类别&lt;/h4&gt;&lt;p&gt;点击类别可展开定义、教学例子和边界；类别只在当前分类方式内部解释。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-framework-category-tree&quot;&gt;${frameworkCategoryTree(f)}&lt;/div&gt;&lt;div class=&quot;kn-category-heading&quot;&gt;&lt;h4&gt;有来源的场景与证据边界&lt;/h4&gt;&lt;p&gt;以下案例逐项说明来源事实、编者映射和原文未说明部分。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-source-scenarios&quot;&gt;${(f.sourceScenarios||[]).map(sourceScenarioCard).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function contentIndexNav(){const idx=knowledge.contentIndex;return `&lt;section class=&quot;kn-content-index&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(idx.title)}&lt;/h3&gt;&lt;p&gt;${esc(idx.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;分类外导航索引&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;${esc(idx.description)}&lt;/p&gt;${idx.groups.map(g=&gt;`&lt;section class=&quot;kn-content-group&quot;&gt;&lt;div class=&quot;kn-content-group-head&quot;&gt;&lt;h4&gt;${esc(g.zh)} &lt;small&gt;${esc(g.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(g.note)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-content-buttons&quot;&gt;${g.items.map(id=&gt;{const m=contentMethod(id);return `&lt;button type=&quot;button&quot; class=&quot;kn-content-card ${state.memoryType===id?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-content-type=&quot;${esc(id)}&quot; aria-pressed=&quot;${state.memoryType===id}&quot;&gt;&lt;strong&gt;${esc(m.zh)}&lt;/strong&gt;&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;span&gt;${esc(m.definition)}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;`;}
function draftTaxonomySection(){const draft=knowledge.draftTaxonomy;return `&lt;section class=&quot;kn-draft-taxonomy&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(draft.title)}&lt;/h3&gt;&lt;p&gt;${esc(draft.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-pending-badge&quot;&gt;${esc(draft.status)}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;${esc(draft.intro)}&lt;/p&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;形成依据&lt;/dt&gt;&lt;dd&gt;${esc(draft.rationale)}&lt;/dd&gt;&lt;dt&gt;当前限制&lt;/dt&gt;&lt;dd&gt;${esc(draft.limitation)}&lt;/dd&gt;&lt;/dl&gt;&lt;div class=&quot;kn-draft-items&quot;&gt;${draft.items.map(item=&gt;`&lt;article id=&quot;types-${esc(item.id)}&quot;&gt;&lt;h4&gt;${esc(item.zh)} &lt;small&gt;${esc(item.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(item.definition)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;边界：${esc(item.boundary)}&lt;/p&gt;${sourceLinks(item.sources)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function contentIndexSection(){const selected=contentMethod(state.memoryType);return `&lt;section class=&quot;kn-content-outside&quot;&gt;${contentIndexNav()}&lt;section class=&quot;kn-selected-content&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;当前选中的索引项&lt;/h3&gt;&lt;p&gt;这里是分类外导航内容，不把它当作某套正式分类的下级。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${selected?explanation(selected,{type:true,heading:&#x27;h3&#x27;}):&#x27;&#x27;}&lt;/section&gt;&lt;/section&gt;`;}
function mappingState(value){return value||&#x27;none&#x27;;}
function mappingLabel(value){return ({direct:&#x27;直接对应&#x27;,parent:&#x27;上层包含&#x27;,related:&#x27;有关联&#x27;,possible:&#x27;可落入&#x27;,unclear:&#x27;待核&#x27;,none:&#x27;无直接对应&#x27;})[value]||&#x27;无直接对应&#x27;;}
function mappingSymbol(value){return ({direct:&#x27;●&#x27;,parent:&#x27;◆&#x27;,related:&#x27;◐&#x27;,possible:&#x27;◇&#x27;,unclear:&#x27;?&#x27;,none:&#x27;—&#x27;})[value]||&#x27;—&#x27;;}
function taxonomyCrosswalk(){const f=knowledge.frameworks[state.framework];const categories=frameworkCategories(state.framework);const groups=[...new Set(categories.map(c=&gt;c.dimension||&#x27;当前分类&#x27;))];const mapping=knowledge.contentIndex.mappings?.[state.framework]||{};const methods=contentMethods();return `&lt;section class=&quot;kn-crosswalk&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;交叉映射：典型记忆内容 × 当前分类方式&lt;/h3&gt;&lt;p&gt;行是 5+2 内容索引，列是“${esc(f.name)}”自己的类别&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;${esc(knowledge.contentIndex.mappingStatus||&#x27;编者映射 · 待验证&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;这里比较的是“典型内容”与当前分类方式的交叉关系。它不表示不同分类方式之间的父子关系；其中 ◆ 只表示当前分类方式内部的上层类别与该内容的包含关系。短横线（—）表示当前没有直接对应标注，不等同于已经证明不存在。&lt;/p&gt;&lt;div class=&quot;kn-crosswalk-wrap&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;典型记忆内容与分类方式交叉映射&quot;&gt;&lt;table&gt;&lt;caption class=&quot;kn-sr&quot;&gt;典型记忆内容与当前分类方式的交叉映射&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;典型记忆内容&lt;/th&gt;${categories.map(c=&gt;`&lt;th scope=&quot;col&quot;&gt;&lt;span&gt;${esc(c.zh)}&lt;/span&gt;&lt;small&gt;${esc(c.en)}&lt;/small&gt;&lt;em&gt;${esc(c.dimension||&#x27;&#x27;)}&lt;/em&gt;&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${knowledge.contentIndex.groups.flatMap(g=&gt;g.items).map(id=&gt;{const m=methods[id];const row=mapping[id]||{};return `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-content-type=&quot;${esc(id)}&quot;&gt;${esc(m.zh)}&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;/button&gt;&lt;/th&gt;${categories.map(c=&gt;{const s=mappingState(row[c.id]);return `&lt;td class=&quot;kn-map-${s}&quot;&gt;&lt;span class=&quot;kn-sr&quot;&gt;${esc(mappingLabel(s))}&lt;/span&gt;${mappingSymbol(s)}&lt;/td&gt;`;}).join(&#x27;&#x27;)}&lt;/tr&gt;`;}).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;kn-map-legend&quot;&gt;&lt;span class=&quot;kn-map-direct&quot;&gt;●&lt;/span&gt;直接对应　&lt;span class=&quot;kn-map-parent&quot;&gt;◆&lt;/span&gt;上层包含　&lt;span class=&quot;kn-map-related&quot;&gt;◐&lt;/span&gt;有关联　&lt;span class=&quot;kn-map-possible&quot;&gt;◇&lt;/span&gt;可落入　&lt;span class=&quot;kn-map-unclear&quot;&gt;?&lt;/span&gt;待核　&lt;span class=&quot;kn-map-none&quot;&gt;—&lt;/span&gt;未标注直接对应&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;${groups.length&gt;1?`列头中的小字说明三维或工程术语族内部的子轴：${esc(groups.join(&#x27;、&#x27;))}。`:&#x27;&#x27;}这些符号是导航关系和证据边界，不是性能分数。&lt;/p&gt;&lt;/section&gt;`;}
function relatedResearchPerspectives(){const updates=(knowledge.updates||[]).filter(u=&gt;u.id!==&#x27;foundation-3d&#x27;);if(!updates.length)return &#x27;&#x27;;return `&lt;section class=&quot;kn-updates&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;相关研究视角&lt;/h3&gt;&lt;p&gt;补充研究问题，不并入上面的分类树&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;这些工作讨论结构、生命周期、成本和图记忆等其他问题。它们可以帮助继续研究，但不与四套主流分类方式抢同一个层级。&lt;/p&gt;&lt;div class=&quot;kn-update-grid&quot;&gt;${updates.map(u=&gt;`&lt;article class=&quot;kn-update-card&quot;&gt;&lt;div class=&quot;kn-update-meta&quot;&gt;&lt;span&gt;${esc(u.year)}&lt;/span&gt;&lt;span&gt;研究视角&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;${esc(u.title)} &lt;small&gt;${esc(u.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(u.summary)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;与分类页面的关系：&lt;/strong&gt;${esc(u.relation)}&lt;/p&gt;${sourceLinks(u.sources)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function topicNavigation(a){return `&lt;nav class=&quot;kn-topic-nav&quot; aria-label=&quot;分类与方法专题&quot;&gt;${knowledge.topics.map((t,i)=&gt;`&lt;button type=&quot;button&quot; data-topic=&quot;${t.id}&quot; ${a.id===t.id?&#x27;aria-current=&quot;location&quot;&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;${esc(t.short)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;}
function renderLegacyHome(){return `&lt;section class=&quot;kn-hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;kn-kicker&quot;&gt;A field guide to agent memory&lt;/p&gt;&lt;h1&gt;先理解记忆，&lt;br&gt;再找到适合的方法。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;从记忆分类、技术路线到实际系统，连接论文、代码与评测。为学习、选型和自己的 Harness 设计建立知识全景。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-path&quot;&gt;&lt;strong&gt;从这里开始&lt;/strong&gt;&lt;p&gt;认识记忆 → 理解方法 → 找到实现 → 检查证据&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-topic=&quot;types&quot;&gt;进入记忆分类 →&lt;/button&gt;&lt;p class=&quot;kn-note&quot;&gt;也可以从顶部直接查需求、找资源或比较系统。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;九个问题，读懂记忆系统&lt;/h2&gt;&lt;p&gt;每个问题各管一件事，点击进入专题&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-atlas&quot;&gt;${knowledge.topics.map((t,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-axis&quot; data-topic=&quot;${t.id}&quot;&gt;&lt;span class=&quot;kn-num&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${esc(t.title)}&lt;/strong&gt;&lt;small&gt;${esc(t.en)}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;kn-preview&quot;&gt;${esc(t.intro)}&lt;/span&gt;&lt;span class=&quot;kn-arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;九个问题是本仓库的阅读导航，会随研究修订。记忆分类展示具名分类方式；其他专题分别描述控制、范围、期限、表示、存储、维护、使用和权限。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;同一份记忆，可以从不同问题理解&lt;/h2&gt;&lt;div class=&quot;kn-example&quot;&gt;&lt;p&gt;例如“项目做到第三步，明天继续”：它可以是当前工作状态，按项目组织，写成笔记并存到文件中，保留到任务结束，下次会话再读入。&lt;/p&gt;${flow([&#x27;记录任务进度&#x27;,&#x27;按项目保存&#x27;,&#x27;下次读回继续&#x27;])}&lt;p class=&quot;kn-note&quot;&gt;“记忆分类”回答它是什么；其余专题分别说明谁控制、如何组织、怎样保存与使用。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;继续走向方法与实现&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;kn-quick&quot;&gt;&lt;article&gt;&lt;h3&gt;有具体需求&lt;/h3&gt;&lt;p&gt;跨会话继续工作、记住用户偏好、复用经验，从需求找到阅读路线。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;needs&quot;&gt;按需查找 →&lt;/button&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;找论文与系统&lt;/h3&gt;&lt;p&gt;${resources.length} 项资料保留功能、亮点、边界和原始来源。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;library&quot;&gt;资源目录 →&lt;/button&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;看系统如何组合&lt;/h3&gt;&lt;p&gt;先了解方法，再比较真实 Harness 与 Agent 采用的做法；独立记忆层另见资源目录。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;layers&quot;&gt;图解探索 →&lt;/button&gt;&lt;a class=&quot;kn-text-btn&quot; href=&quot;https://dongshuyan.github.io/awesome-harness-memory/report/index.html&quot;&gt;研究 × 工程报告 →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;`;}
function renderTaxonomy(){return `&lt;section class=&quot;kn-taxonomy&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;有来源的分类入口&lt;/h2&gt;&lt;p&gt;四套入口并列展示，按来源清晰度和当前证据状态排序&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;正式分类模块&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;先选择一套分类方式。展开后只显示这套方式自己的来源事实、类别结构和场景；分类外草案、索引、交叉映射与相关研究另行展示。&lt;/p&gt;${frameworkChooser()}${selectedFrameworkDetail()}&lt;/section&gt;${draftTaxonomySection()}${contentIndexSection()}${taxonomyCrosswalk()}${relatedResearchPerspectives()}`;}
function renderTopic(){const a=topicBy(state.topic),chosen=a.methods.find(m=&gt;m.id===state.method)||a.methods[0];return `${crumbs(&#x27;分类与方法&#x27;)}${topicNavigation(a)}&lt;div class=&quot;kn-topic-title&quot;&gt;&lt;h1&gt;${esc(a.title)}&lt;/h1&gt;&lt;span&gt;${esc(a.en)}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(a.intro)}&lt;/p&gt;&lt;p class=&quot;kn-english&quot;&gt;${esc(a.enIntro)}&lt;/p&gt;&lt;p class=&quot;kn-boundary&quot;&gt;${esc(a.boundary)}&lt;/p&gt;${a.id===&#x27;types&#x27;?renderTaxonomy():`&lt;details class=&quot;kn-topic-example&quot;&gt;&lt;summary&gt;先用一个例子理解这个问题&lt;/summary&gt;&lt;p&gt;${esc(a.example)}&lt;/p&gt;${sourceLinks(a.sources)}&lt;/details&gt;`}${a.id===&#x27;types&#x27;?&#x27;&#x27;:`&lt;section class=&quot;kn-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;方法与做法&lt;/h2&gt;&lt;p&gt;直接选择一项，无需逐页翻找&lt;/p&gt;&lt;/div&gt;&lt;nav class=&quot;kn-method-nav&quot; aria-label=&quot;选择具体方法&quot;&gt;${a.methods.map(m=&gt;`&lt;button type=&quot;button&quot; data-method=&quot;${m.id}&quot; aria-current=&quot;${chosen.id===m.id?&#x27;true&#x27;:&#x27;false&#x27;}&quot;&gt;${esc(m.zh)}&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;${explanation(chosen)}&lt;/section&gt;`}&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;继续检验与比较&lt;/h2&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;evaluation&quot;&gt;评测与证据 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;系统资料对照 →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;}

function tutorialSourceLinks(ids){
