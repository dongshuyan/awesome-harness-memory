pt 原样当成唯一长期记忆，而是通过 extraction/consolidation 选择未来可能有价值的信息。Generate memories 页面还提醒，敏感或个人数据的过滤并非万无一失，不能把“自动抽取”当成隐私保证。&quot;,&quot;why&quot;:&quot;先分清“事件来源”和“长期事实”，才能理解为什么 Sessions 负责保留交互历史，而 Memory Bank 负责生成可跨 session 使用的记忆。&quot;,&quot;example&quot;:&quot;客服 Agent 从过去工单中抽取“用户使用企业版、偏好邮件通知”作为用户记忆；下一次会话可直接利用这些事实，而不是重新读完整工单。&quot;,&quot;trace&quot;:&quot;官方概览与 Generate memories 页面说明 user facts、对未来交互有价值的信息、GenerateMemories/CreateMemory、extraction/consolidation；Generate 页面单独说明 multimodal image/video/audio input，以及敏感/个人数据过滤并非万无一失。具体 schema 和抽取质量取决于服务配置，不能由示例推断所有记忆都同样结构化。&quot;},{&quot;answer&quot;:&quot;载体是 Google 托管的持久化 Memory Bank store；公开文档展示 memory 的 scope、fact/name 等逻辑字段，并支持全量或 similarity search。文档没有公开底层数据库、embedding 模型或索引实现，因此应把“托管 store + retrieval API”当成工程接口，把实际物理后端标为未说明。&quot;,&quot;why&quot;:&quot;工程接口和物理实现是两层。读者需要知道如何使用服务，也需要知道官方页面没有承诺某种数据库或向量结构。&quot;,&quot;example&quot;:&quot;应用用 RetrieveMemories 做相似度检索，得到与当前用户和对话相关的 memory；开发者不需要直接管理底层索引，但也不能据此断言它一定使用某个向量数据库。&quot;,&quot;trace&quot;:&quot;官方概览的 Managed storage and retrieval、Similarity search、Memory revisions 段落，以及 Fetch memories 页面支持逻辑接口；底层 backend/embedding schema 在公开页面中未说明。&quot;},{&quot;answer&quot;:&quot;范围以 identity scope 为核心。官方文档要求 Session 有 user ID，生成的 memory 映射到该 user；记忆按 identity scope 隔离，检索也按 specific identity 组织。工程配置示例可以用 scope、IAM principal/roles 和 regional instance 划分访问边界；这是部署层映射，不是 Memory Bank 默认共享语义。scope isolation 不等于完整授权：Google 还提供 IAM conditions 和专用角色控制哪些 principal 能读写哪些 scope。&quot;,&quot;why&quot;:&quot;“这条记忆属于谁”与“谁有权访问”是两个问题。Memory Bank 同时给出 identity scope 和 IAM，正好说明业务范围与安全权限不能合并。&quot;,&quot;example&quot;:&quot;配置示例（假设，不代表默认部署）：同一客服应用把每个客户的偏好存到对应 user scope，再用 IAM 条件把读写 principal 限制到目标 scope；跨区域隔离需按项目配置验证。&quot;,&quot;trace&quot;:&quot;官方概览的 Data isolation across identities、Example usage 的 user ID、Governance 的 data residency/region/IAM 段落，以及 IAM conditions 页面支持范围与授权的分层。文档未证明某个部署已经正确配置这些策略。&quot;},{&quot;answer&quot;:&quot;生命周期包括事件摄入、抽取、合并、修订、检索和过期。Agent 可以在 session 结束、session 内定期调用，或通过 continuous events 按配置的 volume/time 条件触发 GenerateMemories，也可用 CreateMemory 直接写入；GenerateMemories 的响应示例把动作标为 CREATED、UPDATED 或 DELETED，Revisions 文档说明这些变更可以留下 revision。实例还可以配置 memory TTL 和 revision-history TTL；Setup 文档描述过期记忆不再可检索并会被删除，但本教程未验证物理删除传播和跨索引残留，版本冲突规则仍需看具体 API/服务保证。&quot;,&quot;why&quot;:&quot;Memory Bank 的工程价值不只是“有个库”，而是把抽取、异步合并、可追溯修订和过期策略都纳入生命周期。把自动流程与可证明的删除边界分开，避免过度承诺。&quot;,&quot;example&quot;:&quot;配置示例（推断）：一轮对话后后台任务把“用户住在 A 城”写入；新对话提供“用户住在 B 城”时，后台 consolidation 可能更新旧事实并留下 revision，具体冲突取舍以服务配置和文档保证为准；TTL 到期后服务按配置删除过期 memory。&quot;,&quot;trace&quot;:&quot;官方概览 Example usage、Generate memories、Setup、Revisions 页面；Generate memories 页面明确列出 session 结束/定期调用、continuous events 按 volume/time 触发，以及 CREATED/UPDATED/DELETED；Setup 页面明确记录 TTL 到期后的不可检索和删除语义。文档功能说明不等于本地运行验证，跨索引残留和物理传播仍未在本教程验证。&quot;},{&quot;answer&quot;:&quot;官方 ADK 集成通过 VertexAiMemoryBankService，应用也可以用官方 API 或自定义 wrapper 调用 GenerateMemories/CreateMemory 和 RetrieveMemories。检索可以返回全部 memory，也可以按当前对话做 similarity search；应用随后把结果注入 prompt（这是应用集成示例，官方页面没有规定统一模板）。这个路径说明“存储完成”与“某次调用实际使用”仍是两件事：是否触发检索、如何排序、截断和解释由 Agent 集成决定。&quot;,&quot;why&quot;:&quot;只有把 API 调用和 prompt 注入连起来，读者才能判断 Memory 是否真的影响了模型输入；托管服务不会替应用自动决定每次调用要用哪些事实。&quot;,&quot;example&quot;:&quot;应用集成示例（推断）：ADK Agent 在收到新问题时按 user scope 检索相关偏好，把结果拼入 prompt；若应用没有调用 RetrieveMemories，即使 Memory Bank 中已有事实，本次调用也不会自动看到。&quot;,&quot;trace&quot;:&quot;官方概览的 Agent integration 与 Example usage、Fetch memories 页面支持 VertexAiMemoryBankService、生成/检索/注入路径；页面没有规定所有框架都使用同一种触发和 prompt 模板。&quot;},{&quot;answer&quot;:&quot;Memory Bank 文档明确把 IAM conditions、`roles/aiplatform.memoryViewer` 与 `roles/aiplatform.memoryEditor` 角色、scope isolation、regional deployment、CMEK/VPC Service Controls 和 memory poisoning 风险放进治理讨论；它还建议用 Model Armor、adversarial testing/red teaming，并提醒部署者关注数据驻留和跨区域隔离。这些是产品配置和建议，不能直接写成“默认安全”或“已经合规”。是否满足数据驻留和跨区域隔离要求取决于具体部署配置，需要独立验证；用户同意、来源级 provenance、审计报表和删除后的全链路证明，公开概览没有完整统一协议。&quot;,&quot;why&quot;:&quot;工程系统的治理必须回答谁能读写、如何防止错误事实和跨区域泄露。官方文档提供了控制面，但真正的安全结果取决于实例、IAM、模型和应用配置。&quot;,&quot;example&quot;:&quot;IAM 页面列出 `roles/aiplatform.memoryViewer` 与 `roles/aiplatform.memoryEditor`；例如配置示例（建议，不代表默认配置）：给只读服务账号授予 memoryViewer、给写入服务账号授予 memoryEditor，并把它们绑定到同一区域；同时对恶意对话做 poisoning red-team。这样的配置仍需独立验证，不能只看文档就宣称合规。&quot;,&quot;trace&quot;:&quot;官方概览的 Governance/Data residency、CMEK/VPC Service Controls 段落，以及 IAM conditions 页面；这些页面写的是控制项、建议、角色和配置语义，没有提供本教程部署的审计或合规证书。&quot;}]},{&quot;id&quot;:&quot;graphiti&quot;,&quot;title&quot;:&quot;Graphiti&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;summary&quot;:&quot;把持续到来的材料构造成有来源、有时间范围的实体关系图。Agent可以从图中取回相关事实；开发者负责把这个框架接入应用，并提供权限、存储和运行服务。&quot;,&quot;why&quot;:&quot;它让读者看到，Memory不必只是一串对话或独立文本片段：事实之间的关系、事实何时成立、系统何时得知，都可以成为显式结构。源码公开了写入、检索和删除路径，便于核查图记忆的实际边界。&quot;,&quot;boundary&quot;:&quot;本页解释getzep/graphiti固定提交的开源Python框架。Graphiti与托管Zep产品边界按官方README区分；Zep的服务保证、部署功能和性能不能直接算作Graphiti库的能力。&quot;,&quot;sources&quot;:[&quot;graphiti&quot;,&quot;graphiti-core&quot;,&quot;graphiti-nodes&quot;,&quot;graphiti-edges&quot;,&quot;graphiti-recipes&quot;,&quot;graphiti-filters&quot;,&quot;graphiti-invalidation&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/getzep/graphiti&quot;,&quot;selectionEvidence&quot;:&quot;getzep官方仓库（源码版权署名Zep Software, Inc.）提供实体、事实、episode、时间字段以及写入/搜索/删除实现。该证据可以支持具体机制的解释；本教程没有运行图数据库或测量吞吐、延迟、准确率，不采用托管产品宣传替代开源框架验证。&quot;,&quot;limitations&quot;:&quot;抽取与冲突判断依赖所选模型，来源链接不能证明事实本身正确。数据库、LLM、embedding和外层服务均需自行配置。参考MCP/REST服务器明确不提供身份认证、授权或prompt注入防护；分区ID和逻辑失效都不是完整安全或擦除保证。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;时序实体关系图框架，可作为Agent Memory组件&quot;,&quot;maintainer&quot;:&quot;getzep（源码版权署名Zep Software, Inc.）&quot;,&quot;artifact&quot;:&quot;graphiti-core Python库、参考服务器、官方README与固定提交源码&quot;,&quot;version&quot;:&quot;ebef986a0b2360211b65751c111cacb4a7d790eb（提交日期2026-11-11）；2026-11-12只读核查，未运行服务&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;Graphiti把输入材料称为episode，再从中抽取实体和实体间的事实或关系。实体可以是人、产品、政策等，带有可更新的摘要；关系边保存可读事实，episode保留其来源。这个结构适合表示“谁与谁有什么关系、何时成立”。它没有要求所有应用使用一套情景/语义/程序性记忆分类，episode也不等于在认知意义上实现了完整情景记忆。&quot;,&quot;why&quot;:&quot;把人物和关系显式分开，能沿同一实体连接来自不同会话的材料。与此同时，“原文说了什么”与“系统抽取出什么”属于不同层次；错误的实体合并或事实抽取仍可能让图产生误导。&quot;,&quot;example&quot;:&quot;教学例子：“小林从5月1日起住在杭州”可以产生小林、杭州两个实体，以及居住关系，边再指向提供这句话的episode。若消息只是别人猜测，来源仍可追溯，但它不会因此自动变成已证实事实。&quot;,&quot;trace&quot;:&quot;《Graphiti · 官方README与产品边界》的What is a Context Graph；《Graphiti · 节点结构》的EpisodicNode/EntityNode；《Graphiti · 关系与时间字段》的EntityEdge。上述是数据结构事实，例子为教程构造。&quot;},{&quot;answer&quot;:&quot;主体载体是外部图数据库中的节点和边，保存文本和向量，支持关键词与向量检索。EntityEdge的valid_at/invalid_at描述事实何时成立和停止成立，created_at/expired_at记录边的创建和被判失效的系统时间。两组时间可以不同；source episode又提供信息从哪里来的线索。开发者也可用Pydantic数据模型定义实体、关系的类型和字段。&quot;,&quot;why&quot;:&quot;现实发生变化与系统收到通知往往不同步。如果只保留“最后更新时间”，就难以区分过去真实状态与当时系统掌握的状态；这两类问题需要不同时间字段和查询条件。&quot;,&quot;example&quot;:&quot;教学假设：小林5月1日搬到杭州，系统5月3日才收到消息。可用valid_at表达5月1日，用created_at表达5月3日。“他5月2日住哪里”与“系统5月2日知道什么”不是同一查询。这里展示字段含义，不冒充一次真实抽取结果。&quot;,&quot;trace&quot;:&quot;《Graphiti · 关系与时间字段》的Edge.created_at与EntityEdge.valid_at/invalid_at/expired_at；《Graphiti · 官方README与产品边界》的组件表与自定义类型说明。《Graphiti · 冲突与逻辑失效源码》第369行构造EntityEdge时设置created_at=utc_now()，支持系统时间解释。两种查询的区别是基于字段语义的教学推导，不承诺任意自然语言问句都会自动转成正确时间过滤。&quot;},{&quot;answer&quot;:&quot;写入episode时可传group_id，把它放入一个图分区；查询可用group_ids限制返回范围。分区如何对应用户、项目或组织，由应用决定；当group_id与当前数据库不同时，写入路径会取得相应的克隆驱动，实际隔离方式取决于后端。实体描述的是记忆谈论的对象，group_id描述数据组织范围，这两者不必相同。源码参数并不验证调用者是否有权访问某个分区，跨用户授权必须由外层服务完成。&quot;,&quot;why&quot;:&quot;同名人物和相似事实可能出现在不同组织中。先确定允许使用哪一份图，再检索其中的关系，能防止把语义相关误当成可访问；把分区当作权限则会漏掉“谁能指定这个ID”的问题。&quot;,&quot;example&quot;:&quot;教学流程：应用验证当前用户属于项目A → 在服务端确定A对应的group_id → 写入和搜索都使用该范围。不能仅接收客户端传来的任意group_id。若要共享公共资料，需要另定可访问的分区集合。&quot;,&quot;trace&quot;:&quot;《Graphiti · 写入检索与删除源码》的_resolve_request_scope、add_episode(group_id)、search(group_ids)；《Graphiti · 官方README与产品边界》的Reference MCP and REST servers明确说明任意调用者可操作任意group_id。分区是机制，身份映射是应用责任。&quot;},{&quot;answer&quot;:&quot;add_episode从新材料抽取实体和关系，查找已有对象、处理重复与矛盾，再更新图。新事实使旧事实停止成立时，旧边可以被标记invalid_at/expired_at并保留，供历史查询使用。另有remove_episode：删除该来源独自支持的边和实体，保留仍有其他episode支持的边，并尝试重建受影响实体摘要。逻辑失效与删除来源是不同操作。&quot;,&quot;why&quot;:&quot;用户改变地址后，系统既可能要回答当前位置，也可能要解释迁居历史。直接覆盖旧值会丢掉历史，完全不标记失效又容易取到过时信息。删除请求还要检查来源与派生事实的关系，不能只处理一段原文。&quot;,&quot;example&quot;:&quot;教学推演：新消息说明小林5月起迁居杭州，系统可能结束旧“住上海”关系的有效区间，并增加杭州关系。若随后删除这条消息，代码会考虑该边是否还有别的来源支持；因此不能把删除一个episode说成图内所有相同事实都消失，更不能据此推断备份已经清除。&quot;,&quot;trace&quot;:&quot;《Graphiti · 写入检索与删除源码》的add_episode、remove_episode；《Graphiti · 冲突与逻辑失效源码》的resolve_edge_contradictions。remove_episode重建摘要有异常处理，源码可见其尝试，未在本教程测试所有后端或失败条件。&quot;},{&quot;answer&quot;:&quot;应用显式调用search(query)，默认把关键词检索与向量相似度检索结合，再用RRF按两路各自的结果名次融合候选，返回相关EntityEdge。指定中心节点时可改用节点距离重排；高级检索recipe才包含其他组合，例如图遍历。时间条件通过SearchFilters指定，默认时间过滤字段为空。取回边之后，应用还需选择文本和时间信息，放入Agent的下一次模型输入。&quot;,&quot;why&quot;:&quot;图里有时间字段，并不意味着每次搜索都自动只返回当前事实；图里有链接，也不意味着每次检索都执行遍历。看清默认流程、可选配置和prompt装配，才能判断某次回答究竟用了什么记忆。&quot;,&quot;example&quot;:&quot;教学流程：“小林现在住哪里” → 确定允许访问的分区 → 配置当前有效事实的过滤条件 → 检索关系边 → 把事实与必要时间说明交给回答模型。若改问“去年住哪里”，应换相应时间条件；不能只换问句就假定数据库理解了历史范围。&quot;,&quot;trace&quot;:&quot;《Graphiti · 写入检索与删除源码》的search；《Graphiti · 检索配置》的EDGE_HYBRID_SEARCH_RRF、EDGE_HYBRID_SEARCH_NODE_DISTANCE与包含广度优先图遍历的CROSS_ENCODER配置；《Graphiti · 时间与属性过滤》的SearchFilters。默认配置与返回结构按实际代码核查，示例集成流程未运行。&quot;},{&quot;answer&quot;:&quot;开发者选择模型、数据库、写入材料、抽取类型和检索范围，模型参与实体/关系抽取与冲突判断。官方README明确：参考MCP/REST服务器没有认证、授权和prompt注入防护；生产应用需要自己的服务层提供这些控制。episode来源和时间字段能辅助追溯，但不能单独保证输入可信、更新正确或所有副本可擦除。&quot;,&quot;why&quot;:&quot;把框架接成工具接口后，谁能写入、读取和删除会直接影响长期记忆。若不检查调用者，知道一个分区名就可能够访问数据；若把未经确认的材料长期保存，错误也可能持续进入后续回答。&quot;,&quot;example&quot;:&quot;教学检查：允许删除episode前核对身份和数据归属；若承诺彻底清除，再检查图中的派生信息、其他来源、日志和备份。部署方还应决定外部模型能接触哪些材料。这里列的是由公开边界推导出的部署要求，不是对某个Graphiti服务的安全认证。&quot;,&quot;trace&quot;:&quot;《Graphiti · 官方README与产品边界》的Graphiti and Zep、Reference MCP and REST servers；《Graphiti · 写入检索与删除源码》的删除路径。参考服务器限制是维护者明确声明；部署建议与未验证范围已分开。&quot;}]},{&quot;id&quot;:&quot;hindsight&quot;,&quot;title&quot;:&quot;Hindsight&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;提供retain、recall、reflect三种接口：把输入整理为记忆，按查询取回证据，再按需由服务内的模型综合回答。当前版本还区分原始事实、后台整合的observations和保存的mental models。&quot;,&quot;why&quot;:&quot;它适合学习独立Memory服务如何把存储、整合、检索和基于证据的推理分开，也能显示“记忆类型”与“记忆操作”不能混为同一套分类。&quot;,&quot;boundary&quot;:&quot;以vectorize-io/hindsight固定提交的当前文档为准，不将旧论文类别、Cloud功能和开源部署混写。数据库/权限行为是官方文档陈述，本轮未启动服务或复现宣传成绩。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;hindsight-retain-current&quot;,&quot;hindsight-observations-current&quot;,&quot;hindsight-recall-current&quot;,&quot;hindsight-reflect-current&quot;,&quot;hindsight-banks-current&quot;,&quot;hindsight-config-current&quot;,&quot;hindsight-extensions-current&quot;,&quot;hindsight-documents-current&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/vectorize-io/hindsight&quot;,&quot;selectionEvidence&quot;:&quot;Vectorize官方仓库提供可固定版本的接口、配置和运行文档，能追踪完整写入至读取链。收录基于机制与可审计资料，不采用README的“最佳效果”或生产客户宣传作为独立质量证明。&quot;,&quot;limitations&quot;:&quot;事实提取、实体合并和反思仍可能出错；observations后台处理有延迟。bank和tags只是组织/过滤手段，实际权限取决于认证与租户配置；直接删除一份文档也不证明备份和所有外部副本都已擦除。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;独立记忆服务与开源实现&quot;,&quot;authors&quot;:&quot;Vectorize · vectorize-io/hindsight维护团队&quot;,&quot;venue&quot;:&quot;官方GitHub仓库及对应开发文档；首次公开日期未在本轮核实&quot;,&quot;artifact&quot;:&quot;retain/recall/reflect API、数据库与租户扩展配置&quot;,&quot;version&quot;:&quot;7cec128b8fdb0a696366d888e63be71fe1d52338；2026-11-12核查固定文档&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;默认提取路径区分world与experience：前者是外部人物、事件和事实，后者是该bank所属Agent自己的行动/观察。后台observations将多个事实综合成带来源的认识；mental models则保存针对常见问题预先整理的反思结果。它们分别处于输入事实、综合认识和可重用答案的位置，并非四个互斥且同层的记忆桶。&quot;,&quot;why&quot;:&quot;先区分谁经历了事情，再区分原记录和推断结果，才能知道一句话是直接证据还是系统归纳。自动归纳有用，但不能因带有引用就把推断当作原始事实。&quot;,&quot;example&quot;:&quot;官方Retain例子：用户说“我买了一辆Tesla”，属于world，因为讲的是用户；Agent自己的日志说“我修复了认证错误”，才属于experience。教学延伸：多次提到喜欢Python可形成偏好observation，仍应能追到支持它的记录。&quot;,&quot;trace&quot;:&quot;《Hindsight · 写入与提取》Two Types of Facts；《Hindsight · 经验整合》What Are Observations；《Hindsight · 证据推理》Hierarchical Retrieval Strategy。&quot;},{&quot;answer&quot;:&quot;记忆保存在模型外部数据库。当前配置默认PostgreSQL，支持嵌入式pg0，也提供Oracle后端选项。配置文档分别说明原始文档文本、块文本与提取记忆的存储控制。默认concise会提取事实；verbatim保留块文本并抽元数据，chunks直接保存块而不调用提取模型，所以不能一概说Hindsight不存原文。 HINDSIGHT_API_STORE_DOCUMENT_TEXT=false可关闭原文持久保存；实际保留内容须结合配置判断。&quot;,&quot;why&quot;:&quot;文本内容、实体/时间结构、向量或全文检索是不同层次。同一段资料可以保留原文又产生提取事实；选择提取模式会影响可追溯细节、调用成本和搜索对象。&quot;,&quot;example&quot;:&quot;教学例子：合同中的精确编号不能只靠自由摘要保留。可以考虑保留原始块并检查相关元数据；这只是模式选择建议，不能由“verbatim”这个名称推定系统已通过合同准确性测试。&quot;,&quot;trace&quot;:&quot;《Hindsight · 数据库配置》Database；《Hindsight · 写入与提取》extraction modes、无事实文档仍保存的说明；《Hindsight · Bank与声明范围》存储对象。&quot;},{&quot;answer&quot;:&quot;bank是应用选择的记忆容器，内部有自己的文档、实体、关系与配置；可以按用户、项目或Agent组织，但bank_id本身不替你判断授权。tags可进一步限制recall/reflect范围。租户扩展负责验证请求并选择数据库schema，是不同于bank/tag的隔离层。&quot;,&quot;why&quot;:&quot;“记住Alice的信息”说明内容主体，“放在项目bank”说明组织方式，“哪个身份能读”才是权限。把这三件事分开，才能避免误以为按用户命名bank就完成了多租户安全。&quot;,&quot;example&quot;:&quot;教学例子：两个Agent可由应用安排读取同一项目bank；用户私有偏好另放个人bank。即使检索时用了user标签，应用仍要验证调用者能否指定该标签和bank，不能让任意请求自选另一个人的范围。&quot;,&quot;trace&quot;:&quot;《Hindsight · Bank与声明范围》What is a Memory Bank；《Hindsight · 写入与提取》Tagging；《Hindsight · 身份与租户扩展》TenantExtension。共享安排是应用设计示例。&quot;},{&quot;answer&quot;:&quot;retain提取并保存事实后，默认触发后台consolidation，把新证据与已有observations结合；可配置关闭自动处理。重用同document_id可更新来源文档，删除API移除其提取记忆。observations能够记录偏好变化和历史依据，处理完成时间可能晚于retain返回，不能把写入成功等同所有综合认识已同步。&quot;,&quot;why&quot;:&quot;更新一条事实和更新依赖它的结论是两步。若新偏好已经写入、旧observation尚未重建，读取策略需要识别新旧状态；这解释了为何记忆系统会出现短暂的不一致。&quot;,&quot;example&quot;:&quot;官方示例是用户从React转向Vue，observation应体现偏好变化，而非继续当作只喜欢React。教学检查：写入后分别查看原事实、整合状态和实际返回证据，再判断更新是否传播；不以一次200响应代替检查。&quot;,&quot;trace&quot;:&quot;《Hindsight · 经验整合》Automatic Background Processing、Disabling Auto-Consolidation、Handling Contradictory Evidence；《Hindsight · 文档更新与删除》Update与Delete Document。&quot;},{&quot;answer&quot;:&quot;recall按语义、关键词BM25、图和时间四路搜索，再融合/重排，按预算返回记忆，调用方决定如何交给自己的Agent。reflect则在服务内收集证据并生成带来源的回答，文档描述优先mental models、再observations和原事实的Agent路径；配置decision model时可改为多层并行检索。两者都不是把全库永久放进模型上下文。&quot;,&quot;why&quot;:&quot;需要自行控制推理时，取回证据与生成最终答案应分开；希望服务综合已有认识时可调用reflect。若不区分返回内容，应用可能把一段已归纳的回答误当作未经加工的原始记录。&quot;,&quot;example&quot;:&quot;教学例子：问“有哪些关于Alice的记录”可先recall并检查出处；问“基于这些经历，哪些任务适合她”可用reflect综合。但推荐是模型推断，引用记录只支持推断的前提，不保证结论正确。&quot;,&quot;trace&quot;:&quot;《Hindsight · 检索API》开头、types、budget/max_tokens；《Hindsight · 证据推理》Agentic Loop、Decision-Model Orchestration及What You Get。&quot;},{&quot;answer&quot;:&quot;开发者设定提取/整合/反思mission、工具调用接口、租户认证和操作验证扩展。directives约束reflect的回答行为，与数据库访问授权不同。内置ApiKeyTenantExtension验证密钥后共用public schema；若要独立租户schema，须配置相应扩展。文档还描述可选Memory Defense，但启用检测不等于对所有注入攻击有保证。&quot;,&quot;why&quot;:&quot;记忆的内容控制、服务认证和用户隔离分别解决不同问题。一个模型遵守了“不要泄露”的文字指令，仍不足以证明其底层检索从未读到不应访问的数据。&quot;,&quot;example&quot;:&quot;教学部署检查：用两个身份交叉请求对方bank，检查拒绝发生在读取前；再检查被删除文档、整合结论与备份范围。以上是建议验收，不是本教程已做的安全实测；不要把默认API key方案当成每用户独立隔离。&quot;,&quot;trace&quot;:&quot;《Hindsight · 身份与租户扩展》TenantExtension/OperationValidatorExtension；《Hindsight · 证据推理》Directives；《Hindsight · 写入与提取》Memory Defense。&quot;}]},{&quot;id&quot;:&quot;langgraph&quot;,&quot;title&quot;:&quot;LangGraph&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;LangChain 的低层 Agent 编排框架，官方 Memory 文档把 thread-scoped state/checkpoint 与跨会话 namespace/store 分开。&quot;,&quot;why&quot;:&quot;它提供了一个清晰的工程样本：短期工作状态与长期记忆的边界、持久化接口、写入时机和节点内读取路径都在官方文档中给出，可用来观察“研究概念如何落成工程 API”。&quot;,&quot;boundary&quot;:&quot;本条目只描述官方公开文档和仓库，不等于本教程已经运行了所有配置；具体后端、部署权限、版本行为和应用 schema 需要按目标项目单独核对。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;langgraph:0&quot;,&quot;langgraph:1&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://docs.langchain.com/oss/python/concepts/memory&quot;,&quot;selectionEvidence&quot;:&quot;官方 README 将 LangGraph 定义为构建有状态 Agent 的低层编排框架；官方 Memory 概念文档明确写出 short-term/thread state、thread-scoped checkpoints、long-term namespaces/stores、hot-path/background 写入和 get/search/put 示例。收录依据是机制可定位，而不是用户规模或效果排名。&quot;,&quot;limitations&quot;:&quot;没有运行当前仓库或部署；官方概念页没有完整规定权限、同意、审计、投毒、删除传播、租户隔离或成本 SLO。物理数据库和生产配置由应用选择。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;官方开源 Agent 编排框架 / Memory 与持久化原语&quot;,&quot;maintainer&quot;:&quot;LangChain&quot;,&quot;artifact&quot;:&quot;LangGraph 官方仓库 README 与 Python Memory 概念文档；本教程未运行代码&quot;,&quot;version&quot;:&quot;2026-11-11 快照；仓库 HEAD 5ea88ecbcdb9fde713c3abd58850a5b7beaa24ec&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;LangGraph 的短期记忆不是一个固定内容类别，而是 Agent state：通常包括当前 thread 的消息历史，也可以包括上传文件、检索文档和生成的 artifact。长期记忆则是跨 session/thread 保存的 user-specific 或 application-level data；文档用 semantic facts、episodic experiences、procedural instructions 举例。比如一条消息可以留在 thread state 中，而“用户偏好简短回答”可以作为长期 JSON memory。&quot;,&quot;trace&quot;:&quot;官方 Memory 概览和 short-term/long-term 小节明确列出 state 可包含的材料、跨线程长期数据和三种语义例子。文档没有要求应用必须采用某个统一 schema。&quot;,&quot;why&quot;:&quot;消息、文件和长期事实都是内容，但它们的作用不同；先列出内容才能判断是否需要摘要、更新或检索。&quot;,&quot;example&quot;:&quot;thread state 可保留当前对话和生成 artifact；长期 store 可保存“用户喜欢简短回答”的 JSON。&quot;},{&quot;answer&quot;:&quot;短期 state 通过 thread-scoped checkpoint 持久化，逻辑上与恢复一次 thread 的运行状态有关；长期 memory 以 JSON document 放进 Store，由 namespace 和 key 组织，Store 还可以按内容过滤或做 semantic search。官方示例用 InMemoryStore 演示，但同时提示生产环境应使用数据库后端。因此这里要把“checkpoint/store 这两个逻辑接口”和“实际数据库”分开：前者是文档承诺，后者是部署选择。&quot;,&quot;trace&quot;:&quot;官方概览 lines 23–25、存储小节 lines 147–179，以及 `store.put/get/search` 示例。仓库 README 只证明它是框架，不证明某个后端在所有部署中都默认存在。&quot;,&quot;why&quot;:&quot;同一内容可以由 checkpoint 保存状态、由 store 保存长期 JSON；把接口名当成认知类型会混淆逻辑位置和物理后端。&quot;,&quot;example&quot;:&quot;官方 InMemoryStore 示例用 namespace/key 写入 JSON，生产环境可换 DB-backed store；这说明后端不是固定 taxonomy。&quot;},{&quot;answer&quot;:&quot;短期记忆按 thread 隔离；长期记忆可以跨不同会话和 thread，通过自定义 namespace 组织，namespace 常包含 user ID、org ID 或应用上下文。一个应用可以把同一用户的偏好放在 `(user_id, application_context)` 下，也可以把项目共享资料放到团队约定的 namespace。可是 namespace 命名本身不等于授权：谁能访问它、怎样做租户隔离，仍取决于应用和部署配置。&quot;,&quot;trace&quot;:&quot;官方文档的 thread-scoped、cross-session/cross-thread 和 namespace 示例支持范围判断；文档没有在该页给出完整 auth/tenant policy，所以不扩写成安全能力。&quot;,&quot;why&quot;:&quot;thread 与 namespace 解决“看哪一组数据”，不自动解决“谁有权看”。&quot;,&quot;example&quot;:&quot;(user_id, application_context) 可以隔离用户偏好与应用上下文；项目共享 namespace 需要另外配置成员权限。&quot;},{&quot;answer&quot;:&quot;短期 state 在图被 invoke 或某个 step 完成时更新，并在每个 step 开始时读取。长期记忆有两种官方写法：在 hot path 中实时写入，或者由 background task 异步生成；文档还区分持续更新 profile 与向 collection 插入、更新、删除条目。比如一个节点可以从 conversation state 和旧 instructions 生成新 instructions，再 `store.put` 回去。冲突优先级、版本迁移、TTL 和物理删除并不是这页规定的统一协议。&quot;,&quot;trace&quot;:&quot;官方概览、Writing memories、Profile/Collection 和 Procedural memory 示例；这些段落支持写入时机和更新模式，不支持所有实现都有同一套生命周期治理。&quot;,&quot;why&quot;:&quot;更新时机直接影响延迟和新记忆何时可见，因此 hot path/background 必须分开。&quot;,&quot;example&quot;:&quot;节点可以在响应前更新 instructions，也可以由后台任务异步生成 memory；两者在实时性和主链路延迟上不同。&quot;},{&quot;answer&quot;:&quot;调用开始时，图节点读取当前 state；需要长期记忆时，节点可以用 `store.get` 按 namespace/key 读取，或用 `store.search` 按 query/filter 找到候选，再把结果组装进 prompt。官方 procedural memory 示例展示了“读取 instructions → 用当前对话生成新 instructions → store.put → 后续 call_model 使用”的完整路径。因而“已经存储”与“本次调用真的看到了”是两回事；即使进入输入，也不能单凭接口证明它改变了输出或行动。框架提供接口，具体触发、排序、截断和注入由节点逻辑决定。&quot;,&quot;trace&quot;:&quot;官方文档 lines 23–25、100–120、147–178 的读取和写入示例。未运行本项目，因此不把示例行为升级为本地复现实验。&quot;,&quot;why&quot;:&quot;沿着节点的 get/search→prompt 路径，可以确认存储内容是否进入本次模型输入；它是否改变输出或行动，还需要运行 trace、对照实验或实际观察。&quot;,&quot;example&quot;:&quot;call_model 读取 agent instructions，update_instructions 根据 conversation state 生成新版本并 store.put；保存和使用是两个动作。&quot;},{&quot;answer&quot;:&quot;LangGraph 文档公开了 state/checkpoint/store 等机制，但没有在 Memory 概念页规定完整的读写权限、用户同意、来源审计、投毒防护、删除证明或跨租户治理。实际控制通常来自应用代码、数据库和部署身份系统；例如一个应用可以限制某类节点调用某个 namespace，但这不是该概念页自动保证的能力。这里的“未说明”是文档边界，不是说 LangGraph 部署无法实现治理。&quot;,&quot;trace&quot;:&quot;官方 Memory 文档与仓库 README 的公开范围；没有把 InMemoryStore 示例、namespace 命名或 persistence API 误读成权限/合规协议。&quot;,&quot;why&quot;:&quot;框架原语不等于完整治理；把应用权限、数据库和部署身份混写成 LangGraph 自带能力会过度归因。&quot;,&quot;example&quot;:&quot;应用可以限制节点访问某 namespace，但该授权逻辑不由 Memory 概念页自动提供。&quot;}]},{&quot;id&quot;:&quot;letta&quot;,&quot;title&quot;:&quot;Letta · MemFS与Agent SDK&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;Letta把长期记忆组织成Agent拥有的Git仓库，通过MemFS投影到运行机器。少量核心Markdown进入提示词，较深资料按需读，后台Dreaming可以从对话中整理经验。旧V1的memory blocks需与当前机制分开理解。&quot;,&quot;why&quot;:&quot;它把记忆归属、文件表示、版本同步和提示词装配放到同一条可检查的链路上。适合学习“写下了”为什么还不等于“所有设备都拿到了”，以及“拿到了”为什么还不等于本轮模型已看到。&quot;,&quot;boundary&quot;:&quot;主体为2026-11-12官方当前MemFS/Agent SDK说明与letta-code固定提交。旧V1 API server已经归档；V1 memory blocks、MemFS v1格式与Agent SDK代际不能混为同一版本号。文档能力未在本教程部署实测。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;letta-current&quot;,&quot;letta-memfs&quot;,&quot;letta-shared-current&quot;,&quot;letta-dreaming&quot;,&quot;letta-sdk-memory&quot;,&quot;letta-format&quot;,&quot;letta-root-prompt&quot;,&quot;letta-permissions&quot;,&quot;letta-migration&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/letta-ai/letta&quot;,&quot;selectionEvidence&quot;:&quot;由Letta官方团队维护，有可读的当前文档、Git实现和运行提示。仓库明确公布旧V1到当前代码的迁移关系，能直接核对核心/外部记忆与同步机制；这支持机制分析，不证明其效果优于其他系统。&quot;,&quot;limitations&quot;:&quot;官方文档仍存在格式过渡：Agent SDK Memory页把创建时设置的memory放到system/，MemFS页与固定代码已区分新根目录格式和旧system/格式。部署时应检查根MEMORY.md与实际格式，不能仅凭SDK代际判断。Git版本可追溯不等于内容真实；共享需要同步，删除工作区文件也不等于清除Git历史、远端和备份。Dreaming可能写入错误归纳。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;具备持久身份、可编辑记忆与后台反思的Agent平台&quot;,&quot;authors&quot;:&quot;Letta官方团队与开源贡献者&quot;,&quot;venue&quot;:&quot;官方文档与letta-ai/letta-code；V1旧服务器留在archive分支&quot;,&quot;artifact&quot;:&quot;MemFS、Agent SDK、共享仓库与工具权限接口&quot;,&quot;version&quot;:&quot;letta-code提交f0179eafb09308476e1b332259c65962294662f8；官方文档2026-11-12访问快照；初次公开日期未据该commit推定&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;当前记忆包括Agent的身份/行为规则、用户偏好、持久项目事实、参考资料和技能文件。对话历史另外保存经历，MemFS保存从经历中选择、整理出来的可编辑内容。persona与human是常用标签，不是穷尽Memory种类的二分法；旧V1以memory_blocks设定记忆（见V1 SDK迁移说明），不能把旧接口名直接套到新SDK。&quot;,&quot;why&quot;:&quot;原始经历和归纳经验承担不同作用。前者能帮助追溯当时说过什么，后者让后续调用少读大量旧消息；但归纳可能丢条件，因此不能用摘要替代所有原始证据。&quot;,&quot;example&quot;:&quot;官方Memory \u0026 dreaming给出“这个仓库始终用pnpm”的/remember例子。教学展开：规则可进入核心记忆，具体安装报错留在对话记录，长篇依赖说明放到参考目录。三者都可能有用，但没有必要全塞进每轮提示词。&quot;,&quot;trace&quot;:&quot;《Letta · 记忆形成与Dreaming》Teach your agent；《Letta · MemFS结构与同步》Memory structure与Skills；《Letta · 根目录Memory运行提示》Message history及Memory files。分配目录的例子是教学建议。《Letta · V1 SDK迁移说明》的对照表与快速开始支撑旧接口描述。&quot;},{&quot;answer&quot;:&quot;MemFS以Git仓库为持久载体，在运行机器上提供真实checkout，Agent通过普通文件工具读写。新格式以根目录MEMORY.md识别，根Markdown作为核心记忆；带索引的子目录保存按需资料，skills单独组织。旧格式以system/承载核心记忆。默认MemFS没有语义/向量索引；文档另提供可选搜索扩展，对话历史搜索也属于另一条路径。&quot;,&quot;why&quot;:&quot;载体、索引和上下文位置必须分开看：用Git保存不代表自动向量检索，文件存在也不代表被完整放进prompt。确认格式后，才知道把文件写在哪里会影响每轮上下文开销。&quot;,&quot;example&quot;:&quot;教学示意：新格式根目录human.md存简短偏好，根MEMORY.md列出reference/；子目录reference/MEMORY.md再指向project-notes.md。模型每轮看到human.md与根MEMORY.md，子目录索引和项目正文按需读取。如果实际Agent仍是旧格式，应检查system/，不能照搬新目录假设。&quot;,&quot;trace&quot;:&quot;《Letta · MemFS结构与同步》Memory structure与Semantic and vector search；《Letta · MemFS格式判定源码》detectMemoryFormat/isCoreMemoryPath/isProjectedMemoryPath；《Letta · Agent SDK Memory与版本差异》仍写system/，已显式保留差异。&quot;},{&quot;answer&quot;:&quot;私有MemFS属于一个agent_id，并可跨该Agent的多次对话使用；共享仓库则属于组织，可以附加给多个Cloud Agent。当前共享方式是各Agent拿到仓库checkout，通过提交、推送和拉取同步，不能理解成所有运行中的模型会瞬时看到相同值。本地Agent有自己的MemFS与项目文件，官方托管的共享仓库是Cloud功能。&quot;,&quot;why&quot;:&quot;Agent、对话、机器和组织是不同的归属范围。一个Agent跨对话记住用户，并不自动意味着同组织所有Agent都能读取；同一共享文件也不等于每个并发对话已经重新编译了上下文。&quot;,&quot;example&quot;:&quot;教学例子：客服Agent和文档Agent各保留自己的偏好与技能，同时附加团队产品说明仓库。文档Agent推送修改后，客服侧要同步相关checkout；是否已在当前回答使用，应检查实际读取或提示词编译，不能凭“已共享”就推定。&quot;,&quot;trace&quot;:&quot;《Letta · 当前共享记忆》Ownership表、How agents access shared memory、Cloud限制；《Letta · 根目录Memory运行提示》agent_id/conversation_id及Shared memory。示例分工为教学构造。&quot;},{&quot;answer&quot;:&quot;记忆可由初始化、显式/remember、工作中的文件编辑，以及配置后的Dreaming形成。Dreaming按完成步数或上下文压缩事件触发，后台子代理整理近期对话；它使用worktree隔离编辑。修改先是本地文件变化，提交成为版本，Cloud同步还需要推送并由其他checkout获得。核心内容在后续重编译时影响模型，当前已经生成的提示词不会被倒改。&quot;,&quot;why&quot;:&quot;这条链把“想起一条经验”“保存版本”“同步到其他机器”“下一次调用读到”分开。任何一步失败，都可能表现成忘记；Git历史帮助定位修改，却不能证明归纳正确。&quot;,&quot;example&quot;:&quot;教学时间线：用户纠正构建命令 → Agent改human.md或项目记忆 → 提交 → Cloud推送 → 后续上下文重编译。若只编辑未提交，不能据此断言另一台机器已记住。删除文件的提交通常仍留下旧Git历史，彻底擦除需另核范围。&quot;,&quot;trace&quot;:&quot;《Letta · 记忆形成与Dreaming》Dreaming；《Letta · MemFS结构与同步》Versioning and synchronization；《Letta · 根目录Memory运行提示》Syncing memory, state, and context。删除历史的限定来自Git版本载体的推论，未做删除实验。&quot;},{&quot;answer&quot;:&quot;新格式核心根Markdown在编译时进入系统提示词；更深资料主要通过目录索引、文件搜索和读取工具进入后续调用。共享仓库附加时提供路径和文件线索，正文并非全量常驻。对话历史搜索与MemFS分开：官方文档称Cloud消息搜索支持全文、向量和混合模式，本地目前是全文匹配。保存的经验能否影响回答，还取决于是否被读到、是否与当前任务相关。&quot;,&quot;why&quot;:&quot;常驻方式降低找不到关键信息的风险，却占用上下文；按需读取保留较大资料集，但依赖模型发现正确入口。把两种路径讲清楚，才知道该缩短核心文件，还是改善索引与检索。&quot;,&quot;example&quot;:&quot;沿用pnpm例子：短规则可以常驻，过往某次报错则用消息搜索或读取参考记录找到。如果只有目录索引出现在prompt里，就不能声称对应长文也已被模型读取。这个区分可用于检查真实调用记录。&quot;,&quot;trace&quot;:&quot;《Letta · MemFS结构与同步》Memory structure与Conversation-history search；《Letta · Agent SDK Memory与版本差异》共享仓库只展示文件树；《Letta · 根目录Memory运行提示》后续recompile约定。常驻/按需的教学比较不是效果实验。&quot;},{&quot;answer&quot;:&quot;开发者配置记忆初值、共享关系、Dreaming和工具可用范围，Agent通过获准工具修改内容。Agent SDK以permissionMode决定审批模式，以canUseTool处理需要批准的调用，allowedTools控制工具是否暴露。Dreaming的“Agent reviews before applying”是额外Agent复核，官方明确它不请求用户批准。工具权限、组织访问控制和记忆事实正确性仍是不同问题。&quot;,&quot;why&quot;:&quot;允许模型改长期记忆，意味着一次错误可能影响以后的行为；允许背景整理又增加了另一个写入者。必须知道谁会审核变化，以及该审核究竟是人还是模型，才能设定合适的控制。&quot;,&quot;example&quot;:&quot;教学配置思路：在需要审批的standard模式中，应用可用canUseTool审核相关工具请求；acceptEdits会自动允许文件编辑，不能仅添加回调就假定所有编辑都需批准。具体MemFS写入是否经过目标工具路径，还须部署核查。可另检查Git差异；Agent复核不等于用户同意，撤回时也要检查共享仓库、历史和备份。&quot;,&quot;trace&quot;:&quot;《Letta · SDK工具权限》Permission modes与Approve, deny, or edit tool calls；《Letta · 记忆形成与Dreaming》的Agent reviews说明；《Letta · 根目录Memory运行提示》的敏感信息规则。配置建议不是已通过的安全测试。&quot;}]},{&quot;id&quot;:&quot;mem0&quot;,&quot;title&quot;:&quot;Mem0&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;可嵌入应用的独立Memory层：把输入加工成可检索的记忆，再由应用决定怎样送回模型。本页以开源Python Memory库为主，区分自托管服务和托管平台。&quot;,&quot;why&quot;:&quot;它把抽取、存储、范围过滤、检索和显式编辑公开成API，适合与完整Agent框架区分。读者能沿接口追踪Memory如何作为独立组件接入不同应用，并看到存储层与应用控制各自负责什么。&quot;,&quot;boundary&quot;:&quot;以固定提交f1791daa86d469249c9b002f62644d58a1eb96a0及2026-11-12官方文档描述行为；pyproject字段为2.2.1，源码另含V3 pipeline注释，不能据此认定某个发行包行为相同。Python库、自托管服务器和托管平台能力不能互换。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;mem0&quot;,&quot;mem0-version&quot;,&quot;mem0-core&quot;,&quot;mem0-history&quot;,&quot;mem0-quickstart&quot;,&quot;mem0-add&quot;,&quot;mem0-oss-overview&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/mem0ai/mem0&quot;,&quot;selectionEvidence&quot;:&quot;mem0ai官方仓库公开Python实现、配置和CRUD接口，官方快速入门能定位add→search路径。固定提交pyproject版本为2.2.1。本教程据此解释可见机制，不采用README的性能宣传作为自测结果。&quot;,&quot;limitations&quot;:&quot;未安装Mem0或运行服务，也未复现任何LoCoMo分数。抽取质量、检索质量、延迟、成本、权限隔离和删除传播均需在实际配置中验证；库的范围ID不代替登录鉴权，历史记录可能保留已删除记忆的旧文本。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;独立Memory库 / 可自托管服务&quot;,&quot;maintainer&quot;:&quot;mem0ai&quot;,&quot;artifact&quot;:&quot;开源Python Memory、官方文档与固定提交源码；托管MemoryClient仅作边界说明&quot;,&quot;version&quot;:&quot;提交f1791daa86d469249c9b002f62644d58a1eb96a0；pyproject字段2.2.1，含V3 pipeline注释与v2→v3迁移说明；以此提交行为为准，未核验发行包或运行系统&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;输入可以是文本或有role的消息；infer=True时，当前写入流程用LLM抽取值得保存的事实、偏好或决定，形成独立文本记录。infer=False路径直接保存消息内容，二者不是同一种压缩方式。源码另有显式procedural_memory分支，但它不意味着所有输入都会自动被分成一套完整认知分类。应先看实际保存的内容，再讨论它在应用中的用途。&quot;,&quot;why&quot;:&quot;聊天全文包含寒暄、重复和临时信息，抽取可以缩小后续检索材料，却也可能漏掉细节或错误归因。绕过抽取则保留更多原文，但需要承担冗余和噪声；这是一项可选择的内容加工策略。&quot;,&quot;example&quot;:&quot;教学例子：输入“我以后希望用中文收会议纪要”。应用希望保存的是语言偏好，而不是整段寒暄。它可以让add抽取，也可以用infer=False存确定的文本；具体抽取结果由模型决定，本例不冒充一次实测输出。&quot;,&quot;trace&quot;:&quot;《Mem0 · Python Memory 核心源码》的Memory.add、_add_to_vector_store、_create_procedural_memory；《Mem0 · Add Memory / additive pipeline》的Infer和Information extraction。当前普通分支是追加式抽取；旧docstring中的自动update/delete表述不作为行为依据。&quot;},{&quot;answer&quot;:&quot;库把记忆文本、ID、主体范围和时间等元数据与embedding保存在可配置的vector store中；SQLite history另外保存变更记录和部分消息上下文。它还维护供实体关联使用的存储。官方快速入门默认使用本地Qdrant与SQLite，LLM、embedding、向量后端和reranker可配置。这里的向量负责查找相似内容，返回给应用的记忆仍是可读文本。&quot;,&quot;why&quot;:&quot;同一条记忆常同时有文本、向量、索引和历史记录。理解这些副本能解释为什么换embedding会影响查找，为什么删除当前记录不一定消除历史，以及为什么“本地库”不等于所有计算都在本机完成。&quot;,&quot;example&quot;:&quot;教学例子：偏好文本保存在向量记录payload中，embedding帮助匹配“纪要该用什么语言”。若LLM和embedding选了云服务，处理请求仍会发送给所选提供方；若要求本地处理，就需要逐个配置并验证这些组件。&quot;,&quot;trace&quot;:&quot;《Mem0 · Python Memory 核心源码》的Memory.__init__、_add_to_vector_store、entity_store；《Mem0 · SQLite 历史与消息存储》；《Mem0 · OSS Python Quickstart》默认组件和《Mem0 · OSS / Library / Server 边界》配置说明。数据路径由调用代码推导，未做网络抓包验证。&quot;},{&quot;answer&quot;:&quot;写入由user_id、agent_id、run_id中的至少一个确定范围；读取search/get_all时通过filters传入范围。组合这些ID，可以表达某个用户跨会话的记忆，或某个Agent、某次运行的局部材料。范围是由应用提供的标识规则，并不会自动知道当前登录者是谁；按ID读取、修改或删除也需要外层服务核对所有权。&quot;,&quot;why&quot;:&quot;同一个人可能参加多个项目，同一个Agent也可能服务不同用户。没有范围约束，即使相似度很高也可能取到不该使用的记忆；但仅填一个user_id，还不足以证明调用者有权使用这个ID。&quot;,&quot;example&quot;:&quot;API写法示例（未运行）：m.add(\&quot;会议纪要用中文\&quot;, user_id=\&quot;alice\&quot;)；之后用m.search(\&quot;纪要语言\&quot;, filters={\&quot;user_id\&quot;:\&quot;alice\&quot;})读取。若需要项目隔离，可由应用补元数据和过滤约定；不能把客户端提交的alice直接视为可信身份。&quot;,&quot;trace&quot;:&quot;《Mem0 · Python Memory 核心源码》的_build_filters_and_metadata、Memory.add、search、get_all；《Mem0 · OSS Python Quickstart》的filters示例。该固定提交的search拒绝顶层user_id等参数，不能复制旧版调用签名。授权要求是基于API边界作出的工程推论。&quot;},{&quot;answer&quot;:&quot;当前add把新抽取的记忆追加进去，实际实现会做部分重复检测，并记录写入历史；它不自动承诺覆盖或删除相互矛盾的旧事实。要修改或移除已知记录，应用可显式调用update、delete或带范围的delete_all。expiration_date让过期记录在默认search/get_all中隐藏，但按ID仍可读取。过期、删除当前向量记录、清除历史与备份是不同动作。&quot;,&quot;why&quot;:&quot;“旧值和新值都存在”与“新值替换旧值”会造成不同回答。只有知道当前写入协议，才能决定是否保留时间线、怎样处理偏好改变，以及用户要求忘记时还需要清理哪些副本。&quot;,&quot;example&quot;:&quot;教学例子：先说“常驻上海”，后来改为“已搬到杭州”。两次add不能被假设为原地替换；应用应明确想保留迁居历史，还是更新一个当前地址字段。若用过期日期隐藏上海记录，也不能宣称它已从所有存储中抹除。&quot;,&quot;trace&quot;:&quot;《Mem0 · Add Memory / additive pipeline》明确Additive storage；《Mem0 · Python Memory 核心源码》的_add_to_vector_store、update、delete、_delete_memory、_payload_is_expired及get；《Mem0 · SQLite 历史与消息存储》保存历史。现行文档与实现交叉支持；未运行冲突或删除测试。&quot;},{&quot;answer&quot;:&quot;应用显式调用search，库在给定范围内先取得语义候选，再结合后端可用的关键词信息和实体线索评分；已配置reranker且search调用传入rerank=True时才执行重排。返回值是字典，results键下是结果列表，各项包含ID、记忆文本、分数等字段及相关元数据。Mem0库不会仅因存好了偏好就自动改写任意Agent的prompt，应用仍要选择哪些结果、多少条、放在哪个位置，并将其传入下一次模型调用。&quot;,&quot;why&quot;:&quot;从“有记忆”到“能用记忆”之间至少隔着检索、输入装配和模型理解。按这条路径排查，才能区别数据没有存入、范围选错、召回失败和模型忽略内容，而不把所有错误归给一个向量数据库。&quot;,&quot;example&quot;:&quot;教学流程：用户问“帮我写会议纪要” → 应用按用户范围搜索 → 取到语言偏好 → 将其作为附带背景传给生成模型。应记录实际返回与实际prompt，才能验证偏好有没有被送到模型；最终语言是否正确还要检查输出。&quot;,&quot;trace&quot;:&quot;《Mem0 · Python Memory 核心源码》的search、_search_vector_store、_compute_entity_boosts及reranker分支；《Mem0 · OSS Python Quickstart》演示返回结构。关键词能力依赖后端；prompt装配示例是应用集成推演，不是库自动执行的完整Agent。&quot;},{&quot;answer&quot;:&quot;库允许调用方选择提供者、写入内容、抽取prompt、范围以及更新和删除动作；更外层的自托管服务与托管平台承担各自的身份控制。公开README区分library没有独立服务认证层、server有认证与API key。源码还表明delete会向history记录被删除的旧文本，因此“返回删除成功”不能等同于所有副本永久擦除。来源、同意、保留策略和权限仍需具体部署说明。&quot;,&quot;why&quot;:&quot;控制权分布在应用、SDK、模型提供方和数据库之间。把这些边界写清，才能判断错误记忆谁能改、跨用户请求由谁拒绝，以及“忘记我”需要覆盖哪些存储位置。&quot;,&quot;example&quot;:&quot;教学检查：服务收到删除请求后先验证身份和记录归属，再删除当前记录；若承诺彻底清除，还要检查history、消息、实体关联和备份策略。这里描述的是需要制定和测试的流程，不宣称Mem0已自动提供同等级删除保证。&quot;,&quot;trace&quot;:&quot;《Mem0 · OSS / Library / Server 边界》与固定提交README的Library/Server/Platform对照；《Mem0 · Python Memory 核心源码》的_delete_memory和history；《Mem0 · SQLite 历史与消息存储》的SQLiteManager。旧文本留在history是静态源码可见事实；未验证某部署的安全与合规。&quot;}]},{&quot;id&quot;:&quot;openai-agents-sdk&quot;,&quot;title&quot;:&quot;OpenAI Agents SDK&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;OpenAI Agents SDK 的 Session/运行状态与上下文集成。&quot;,&quot;why&quot;:&quot;它展示调用历史如何进入后续 Agent run。&quot;,&quot;boundary&quot;:&quot;本条目只收录公开 Session/Memory 文档证据，不推断隐藏实现。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;openai-agents-sdk&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/openai/openai-agents-python&quot;},{&quot;id&quot;:&quot;openclaw&quot;,&quot;title&quot;:&quot;OpenClaw&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;个人 Agent 系统，官方文档公开 memory search 与文件化记忆路径。&quot;,&quot;why&quot;:&quot;它是个人助手/长期记忆和 Harness 组合的工程样本。&quot;,&quot;boundary&quot;:&quot;文档描述不等于所有运行配置或数据安全结论。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;openclaw&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://docs.openclaw.ai/concepts/memory&quot;},{&quot;id&quot;:&quot;pi&quot;,&quot;title&quot;:&quot;Pi&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;Pi coding agent/harness，公开仓库与 session 文档展示文件、上下文和工具路径。&quot;,&quot;why&quot;:&quot;它补充独立服务之外的 Harness 端 Memory 组合。&quot;,&quot;boundary&quot;:&quot;必须按 commit 核对，不能从仓库存在推出用户规模或性能。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;pi&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/sessions.md&quot;}],&quot;benchmarks&quot;:[{&quot;id&quot;:&quot;collabmem&quot;,&quot;title&quot;:&quot;COLLABMEM · A Diagnostic Benchmark for Collaborative Memory Operations&quot;,&quot;date&quot;:&quot;2026-10；EMNLP 2026&quot;,&quot;summary&quot;:&quot;面向多 Agent 协作记忆的诊断 Benchmark，把共享、访问、路由、来源、冲突和保留拆成可定位的 probe。&quot;,&quot;why&quot;:&quot;本教程把它作为多主体和治理侧的代表样本：它不仅问“能不能找回事实”，还问事实是否到达正确角色、对无权角色保持隐藏、携带正确来源并在更新/压缩后保持正确。&quot;,&quot;boundary&quot;:&quot;Benchmark 的场景、gold event 和 memory-only harness 是诊断协议，不是生产权限系统或现实协作分布的完整模拟；论文报告的 TMS-GRAPH++ 分数只属于其协议和实现，本教程未运行。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;collabmem&quot;,&quot;collabmem:pdf&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.emnlp-main.1194/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;substrate&quot;,&quot;scope&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;,&quot;governance&quot;],&quot;selectionEvidence&quot;:&quot;ACL Anthology 记录 COLLABMEM 为 EMNLP 2026 论文；摘要给出 58 个手工场景/1,118 probes、174 场景/3,359 probes、六项 transactive-memory competencies 和 matched memory-only harness。正文 §§3.1–3.4、Table 1 与附录 Table 10 进一步给出 access matrix、provenance、conflict、retention、C6 的 stale value/update rationale、五类事件、core/scaled/adversarial/compositional splits 与 gold audit；摘要和 PDF 还报告 TMS-GRAPH++ 非 Oracle 平均分 69.6%。&quot;,&quot;limitations&quot;:&quot;场景和事件由论文协议构造，受固定 trace、角色、answerer、judge 和 gold event 约束；不直接测用户同意、真实 IAM/法律合规、物理删除、成本、延迟或生产漂移。非 Oracle 分数不能直接当成跨系统排名。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;多 Agent 协作 Memory 诊断 Benchmark&quot;,&quot;authors&quot;:&quot;Shun Wu、Di Wu、XueYou Zhang、Kang Liu&quot;,&quot;venue&quot;:&quot;EMNLP 2026（ACL Anthology，2026-10）&quot;,&quot;artifact&quot;:&quot;ACL 论文、PDF 与待公开的数据/评测代码说明；本教程未运行官方 SDK 或复现结果&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;Benchmark 的第一问不是“它内部保存哪一种 Memory”，而是“这次 probe 要验证哪类记忆事实和协作操作”。论文用 FACT、CONTRADICTION、SENSITIVE、ROLE_SPECIFIC、DEPRECATION 这 5 类事件构造 value/evidence probes，并把结果组织为 C1 sharing、C2 consistency update、C3 access、C4 authority/routing、C5 conflict/provenance、C6 retention/compression 六项 transactive-memory competencies。&quot;,&quot;why&quot;:&quot;Benchmark 若把能力维度误写成内容 taxonomy，就会让读者误以为 COLLABMEM规定了一个数据库结构。这里明确它测的是可观察的协作记忆行为。&quot;,&quot;example&quot;:&quot;一个 ROLE_SPECIFIC 事实应该到达负责财务的 Agent，但不能暴露给普通客服 Agent；一个 DEPRECATION 事件应该让新值取代旧值，同时保留可追溯证据。&quot;,&quot;trace&quot;:&quot;ACL 摘要和 PDF §3.1/§3.3 的 event types、probe 定义与 Table 1 C1–C6；论文把这些称为 competency/diagnostic operations，不是 Memory ontology。&quot;},{&quot;answer&quot;:&quot;COLLABMEM 对内部载体保持开放：参测 memory layer 可以是 buffers、vector stores、graphs、private/shared banks 或 tool-mediated retrieval。它通过 matched memory-only harness 固定 trace、target role、answerer、judge 和 gold event，让 answerer 只接触 memory layer 提供的上下文。这样比较的是协作操作是否正确，而不是哪种数据库天然更好。&quot;,&quot;why&quot;:&quot;协作 Memory 的错误可能来自结构、权限或路由；如果 Benchmark 强制一种载体，结果就混入实现偏好，难以定位问题。&quot;,&quot;example&quot;:&quot;同一组事件可以放进向量库或图结构；只要两者都能给目标 Agent 提供 memory-only context，就可以比较 C3 access 和 C5 provenance 的错误。&quot;,&quot;trace&quot;:&quot;PDF §3.1 对 memory layer、buffers/vector/graph/private-shared banks 和 matched harness 的描述；论文未要求参测系统使用 TMS-GRAPH++，后者是论文报告的一个框架。&quot;},{&quot;answer&quot;:&quot;主体由 roles、access matrix A、target role 和 answerer 组成。每个事件带有应该可见的角色范围，probe 检查事实是否到达正确角色并对无权角色保持隐藏；因此它把“谁拥有/谁能看到”直接变成评测条件。可是 access matrix 是 Benchmark 的 gold 协议，不等于真实生产系统已经有 IAM、用户同意或租户隔离。&quot;,&quot;why&quot;:&quot;多 Agent 记忆的关键区别是共享边界。单 Agent QA 只问答案对不对，无法发现事实被错误角色看到或没有路由到应答角色。&quot;,&quot;example&quot;:&quot;事件 E 的 access matrix 允许 Agent-2 读取、禁止 Agent-3 读取；若 Agent-3 的回答包含 E，C3 会记录未授权泄露，即使答案文本本身正确。&quot;,&quot;trace&quot;:&quot;PDF §3.1 对 scenario tuple（roles R、access matrix A、event schedule E、probe/query Q）和 target-role probe 的描述，以及 ACL 摘要对 visibility/access 的说明；真实 IAM、法律责任和 consent 不在核心协议中。&quot;},{&quot;answer&quot;:&quot;生命周期由有序事件、时间戳、supersession pointers 和压缩测试表达。C1 测共享，C2 测新信息更新旧信息，C4 测 authority/routing，C5 测 conflict/provenance，C6 测压缩后是否仍保留被取代的旧值及其解释价值，并能区分当前值与历史值。它能观察更新、冲突和压缩后的结果，但没有直接调用真实服务的 TTL、物理删除或 rollback API。&quot;,&quot;why&quot;:&quot;协作记忆的错误常常不是“没存”，而是旧事实仍被当成当前事实，或压缩后丢掉了替代关系；把事件顺序和 retention 单独测出来才能定位这类失败。&quot;,&quot;example&quot;:&quot;先写“项目负责人是 A”，再写带更高 authority 的“负责人改为 B”；正确系统应回答 B，并在需要时指出 A 已被 supersede。压缩后仍应保留 B、A 以及“为什么 B 取代 A”的来源或更新依据。&quot;,&quot;trace&quot;:&quot;PDF §3.1/§3.2、Table 1、附录 Table 10 的 C1–C6 诊断语义，以及 ordered events/timestamps/supersession 与 compression 说明；Table 10 明确 C6 gold 要保留 stale value 和 update rationale。论文未把测试结果升级成真实删除或 TTL 保证。&quot;},{&quot;answer&quot;:&quot;它的暴露路径是受控的 memory-only query：固定 trace 产生事件，目标 role 发出 probe，memory layer 向 answerer 暴露应有的 evidence，judge 根据 gold event 判定并把错误定位到 sharing、access、routing、provenance、conflict 或 retention。它不测试完整 Agent planning、工具调用或长期对话中的自由检索，因此能诊断“正确证据是否给到正确角色”，不能单独证明真实任务行动正确。&quot;,&quot;why&quot;:&quot;把 trace、target role、answerer 和 judge 固定，可以把协作 Memory 错误从后续推理和工具执行中隔离出来；代价是失去开放环境的全部复杂性。&quot;,&quot;example&quot;:&quot;probe 只让目标 Agent 根据 memory context 判断当前负责人和来源；若 evidence 没到达、给错角色或来源冲突，诊断标签分别落在 sharing/access/provenance，而不是笼统记一个答错。&quot;,&quot;trace&quot;:&quot;ACL 摘要和 PDF §3.1 对 matched memory-only harness、fixed trace/target role/answerer/judge/gold event 的描述；论文没有把该协议当成完整 Agent benchmark。&quot;},{&quot;answer&quot;:&quot;COLLABMEM 把治理相关行为放进核心能力：C3 访问控制、C4 authority/routing、C5 conflict/provenance、C6 retention/compression；场景还包含 SENSITIVE 和 ROLE_SPECIFIC 事件。数据由 gold audit 与 204-probe human verification 检查发布协议的一致性。它仍不测用户同意、真实 IAM、法律合规、物理删除、成本或延迟，因此它覆盖了一部分可诊断治理行为，仍需外部安全/隐私测试补足。&quot;,&quot;why&quot;:&quot;相比只测 recall 的 Benchmark，这种设计能直接暴露共享和权限边界；同时必须说明它是协议级检查，不是生产合规认证。&quot;,&quot;example&quot;:&quot;给无权角色安排一条敏感事实可以测试 C3 access；让低 authority 的旧值与新值发生冲突，则可分别观察 C4 authority/routing 和 C5 conflict/provenance；但要验证真实 API 的 IAM 和删除传播，还需要部署级测试。&quot;,&quot;trace&quot;:&quot;PDF §§3.2–3.4 的 C3–C6、adversarial/compositional splits、gold audit 与 human verification；ACL 摘要的六项 competencies 和规模说明；未出现的 consent/legal/physical deletion 标为 not_assessed。&quot;}],&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;C1 Sharing；C2 Consistency Update；C3 Access Control；C4 Authority/Routing；C5 Conflict/Provenance；C6 Retention/Compression（论文的 transactive-memory competencies）&quot;,&quot;taskProtocol&quot;:&quot;基于有序事件、角色集合、access matrix、target role 和 probe 构造 memory-only harness；固定 trace、answerer、judge 与 gold event，再用 core/scaled、adversarial 和 compositional split 诊断错误来源。&quot;,&quot;metrics&quot;:&quot;论文报告 competency 级和 split 级诊断分数；ACL 摘要给出 58 个手工场景/1,118 probes、174 场景/3,359 probes，并报告 TMS-GRAPH++ 的非 Oracle 平均分 69.6%。另有 204-probe human verification；这些数值只属于论文协议，不能直接合成跨 Benchmark 排名。&quot;,&quot;designMapping&quot;:&quot;直接覆盖 Q3 的主体/共享拓扑、Q4 的更新/冲突/保留、Q5 的证据暴露和 Q6 的访问/来源/权威治理；Q1 通过事件类型体现内容角色，Q2 只要求载体可提供 memory-only evidence，不评判具体数据库优劣。&quot;,&quot;limitations&quot;:&quot;场景和 gold 由论文协议构造，结果依赖事件分布、role/access matrix、answerer/judge 与参测系统配置；不直接测用户同意、真实 IAM、物理删除、成本/延迟、自由规划或生产漂移。&quot;}},{&quot;id&quot;:&quot;mem-gallery&quot;,&quot;title&quot;:&quot;Mem-Gallery&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;面向 Memory 机制比较的 benchmark/评测集合。&quot;,&quot;why&quot;:&quot;可用来观察多种 Memory 结构和使用方式的覆盖。&quot;,&quot;boundary&quot;:&quot;需要继续核对任务、指标和数据许可。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;mem-gallery&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2601.03515&quot;,&quot;coverage&quot;:[&quot;substrate&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;mem2actbench&quot;,&quot;title&quot;:&quot;Mem2ActBench&quot;,&quot;date&quot;:&quot;2026-01-13 · arXiv v1&quot;,&quot;summary&quot;:&quot;把分散在历史里的偏好和约束转成工具参数：用户不再重复目的地、预算等信息，Agent需要从记忆补齐一次工具调用。它提供任务设计上的补充，但v1的部分指标口径仍待澄清。&quot;,&quot;why&quot;:&quot;很多真实请求只说“按之前的要求办”。这个Benchmark围绕省略参数的请求构造任务，有助于分清找到历史事实、推导参数和真正执行行动。收录是为了学习该任务设计，不把其成绩作为系统质量认证。&quot;,&quot;boundary&quot;:&quot;按arXiv v1解释，未核得正式会议身份。主实验提供正确工具，不能称为完整的自主工具选择或真实执行成功测试。正文指标解释存在不一致；作者给出的匿名代码入口本轮返回401，未核评分代码和发布数据。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;mem2actbench-meta&quot;,&quot;mem2actbench-paper&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/html/2601.19935v1&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;selectionEvidence&quot;:&quot;作者Yiting Shen、Kun Li、Wei Zhou、Songlin Hu，单位包括中科院信息工程研究所和中国科学院大学。原文公开事实演化链、反向提问、泄漏筛查及人工核验方法，能为本教程补充行动参数这一主题。团队和预印本身份不代替同行评议，原文问题与访问缺口已单列。&quot;,&quot;limitations&quot;:&quot;构造数据来自ToolACE、BFCL和OASST1的整合与生成，不等于连续采集的真实用户历史。§4.1将TA定义为工具及全部参数精确匹配，§4.2却据TA的集中分布判断剩余错误主要属于语义而非结构，§5.4另用EM、Table4使用TSA，未给足够说明统一口径；本页不引用TA数字作效果结论。摘要平均12轮而正文写13轮；人工抽查91.3%只按作者报告，不自行反推样本数。代码/data入口不可读，未做复现。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;从长期历史推导工具调用参数的Memory评测&quot;,&quot;authors&quot;:&quot;Yiting Shen、Kun Li、Wei Zhou、Songlin Hu&quot;,&quot;venue&quot;:&quot;arXiv:2601.19935v1，预印本&quot;,&quot;artifact&quot;:&quot;可读论文与构造/过滤示例；论文声明有代码与数据，但本次匿名入口访问为401&quot;,&quot;version&quot;:&quot;v1（2026-01-13）；2026-11-12核查，未读取评分实现或运行系统&quot;},&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;从省略关键参数的用户请求推断应该查什么记忆；从历史偏好、约束和状态中恢复参数；在更新与噪声之后使用相关证据。工具候选选择另见§5.4，主表已提供正确工具。&quot;,&quot;taskProtocol&quot;:&quot;先整合工具对话与闲聊，抽取attribute/fact/source ID，再局部消解冲突并整合事实演化顺序；从有依据的正确工具调用反向生成省略参数的请求，过滤直接泄漏和无记忆也能猜出的题。作者构造2029个sessions和400题，§4.1实际实验选取含全部必要证据的429个sessions，两个数字属于不同阶段。&quot;,&quot;metrics&quot;:&quot;按§4.1声明：参数F1衡量precision/recall，BLEU-1看与参考的词项重合，TA要求工具正确且所有参数精确匹配。主实验给出gold tool，§5.4在候选工具集合上另报告TSA与EM；原文未说明TSA与§4.1的TA是否同一口径。原文TA的后续解释、TSA命名和主表数值关系未说明清楚，代码又不可读，因此这里只介绍声明定义，不认证实际计算公式、作跨系统数值比较或把TA等同真实任务成功率。&quot;,&quot;designMapping&quot;:&quot;Q1由偏好/约束等内容、Q4由事实更新与历史位置、Q5由检索后参数生成直接关联。Q2主要是参评实现的表示选择；Q3涉及内容主题和来源组织，却没有多租户授权任务；Q6涉及评测数据筛查，但不检验被测系统的访问权限或删除传播。这是教程对协议的分析，不是六项独立能力分。&quot;,&quot;limitations&quot;:&quot;自动过滤器失败只说明该过滤器未解出，不能证明任意模型都必须依赖记忆。人工核验仅为作者的抽样结果。F1/词项重合不足以确认工具执行效果；若要测真实行动，应另设执行环境、状态变化成功条件、错误副作用与成本指标。&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;任务要求记住用户的偏好、约束、实体信息和随对话变化的状态，用它们补齐当前请求没有明说的工具参数。事实抽取采用attribute、fact和source ID三部分；attribute尽量绑定具体实体，避免把不同平台的“账户修改”混在一起。这是构造任务需要的信息，不要求参评系统采用同样的内部字段或分类。&quot;,&quot;why&quot;:&quot;“预算是多少”直接指出需要哪条事实；“按之前预算订票”还要求识别缺失参数并主动利用历史。两者都与记忆有关，但后者多了把内容映射到行动接口的步骤。&quot;,&quot;example&quot;:&quot;附录B Table8的有效例子：历史Turn1给出预算500美元，当前请求只说“找符合之前预算的航班”，目标参数price=500。这里复述作者构造示例；并不表示已调用真实订票工具或完成交易。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§3.3.1、§3.4、附录B Table8。字段与price例子是论文事实；直接问答与隐含参数的解释为教程归纳。&quot;},{&quot;answer&quot;:&quot;基准构造阶段把源对话抽成(attribute, fact, source ID)三元组，局部消解冲突后形成全局事实演化序列，用来追踪题目及参数的依据。交付材料包含历史对话、当前请求、工具定义和参考调用；被测系统仍可自行选择文本、向量库或图等内部表示。基准的标准记录服务于出题和核验，并不要求所有参评系统采用它的存储结构。&quot;,&quot;why&quot;:&quot;如果把评测者知道的正确证据和答案直接交给系统，会把“自己找到并使用历史”变成“照着答案填空”。区分评分端材料与模型端记忆，也是理解oracle检索对照的前提。&quot;,&quot;example&quot;:&quot;教学对照：给两个系统相同对话历史，一个保存文本片段，一个形成结构化事实；让它们补price参数。若另把正确支持事实直接提供给模型，应标为oracle条件，不能混入正常检索成绩。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§3.2至§3.5、§4.1与§5.1的no/passive/oracle retrieval。如何隔离gold信息是依据协议提出的实验检查，未运行该对照。&quot;},{&quot;answer&quot;:&quot;构造时按实体绑定的属性组织历史，并为事实保留来源ID；它模拟持续使用助手时被闲聊打断的任务历史。论文没有把不同用户身份、组织权限或多个自主Agent的共享协议设为主要变量。内容提到不同账户或实体，不等于已测试这些主体之间的访问隔离。&quot;,&quot;why&quot;:&quot;把两个平台的账户混成一个主题，会填错工具参数；把两名用户的资料混进同一可检索集合，则可能越权。前一个问题在构造流程里被处理，后一个需要独立的权限场景和判据。&quot;,&quot;example&quot;:&quot;论文§3.3.1以“account modification (YouTube)”说明属性应绑定实体。教学扩展：如果为用户A和B都生成相似账户任务，必须额外携带授权身份并检查串读；这不是原Benchmark已完成的测试。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§3.2、§3.3.1及附录A的数据组织。多租户覆盖不足是对所列任务协议的范围判断，不推断某个参评系统没有权限功能。&quot;},{&quot;answer&quot;:&quot;事实链构造先对同主题事实排序，保留合理更新和细化，丢弃被判定为矛盾或冗余的项，再用带破环规则的拓扑排序形成全局顺序。实验使用按原顺序筛出的历史，另按最早支持证据的位置分析性能。这里的冲突清理主要发生在数据构造端，不能等同于每个参评Memory都实时执行同样的更新算法。&quot;,&quot;why&quot;:&quot;历史不只是不断加长，也可能改变当前有效约束。需要区分保留旧状态作历史、更新当前状态，以及数据生成器删除不一致材料这三件事；它们对“记住多久”和“用哪个值”提出不同要求。&quot;,&quot;example&quot;:&quot;附录A Table7用饮食偏好演化示例说明：作者把当前纯素要求与蔬菜、高蛋白偏好组合，保留较早素食阶段的背景，删除被判矛盾的鱼类偏好。这个示例说明构造规则，不证明真实人的偏好一定符合该条时间线。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§3.3.2、§4.1历史筛选、§5.2及附录A Table7/Algorithm1。它未建立完整TTL、删除请求或副本擦除协议。&quot;},{&quot;answer&quot;:&quot;§5.1比较三种证据暴露条件：不检索；用BM25、Dense或Hybrid检索，分别取k=1/5/10；oracle条件直接提供标准记忆。系统再把得到的历史证据用于生成工具调用与参数，§5.2另按最早证据在历史中的位置分组。主实验已提供正确工具，主要考察参数依据；§5.4才增加干扰工具。指标声明与后文命名存在未解释处，评分代码本轮不可读，不能把主表TA当真实行动成功率。&quot;,&quot;why&quot;:&quot;答错可能是没找对历史，也可能是找到后组合错参数；工具选对还可能参数错，调用格式正确也不保证外部执行成功。把这些阶段分开，才能知道该改进检索还是推理/行动接口。&quot;,&quot;example&quot;:&quot;教学例子：系统选对航班工具却填入旧预算，应算参数使用问题；填对price=500仍不能说明航班真的订成功。作者§5.1用oracle检索分析给对证据后的表现，本页不重算或推广其数值。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§4.1 Evaluation Metrics、§4.2、§5.1、§5.4及Table4。TA仅按原文定义介绍；数值与实际实现待澄清，访问限制已记录。&quot;},{&quot;answer&quot;:&quot;评测方控制合成、冲突消解、参数溯源和请求过滤，并安排人工抽查；这属于数据质量控制。自动过滤会移除直接暴露答案或被无记忆判别器解出的请求，但不能逻辑保证所有模型都无法猜中。公开协议没有把用户同意、恶意记忆注入、身份越权和彻底删除作为独立成功条件。&quot;,&quot;why&quot;:&quot;数据构造可信度与被测系统治理能力是两条证据链。一个题目确实需要历史，仍不能证明系统只使用了获准历史；一个高准确率也不能证明长期记忆可安全撤回。&quot;,&quot;example&quot;:&quot;附录B拒绝“订去Seattle的航班”这种直接泄漏目的地的请求，也拒绝可从“意面和披萨”推断意大利菜的题。教学扩展：治理测试还应加入“未获授权的另一用户目的地”，并按违规使用率单列评分；原有指标不能代替它。&quot;,&quot;trace&quot;:&quot;《Mem2ActBench · v1任务与指标》§3.4.2、§3.6与附录B/C。五名专家和抽样比例为作者报告，非独立核验；对治理的缺口与扩展建议是教程分析。&quot;}]},{&quot;id&quot;:&quot;memora&quot;,&quot;title&quot;:&quot;Memora · From Recall to Forgetting&quot;,&quot;date&quot;:&quot;2026-04-21 · 预印本首发；2026-07 · Findings of ACL&quot;,&quot;summary&quot;:&quot;用持续变化的个人偏好、活动和目标构造长时段对话，检查系统是否既能使用当前有效记忆，又能避免引用已更新或撤回的信息。评测任务包括记忆、推理和推荐。&quot;,&quot;why&quot;:&quot;它把“记住了什么”与“是否还在用失效记忆”放在同一次评分里，适合学习生命周期与行为结果之间的关系，也提醒读者不要把回答层面的遗忘等同存储擦除。&quot;,&quot;boundary&quot;:&quot;正式发表于Findings of ACL 2026。数据是模拟对话而非真实用户长期跟踪；FAMA是回答层指标，不能证明数据库删除、权限隔离或生产延迟。未运行参评系统和裁判模型。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;memora-venue&quot;,&quot;memora-meta&quot;,&quot;memora-final&quot;,&quot;memora-data-current&quot;,&quot;memora-scoring-current&quot;,&quot;memora-eval-current&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.findings-acl.1337/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;selectionEvidence&quot;:&quot;有正式ACL Anthology论文、公开数据格式和可核查评分代码，作者来自Arizona State、Genies和University of Arizona。收录依据是明确的记忆更新/撤回协议及判据，不以团队声誉代替实验适用性检查。&quot;,&quot;limitations&quot;:&quot;十种职业persona与三类记忆不能代表所有用户和任务；未覆盖多用户协作和更丰富的社会关系。LLM裁判可能共享偏差。论文不报告运行时间、延迟或效率；长上下文和记忆Agent的底模/推理条件不同，不能把整张表当作存储架构的单变量实验。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;面向个性化Agent的长期记忆与遗忘评测&quot;,&quot;authors&quot;:&quot;Md Nayem Uddin、Kumar Shubham、Eduardo Blanco、Chitta Baral、Gengyu Wang&quot;,&quot;venue&quot;:&quot;Findings of the Association for Computational Linguistics: ACL 2026&quot;,&quot;artifact&quot;:&quot;正式论文、模拟多会话数据、两种评测轨道和FAMA实现&quot;,&quot;version&quot;:&quot;正式版2026-07；仓库a6493188efc836d6511ed5e4163fe3ba87da30ff；2026-11-12核查&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;基准主要覆盖个人偏好、活动和长期目标。任务分别要求记住有效事实、跨记录推理以及按当前偏好推荐；遗忘判据主要见于记忆和推荐题；数据说明指出多数推理题只有有效信息判据，此时λ=0、FAMA退化为MPA。所谓“该忘记的内容”既包括明确撤回，也包括已被新值替代的内容，它是判分对象，不要求被测系统采用同名记忆类别。&quot;,&quot;why&quot;:&quot;只奖励提及正确事实，会放过把新旧信息一起输出的答案。增加失效信息判据，才能识别“知道新答案但仍沿用旧状态”的错误。&quot;,&quot;example&quot;:&quot;教学例子，依据论文的偏好变化情境：用户过去喜欢某导演，后来表示厌倦。推荐时既要利用当前喜好，也不能把旧偏好继续当作当前理由；这比背出用户曾经喜欢谁多了时间有效性要求。&quot;,&quot;trace&quot;:&quot;《Memora · Findings of ACL 2026正式论文》§3.1、§3.5、§4.2；例子为偏好漂移机制的教学改写。 《Memora · 发布数据格式》Reasoning-task caveat。&quot;},{&quot;answer&quot;:&quot;发布数据以JSON表示会话、persona、日期和操作信息；题目另有有效记忆依据、遗忘依据及逐条评分条件。模拟器的结构化状态用于构造标准答案和核验对话，被测Agent的内部存储可自行选择。LLM轨道使用历史上下文，Agent轨道使用自己的记忆模块，不能从数据格式反推出参评系统一定用JSON存储。&quot;,&quot;why&quot;:&quot;基准的标准状态帮助评测方知道什么信息有效，系统内部表示则是实验自变量之一。若把用于评分的隐藏依据也交给被测模型，会把检索和更新难题提前替它解决。&quot;,&quot;example&quot;:&quot;发布格式示例询问本周待办事项，同时附带memory_evidence和forgetting_evidence供审计。教学检查：给系统会话与问题，保留判据供裁判；不要把“已删除待办列表”作为额外答案提示混入普通实验。&quot;,&quot;trace&quot;:&quot;《Memora · 发布数据格式》Session/Evaluation file；《Memora · Findings of ACL 2026正式论文》§3.2、§3.5；审计与输入分离为教程复现建议。&quot;},{&quot;answer&quot;:&quot;资料按persona和weekly/monthly/quarterly组织，同一组十种persona在不同时间跨度下有不同长度历史。基准关注单个用户的跨会话积累，没有把多租户越权或多Agent协作作为独立任务。日期用于判断记忆在提问时是否有效，不代表系统可以访问所有persona的历史。&quot;,&quot;why&quot;:&quot;用户归属与时间范围共同决定一条记忆是否适用。答出了正确数字，如果来自另一用户或未来会话，仍不能说明系统具备合格的记忆能力；评测输入必须保持分组和时间边界。&quot;,&quot;example&quot;:&quot;教学例子：软件工程师persona的待办和研究者persona的待办分别摄入，按各自提问日期回答。测试实现应防止缓存跨persona串用；本基准没有提供由跨租户攻击构成的专门分数。&quot;,&quot;trace&quot;:&quot;《Memora · 发布数据格式》Layout与persona清单；《Memora · Findings of ACL 2026正式论文》Table2、Limitations。串用检查是部署/评测建议。&quot;},{&quot;answer&quot;:&quot;模拟器逐会话加入、更新或删除记忆，并保存变化前后的状态；对话生成把这些操作转成自然语言。还混入不改变记忆的普通交流。题目要求跨较远会话综合，按当前状态保留有效内容、排除失效内容。所谓weekly/monthly/quarterly是模拟时间跨度，不是实地跟踪用户数月的证据。&quot;,&quot;why&quot;:&quot;生命周期困难来自多次修订和信息分散：不能只把最后一句视为全部记忆，也不能让最早写入的偏好永久有效。显式状态轨迹让这类错误可以被定位，而不只是看一个总正确率。&quot;,&quot;example&quot;:&quot;教学序列：周一设定目标，周三修改目标值，周五撤回其中一项。周末回答应合并仍有效的部分，并排除撤回项。这个序列由本教程构造，用来说明add/update/delete如何共同影响答案。&quot;,&quot;trace&quot;:&quot;《Memora · Findings of ACL 2026正式论文》§3.2至§3.5；《Memora · 发布数据格式》operation与date。&quot;},{&quot;answer&quot;:&quot;两条评测轨道通过不同路径把历史暴露给模型：LLM轨道直接提供对话历史并比较是否开启推理；Agent轨道按时间逐步摄入对话，在提问时检索后生成答案。论文对Agent答案生成采用共同GPT-4o-mini后端，但LLM轨道使用其他模型。因此应分别分析摄入、检索、生成条件，不能把跨轨道差异全部归因于存储。 LLM轨道提示词明确要求只用更新后的信息；已知模型的默认上下文构造路径取有效模型额度与200,000 token的较小值，生成前还会复查硬上限；超限会丢弃较早会话。因此较高的遗忘分也可能受提示或未看到旧信息影响，不能直接当作原生记忆维护的证据。&quot;,&quot;why&quot;:&quot;同一最终回答可能因为没取到证据、取到了旧值，或生成时忽略了更新而出错。历史进入模型的路径决定怎样定位问题；一个FAMA数值不能单独告诉我们是哪一步失败。&quot;,&quot;example&quot;:&quot;教学诊断：系统漏掉某项有效待办时，先查它是否已摄入，再看检索结果是否包含它，最后看生成是否遗漏。论文评分观察最终回答；要证实具体故障环节，需额外保留系统调用与检索日志。&quot;,&quot;trace&quot;:&quot;《Memora · Findings of ACL 2026正式论文》§4.1；《Memora · 两类评测协议》Track1/Track2。诊断步骤是教程分析，未声称原基准记录了全部中间状态。 《Memora · FAMA与裁判实现》build_conversation_context、系统提示第6条。&quot;},{&quot;answer&quot;:&quot;评测方控制模拟状态、对话校验和题目判据。正式论文说明生成对话需三位LLM校验者一致通过，并抽取每个persona的5%对话人工核验；评分阶段则对每条二元判据采用三位LLM裁判多数票，这两个环节不要混淆。基准通过答案是否排除旧信息检验行为遗忘，未验证存储层擦除或用户授权。 固定代码允许部分裁判初始化或调用失败后用剩余有效结果评分；复跑时应检查num_valid_judges，不能仅凭配置就宣称所有题都经过三裁判多数票。&quot;,&quot;why&quot;:&quot;数据质量控制支持题目可信度，不能自动推导参评系统的安全性。三模型多数票也可能共享判断偏差，需要保留分歧、失败和人类抽检结果。&quot;,&quot;example&quot;:&quot;教学反例：系统把敏感旧信息藏在数据库中，只是不在这次回答提及，仍可能获得较高遗忘分；这不证明删除完成。若测试删除，应另外检查索引、派生摘要、备份和撤回后的探测请求。&quot;,&quot;trace&quot;:&quot;《Memora · Findings of ACL 2026正式论文》§3.3、§4.2、Limitations；《Memora · FAMA与裁判实现》的多数票与失败结果处理。删除建议不是原基准已覆盖能力。&quot;}],&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;Remembering检查当前有效信息是否被记住；Reasoning检查跨会话信息整合；Recommending检查当前偏好是否影响建议。更新与撤回横跨三类任务，不是单独的存储擦除测验。&quot;,&quot;taskProtocol&quot;:&quot;十种模拟persona，按周/月/季度生成含普通交流和add/update/delete的会话；Table2分别给150、150、300道题，总计600题。LLM轨道直接读取历史；Agent轨道增量摄入并检索，按任务和时间跨度报告结果。数据构造校验与答案评分采用不同投票规则。&quot;,&quot;metrics&quot;:&quot;每题MPA是有效信息判据通过比例，FAA是失效信息排除判据通过比例，λ=Nforget/(Npresence+Nforget)。FAMA=max(0, MPA−λ×(1−FAA))；按任务和时段求题目平均后乘100，聚合写法依据公开代码与evals/README；论文正文表述为求和后归一化。无遗忘判据时λ=0、FAMA=MPA。教学算例：4项有效信息满足3项、2项应排除旧信息只排除1项，则MPA=0.75、FAA=0.5、λ=1/3，FAMA约0.583；这是公式演示，不是论文实测成绩。&quot;,&quot;designMapping&quot;:&quot;Q1对应偏好/活动/目标，Q4对应增删改和有效期，Q5对应历史暴露与答案使用；Q2是被测实现的表示选择，Q3规定persona/时段却不测试越权，Q6包含数据质量控制与行为遗忘但不证明物理删除。这是协议关联，不能解释为六个独立性能分。&quot;,&quot;limitations&quot;:&quot;开放回答依赖LLM裁判，分数受判据和任务组合影响；没有效率/延迟指标。建议同时看MPA、FAA、各任务与时段的FAMA，避免只看合并分数而掩盖“会记不会忘”或“过度遗漏”。该建议不宣称已构建新的完整Benchmark。&quot;}},{&quot;id&quot;:&quot;memoryagentbench&quot;,&quot;title&quot;:&quot;MemoryAgentBench · Evaluating Memory in LLM Agents via Incremental Multi-Turn Interactions&quot;,&quot;date&quot;:&quot;2025-07-07；ICLR 2026；论文 v4：2026-06-28&quot;,&quot;summary&quot;:&quot;Hu、Wang、McAuley 提出的增量多轮 Memory benchmark，围绕 Accurate Retrieval、Test-Time Learning、Long-Range Understanding 和 Selective Forgetting 四类能力组织任务；官方仓库把最后一类称为 Conflict Resolution。&quot;,&quot;why&quot;:&quot;它是 ICLR 2026 录用、论文和代码均公开的专门 Memory benchmark，明确把长上下文材料改造成增量多轮交互，并同时覆盖检索、测试时学习、长程理解和冲突/选择性遗忘。它适合展示“评测能力维度”和“教程六问”是两个不同视角。&quot;,&quot;boundary&quot;:&quot;benchmark 测的是给定协议下的可观察结果和部分过程控制，不是某个系统内部 Memory ontology，也不是权限、审计、删除或成本的完整验收。本文未运行仓库评测，代码/模型/API 配置可能随版本变化。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;memoryagentbench:0&quot;,&quot;memoryagentbench:1&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2507.05257v4&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;selectionEvidence&quot;:&quot;论文元数据、ICLR 2026 录用信息、官方 README、指标表和公开运行入口已核。官方仓库在快照日 HEAD 为 5380260；本教程记录协议和证据边界，不把论文结果当作本地复现或跨 benchmark 排名。&quot;,&quot;limitations&quot;:&quot;官方论文/README 的四类能力覆盖了记忆结果的重要切片，但不直接测试主体共享、权限、来源追溯、物理删除或投毒治理；论文附录有成本/延迟/GPU memory 的次级分析，但它们不是四项核心能力指标；不同 agent 配置、模型、judge、chunk size 和任务子集会影响结果。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;专门的 LLM Agent Memory benchmark&quot;,&quot;authors&quot;:&quot;Yuanzhe Hu、Yu Wang、Julian McAuley&quot;,&quot;venue&quot;:&quot;The Fourteenth International Conference on Learning Representations (ICLR 2026); arXiv v4&quot;,&quot;artifact&quot;:&quot;论文、官方代码仓库（含 README 指标表和运行入口）与 Hugging Face 数据入口；本教程未运行评测&quot;,&quot;version&quot;:&quot;paper v4 updated 2026-06-28；repo HEAD 538026089d1a8a8eff05121d0db89b388f360eba&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;这里的“保存的是什么”要改写成“评测对象是什么”：benchmark 不保存一个统一 Memory store，而是把能力拆成四类结果。Accurate Retrieval 关注从长对话或文档中找到相关信息；Test-Time Learning 关注在交互中学会新的分类、偏好或任务知识；Long-Range Understanding 关注长距离摘要和推理；Selective Forgetting/Conflict Resolution 关注新旧事实冲突时能否使用更新信息。比如 EventQA 属于检索，FactConsolidation-SH/MH 用于冲突/选择性遗忘。&quot;,&quot;trace&quot;:&quot;论文摘要、§3 和 Appendix B/Table 2 给出四类能力与任务构成；论文 v4 的摘要、§3 和 Appendix B 使用 Selective Forgetting；仓库 README 的 overview 使用 Conflict Resolution。它们是 evaluation categories，不能被写成 memory 内容 taxonomy。&quot;,&quot;why&quot;:&quot;Benchmark 的第一问描述被测能力和内容类型，而不是假装它有一个内部 Memory schema。&quot;,&quot;example&quot;:&quot;EventQA/LongMemEval 需要从历史中找事件或事实；FactConsolidation 需要处理新旧事实冲突。&quot;},{&quot;answer&quot;:&quot;被测 Memory 的载体由参测系统决定；benchmark 提供的是“增量多轮输入协议”：长文档、对话或事实被切成 context chunks，按交互顺序送给 agent，再在之后提出多个 query。被测系统可以是 full-context、RAG、外部 Memory module 或 tool-integrated agent，因此协议不强制一种文件、向量库、图或参数表示。官方 README 还明确采用“inject once, query multiple times”，让同一段输入支持后续多个问题。&quot;,&quot;trace&quot;:&quot;论文摘要、§3.1、Table 2 和 README 的 LongMemEval overview 支持 chunking、multi-turn、agent family 和 inject-once/query-many 事实；协议与被测系统的内部 substrate 分开。&quot;,&quot;why&quot;:&quot;协议固定输入顺序和查询方式，故可以比较不同内部载体，同时不把某种载体当作标准。&quot;,&quot;example&quot;:&quot;同一组 chunks 可以交给 full-context、RAG 或 external-memory agent；差异来自系统实现和协议共同作用。&quot;},{&quot;answer&quot;:&quot;评测单位通常是一套能逐步接收 context 和 query 的 agent system 及一次 protocol run；系统内部可以包含多 Agent memory architecture（论文示例包括 MIRIX），范围是评测序列中的长期交互。表格把不同数据集和平均上下文长度列出来，但没有把团队共享、多个主体的可见性、tenant isolation 或 user consent 设计成核心变量。因此它能回答“在一段增量历史中，这个 agent 是否记住并使用信息”，不能回答“多 Agent 共享是否安全”。&quot;,&quot;trace&quot;:&quot;论文摘要、§3.1、Appendix B 和 README 运行流程支持 agent system/incremental interaction 范围，且 §4.1/C.3 说明可评测包含 multi-agent memory architecture 的系统；跨 Agent 共享、可见性和租户治理没有进入核心任务定义，故标为 not_assessed。&quot;,&quot;why&quot;:&quot;评测序列围绕一个 agent 的增量历史组织，无法由此推出多 Agent 共享、租户隔离或同意机制。&quot;,&quot;example&quot;:&quot;一个序列里先注入历史再提出多个 query，测的是这个 agent 后续是否能用历史。&quot;},{&quot;answer&quot;:&quot;它通过后续查询间接观察生命周期：新信息到达后能否学会，长距离之后能否仍然理解，事实被更新或冲突后能否选择新的版本。实际协议是先逐块摄入并处理全部材料，再统一提出查询；Appendix H.1 将 acquisition 与 evaluation 分成两个阶段，并明确它不是 fully interleaved online learning。这个设计比一次性长文档 QA 更接近“先摄入、再使用、再检查更新/冲突结果”，但它不会直接打开系统日志检查写入、合并、TTL、物理删除或 rollback。一个 agent 回答错了，可能是没有写入、没有检索、注入失败、推理错误或冲突策略错误，benchmark 分数本身不能区分这些原因。&quot;,&quot;trace&quot;:&quot;论文摘要与 Appendix B.1/B.2/B.3/B.4 的任务定义支持增量、长程和冲突观察；§3.3 与 Appendix H.1 说明先摄入后评估的两阶段协议；对内部日志/删除协议的限制是从黑盒评测边界推出，并明确标为未直接测量。&quot;,&quot;why&quot;:&quot;增量、更新和冲突任务能观察生命周期结果，但黑盒分数不能定位写入、检索还是删除哪一步失败。&quot;,&quot;example&quot;:&quot;新事实覆盖旧事实时答错，可能是未学习、检索错、注入错或冲突策略错；需要额外 trace 才能区分。&quot;},{&quot;answer&quot;:&quot;它主要看“信息最终有没有被有效取回并用对”：论文比较 context-based、RAG、external-memory 和 tool-integrated agents，并采用统一的 prompt/工具设置和受控的检索预算；chunk size 会随任务和方法变化（例如多数 AR/SF 任务为 512，部分外部记忆方法为 4096），多数检索结果使用 TopK=10，细节见论文 §4.1 与 Appendix F.3。指标按任务不同包括 substring_exact_match、exact_match、Recall@5、F1 或 LLM-as-judge；因此它既观察暴露后的任务结果，也保留了一些过程控制。可是黑盒结果不能证明每次调用内部到底检索了哪条记录、如何排序，或模型是否从其他输入捷径得到答案。&quot;,&quot;trace&quot;:&quot;论文 §4.1/§4.2、Appendix F.3（chunk size/TopK）、lines 525–528 和官方 README 的 metrics table；指标字段和具体任务以 repo snapshot 为准，本教程没有运行验证。&quot;,&quot;why&quot;:&quot;统一 prompts 和 tool access，并控制 TopK、chunk size 等检索预算，可以减少协议差异；具体值仍会随任务和方法变化，因此不能据分数证明内部调用链。&quot;,&quot;example&quot;:&quot;README 的 metrics table 把 EventQA 记为 substring_exact_match、Movie Recommendation 记为 Recall@5；不同任务指标不能合成一个总分。&quot;},{&quot;answer&quot;:&quot;第六问的答案是“主要未评估”：协议没有把读写权限、同意、来源追溯、审计、投毒抵抗、物理删除、跨租户隔离或资源成本作为主指标。仓库的 API key、LLM judge 和运行配置属于复现条件，不等于治理评测。要覆盖教程六问，需要在 MemoryAgentBench 旁边增加权限错误、删除传播、来源可信度、投毒和成本/延迟测试，而不能用现有分数替代这些检查。&quot;,&quot;trace&quot;:&quot;论文 §4、Appendix E、I、J、Reproducibility Statement 与 README metrics/quick setup 说明评测和运行范围；附录的成本/延迟分析与核心能力分类分开；未出现的治理维度以 not_assessed 记录，不写成系统没有这些能力。&quot;,&quot;why&quot;:&quot;评测没有把治理作为主指标，所以应明确列出缺口并设计额外安全/隐私测试。&quot;,&quot;example&quot;:&quot;可以另加“无权用户读取”“删除后仍被检索”“被投毒事实优先级”等任务，而不能用当前四类分数替代。&quot;}],&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;Accurate Retrieval；Test-Time Learning；Long-Range Understanding；Selective Forgetting（官方 README 对第四类使用 Conflict Resolution）&quot;,&quot;taskProtocol&quot;:&quot;将已有长上下文/对话数据和新构造数据切成 context chunks，先按增量多轮交互摄入全部 context chunks，再进入查询阶段；采用 inject once, query multiple times 的设计；论文 Table 2 列出各类任务和平均长度。&quot;,&quot;metrics&quot;:&quot;任务级指标包括 substring_exact_match、exact_match、Recall@5、F1 和 LLM-as-judge；官方 README 给出 category→dataset→metric→JSON field 映射。不同任务的数值不能直接合成教程排名。&quot;,&quot;designMapping&quot;:&quot;主要覆盖 Q1 的评测内容/能力、Q4 的学习与冲突结果、Q5 的取回和使用（协议控制 prompt/工具与部分检索预算，但 chunk size/TopK 仍有任务和方法差异）；Q2 的内部载体、Q3 的跨 Agent 共享/可见性拓扑和 Q6 的治理不是直接测量维度。&quot;,&quot;limitations&quot;:&quot;分数依赖模型、memory agent 配置、context/chunk size、TopK、judge、任务子集和运行环境；结果不能单独反推内部写入、检索、删除、权限或安全机制。&quot;}},{&quot;id&quot;:&quot;timl-membench&quot;,&quot;title&quot;:&quot;TimlMemBench&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;近期的长程/时间变化 Memory benchmark 线索。&quot;,&quot;why&quot;:&quot;提供时间和动态维度的候选评测。&quot;,&quot;boundary&quot;:&quot;当前条目依赖资源目录线索，详细协议待补。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;s012&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.findings-emnlp.507/&quot;,&quot;coverage&quot;:[&quot;lifecycle&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;utilmem&quot;,&quot;title&quot;:&quot;UTILMEM&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;近期 Memory utility 评测线索。&quot;,&quot;why&quot;:&quot;可用于讨论有用性指标与六问设计层的差异。&quot;,&quot;boundary&quot;:&quot;当前只保留论文入口和候选状态。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;s014&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2026.emnlp-main.1639/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;exposure&quot;]},{&quot;id&quot;:&quot;longmemeval&quot;,&quot;title&quot;:&quot;LongMemEval&quot;,&quot;date&quot;:&quot;2025&quot;,&quot;summary&quot;:&quot;评估聊天助手长期交互中的信息提取、推理、时间变化、知识更新和 abstention。&quot;,&quot;why&quot;:&quot;任务定义清晰，是分析“结果能力”和“Memory 设计”差异的核心样板。&quot;,&quot;boundary&quot;:&quot;结果依赖模型、历史长度、任务子集、预算和评审协议；不做跨 benchmark 排名。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;longmemeval&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;selectionEvidence&quot;:&quot;论文身份、任务说明和公开入口可定位；纳入依据是长期交互与多类任务覆盖，不把得分当成系统完整性证明。&quot;,&quot;limitations&quot;:&quot;不直接测权限、审计、物理删除、成本和内部检索路径；需要与其他 benchmark 组合。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;questions&quot;:[{&quot;answer&quot;:&quot;LongMemEval 的任务围绕长期对话中的事实、偏好、事件和知识变化，测五类结果能力：信息提取、多会话推理、时间推理、知识更新和 abstention。它测的是系统能否在新问题中给出正确回答或承认不知道，不规定某一种 Memory taxonomy。&quot;,&quot;trace&quot;:&quot;论文摘要和任务章节列出的五类能力、500 个问题与长期 user-assistant history 设置；内容类别是任务设计，不是系统内部 schema。&quot;},{&quot;answer&quot;:&quot;Benchmark 的输入协议提供对话历史与查询，论文还把设计拆为 indexing、retrieval、reading 三阶段，但不把文件、向量库、图或参数记忆作为必须的控制变量。因此一个分数只能说明在给定协议下得到的结果，不能证明某种载体本身更好，也不能判断系统是否保留了可审计的权威记录。&quot;,&quot;trace&quot;:&quot;论文摘要对三阶段设计的概括、数据输入和 baseline 设置；内部存储形式属于被测系统实现。&quot;},{&quot;answer&quot;:&quot;评测范围由对话历史、用户/助手交互和任务实例定义，主要面向单个助手的长期交互。题目可以包含用户偏好和时间变化，但没有把团队共享、租户隔离、不同主体的可见性或权限错误作为核心指标。&quot;,&quot;trace&quot;:&quot;论文的数据构造和任务分类；协作共享与租户治理不在 LongMemEval 的核心协议中，故标为 not_assessed。&quot;},{&quot;answer&quot;:&quot;新信息、时间变化和知识更新任务让我们能观察部分生命周期结果，例如旧事实被新事实替换后是否回答正确；abstention 还可以观察系统是否避免无依据作答。它仍不直接验证写入日志、版本迁移、物理删除、删除传播或错误记忆的回滚路径。&quot;,&quot;trace&quot;:&quot;论文对 temporal reasoning、knowledge updates 和 abstention 的任务说明；缺失的是实现层生命周期协议。&quot;},{&quot;answer&quot;:&quot;它观察系统在给定历史与查询下能否取回并使用相关信息，最终以回答或判断结果计分。论文的 indexing/retrieval/reading 分解帮助我们分析路径，但黑盒结果仍不能单独证明触发条件、排序、上下文注入位置或模型是否绕过 Memory 直接利用了其他输入。&quot;,&quot;trace&quot;:&quot;论文摘要和评测协议对三阶段设计与任务输出的描述；内部调用链未被结果分数固定。&quot;},{&quot;answer&quot;:&quot;权限、同意、来源追溯、审计、投毒、物理删除、成本和延迟不是 LongMemEval 的主要测量维度。因此它是长期 Memory 结果能力的切片，不能作为完整系统验收；要回答 Q6，需要额外的安全、隐私和治理测试。&quot;,&quot;trace&quot;:&quot;论文任务和指标范围；这里明确记录未评估项，而不是把“没有测”解释成“系统没有”。&quot;}],&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2410.10813&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;profile&quot;:{&quot;kind&quot;:&quot;长期交互 Memory benchmark&quot;,&quot;authors&quot;:&quot;Di Wu, Hongwei Wang, Wenhao Yu, Yuwei Zhang, Kai-Wei Chang, Dong Yu&quot;,&quot;venue&quot;:&quot;ICLR 2025；arXiv v1 2024-10-14、v2 2025-03-04&quot;,&quot;artifact&quot;:&quot;论文声明公开 benchmark 与代码；本教程没有运行评测或复现得分&quot;},&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;information extraction、multi-session reasoning、temporal reasoning、knowledge updates、abstention 五类能力&quot;,&quot;taskProtocol&quot;:&quot;500 个问题嵌入可扩展的 user-assistant 长期对话历史；系统根据历史和查询回答或选择 abstain&quot;,&quot;metrics&quot;:&quot;论文报告问答/准确率结果，并讨论 indexing、retrieval、reading 三阶段；本教程不把论文分数转成跨系统排名&quot;,&quot;designMapping&quot;:&quot;主要关联 Q1 内容、Q4 生命周期、Q5 暴露与使用；Q2 载体、Q3 共享拓扑、Q6 治理不由该 benchmark 直接测量&quot;,&quot;limitations&quot;:&quot;任务结果依赖模型、历史长度、任务子集、检索预算、回答/评审协议和实现；分数不能反推出内部存储、权限或删除语义&quot;}},{&quot;id&quot;:&quot;membench&quot;,&quot;title&quot;:&quot;MemBench&quot;,&quot;date&quot;:&quot;2025-07 · Findings of ACL&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;summary&quot;:&quot;把记事实、归纳偏好、证据召回和读写开销放进同一评测框架，并区分参与对话与只观察消息两种场景。历史按顺序输入，用问题检查记忆保留与使用的效果。&quot;,&quot;why&quot;:&quot;它不仅问答案对不对，还把内容层次、输入场景与评测指标分开，适合学习如何设计Memory实验。读者可以同时看到任务覆盖的扩展，以及多选题、合成数据和计时范围带来的限制。&quot;,&quot;boundary&quot;:&quot;采用Findings of ACL 2025正式版与作者仓库固定提交；Findings不写成ACL主会长文。论文的四项评测维度与本教程六问不是一一对应；本页映射说明它能提供哪些证据，不产生六个能力得分。&quot;,&quot;sources&quot;:[&quot;membench&quot;,&quot;membench-paper&quot;,&quot;membench-repo&quot;,&quot;membench-env&quot;,&quot;membench-agent&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2025.findings-acl.989/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;lifecycle&quot;,&quot;exposure&quot;],&quot;selectionEvidence&quot;:&quot;Findings of ACL 2025正式论文，作者来自中国人民大学与华为诺亚方舟实验室；公开了任务构造、指标、基线比较和评分实现。事实/反思内容与参与/观察场景可分别检查，作者报告七种Memory机制的实验。本教程只核查论文与代码，没有下载重计全部发布数据或运行参评系统。&quot;,&quot;limitations&quot;:&quot;数据围绕合成的用户/实体关系图和属性构造，偏好材料利用推荐数据生成，不能代表所有真实对话；附录表7列有Emotion定义，但正文实验主要讨论偏好，Limitations仍将情绪记忆列为待探索方向；不能据类别表就认定它已充分评估情绪记忆。参与场景中的Agent回复预先给定，不检验自主对话策略。多选正确率、检索召回和读写时间应分别报告，也不覆盖完整权限与删除治理。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;多场景、多内容层次的Agent Memory评测&quot;,&quot;authors&quot;:&quot;Haoran Tan、Zeyu Zhang、Chen Ma、Xu Chen、Quanyu Dai、Zhenhua Dong&quot;,&quot;venue&quot;:&quot;Findings of ACL 2025；19336至19352；DOI 10.18653/v1/2025.findings-acl.989&quot;,&quot;artifact&quot;:&quot;正式论文、合成数据生成流程、作者发布数据入口及评分代码&quot;,&quot;version&quot;:&quot;ACL正式版；import-myself/Membench提交f66d8d1028d3f68627d00f77a967b93fbb8694b6；2026-11-12静态核查&quot;},&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;事实记忆包括属性查找、时间理解、知识更新、跨信息推理及回忆Agent预设回复；反思记忆要求从多次低层偏好表达归纳高层偏好。两者分别放入参与和观察场景，形成四类数据。&quot;,&quot;taskProtocol&quot;:&quot;先构造用户与相关实体的关系图，再生成支持问题的证据对话和其他材料。参与场景保留用户话语与预设Agent回复；观察场景只接收消息。逐轮送入材料后提出含时间与选项的问题；容量实验在关键证据之后继续增加历史并检查正确率。噪声生成要求不与任务事实冲突。&quot;,&quot;metrics&quot;:&quot;Memory Accuracy是多选字母与标准答案的一致率；Memory Recall按取回的唯一step ID与标准证据ID的交集大小，除以标准证据ID集合大小计算。Memory Capacity观察历史增长时的正确率曲线；§4.4报告特定配置下MemGPT与Self-Controlled Memory出现陡降，§3.4则保留其他机制未必有阈值的限定。Memory Efficiency报告读写耗时；代码分别计时store和recall，读计时不包含后续答题LLM调用或另一次retri，因此不是完整请求延迟。&quot;,&quot;designMapping&quot;:&quot;Q1由事实/反思任务直接关联，Q4由顺序输入、知识更新题和容量压力直接关联，Q5由证据召回与答题使用关联。Q2主要是被比较Memory采用的表示条件；Q3是人物与参与/观察场景的组织方式。Q6没有相应的身份授权、同意撤回或彻底删除测试。矩阵为教程依据协议所作分析，不是作者声称六轴均衡覆盖。&quot;,&quot;limitations&quot;:&quot;选择题降低了自由措辞评分的歧义，也限定了输出形式，不能直接代表开放问答或真实行动能力。未提供memory_index键时环境返回recall=None；键存在但值为None时get_recall返回0，两种情况须区分。硬件、模型、网络和实现影响耗时；比较时应保留配置及计时边界。&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;MemBench要求保留两层内容：factual memory是人物、事件、地点等可核对属性；正文重点评估的reflective memory是从多次具体表达归纳出的高层偏好，附录对情绪类的定义与实验覆盖还须分开看。它用事实查找、时间理解、知识更新、跨信息推理，以及回忆Agent自身回复的单/多会话题检查前者，用口味、电影或图书等偏好问题检查后者。这是任务需要的信息层次，不要求参评系统必须建两个同名存储区。&quot;,&quot;why&quot;:&quot;记住“喜欢某道菜”与归纳“偏好某种口味”需要不同的信息加工。只测直接复述会遗漏归纳，只测总结又可能放过细节丢失；分别出题可以观察这两种表现是否一致。&quot;,&quot;example&quot;:&quot;论文§3.3用多次喜欢不同菜品的表达说明口味偏好推断；图3还给出直接询问侄女公司名称的事实题。前者要组合证据，后者要准确保留具体名称。若教学中写成“喜欢甜食”，仍需足够一致的菜品证据，不能凭单次选择断言长期偏好。&quot;,&quot;trace&quot;:&quot;《MemBench · Findings正式论文》§3.1、§3.3、图3及附录Table 6/7。事实与反思是作者定义的任务层次；对存储区的解释是教程对任务与实现的区分。&quot;},{&quot;answer&quot;:&quot;评测材料是按轨迹组织的消息、问题、选项、标准答案和证据位置；作者代码通过message_list与QA等字段读取它们。参评Memory可以保留完整历史、近期窗口、检索材料或其他摘要/管理结构，论文比较了不同机制。评测数据的JSON表示与被测系统的内部记忆表示是两回事，标准答案和证据位置属于评分端。&quot;,&quot;why&quot;:&quot;把同一任务交给不同记忆机制，才能研究表示方式的影响。如果提前把正确答案或证据ID送进正常答题输入，测到的就不再是系统自己保存和找回信息的能力。&quot;,&quot;example&quot;:&quot;教学对照：同一条活动更正轨迹，一种实现保留全部消息，另一种只索引抽取出的事实。在同一底模、问题和输入预算下比较答案与召回。QA.ground_truth和target_step_id留在评分端；若另设预先知道正确证据的对照（oracle），应单独标明。&quot;,&quot;trace&quot;:&quot;《MemBench · 轨迹与评分环境》的load_dataset、step；《MemBench · Findings正式论文》§4.1的基线与输入过程；《MemBench · 作者仓库与数据入口》说明数据分组。控制变量与防泄漏要求是教程评测建议，未执行该对照。&quot;},{&quot;answer&quot;:&quot;数据围绕一个用户及其关联的人、事、物、地点组织，再区分participation与observation。参与场景里系统需要记住用户说的话和预先设定的Agent回复，例如曾推荐什么；观察场景只接受用户消息流，不参与对话行动。这个区分改变了哪些来源应进入记忆，但没有建立多个真实租户或多个自主Agent之间的权限评测。&quot;,&quot;why&quot;:&quot;有些问题的答案来自系统自己曾经说过的话。只记录用户输入会让这些题缺少证据；但预设回复又排除了自主回复策略的影响，因此成绩不能直接证明系统在真实开放对话中能持续记住自己的行动。&quot;,&quot;example&quot;:&quot;论文中的参与场景允许询问Agent之前推荐过的内容。教学反例：若只把用户发言写入Memory，推荐记录就丢了。实验接入时应按轨迹重置或隔离记忆，并保留说话人；这是配置要求，不等于已经通过跨用户隐私测试。&quot;,&quot;trace&quot;:&quot;《MemBench · Findings正式论文》§3.1用户关系图、§3.2参与/观察定义、§4.1预设回复；《MemBench · Memory适配与计时源码》response对dict消息保存user与agent两侧内容。&quot;},{&quot;answer&quot;:&quot;材料按时间顺序逐轮送入，过去轮次只能通过Memory重新获得；其中知识更新题要求使用后来修正的事实。容量实验在证据出现后继续增加历史，观察正确率随记忆负担如何变化。§4.4在观察场景Sub-dataset 2、Qwen2.5-7B-Instruct配置的容量实验中报告MemGPT与Self-Controlled Memory出现陡降，作者认为可能与该配置的记忆保留上限有关；这是作者的观察与可能解释。§3.4同时指出其他机制未必出现阈值，检索机制还受召回有效性影响，不能把上述结果推广为所有系统的固定容量。它没有统一测试过期、删除和所有副本擦除。&quot;,&quot;why&quot;:&quot;一次性读完整历史与逐轮维持记忆，对系统提出不同要求。更新题能检查旧值是否继续误导回答，容量曲线能暴露保留和检索在长历史下的退化；两者仍不能替代忘记或删除测试。&quot;,&quot;example&quot;:&quot;论文图3的实际例子：活动原计划持续四天，后来改成一天，最终问题应按更正值回答。另加与该事实不冲突的噪声，是考察长历史压力；若加入恶意矛盾消息或要求删除旧值，则成为额外实验，不能算作原有噪声协议。&quot;,&quot;trace&quot;:&quot;《MemBench · Findings正式论文》图3 Knowledge Update、§3.4 Capacity、§4.1顺序输入与无事实冲突的噪声、§4.4容量实验；《MemBench · 轨迹与评分环境》的step/step_cap。容量是行为曲线，不是数据库字节上限。&quot;},{&quot;answer&quot;:&quot;问题、当前时间和选项交给Agent后，适配层先调用Memory.recall得到上下文，再让答题模型选出答案。环境按选择字母是否等于ground_truth评分；若提供检索step ID，还计算证据召回。因此能分别观察“有没有取回证据”和“拿到材料后是否答对”。代码的读计时只包住recall，不包含答题LLM和另外的retri调用。&quot;,&quot;why&quot;:&quot;答错可能发生在存储、检索或推理阶段。把召回与答案分开更有助于排查；同时读耗时的范围必须讲清，否则容易把局部检索时间误报成用户等待整个回答的时间。&quot;,&quot;example&quot;:&quot;教学算例：标准证据是步骤2和7，系统返回2、2、9，去重后只命中一个证据，召回为1/2。即便猜对选项，也不能据此说证据完整。环境没收到memory_index键时recall为None；收到该键但值为None时返回0。作者当前适配器在答题时总带这个键，因此其retri返回None会被计为0，不能写成未计分。&quot;,&quot;trace&quot;:&quot;《MemBench · 轨迹与评分环境》的get_recall、step；《MemBench · Memory适配与计时源码》的response先recall再构造prompt，随后另取retri。指标依据为《MemBench · Findings正式论文》§3.4。1/2是公式教学算例，不是参评成绩。&quot;},{&quot;answer&quot;:&quot;评测方控制数据生成、预设回复、噪声、选项与评分规则，参评方实现Memory并配置模型。公开协议没有把授权读取、用户同意、恶意写入或删除传播设为独立任务。论文还说明评测方法局限于结构化数据的记忆评估；附录表7虽列有Emotion定义，Limitations仍将情绪记忆列为待探索方向，不能据表格名称认定已有充分评测。数据来源和伦理声明是作者说明，不等于本教程独立验证了所有材料的使用权。&quot;,&quot;why&quot;:&quot;能准确回答偏好问题的系统仍可能泄露别人的偏好。描述评测控制了什么、漏测了什么，可以避免把一个较全面的记忆任务集误当成生产安全认证，也便于设计后续互补评测。&quot;,&quot;example&quot;:&quot;教学扩展：若想测试“用户B不得读取用户A的饮食偏好”，必须加入身份、访问策略和越权探针，并单列违规率；若测试撤回，还要说明哪些派生记忆应被移除。原MemBench的正确率与召回率不能替代这两类指标。&quot;,&quot;trace&quot;:&quot;《MemBench · Findings正式论文》§3至§4、Limitations与Ethics Statement；《MemBench · 轨迹与评分环境》的实际评分字段。未覆盖项是依据这些公开协议做出的范围判断，不宣称参评Memory系统自身不具备治理能力。&quot;}]},{&quot;id&quot;:&quot;locomo&quot;,&quot;title&quot;:&quot;LoCoMo&quot;,&quot;date&quot;:&quot;2024-08 · ACL Long Papers&quot;,&quot;summary&quot;:&quot;用持续数月的多会话对话，检查模型能否找回细节、连接事件并维持对话一致性。正式版包含问答、事件总结和多模态对话生成三类任务，本页区分论文协议与公开评分代码。&quot;,&quot;why&quot;:&quot;它把长期记忆的作用落实到有时间线、有说话人、有证据位置的任务，适合接在记忆机制之后学习。它提供可检查的任务和评分协议，同时让读者看到长对话能力与权限、删除等要求的区别。&quot;,&quot;boundary&quot;:&quot;按ACL 2024正式论文与作者10对话发布集解释。README Note1所述早期50段对话不混入正式版10段统计；能力测量与六问的设计描述不是一一对应，分数也不能说明数据库、权限或删除是否合格。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;locomo-metadata&quot;,&quot;locomo-paper&quot;,&quot;locomo-readme&quot;,&quot;locomo-data&quot;,&quot;locomo-eval&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://aclanthology.org/2024.acl-long.747/&quot;,&quot;coverage&quot;:[&quot;content&quot;,&quot;exposure&quot;],&quot;selectionEvidence&quot;:&quot;ACL 2024长文，作者来自UNC Chapel Hill、USC和Snap；有正式论文、任务数据、证据dialog ID和QA评分实现。Table5与本地解析发布JSON均为10段对话、1,986个QA；这里只核对数据结构与计数，未运行任何参评模型。&quot;,&quot;limitations&quot;:&quot;对话主要由模型生成、再由人工编辑；10段长对话不能代表所有真实用户和专业场景。QA自动评分受措辞与拒答规则影响，图片只发布链接/描述；固定提交README的事件总结、多模态评估代码仍写Coming soon。无完整权限、物理删除、在线成本或生产可靠性评估。&quot;,&quot;next&quot;:&quot;culture&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;长程对话Memory数据集与评测协议&quot;,&quot;authors&quot;:&quot;Adyasha Maharana、Dong-Ho Lee、Sergey Tulyakov、Mohit Bansal、Francesco Barbieri、Yuwei Fang&quot;,&quot;venue&quot;:&quot;ACL 2024 Long Papers；13851–13870&quot;,&quot;artifact&quot;:&quot;ACL论文、locomo10.json、QA/RAG评估代码&quot;,&quot;version&quot;:&quot;ACL正式版；仓库 3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376；数据只读统计&quot;},&quot;evaluation&quot;:{&quot;abilities&quot;:&quot;问答分单跳841、多跳282、时间推理321、开放域知识96、对抗/不可回答446，共1,986题；此外还有事件总结与多模态对话生成。类别数量是数据分布，不是六问数量。&quot;,&quot;taskProtocol&quot;:&quot;生成带人格与时间事件图的长对话，再由人工修订并添加答案与证据。QA比较截断上下文、长上下文及RAG；RAG可用原对话、observation或session summary。事件总结对照人物事件标注；多模态生成比较预测的多模态后续对话与数据集真实多模态对话的对齐程度，用MMRelevance及文本生成指标评价。&quot;,&quot;metrics&quot;:&quot;QA论文报告answer F1与RAG evidence recall@k；发布代码对单跳/时间/开放域使用词归一化与词干化F1，多跳按子答案计算，对抗题按拒答字符串给0/1。事件总结在论文Table4同时报告ROUGE和改造后的FactScore precision/recall/F1；§4.2说明词面相似度不足以判断事实性，因此还需后者；多模态任务用MMRelevance及文本生成指标。不同指标不能混为统一Memory总分。&quot;,&quot;designMapping&quot;:&quot;本页矩阵标出Q1与Q5的直接任务关联：Q1关注是否保留支持任务的内容，Q5在RAG协议中可检查证据是否召回。Q4通过跨会话时间与事件连接间接施压，但不等于测试了写入、更新、过期和删除的全过程。Q2是被比较系统采用的表示条件，Q3是对话/说话人的组织边界；Q6仅触及不知道时拒答，未检验授权、同意和物理删除。&quot;,&quot;limitations&quot;:&quot;论文能力与公开脚本完备度分开。不能把无检索context时评分代码默认填的recall=1当成实际命中；也不能把后来改用LLM judge、不同类别子集或不同底模的“LoCoMo分数”直接等同于原论文指标。&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;LoCoMo要求系统保留能支撑回答和连贯对话的信息：人物、偏好、经历、时间关系，以及对话中的视觉内容。QA五类分别检查单会话事实、跨会话组合、时间推理、对话事实与外部常识结合、以及信息不足时拒答。事件总结进一步要求还原重要事件，不能只记住零散关键词。这里描述的是任务需求，并未强制参评系统采用同一种Memory分类。&quot;,&quot;why&quot;:&quot;只测能否复述一句话，会漏掉跨会话连接和不知道时拒答。反过来，开放域题还依赖底模常识，因此答对多少并不是一个纯粹的“存了多少事实”指标，需要按任务类别阅读。&quot;,&quot;example&quot;:&quot;发布数据里有“Melanie何时画了一幅日出”的时间题，标注答案是2022，证据指向D1:12。读者可以沿证据核对时间线；这是实际数据示例。若把问题改成原对话没有提到的地点，则是另一个教学反例，不能拿原答案猜。&quot;,&quot;trace&quot;:&quot;《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》 §4.1–4.3；《LoCoMo · locomo10.json》首个sample的qa与evidence字段。Table5及本地解析核对类别计数；实际题与教学反例已分开。&quot;},{&quot;answer&quot;:&quot;数据集以JSON组织原对话、生成的observations、会话摘要、事件总结标注和QA。对参评Memory的物理载体没有唯一要求：论文比较截断上下文、长上下文和检索增强，并在RAG中分别用原对话、observation或session summary作检索材料。重要区别是event_summary属于评测金标准，不能混作正常系统已经知道的记忆输入。&quot;,&quot;why&quot;:&quot;用同一批对话更换记忆表示，才能观察信息加工怎样影响检索与回答。但如果把标准答案或金标准事件图直接塞给模型，测到的是答案泄漏后的表现，不能说明Memory设计有效。&quot;,&quot;example&quot;:&quot;教学对照：一次把原始多轮对话建索引，另一次只索引每轮抽出的observations，保持问答模型和问题不变，再看证据召回与答案变化。评测用的qa.answer、qa.evidence和event_summary保留给评分端；若使用oracle条件必须单独标明。&quot;,&quot;trace&quot;:&quot;《LoCoMo · 发布数据说明 / 版本差异》 Data字段和Note3；《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》 §5的三类RAG材料及§4.2金标准。此处控制变量和防泄漏要求是教程的评测推导，未声称本教程运行了该对照。&quot;},{&quot;answer&quot;:&quot;基本单位是两个虚拟说话人的一段长期对话，内部由带时间戳的多个session和turn组成。正式发布集有10段对话；每条turn带speaker和dia_id，问答证据指回这些位置。因而它能检查系统是否分清人物与会话，但不是多租户、多组织或多个Agent各自拥有权限记忆的完整测试。&quot;,&quot;why&quot;:&quot;同一事实属于谁、发生在哪次会话，会影响答案是否正确。把所有对话无标识地混在一起，即使找到了相似句子也可能张冠李戴；这类归属问题仍不能替代访问授权测试。&quot;,&quot;example&quot;:&quot;教学例子：Alice和Bob都谈到搬家，答题时既要保留说话人，又要找到对应时间。正式实验接入独立Memory服务时，应按sample隔离数据并保留speaker信息，避免从另一段对话取到同名事实；这是一条实验配置建议。&quot;,&quot;trace&quot;:&quot;《LoCoMo · 发布数据说明 / 版本差异》的conversation/session_\u003cnum\u003e/speaker/dia_id；《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》 Appendix B Table5；《LoCoMo · locomo10.json》只读检查。人物归属与租户安全的差异是基于协议范围的推论。&quot;},{&quot;answer&quot;:&quot;对话跨越多个带日期的session，任务要求把早期事件和后来谈话联系起来，识别时间与因果关系。正式版平均约600轮、16K tokens，最长32个session；Table5更精确地给出平均27.2个session和16,618.1 tokens。它主要衡量已有长历史被保留和利用后的效果，没有为通用Memory规定何时写入、如何纠正冲突、何时过期或怎样物理删除的统一测试协议。&quot;,&quot;why&quot;:&quot;长时间跨度会暴露遗忘旧事件和连接错误，但看到一份完整历史后答题，与在实时交互中逐步更新记忆不同。必须说明自己是离线一次导入，还是按session顺序写入，否则同名benchmark下的系统负担并不相同。&quot;,&quot;example&quot;:&quot;教学例子：早期说受伤，后期说正在康复，正确理解需要把两个session连起来。若另外测试“删除受伤记录后应不再透露”，那是新增删除任务，不能把原来的时间推理得分解释为已经验证了删除能力。&quot;,&quot;trace&quot;:&quot;《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》摘要、§3–4与Appendix B Table5；《LoCoMo · 发布数据说明 / 版本差异》 Note1说明从早期50段中筛出10段。README Note1记录初始50段筛成10段；本页明确使用ACL正式版。在线更新与删除缺口为协议审计判断。&quot;},{&quot;answer&quot;:&quot;QA系统可直接读有限或较长上下文，也可先检索相关材料再回答。论文为QA标注了证据turn ID，因此在有检索上下文记录的RAG条件下，能把“证据是否召回”和“答案是否正确”分开看。发布代码按类别评分：多数题用词级F1，多跳按子答案处理，对抗题检查特定拒答表达。高词重合分不自动证明模型推理过程可靠。&quot;,&quot;why&quot;:&quot;检索失败和读到后仍答错需要不同修复。两种指标有助于定位问题；评分实现又决定了能识别哪些正确回答，所以报告分数时必须说明类别范围、底模、prompt、输入预算和评分器。&quot;,&quot;example&quot;:&quot;教学诊断：答案错误且证据没进检索结果，先检查索引和召回；证据已进入prompt仍答错，再检查时间理解或生成。另一个陷阱是代码在没有_context字段或没有evidence标注时把recall填成1，这只是实现默认值，不能报告成100%真实检索命中。&quot;,&quot;trace&quot;:&quot;《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》 §4.1、§5、Table2–3；《LoCoMo · QA 评分实现》的f1_score、f1与eval_question_answering，尤其category5和_context分支。本教程只做静态核查，未产生模型得分。&quot;},{&quot;answer&quot;:&quot;评测方控制对话生成、人工编辑、问答标注及评分协议；参评系统控制自己的记忆读写实现。对抗题检查信息不足时能否拒答，与治理有有限交集，但没有模拟多用户权限、恶意记忆写入、同意撤回和删除传播。数据许可与图片来源也属于使用边界：论文Appendix B.2声明拟以CC BY-NC 4.0发布数据；这是论文的许可声明，本页未另行核验发布包许可，仓库仅给图片URL、描述和检索词，不提供图片本体。&quot;,&quot;why&quot;:&quot;能拒答未知问题有助于减少编造，却不能说明系统会拒绝未授权读取。把这两种保证混在一起，会错误扩大benchmark的安全覆盖；评测材料可下载也不等于所有图片权利都已获得。&quot;,&quot;example&quot;:&quot;教学反例：系统能回答“资料未提及”，仍可能把用户A的真实记忆泄露给用户B。若要检验这点，需要额外构造身份、访问策略和跨用户探针，并单独报告违规率；原LoCoMo的adversarial题不能代替这个实验。&quot;,&quot;trace&quot;:&quot;《LoCoMo · ACL 2024 正式论文 §3–8 / Appendix B–C》 §4.1 Adversarial、§8 Limitations、印刷页13865 Appendix B.2许可声明；《LoCoMo · 发布数据说明 / 版本差异》 Note2及代码发布状态。权限与删除的未覆盖项根据公开协议判断，不宣称参评系统本身不支持这些能力。&quot;}]}],&quot;culture&quot;:[{&quot;id&quot;:&quot;severance&quot;,&quot;title&quot;:&quot;Severance&quot;,&quot;date&quot;:&quot;2022&quot;,&quot;summary&quot;:&quot;影视作品以记忆隔离设定讨论同一主体在不同工作/生活空间的记忆边界。&quot;,&quot;why&quot;:&quot;它帮助读者思考范围、主体和隔离拓扑。&quot;,&quot;boundary&quot;:&quot;此条目暂作文化线索，正式页面需补权威作品来源和剧情范围。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;severance&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityN
