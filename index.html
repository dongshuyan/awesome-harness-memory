  flex: none;

}

.text-warning,
.text-destructive {

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  globalThis.__tutorialInitialRoute = typeof initialGlobals.routeHash === &quot;string&quot; ? initialGlobals.routeHash : &quot;&quot;;
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;route-change&quot; &amp;&amp; typeof data.hash === &quot;string&quot;) {
              globalThis.dispatchEvent(new CustomEvent(&quot;codex-route-change&quot;, { detail: { hash: data.hash } }));
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

text&quot;:{&quot;zh&quot;:&quot;上下文记忆&quot;,&quot;en&quot;:&quot;Context Memory&quot;,&quot;kind&quot;:&quot;常见工程叫法 · 本页按“上下文续接”解释&quot;,&quot;def&quot;:&quot;当对话越来越长、模型窗口装不下全部历史时，保住继续工作所需的信息，并在后续调用中重新提供。&quot;,&quot;what&quot;:&quot;可能包含历史事件、关键事实、任务进度和必要的操作说明。&quot;,&quot;when&quot;:&quot;长对话、上下文压缩、窗口重置或需要找回前文时。&quot;,&quot;use&quot;:&quot;窗口变化后，仍知道前面讨论了什么、现在应接着做什么。&quot;,&quot;example&quot;:&quot;你写报告写到一半，桌面已经堆满资料。先写一张交接便条：“已完成第一章，下一步核对图表”，清理桌面后，再凭便条继续。&quot;,&quot;steps&quot;:[&quot;历史越来越长&quot;,&quot;摘要或外部笔记&quot;,&quot;读回必要信息&quot;],&quot;boundary&quot;:&quot;这里是一种用途入口，不是新的内容类型。下方相关方法也不表示每个系统都同时采用。&quot;,&quot;methods&quot;:&quot;摘要压缩（Compaction）、外部笔记（Note-taking）、按需检索（Retrieval）。&quot;,&quot;relation&quot;:&quot;上下文续接 → 主要关联工作记忆的管理。它也可以从长期记忆中取回所需的事实或经历。&quot;,&quot;sources&quot;:[&quot;context&quot;,&quot;microsoft-memory&quot;,&quot;aws-agent-memory&quot;,&quot;coala&quot;],&quot;resources&quot;:[&quot;pi&quot;,&quot;codex&quot;,&quot;claude-code&quot;,&quot;claude-mem&quot;,&quot;aider&quot;],&quot;enDefinition&quot;:&quot;Here, Context Memory means preserving and recovering the information needed to continue when conversation history exceeds the model window.&quot;,&quot;evidenceLevel&quot;:&quot;中&quot;,&quot;standardization&quot;:&quot;常见工程入口，但“Context Memory”不是一套统一的标准分类名称&quot;,&quot;evidenceSummary&quot;:&quot;“working memory / active context / session memory”在 Microsoft、AWS、Anthropic 和研究综述中有相近用法；这里把 Context Memory 作为窗口受限后的续接问题入口，而不是声称它是独立的认知类型。&quot;},&quot;workspace&quot;:{&quot;zh&quot;:&quot;工作区记忆&quot;,&quot;en&quot;:&quot;Workspace Memory&quot;,&quot;kind&quot;:&quot;工程叫法 · 按项目或任务组织&quot;,&quot;def&quot;:&quot;围绕一个项目或任务保存资料，使下一次打开工作区时，能够接着原来的进度工作。&quot;,&quot;what&quot;:&quot;目标、进度、未决问题、项目事实、工作方法与历史记录。&quot;,&quot;when&quot;:&quot;任务暂停恢复、换会话、跨天工作或协作交接时。&quot;,&quot;use&quot;:&quot;知道做到哪一步、为什么这样做，以及下一步做什么。&quot;,&quot;example&quot;:&quot;一个实验项目文件夹里有进度表、实验日志、设备信息和操作手册。它们服务同一项目，但分别保存状态、经历、事实和方法。&quot;,&quot;steps&quot;:[&quot;任务或项目&quot;,&quot;分门别类记录&quot;,&quot;恢复并继续&quot;],&quot;boundary&quot;:&quot;工作区说明资料围绕哪个项目组织；工作记忆说明当前正在使用的信息。工作区资料也可以长期保存。&quot;,&quot;methods&quot;:&quot;进度笔记、项目资料、检查点（Checkpoint，保存可恢复的执行状态）。具体系统的能力需分别核查。&quot;,&quot;relation&quot;:&quot;工作区 → 可能同时包含当前状态、经历、事实和方法。高亮表示可能涉及，不表示每个工作区都具备全部类型。&quot;,&quot;sources&quot;:[&quot;microsoft-memory&quot;,&quot;aws-agent-memory&quot;,&quot;agentscope-harness&quot;,&quot;cline&quot;],&quot;resources&quot;:[&quot;cline&quot;,&quot;deep-agents&quot;,&quot;letta-code&quot;,&quot;openai-agents-sdk&quot;],&quot;enDefinition&quot;:&quot;Workspace Memory organizes goals, progress, records, and methods around a task or project so work can continue later.&quot;,&quot;evidenceLevel&quot;:&quot;中低&quot;,&quot;standardization&quot;:&quot;多种 Harness / 产品使用的工程叫法；尚未发现把它与 Context、Long-term 固定并列的权威统一分类&quot;,&quot;evidenceSummary&quot;:&quot;“workspace”在工程文档中常表示项目/任务的组织边界，也常被写成 online workspace、workspace context 或 workspace memory。它可以承载多种内容，因此不能被当作单一内容类型。&quot;},&quot;longterm&quot;:{&quot;zh&quot;:&quot;长期记忆&quot;,&quot;en&quot;:&quot;Long-term Memory&quot;,&quot;def&quot;:&quot;在 CoALA 架构中，保存可供后续取回的经历、知识和做法，与当前活跃的工作记忆分工。&quot;,&quot;what&quot;:&quot;情景、语义和程序性记忆；内容不限于用户偏好。&quot;,&quot;when&quot;:&quot;需要利用此前的经验或已积累的知识时。&quot;,&quot;use&quot;:&quot;让已有的信息和能力在后续任务中继续发挥作用。&quot;,&quot;example&quot;:&quot;你的笔记本里既有上周实验的记录，也有学到的公式和实验操作方法。它们可以长期保留，做题时只取出需要的部分。&quot;,&quot;steps&quot;:[&quot;积累资料&quot;,&quot;需要时取回&quot;,&quot;支持当前任务&quot;],&quot;boundary&quot;:&quot;“长期”不对应统一天数。LangChain 还使用跨线程范围区分长短期；具体系统应注明自己的定义。&quot;,&quot;kind&quot;:&quot;常见术语 · 按当前研究框架对照&quot;,&quot;methods&quot;:&quot;持久保存、按需检索、更新和纠错；“用户画像”只是其中一种内容。&quot;,&quot;relation&quot;:&quot;长期记忆 → 在 CoALA 中，下分情景、语义和程序性记忆。切换研究框架后，应按该来源的定义理解。&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;microsoft-memory&quot;,&quot;aws-agent-memory&quot;,&quot;langchain&quot;],&quot;resources&quot;:[&quot;letta&quot;,&quot;mem0&quot;,&quot;memobase&quot;,&quot;chatgpt-memory&quot;],&quot;enDefinition&quot;:&quot;The meani d&quot;:&quot;working-context&quot;,&quot;zh&quot;:&quot;当前工作集与上下文&quot;,&quot;en&quot;:&quot;Working set \u0026 context management&quot;,&quot;definition&quot;:&quot;为当前问题选择历史、摘要、目标或检索结果，再把需要的内容送入模型。&quot;,&quot;what&quot;:&quot;为当前问题选择历史、摘要、目标或检索结果，再把需要的内容送入模型。&quot;,&quot;when&quot;:&quot;模型窗口有限、任务仍在继续时。&quot;,&quot;purpose&quot;:&quot;保住当前目标、必要历史和下一步。&quot;,&quot;example&quot;:&quot;桌上只放当前实验要用的几页；完整记录保存在文件夹里，需要时再拿出来。&quot;,&quot;boundary&quot;:&quot;保存在窗口外的历史，尚未读入时不属于本次模型输入；工作记忆也不能简单等同于一次调用的上下文窗口。&quot;,&quot;resources&quot;:[&quot;langgraph&quot;,&quot;memoryos&quot;,&quot;letta-code&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;langgraph:0&quot;,&quot;memoryos:0&quot;],&quot;legacy&quot;:[&quot;content:6&quot;],&quot;enDefinition&quot;:&quot;History, summaries, goals, or retrieved information selected for the current problem, with the needed subset supplied to the model.&quot;},{&quot;id&quot;:&quot;events&quot;,&quot;zh&quot;:&quot;经历与事件&quot;,&quot;en&quot;:&quot;Episodic memory / Event records&quot;,&quot;definition&quot;:&quot;记录某次对话、任务、观察、工具调用及结果。&quot;,&quot;what&quot;:&quot;记录某次对话、任务、观察、工具调用及结果。&quot;,&quot;when&quot;:&quot;需要回顾某次对话、工具调用或任务过程时。&quot;,&quot;purpose&quot;:&quot;保留可追溯的经历，供回顾和案例参考。&quot;,&quot;example&quot;:&quot;“昨天用仪器 A 测了三次，第二次读数异常。”记录的是一次经历。&quot;,&quot;boundary&quot;:&quot;保留细节有助于追溯，但不能假设所有历史都能放进一次模型输入。&quot;,&quot;resources&quot;:[&quot;generative-agents&quot;,&quot;graphiti&quot;,&quot;openai-agents-sdk&quot;,&quot;claude-mem&quot;,&quot;pi&quot;,&quot;mastra&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;generative-agents:0&quot;,&quot;graphiti:0&quot;],&quot;legacy&quot;:[&quot;content:0&quot;],&quot;enDefinition&quot;:&quot;Records of particular conversations, tasks, observations, tool calls, and their results.&quot;},{&quot;id&quot;:&quot;facts&quot;,&quot;zh&quot;:&quot;事实与用户偏好&quot;,&quot;en&quot;:&quot;Semantic memory / Facts \u0026 preferences&quot;,&quot;definition&quot;:&quot;提取可供后续交互使用的事实、属性与偏好。&quot;,&quot;what&quot;:&quot;提取可供后续交互使用的事实、属性与偏好。&quot;,&quot;when&quot;:&quot;新会话需要沿用背景知识或用户偏好时。&quot;,&quot;purpose&quot;:&quot;减少重复询问，为决策提供可更新的事实。&quot;,&quot;example&quot;:&quot;“小林喜欢用中文看解释”是偏好；“昨天小林提了这个要求”是事件。&quot;,&quot;boundary&quot;:&quot;事实可能改变；用户画像本身也不是使用这些信息的授权。&quot;,&quot;resources&quot;:[&quot;mem0&quot;,&quot;memorybank&quot;,&quot;google-agent-platform-memory-bank&quot;,&quot;codex&quot;,&quot;memobase&quot;,&quot;honcho&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;mem0:0&quot;,&quot;memorybank:0&quot;],&quot;legacy&quot;:[&quot;content:1&quot;],&quot;enDefinition&quot;:&quot;Facts, attributes, and preferences extracted for use in later interactions.&quot;},{&quot;id&quot;:&quot;procedures&quot;,&quot;zh&quot;:&quot;步骤与流程&quot;,&quot;en&quot;:&quot;Procedural memory / Procedures&quot;,&quot;definition&quot;:&quot;保存“这件事怎么做”的步骤、操作说明和可执行流程。&quot;,&quot;what&quot;:&quot;保存“这件事怎么做”的步骤、操作说明和可执行流程。&quot;,&quot;when&quot;:&quot;需要复用已知操作步骤或技能时。&quot;,&quot;purpose&quot;:&quot;让做事方法能够再次被调用。&quot;,&quot;example&quot;:&quot;实验前先校准仪器再检查标签，是可复用流程；昨天执行过它是事件。&quot;,&quot;boundary&quot;:&quot;流程是否适用取决于环境和条件；保存流程不保证执行正确。&quot;,&quot;resources&quot;:[&quot;deep-agents&quot;,&quot;online-memory-under-token-budgets&quot;,&quot;hermes&quot;,&quot;openviking&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;deep-agents:0&quot;,&quot;online-memory-under-token-budgets:0&quot;],&quot;legacy&quot;:[&quot;content:2&quot;],&quot;enDefinition&quot;:&quot;Reusable steps, instructions, and workflows describing how to carry out a task.&quot;},{&quot;id&quot;:&quot;experience&quot;,&quot;zh&quot;:&quot;可复用经验与策略&quot;,&quot;en&quot;:&quot;Experiential memory / Strategies&quot;,&quot;definition&quot;:&quot;从尝试结果中归纳以后可以参考的做法和适用条件。&quot;,&quot;what&quot;:&quot;从尝试结果中归纳以后可以参考的做法和适用条件。&quot;,&quot;when&quot;:&quot;过去任务中有能用于新任务的案例、策略或技能时。&quot;,&quot;purpose&quot;:&quot;积累经验并保留适用条件。&quot;,&quot;example&quot;:&quot;一次实验失败后总结“先备份原始数据”，下次遇到同类任务时参考。&quot;,&quot;boundary&quot;:&quot;反馈质量、额外尝试和迁移条件会影响收益。&quot;,&quot;resources&quot;:[&quot;reflexion&quot;,&quot;reasoningbank&quot;,&quot;hindsight&quot;,&quot;letta-code&quot;],&quot;sources&quot;:[&quot;survey&quot;,&quot;langchain&quot;,&quot;reflexion:0&quot;,&quot;reasoningbank:0&quot;],&quot;legacy&quot;:[&quot;content:3&quot;],&quot;enDefinition&quot;:&quot;Lessons and strategies drawn from previous attempts, together with conditions under which they may be useful.&quot;},{&quot;id&quot;:&quot;relations&quot;,&quot;zh&quot;:&quot;关系与时间事实&quot;,&quot;en&quot;:&quot;Relational \u0026 temporal facts&quot;,&quot;definition&quot;:&quot;记录谁与什么有关，以及一个事实在什么时候成立。&quot;,&quot;what&quot;:&quot;记录谁与什么有关，以及一个事实在什么时候成立。&quot;,&quot;when&quot;:&quot;需要区分关系和随时间变化的事实时。&quot;,&quot;purpose&quot;:&quot;让事实带上主体、关系与有效时间。&quot;,&quot;example&quot;:&quot;“小林在三月负责项目 A，四月交给小周。”关系和时间说明了事实适用范围。&quot;,&quot;boundary&quot;:&quot;用图表示是一种实现选择；关系存在不证明因果。&quot;,&quot;resources&quot;:[&quot;graphiti&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;graphiti:0&quot;],&quot;legacy&quot;:[&quot;content:4&quot;],&quot;enDefinition&quot;:&quot;Information about relationships and the periods during which a fact holds.&quot;},{&quot;id&quot;:&quot;rules&quot;,&quot;zh&quot;:&quot;规则与约束&quot;,&quot;en&quot;:&quot;Instructions / Constraints&quot;,&quot;definition&quot;:&quot;保存用户约定、任务限制或组织规则，供后续工作参考。&quot;,&quot;what&quot;:&quot;保存用户约定、任务限制或组织规则，供后续工作参考。&quot;,&quot;when&quot;:&quot;有需要沿用的行为要求或项目约定时。&quot;,&quot;purpose&quot;:&quot;为后续工作提供明确的规则。&quot;,&quot;example&quot;:&quot;“只读原始数据，清洗结果另存。”是约束；把它记下来并不自动限制文件权限。&quot;,&quot;boundary&quot;:&quot;保存了规则，不代表已经强制执行；权限与审计另见治理专题。&quot;,&quot;resources&quot;:[&quot;letta-code&quot;,&quot;collabmem&quot;,&quot;claude-code&quot;,&quot;gemini-cli&quot;,&quot;cline&quot;],&quot;sources&quot;:[&quot;coala&quot;,&quot;langchain&quot;,&quot;letta-code:0&quot;,&quot;collabmem:0&quot;],&quot;legacy&quot;:[&quot;content:5&quot;],&quot;enDefinition&quot;:&quot;User agreements, task constraints, and organizational rules retained for later work.&quot;}]}}&lt;/script&gt;
&lt;script type=&quot;application/json&quot; id=&quot;tutorial-data&quot;&gt;{&quot;version&quot;:1,&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;title&quot;:&quot;Agent Memory 教程&quot;,&quot;intro&quot;:&quot;从六个问题建立共同观察方法，再读 Research、工程、Benchmark 和文化类比。&quot;,&quot;comparisonCategories&quot;:[&quot;research&quot;,&quot;engineering&quot;,&quot;benchmarks&quot;,&quot;culture&quot;],&quot;questions&quot;:[{&quot;id&quot;:&quot;content&quot;,&quot;short&quot;:&quot;内容角色&quot;,&quot;title&quot;:&quot;Q1 · 保存的是什么？&quot;,&quot;en&quot;:&quot;Content role&quot;,&quot;what&quot;:&quot;识别 Memory 里保存的内容和它承担的认知或任务角色：事件、事实、偏好、流程、经验、关系、规则，或当前任务的派生材料。&quot;,&quot;why&quot;:&quot;同一段对话既可以留下原始事件，也可以被提炼成事实或流程。若不先分清内容角色，读者很容易把“保存了什么”和“放在哪里”混成一个问题。&quot;,&quot;how&quot;:&quot;面对新系统，先找写入对象的 schema、示例记录和作者对用途的描述；记录内容粒度、来源、是否会被提炼，以及它是否会改变后续决策。&quot;,&quot;example&quot;:&quot;“上周五开过会”是事件；“用户偏好上午开会”是事实/偏好；“会前先发议程”是流程。三者可以来自同一条消息，却有不同的更新和失效方式。&quot;,&quot;evidence&quot;:&quot;CoALA 将工作记忆与 episodic、semantic、procedural memory 放进认知架构；Foundation Agent Memory 摘要同时列出感觉、工作、情景、语义、程序性机制；工程文档也分别描述消息、用户事实、经验或规则。这里把它们抽象成跨系统的内容问题，是综合推断。&quot;,&quot;check&quot;:&quot;能否举例说明一个事件怎样被提炼成事实或流程？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;storage-experience&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;substrate&quot;,&quot;short&quot;:&quot;载体与表示&quot;,&quot;title&quot;:&quot;Q2 · 它以什么形式、放在哪里？&quot;,&quot;en&quot;:&quot;Substrate and representation&quot;,&quot;what&quot;:&quot;区分内容语义与承载方式：文本、结构化字段、向量索引、图、文件、数据库、检查点、参数或模型内部状态。&quot;,&quot;why&quot;:&quot;同一事实可以同时存在于原始日志、摘要字段、向量索引和关系图中。把表示方式误当成记忆类型，会把“图”误解成一种内容，把“数据库”误解成一种认知功能。&quot;,&quot;how&quot;:&quot;分别记录原始载体、派生表示、索引方式和物理/逻辑位置；再确认哪些是权威记录，哪些只是为了检索或恢复而生成的副本。&quot;,&quot;example&quot;:&quot;“项目使用 Python 3.12”可以写在 MEMORY.md，也可以抽成 JSON 字段并建立向量索引；索引帮助找到它，却不自动保证它是最新或有权被使用。&quot;,&quot;evidence&quot;:&quot;Forms–Functions–Dynamics 与多篇 Agent Memory survey 都把形式/承载与功能、动态分开讨论；LangGraph 将 state/checkpoint/store 分开；Graphiti 以时序知识图组织实体、事实和来源。由此可见载体是独立观察角度，但不等于内容分类。&quot;,&quot;check&quot;:&quot;能否指出一个系统的权威记录和检索索引分别是什么？&quot;,&quot;sources&quot;:[&quot;survey&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;langgraph&quot;,&quot;graphiti&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;scope&quot;,&quot;short&quot;:&quot;主体与范围&quot;,&quot;title&quot;:&quot;Q3 · 这份 Memory 归谁、服务谁、谁可以共享？&quot;,&quot;en&quot;:&quot;Subjects, scope, and sharing topology&quot;,&quot;what&quot;:&quot;确定 Memory 围绕哪个主体或边界组织：一次线程、任务、项目、用户、Agent、团队、租户或环境；同时记录共享和隔离关系。&quot;,&quot;why&quot;:&quot;“跨会话”只说明时间上持续，不说明它属于谁；按用户分组也不自动等于权限隔离。主体、范围和共享拓扑决定了同一条记忆会被哪些后续任务看到。&quot;,&quot;how&quot;:&quot;从 namespace、thread/user/project ID、tenant 配置、共享接口和权限文档中核对范围；把归属、可见性和授权分开记录。&quot;,&quot;example&quot;:&quot;项目团队的会议摘要可以属于项目空间、供多个 Agent 读取；用户的饮食偏好只应在用户授权的范围内使用。两者都可能跨会话保留，但共享拓扑不同。&quot;,&quot;evidence&quot;:&quot;CoALA 以单个语言 Agent 的认知架构为主要主体；工程系统的官方文档普遍用 thread、user、namespace、tenant 或 team 组织数据；COLLABMEM 等评测把协作共享作为单独问题。它们共同支持把主体与范围列为独立问题。&quot;,&quot;check&quot;:&quot;能否区分“属于谁”“谁看得到”“谁有权使用”三个句子？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;foundation-agent-taxonomy-arxiv&quot;,&quot;collabmem&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;lifecycle&quot;,&quot;short&quot;:&quot;生命周期&quot;,&quot;title&quot;:&quot;Q4 · 它如何形成、更新、失效和遗忘？&quot;,&quot;en&quot;:&quot;Lifecycle and dynamics&quot;,&quot;what&quot;:&quot;追踪写入、提取、反思、合并、修订、冲突解决、过期、删除和遗忘的全过程。&quot;,&quot;why&quot;:&quot;Memory 不是只写一次的静态仓库。旧事实会失效，摘要会丢失细节，经验可能被反思更新；“不再检索”与“已经删除”也不是同一件事。&quot;,&quot;how&quot;:&quot;画出从事件到长期记录的状态变化，标出触发主体、版本、冲突策略、TTL/删除语义和失败后的回滚或保留。&quot;,&quot;example&quot;:&quot;用户把会议时间从上午改为下午：系统可能追加新事实、覆盖旧字段、保留带时间戳的历史，或在冲突时让 Agent 决定。只有查看更新和删除语义，才能知道下一次会读到什么。&quot;,&quot;evidence&quot;:&quot;Storage→Reflection→Experience 把记忆演化描述为存储、反思和经验形成；多项 benchmark 测试新增信息、时间变化、冲突解决或长期交互；官方服务文档也把写入策略、更新和保留作为配置。&quot;,&quot;check&quot;:&quot;能否说明一条错误记忆从发现到停止影响答案的完整路径？&quot;,&quot;sources&quot;:[&quot;storage-experience&quot;,&quot;longmemeval&quot;,&quot;memoryagentbench&quot;,&quot;google-agent-platform-memory-bank&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;exposure&quot;,&quot;short&quot;:&quot;暴露方式&quot;,&quot;title&quot;:&quot;Q5 · 后续调用如何获得并使用它？&quot;,&quot;en&quot;:&quot;Exposure and use path&quot;,&quot;what&quot;:&quot;拆开“已经保存”“被检索/选择”“进入当前输入”“改变了行动”四个阶段，描述后续调用实际能看到什么。&quot;,&quot;why&quot;:&quot;外部存储里有记录，不代表当前模型已经看到；检索到也不代表被采用。很多 benchmark 测最终回答，却不能仅凭结果证明内部检索或注入路径。&quot;,&quot;how&quot;:&quot;沿着一次调用记录读取触发、查询、排序/过滤、上下文拼接、工具返回和最终决策，标出自动注入与 Agent 主动读取的差异。&quot;,&quot;example&quot;:&quot;文件中有“使用 Python 3.12”的记录；调用前检索没有命中，模型仍会忘记；命中并注入后，模型知道它，但若来源过期仍可能误用。&quot;,&quot;evidence&quot;:&quot;CoALA 的长期记忆通过 retrieval 进入 working memory；LongMemEval、LoCoMo 和 MemoryAgentBench 主要观察取回后的任务结果；LangGraph/OpenAI/Google 文档展示状态或服务如何进入后续运行。&quot;,&quot;check&quot;:&quot;能否把一条“保存了但没有被使用”的失败例子说清楚？&quot;,&quot;sources&quot;:[&quot;coala&quot;,&quot;longmemeval&quot;,&quot;locomo&quot;,&quot;langgraph&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;},{&quot;id&quot;:&quot;governance&quot;,&quot;short&quot;:&quot;控制与治理&quot;,&quot;title&quot;:&quot;Q6 · 谁能读、写、改、删，并承担什么责任？&quot;,&quot;en&quot;:&quot;Control and governance&quot;,&quot;what&quot;:&quot;核对控制主体、权限、同意、来源追溯、审计、投毒防护、删除请求和成本/延迟约束。&quot;,&quot;why&quot;:&quot;同一个 Memory 功能可以由 Agent 主动调用、Harness 自动维护或托管服务完成；权限和审计决定它是否能在真实环境安全工作。&quot;,&quot;how&quot;:&quot;分别检查读/写/改/删权限、批准流程、来源和版本、审计记录、数据隔离、失败处理及资源预算；没有证据就写“未说明”。&quot;,&quot;example&quot;:&quot;用户允许系统记住语言偏好，但不允许把工作项目内容共享给其他 Agent。系统需要记录谁写入、谁读取、如何撤回和如何证明删除已传播。&quot;,&quot;evidence&quot;:&quot;安全、隐私和协作评测把访问控制、共享和投毒作为独立风险；工程文档通常把身份、权限、保留和审计放在服务配置里；研究框架较少完整覆盖这些治理细节，因此教程把它们保留为必答问题并标注证据边界。&quot;,&quot;check&quot;:&quot;能否判断一个“支持 Memory”的声明是否同时说明了权限和删除？&quot;,&quot;sources&quot;:[&quot;collabmem&quot;,&quot;agentpoison&quot;,&quot;google-agent-platform-memory-bank&quot;],&quot;confidence&quot;:&quot;medium — 这是跨研究、工程与评测资料归纳出的描述性工作集，不是来源规定的唯一 taxonomy。&quot;}],&quot;sources&quot;:{&quot;coala&quot;:{&quot;label&quot;:&quot;CoALA · §4.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2309.02427v3#S4.SS1&quot;,&quot;year&quot;:&quot;2023 arXiv / 2024 TMLR&quot;,&quot;evidence&quot;:&quot;研究框架论文；arXiv v3（2024-03）为 TMLR camera-ready；架构分类章节已核&quot;},&quot;survey&quot;:{&quot;label&quot;:&quot;Memory in the Age of AI Agents · §4 Functions&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.13564v2#S4&quot;,&quot;year&quot;:&quot;2025-12-15 submitted；v2 revised 2026-01-13&quot;,&quot;evidence&quot;:&quot;arXiv 预印本 v2；HTML §4 Functions 已核；不是同行评议标准&quot;},&quot;langchain&quot;:{&quot;label&quot;:&quot;LangChain · Memory overview&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/concepts/memory&quot;,&quot;year&quot;:&quot;2026&quot;,&quot;evidence&quot;:&quot;官方概念文档；短期/长期记忆边界已核&quot;},&quot;context&quot;:{&quot;label&quot;:&quot;Anthropic · Context engineering&quot;,&quot;url&quot;:&quot;https://www.anthropic.com/research/effective-context-engineering-for-ai-agents&quot;,&quot;year&quot;:&quot;2025&quot;,&quot;evidence&quot;:&quot;Anthropic 官方研究文章；上下文工程说明已核&quot;},&quot;cline&quot;:{&quot;label&quot;:&quot;功能原始来源&quot;,&quot;url&quot;:&quot;https://docs.cline.bot/prompting/cline-memory-bank&quot;,&quot;year&quot;:&quot;2026-11-06 UTC&quot;,&quot;evidence&quot;:&quot;已读官方文档或项目 README 的相关段落；未验证运行效果&quot;},&quot;langgraph:0&quot;:{&quot;label&quot;:&quot;LangGraph · 官方项目仓库&quot;,&quot;url&quot;:&quot;https://github.com/langchain-ai/langgraph&quot;,&quot;year&quot;:&quot;2026-11-11 snapshot；HEAD 5ea88ecbcdb9fde713c3abd58850a5b7beaa24ec（commit 2026-11-11T04:29Z）&quot;,&quot;evidence&quot;:&quot;官方 README 将 LangGraph 定义为构建有状态 Agent 的低层编排框架；本教程未运行仓库代码&quot;},&quot;langgraph:1&quot;:{&quot;label&quot;:&quot;LangGraph · 官方 Memory 概念文档&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/concepts/memory&quot;,&quot;year&quot;:&quot;2026-11-11 snapshot&quot;,&quot;evidence&quot;:&quot;官方 Memory 概念文档：thread state/checkpoint、long-term namespace/store、hot path/background、profile/collection 与 get/search/put 示例已核&quot;},&quot;deep-agents:0&quot;:{&quot;label&quot;:&quot;Deep Agents · 项目仓库&quot;,&quot;url&quot;:&quot;https://github.com/langchain-ai/deepagents&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;deep-agents:1&quot;:{&quot;label&quot;:&quot;Deep Agents · 记忆文档&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/deepagents/memory&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;deep-agents:2&quot;:{&quot;label&quot;:&quot;Deep Agents · 后端文档&quot;,&quot;url&quot;:&quot;https://docs.langchain.com/oss/python/deepagents/backends&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;mem0:0&quot;:{&quot;label&quot;:&quot;Mem0 · 仓库与文档&quot;,&quot;url&quot;:&quot;https://github.com/mem0ai/mem0&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;graphiti:0&quot;:{&quot;label&quot;:&quot;Graphiti · 仓库与文档&quot;,&quot;url&quot;:&quot;https://github.com/getzep/graphiti&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-agent-platform-memory-bank:0&quot;:{&quot;label&quot;:&quot;Google Agent Platform Memory Bank · 官方概览&quot;,&quot;url&quot;:&quot;https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidence&quot;:&quot;&quot;},&quot;google-agent-platform-memory-bank:1&quot;:{&quot;label&quot;:&quot;Google Agent Platform Memory Bank · 记忆生成&quot;,&quot;url&quot;:&quot;https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank/generate-memories&quot;,&quot;year&quot;:&quot;&quot;,&quot;evidenc a30ff/evals/README.md&quot;,&quot;year&quot;:&quot;固定提交 a6493188 · 2026-06-03&quot;,&quot;evidence&quot;:&quot;LLM全历史与Agent增量摄入、按task/period聚合FAMA。&quot;,&quot;checkedAt&quot;:&quot;2026-11-12&quot;}},&quot;concepts&quot;:[{&quot;id&quot;:&quot;context&quot;,&quot;title&quot;:&quot;Context / working set&quot;,&quot;what&quot;:&quot;当前一次调用实际收到的材料。&quot;,&quot;confusion&quot;:&quot;它可能来自 Memory，但不能推出跨调用持久化。&quot;,&quot;not&quot;:&quot;不要把当前上下文当成长期 Memory。&quot;},{&quot;id&quot;:&quot;session&quot;,&quot;title&quot;:&quot;Session history / transcript&quot;,&quot;what&quot;:&quot;可保存的原始对话或执行记录。&quot;,&quot;confusion&quot;:&quot;有历史不等于被选择、检索或有效使用。&quot;,&quot;not&quot;:&quot;不要把完整日志当成已经形成的语义记忆。&quot;},{&quot;id&quot;:&quot;rag&quot;,&quot;title&quot;:&quot;RAG / external knowledge&quot;,&quot;what&quot;:&quot;从外部资料检索并注入当前调用的机制。&quot;,&quot;confusion&quot;:&quot;可检索资料不一定由 Agent 交互形成，也不自动有更新/删除语义。&quot;,&quot;not&quot;:&quot;不要由“用了 RAG”推出它拥有长期个人 Memory。&quot;},{&quot;id&quot;:&quot;checkpoint&quot;,&quot;title&quot;:&quot;Checkpoint / state&quot;,&quot;what&quot;:&quot;恢复一次运行所需的状态、游标或检查点。&quot;,&quot;confusion&quot;:&quot;可恢复状态不一定有语义抽取、检索或遗忘机制。&quot;,&quot;not&quot;:&quot;不要把 checkpoint 自动当成事实库。&quot;},{&quot;id&quot;:&quot;latent&quot;,&quot;title&quot;:&quot;Parameter / latent / KV&quot;,&quot;what&quot;:&quot;模型参数、隐状态或推理缓存中的保留信息。&quot;,&quot;confusion&quot;:&quot;它们的写入、控制、审计和删除方式与外部 Memory 不同。&quot;,&quot;not&quot;:&quot;不要用外部文件的治理结论替代模型内部记忆的讨论。&quot;},{&quot;id&quot;:&quot;storage&quot;,&quot;title&quot;:&quot;Generic storage / log / cache&quot;,&quot;what&quot;:&quot;保存数据的通用设施。&quot;,&quot;confusion&quot;:&quot;存储机制本身不保证有内容角色、更新、授权或检索语义。&quot;,&quot;not&quot;:&quot;不要把“有数据库”当成完整 Memory 设计。&quot;}],&quot;entries&quot;:{&quot;research&quot;:[{&quot;id&quot;:&quot;foundation-agent-memory&quot;,&quot;title&quot;:&quot;A Survey of Agent Memory in the Second Half&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;综述 Agent Memory 的承载形式、认知机制、主体和长期 Agent 问题。&quot;,&quot;why&quot;:&quot;它覆盖面广，可用来观察研究圈如何把 substrate、memory mechanisms 与 Agent/User 角色放在同一讨论中。&quot;,&quot;boundary&quot;:&quot;arXiv/综述证据；具体分类与出版信息仍需按版本核对。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;foundation-agent-taxonomy-arxiv&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2602.06052&quot;,&quot;researchKind&quot;:&quot;survey&quot;},{&quot;id&quot;:&quot;agent-memory-characterization&quot;,&quot;title&quot;:&quot;Agent Memory: Characterization and System Implications&quot;,&quot;date&quot;:&quot;2026&quot;,&quot;summary&quot;:&quot;从系统特征与构建、检索、生成成本讨论 Agent Memory。&quot;,&quot;why&quot;:&quot;它把系统构建和使用成本带入 Memory 讨论，补充纯内容 taxonomy。&quot;,&quot;boundary&quot;:&quot;arXiv 版本的轴与工程含义仍需逐节核实。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;agent-memory-characterization&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2606.06448&quot;,&quot;researchKind&quot;:&quot;method&quot;},{&quot;id&quot;:&quot;a-mem&quot;,&quot;title&quot;:&quot;A-Mem&quot;,&quot;date&quot;:&quot;2025 · NeurIPS&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;summary&quot;:&quot;让新记忆参与整理旧记忆：把交互做成带语义说明的笔记，为相关笔记建立链接，并随新信息调整旧笔记的描述。它研究的是记忆如何组织和演化。&quot;,&quot;why&quot;:&quot;在理解保存原文、摘要和向量检索之后，A-Mem提供了另一个问题：新经验能否改变旧经验的组织方式？它有正式论文、明确的笔记结构和更新步骤，适合逐步拆解自组织记忆的设计。&quot;,&quot;boundary&quot;:&quot;以NeurIPS 2025正式论文的§3与图2解释方法。论文实验仓库、作者另列的WujiangXu/A-mem-sys系统仓库和agiresearch接入库不是同一个交付物；论文报告的实验结果不能自动转成当前库或生产部署的效果保证。&quot;,&quot;sources&quot;:[&quot;a-mem:1&quot;,&quot;a-mem-paper&quot;,&quot;a-mem-evaluation&quot;,&quot;a-mem-library&quot;,&quot;a-mem-library-code&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;canonicalUrl&quot;:&quot;https://proceedings.neurips.cc/paper_files/paper/2025/hash/19909c36f51abc4856b4560aff3d36d6-Abstract-Conference.html&quot;,&quot;selectionEvidence&quot;:&quot;发表于NeurIPS 2025主会议，作者单位包括Rutgers University与AIOS Foundation，也有独立研究者。正式论文公开构建、链接、演化和检索步骤，并报告六种基础模型上的实验。这里的纳入依据是方法可检查、能补充记忆组织这一教学主题；实验效果是作者报告，本教程未复现。&quot;,&quot;limitations&quot;:&quot;自动生成的标签、上下文和链接可能出错；连接相关经历不等于证明因果。论文没有给出适用于所有应用的权限、删除传播或审计保证。其LoCoMo实验设置按该论文自身版本理解，不与其他论文或后来发布集的规模、指标直接拼接。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;可演化的Agent Memory研究方法&quot;,&quot;authors&quot;:&quot;Wujiang Xu、Zujie Liang、Kai Mei、Hang Gao、Juntao Tan、Yongfeng Zhang&quot;,&quot;venue&quot;:&quot;NeurIPS 2025；DOI 10.52202/085713-0593&quot;,&quot;artifact&quot;:&quot;正式论文、作者实验仓库，以及另行发布的接入库&quot;,&quot;version&quot;:&quot;NeurIPS正式版；实验仓库f9a173dec325d84fcc97e7828775c7b241c33466；接入库ceffb860f0712bbae97b184d440df62bc910ca8d仅用于辨别实现边界&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;A-Mem保存交互内容，并为它补充可检索、可连接的语义说明。论文的一个memory note含原始内容、交互时间、关键词、标签、上下文描述、embedding和关联笔记。原文记录发生了什么，模型生成的关键词和上下文则帮助解释这段经历与什么问题有关。这些是同一条记忆的不同字段，并不是七种彼此独立的Memory。&quot;,&quot;why&quot;:&quot;只保留一句原话时，后续问题可能换了说法，检索很难直接命中。补充语义说明能提供更多查找线索，但也引入了模型的解释，因此读者要分清原始记录与推断出来的描述。&quot;,&quot;example&quot;:&quot;译述论文图2中的英文对话：先出现“实现同时使用内存和磁盘的缓存”，后来出现“生产环境内存占用高，想加入LRU淘汰”。这两段来自图中的实际示例，中文为概括译述。教程推演：第一条笔记既保留原始需求，也可以标记缓存主题；具体标签由模型生成，论文图示不等于本教程运行得到的输出。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.1式(1)至(3)列出字段与生成方式，图2给出缓存/LRU例子。字段与流程是论文明确描述；主题标签的具体措辞是教学推演。&quot;},{&quot;answer&quot;:&quot;主要载体是模型参数之外的结构化笔记集合。每条笔记有可读文本、向量和指向其他笔记的链接；论文把原文、关键词、标签、上下文一起编码成向量，用于相似度候选查找。链接另外表达笔记间的关联。图2的box是对一组相关记忆的概念性说明，同一笔记可以属于多个box，不是必须实现的物理文件夹。&quot;,&quot;why&quot;:&quot;向量擅长找语义接近的候选，链接则保留已经识别出的关联。把两者分开看，就能理解为什么“已有向量库”还不等于实现了A-Mem，也不会把论文示意图的分组误读成固定的记忆分类。&quot;,&quot;example&quot;:&quot;沿用缓存例子：向量可以把LRU请求与早期缓存需求找得很近，链接再记录这两条笔记有关。第一条笔记还可能关联磁盘存储问题，所以它不必只属于一个互斥目录。这里说明表示方式，不声称这些链接已经在某次实际运行中生成。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.1式(3)、§3.2及图2图注。正式论文不强制某个数据库品牌；《A-Mem · 接入库与实验代码边界》是另一实现入口，不能用其数据库选择反推论文唯一架构。&quot;},{&quot;answer&quot;:&quot;论文讨论的是Agent经历形成的历史记忆集合，以及当前交互如何从中找回相关笔记。笔记的主题关联可以跨越多次交互，但论文的note定义没有把用户、租户、项目授权规定成一套通用隔离协议。因此要分别回答“内容谈论谁”和“谁有权检索”；box和语义标签只能帮助组织，不能充当权限边界。&quot;,&quot;why&quot;:&quot;两个用户都谈缓存时，笔记可能非常相似，却不应仅因相似就相互可见。研究方法解释了集合内部如何组织；把它接入多人产品时，还需要决定每个集合的归属和检索范围。&quot;,&quot;example&quot;:&quot;教学例子：为项目A和项目B分别保留缓存设计记录。先按调用者的项目权限确定可检索集合，再在其中建立和查找笔记关联；跨项目共享必须另外授权。这个隔离方案是应用设计建议，A-Mem论文没有宣称自动实现它。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.1的集合M与note定义、§3.4的历史集合检索、图2的可重叠box。权限边界未由这些章节给出；项目隔离是基于其使用范围提出的工程推论。&quot;},{&quot;answer&quot;:&quot;写入分三步：先构建笔记，再用向量选出相关旧笔记并让LLM判断是否连边，最后判断旧笔记的上下文、关键词和标签是否需要更新。§3.3中演化后的笔记替换集合里的原笔记，所以一次写入可能改变既有记忆的组织方式。式(7)主要更新上下文、关键词和标签，链接建立另见§3.2；这不应理解为对所有事实自动纠错，或默认保留完整历史版本。&quot;,&quot;why&quot;:&quot;新信息有时使旧经历呈现新的意义，而不仅是增加一条记录。例如后续问题揭示了早期设计的性能瓶颈。允许更新旧笔记能帮助后续查找，但也让错误解释有机会传播到旧记录，需要检查更新结果。&quot;,&quot;example&quot;:&quot;教学推演：看到LRU请求后，系统可能把早期“缓存实现”的上下文补充为与内存压力相关，再建立两条笔记的关联。它不应因此把原始需求改写成“最开始就要求LRU”。这个反例帮助检查：更新的是解释，还是篡改了经历。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.2式(4)至(6)、§3.3式(7)及图2。旧note被演化版本替换是明确流程；自动纠错、不可篡改历史或完整删除保证不在该流程的证明范围内。&quot;},{&quot;answer&quot;:&quot;回答新问题时，系统先编码查询，再按余弦相似度找相关笔记，并把检索材料放入Agent的prompt。§3.4写的是top-k检索；图2图注进一步描述访问已链接的相关记忆。读者应把这理解为论文提出的取回路径，并在实际实现中核查邻居扩展和最终上下文预算，而不是认为只要建立链接，所有邻居都必然进入模型输入。&quot;,&quot;why&quot;:&quot;笔记存得完整、链接建得丰富，都不保证当前问题拿到了必要信息。最终进入prompt的材料才直接影响这次调用；检索数量、关联扩展和截断规则决定了哪些历史真正暴露给模型。&quot;,&quot;example&quot;:&quot;教学诊断：问“为什么后来加LRU”，理想材料同时包含早期缓存设计和后来的生产内存问题。如果只召回了LRU关键词，答案仍可能缺少原因。检查时依次看候选笔记、关联扩展结果、最终prompt，才能定位丢失发生在哪一步。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.4式(8)至(10)、图2图注；《A-Mem · 接入库检索源码》的search_agentic尝试加入邻居后仍截断到k，不能据函数名承诺邻居必然保留。该源码只作实现边界核查，不视为论文实验等价实现。&quot;},{&quot;answer&quot;:&quot;论文把构建语义描述、判断链接和更新旧描述交给LLM，同时由设计者规定提示模板、编码器和候选检索规则。因此“agentic”不意味着无人设定规则，而是部分记忆组织决策由模型完成。本页分析的§3方法与§4实验没有验证用户同意、恶意写入防护、人工审核或彻底删除，因此不能由这些实验推导相应治理保证。&quot;,&quot;why&quot;:&quot;模型拥有修改记忆组织的能力后，错误就可能从一次输出变成以后反复引用的背景。理解谁决定写入、谁能改旧记录，才能设计检查、纠错和撤回流程；一篇方法论文的效果实验不能代替这些验证。&quot;,&quot;example&quot;:&quot;教学例子：一段未经确认的对话声称“所有缓存都必须禁用”。应用若允许它改写其他笔记，后续建议可能持续受影响。可考虑保留原文与来源、审查重要更新并允许撤回；这些是应额外实现和评测的措施，不是论文已证明的保障。&quot;,&quot;trace&quot;:&quot;《A-Mem · NeurIPS正式论文》§3.1至§3.3的LLM提示与演化步骤、§4实验范围；《A-Mem · NeurIPS 2025论文集》确认发表信息。治理建议由控制路径推导，未运行投毒、权限或删除实验。&quot;}]},{&quot;id&quot;:&quot;forms-functions-dynamics&quot;,&quot;title&quot;:&quot;Memory in the Age of AI Agents · Forms / Functions / Dynamics&quot;,&quot;date&quot;:&quot;2025-12-15 submitted；v2 revised 2026-01-13（arXiv preprint）&quot;,&quot;summary&quot;:&quot;Yuyang Hu 等人的 Agent Memory 综述，用 Forms、Functions、Dynamics 三个观察镜头组织研究版图。&quot;,&quot;why&quot;:&quot;它是本工作集里最适合展示“同一套 Memory 可以按不同观察角度描述”的综述之一：形式回答承载与表示，功能回答为什么需要记忆，动态回答怎样形成、演化和取回。它是 arXiv 综述，不被本教程当作唯一标准或同行评议共识。&quot;,&quot;boundary&quot;:&quot;综述的三镜头是研究组织框架；它们与教程六问有交集但不一一等价，也没有替工程系统规定权限、删除或部署协议。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;survey&quot;,&quot;survey-form&quot;,&quot;survey-dynamics&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/abs/2512.13564v2&quot;,&quot;researchKind&quot;:&quot;survey&quot;,&quot;selectionEvidence&quot;:&quot;arXiv 元数据（2025-12-15 submitted、2026-01-13 v2 revision）、v2 HTML §§2–5 和代表性表格已核。收录依据是它同时提供形式、功能与动态三条研究入口，并明确讨论与 RAG、Context Engineering 的边界；它仍是 arXiv 预印本，不能把“综述覆盖广”写成效果或标准化证明。&quot;,&quot;limitations&quot;:&quot;没有在本教程中复现实验；综述中的方法、表格和前沿判断应回到各自原论文核查。它没有给出完整的生产权限、审计、租户隔离或删除证明协议。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;研究综述与分类框架&quot;,&quot;authors&quot;:&quot;Yuyang Hu et al.&quot;,&quot;team&quot;:&quot;论文作者团队；作者机构以 arXiv 元数据为准&quot;,&quot;venue&quot;:&quot;arXiv preprint v2（2026-01-13 更新）&quot;,&quot;artifact&quot;:&quot;原始论文 HTML §§2–5、分类图表与 §6 资源表；本教程未复现实验&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;这篇综述把“保存的是什么”按功能角色来回答：factual memory 保存交互、用户和环境的显式事实；experiential memory 保存任务执行中形成的案例、策略或技能；working memory 管理当前任务的活动工作区。这里的三类是综述的功能层，而不是把所有系统的记录强行归成三个数据库。例如，教学假设中同一段“用户昨天把部署回滚到 v2”的对话，可以留下一个事件记录，也可以进一步抽象成“回滚前先检查迁移”的策略；这是用该框架做的分析示例，不是论文原例。&quot;,&quot;trace&quot;:&quot;来源事实：§4 将 factual、experiential、working 作为功能支柱，并在 experiential 表格中列出 case/strategy/skill。解释边界：这是作者的 why/function 视角；它不能替代 CoALA 的 working/long-term 层级，也不证明所有系统都实现三种独立模块。&quot;,&quot;why&quot;:&quot;功能角色必须与承载形式分开，否则文本、图或参数会被误读成内容类别。&quot;,&quot;example&quot;:&quot;教学假设（非论文原例）：同一条“回滚到 v2”的轨迹可以作为事件保存，也可以被抽象为回滚前检查迁移的策略。&quot;},{&quot;answer&quot;:&quot;综述把形式/承载单独放到 Forms：token-level memory 可以是平面记录、带关系的二维结构或层级结构；parametric memory 把信息吸收到模型权重或附加参数；latent memory 处于显式数据和固定权重之间，用向量或其他不可直接阅读的表示承载信息。一个事实因此可能以文本日志保存，也可能经过图结构、参数更新或 latent 表示保存；“事实”是内容角色，“token-level/parametric/latent”是承载视角。&quot;,&quot;trace&quot;:&quot;来源事实：§3 的 token-level、parametric、latent 分类及 token-level 的 flat/planar/hierarchical 讨论。作者还明确把 Carrier/Form/Optimization 分开记录。解释边界：综述举的是研究方法，不是某个工程系统必须采用的物理数据库。&quot;,&quot;why&quot;:&quot;综述把 Forms 单列，正是为了说明同一功能可以由显式 token、参数或 latent 表示承载。&quot;,&quot;example&quot;:&quot;一个用户偏好可以是 JSON 文本、向量索引中的条目，或经过参数/latent 更新后的隐式能力；这些不是同一种可审计性。&quot;},{&quot;answer&quot;:&quot;综述的主要对象是 agent memory research，讨论的主体包括 Agent、用户和环境。它特别区分 agent memory 与 LLM memory、RAG、context engineering，并在功能部分区分 user factual memory 与 environment factual memory；同时把 shared memory for multi-agent systems 列为前沿方向。由此可以看出“服务谁、指向谁”会影响记忆的含义，但论文没有为生产系统给出 user、team、tenant 的权限拓扑。&quot;,&quot;trace&quot;:&quot;来源事实：§2 的边界讨论、§4.1 的 user/environment factual memory、§7.5 的 shared memory frontier。未说明项：论文没有给出一套可部署的共享授权或租户隔离协议，故不把研究讨论写成工程能力。&quot;,&quot;why&quot;:&quot;研究对象的主体和范围会改变记忆用途，但论文没有把研究层讨论变成生产授权协议。&quot;,&quot;example&quot;:&quot;user factual memory 与 environment factual memory 指向不同对象；shared memory 则涉及多 Agent，但共享权限仍需工程系统定义。&quot;},{&quot;answer&quot;:&quot;动态视角把生命周期拆成 formation、evolution 和 retrieval。Formation 把交互轨迹转成更密集的知识单元；evolution 负责 consolidation、更新、冲突解决和 forgetting；retrieval 根据当前查询取回内容。比如系统可以先记录每次工具调用，再把多次成功轨迹反思成策略，随后在新任务开始时检索策略；这个例子说明“记下来、改变旧记忆、取出来”是不同阶段。&quot;,&quot;trace&quot;:&quot;来源事实：§5 开头明确列出 formation/evolution/retrieval，并说明演化包括 consolidation、updating、forgetting。解释边界：这些是综述的过程抽象；具体 TTL、版本号、冲突优先级和物理删除仍需看具体方法。&quot;,&quot;why&quot;:&quot;Formation、evolution、retrieval 分别回答“怎样产生”“怎样改变”“怎样被取回”，合并会看不出旧记忆如何失效。&quot;,&quot;example&quot;:&quot;先记录工具调用，再通过反思形成策略，最后在新任务查询策略；三步分别对应形成、演化和暴露前的检索。&quot;},{&quot;answer&quot;:&quot;综述用一个 context-dependent retrieval operator 表示暴露路径：系统根据观察和查询生成检索信号，把文本片段或结构化摘要交给 LLM policy；检索可以只在任务开始发生，也可以间歇或持续发生。比如某个 Agent 在新任务开始时只取回与当前目标相关的经验摘要，而不是把全部历史放入上下文。这个模型回答了“记忆怎样进入调用”，但没有规定向量检索、图遍历、排序、截断或失败回退。&quot;,&quot;trace&quot;:&quot;来源事实：§2 的 Memory Retrieval 与 Memory–Agent Coupling 公式/文字。解释边界：论文描述从记忆状态到策略输入的关系，不等于对每个系统的可观测调用链作了实现承诺。&quot;,&quot;why&quot;:&quot;有记录不等于当前调用能看到，检索时机与注入路径必须单独说明。&quot;,&quot;example&quot;:&quot;系统只在任务开始取回一次相关经验，后续步骤不再检索；这与每一步持续检索是不同设计。&quot;},{&quot;answer&quot;:&quot;这篇综述把 trustworthy memory、shared memory、privacy 和其他风险列为研究前沿，但没有把“谁可以读、谁可以改、怎样证明删除已传播”写成统一协议。因此对第六问的诚实回答是：研究问题被明确提出，工程治理细节仍未规定。读者可以据此继续追问来源、授权、审计、投毒、删除和资源预算，而不能因为综述列出 trustworthiness 就推断任一方法已经满足这些要求。&quot;,&quot;trace&quot;:&quot;来源事实：§7.5–§7.7 将 multi-agent sharing 和 trustworthy memory 作为前沿。证据边界：没有访问控制、审计日志、删除证明或合规配置的统一规范；这里使用 not_specified，而不是“不支持”。&quot;,&quot;why&quot;:&quot;trustworthy/shared memory 被列为前沿，只能证明问题重要，不能证明治理已经实现。&quot;,&quot;example&quot;:&quot;读者应继续追问谁能读写、如何审计和如何删除，而不是把“trustworthy”标签当成权限保证。&quot;}]},{&quot;id&quot;:&quot;coala&quot;,&quot;title&quot;:&quot;CoALA&quot;,&quot;date&quot;:&quot;2024&quot;,&quot;summary&quot;:&quot;Cognitive Architectures for Language Agents，提出语言 Agent 的认知架构视角。&quot;,&quot;why&quot;:&quot;它明确展示 working memory 与长期 episodic/semantic/procedural memory 的层级关系，是理解“分类来自观察视角”的经典入口。&quot;,&quot;boundary&quot;:&quot;架构提案不等于产品实现或安全规范。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;coala&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;selectionEvidence&quot;:&quot;2023 arXiv、2024 TMLR camera-ready 的原始论文与章节已核；作者提出的是架构视角，不是行业统一标准。&quot;,&quot;limitations&quot;:&quot;没有完整规定工程权限、删除、租户隔离或 benchmark 协议；四类不能被画成同层并列。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;questions&quot;:[{&quot;answer&quot;:&quot;CoALA 把 Memory 作为语言 Agent 的信息存储模块。Working memory 是当前决策循环直接操作的短期工作区；long-term memory 再分为 episodic（经历）、semantic（事实或知识）和 procedural（做事方式或规则）三类。因此四个名称不是四个同层并列槽位，而是“working memory + long-term memory 下三类”的层级。论文还描述长期记忆经 retrieval 进入工作记忆，学习动作可以把新内容写回长期记忆。&quot;,&quot;trace&quot;:&quot;CoALA §4.1 的 Memory 图和文字；论文明确把 working memory 与 long-term memory 分开，并在长期记忆下列出 episodic、semantic、procedural。retrieval 与 learning 的桥接关系见同节后续描述。&quot;},{&quot;answer&quot;:&quot;CoALA 更关心认知角色和信息存储层，没有把每类记忆绑定到一种物理数据库。工作记忆可以由当前输入、内部状态或上下文承载；长期记忆可以由外部模块承载，程序性记忆还可能体现在模型参数、Agent 代码或工具能力中。这里的分类不能被误读成“文件、向量库、图数据库”三选一，具体载体必须回到实现或方法论文核对。&quot;,&quot;trace&quot;:&quot;论文的 Memory 模块以及对 external memory、model parameters、programs/tools 的讨论。论文给出的是架构层含义，未规定某个具体数据库或部署拓扑。&quot;},{&quot;answer&quot;:&quot;主要主体是单个语言 Agent 的认知架构：它描述该 Agent 如何在一个决策循环里读写自己的 Memory。论文的目标不是团队资料库或多租户服务，所以没有给出项目、用户、团队共享的完整拓扑，也没有定义谁拥有一条记忆。把这些缺口写出来，是理解 CoALA 边界的一部分。&quot;,&quot;trace&quot;:&quot;论文摘要和 §4 将 CoALA 定义为 language agent 的 conceptual framework；共享主体、租户隔离和删除权并非该框架的完整目标。&quot;},{&quot;answer&quot;:&quot;长期记忆通过 retrieval action 进入 working memory，learning action 则可以把交互中的新信息、反馈或技能写回长期记忆。论文给出的是操作关系和架构位置，不是通用的 TTL、版本、冲突覆盖或删除传播协议。因此“能学习、能检索”不能直接推出“有完整生命周期管理”。&quot;,&quot;trace&quot;:&quot;CoALA §4.1 及 Memory operations 的 retrieval/learning 描述；TTL、版本、冲突和删除协议在论文中未被定义，故标为未说明。&quot;},{&quot;answer&quot;:&quot;在 CoALA 的循环里，后续决策先选择 retrieval action，从长期记忆取回相关内容，再把它放入 working memory，供 reasoning 和 decision 使用。论文用这个 bridge 解释 Memory 怎样影响行动，但没有规定 embedding、排序、上下文预算或检索失败回退。回答这一问时要把架构路径和工程实现分开。&quot;,&quot;trace&quot;:&quot;论文 §4.1 的 retrieval bridge 与 §4.3 Retrieval actions；具体索引、排序和注入策略不属于 CoALA taxonomy 的规定。&quot;},{&quot;answer&quot;:&quot;CoALA 是概念框架和研究组织方式，不是访问控制或合规规范。它没有完整规定谁能读写、怎样审计来源、怎样抵抗投毒，以及用户要求删除后如何证明传播停止。这里的结论是“论文未规定这些治理机制”，不是“采用 CoALA 的系统一定没有这些能力”。&quot;,&quot;trace&quot;:&quot;论文的研究范围、架构章节和讨论部分没有给出权限、审计、删除证明或投毒防护协议；工程治理需要另看系统文档和安全评测。&quot;}],&quot;canonicalUrl&quot;:&quot;https://arxiv.org/html/2309.02427v3#S4.SS1&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;研究框架论文&quot;,&quot;authors&quot;:&quot;Theodore R. Sumers, Shunyu Yao, Karthik Narasimhan, Thomas L. Griffiths&quot;,&quot;team&quot;:&quot;Princeton University&quot;,&quot;venue&quot;:&quot;arXiv v3（2024）与 TMLR camera-ready（2024）&quot;,&quot;artifact&quot;:&quot;原始论文与 HTML §4.1 Memory；本教程没有复现实验&quot;},&quot;researchKind&quot;:&quot;method&quot;},{&quot;id&quot;:&quot;generative-agents&quot;,&quot;title&quot;:&quot;Generative Agents&quot;,&quot;date&quot;:&quot;2023-04-07 预印本；2023 UIST&quot;,&quot;summary&quot;:&quot;让模拟小镇中的 Agent 把经历保存为记忆，形成反思，再据此规划和行动。它适合用来理解“记住发生过什么”如何进一步变成“从经历中得出看法”。&quot;,&quot;why&quot;:&quot;它把观察、检索、反思和行动连接成可解释的循环，论文与作者代码能互相定位。虽然发表于2023年，这个基础案例仍适合讲清经历怎样成为高层判断，再影响后续决策。&quot;,&quot;boundary&quot;:&quot;主讲论文v2的Memory架构，并用作者固定提交解释数据结构。模拟中的行为可信度不等于事实准确性、生产可靠性或人类心智；论文和开源实现也不保证每个参数完全一致。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;generative-agents&quot;,&quot;ga-proceedings&quot;,&quot;ga-code&quot;,&quot;ga-retrieve&quot;,&quot;ga-readme&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/html/2304.03442v2&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;selectionEvidence&quot;:&quot;UIST 2023正式论文，论文v2列出的作者机构包括Stanford、Google Research和Google DeepMind；§4公开检索与反思机制，§6对记忆、规划、反思作消融，§7观察25个Agent在两天模拟时间中的行为。收录依据是可核对的方法、实验和源码，不把演示效果作为真实社会模拟的充分证明。&quot;,&quot;limitations&quot;:&quot;作者报告过漏取重要记忆、给记忆添造细节和语言风格过度正式等问题。原研究规模与运行时长有限，且没有给出生产级授权、隐私删除和投毒防御的完整验证。本教程只读论文与代码，未复现实验；各问例子若未注明原文，均为教学推演。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;研究方法 / 具身社会模拟中的Memory架构&quot;,&quot;authors&quot;:&quot;Joon Sung Park、Joseph C. O’Brien、Carrie J. Cai、Meredith Ringel Morris、Percy Liang、Michael S. Bernstein&quot;,&quot;venue&quot;:&quot;UIST 2023；DOI 10.1145/3586183.3606763&quot;,&quot;artifact&quot;:&quot;论文v2、作者开源代码、可回放模拟&quot;,&quot;version&quot;:&quot;论文v2（2023-08-06）；代码 fe05a71d3e4ed7d10bf68aa4eda6dd995ec070f4&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;核心是memory stream：把Agent经历的事情记录下来，同时保存由这些经历推得的反思和后续计划。观察描述发生过什么，反思表达Agent从多条记录中形成的判断，计划描述它准备做什么。三者都能影响后续行动，但证据身份不同：一条“我认为某人喜欢研究”的反思不是已经核实的客观事实。作者代码另以event、thought、chat组织节点，不能把这些代码标签直接当成论文的认知分类。&quot;,&quot;why&quot;:&quot;只有事件流水，Agent可能记得许多细节却不能归纳；只有总结，又会丢掉支撑总结的经历。把原始经历、推断与意图区分开，才能解释它为什么作出一个选择，也能追查推断是否可靠。&quot;,&quot;example&quot;:&quot;论文§4.2中，Klaus从自己与Maria的研究活动中推得共同兴趣，因而选择与Maria相处。教学时可把链条写成“多条活动记录 → 共同兴趣的判断 → 社交选择”；不能把中间判断视为作者证实的真实人物性格。&quot;,&quot;trace&quot;:&quot;论文v2 §4、§4.1–4.3（来源Generative Agents）；代码ConceptNode.type与三个seq_*列表（来源《Generative Agents · ConceptNode / AssociativeMemory》）。机制与代码字段置信度高；例子的因果用途按论文叙述归纳。&quot;},{&quot;answer&quot;:&quot;这些记忆主要存在模型外部，以自然语言描述加时间、重要性等字段组织。论文把memory stream描述为记忆对象列表；向量表示用来计算相关性。作者代码中的ConceptNode还保存节点类型、主谓宾、关键词和关联信息，AssociativeMemory把节点与embeddings写入JSON文件。读入prompt只是取用阶段：保存的全集和本轮模型看见的子集是两个位置。&quot;,&quot;why&quot;:&quot;这里的长期保留靠外部状态，而不是让每次模型调用都重新学习权重。文本让模型能理解内容，字段和向量让程序能筛选它；理解两者分工，才能知道换数据库或换embedding改变了哪一环。&quot;,&quot;example&quot;:&quot;教学例子：一条“Maria参加了研究讨论”可保存为文本节点，并带创建时间与embedding。磁盘里即使保存了一千条经历，本轮回答也只需收到选出的几条；一千条已保存不等于一千条都进入上下文。&quot;,&quot;trace&quot;:&quot;论文v2 §4.1的memory object与embedding定义；《Generative Agents · ConceptNode / AssociativeMemory》中的ConceptNode、AssociativeMemory.__init__和save。JSON是所核代码的保存方式，不归纳为所有实现必须采用的后端。&quot;},{&quot;answer&quot;:&quot;记忆以单个Agent的经历为中心。各角色从自己的身份种子开始，积累自己观察到的事件和对话；信息通过交流传播后，才可能成为另一个角色的记忆。模拟世界由共同引擎维护，不意味着每个Agent能直接读到所有人的记忆。论文还描述了每个角色对已见空间的局部认识，这与全局世界状态要分开。&quot;,&quot;why&quot;:&quot;如果把共同环境误当成共同记忆，就解释不了为什么某人尚不知道一场活动，或为什么传话会改变信息。主体范围决定谁经历、谁得知、谁能据此行动；这一设计问题与安全授权仍是不同问题。&quot;,&quot;example&quot;:&quot;论文§3.4.1中，Sam竞选的消息通过交谈传播。教学解释：Tom听到消息后可以再告诉别人；另一个尚未接触消息的Agent不应仅因同在小镇就自动拥有该记忆。&quot;,&quot;trace&quot;:&quot;论文v2 §3.1种子记忆、§3.4.1信息传播、§5环境与角色感知；《Generative Agents · ConceptNode / AssociativeMemory》按persona加载存档。单Agent范围有直接依据；没有把它写成经过验证的访问控制机制。&quot;},{&quot;answer&quot;:&quot;观察不断进入记忆流；系统会根据累计事件的重要性触发反思，用近期记录提出问题、检索支撑材料，再生成带证据指向的高层判断并写回。论文实现使用150的触发阈值和最近100条记录来生成反思问题，这些是该实验参数，不是普遍规则。计划也会写回并随新情况调整；检索的时间衰减降低旧记录被取用的机会，不能据此推断旧记录已经被删除。&quot;,&quot;why&quot;:&quot;这个生命周期把“记录”变为“归纳”，再使归纳参与未来决策。也正因为生成的反思会再次成为检索材料，早期错误可能继续影响后续判断；所以需要保留它来自哪些记录的线索。&quot;,&quot;example&quot;:&quot;教学例子：今天多次讨论研究，可以形成一条“最近关心研究合作”的反思；明天规划会面时再检索它。若反思理解错了原话，追到原始记录才能纠正；简单降低旧记忆得分不能替代纠错或删除。&quot;,&quot;trace&quot;:&quot;论文v2 §4.2给出触发、100条记录、生成问题和引用证据的流程；§4.3给出计划写回与修订；§4.1给出recency。阈值属于论文版本；生命周期解释为据此作出的教学归纳。&quot;},{&quot;answer&quot;:&quot;检索根据当前情境寻找值得放进prompt的记忆。论文把近期访问程度、重要性和与问题的语义相关性分别归一化后加权，选择上下文容得下的高分记录；随后模型用这些记录回答、反思或制定计划。重要性由模型评分，相关性用embedding相似度，近期程度依据访问时间衰减。检索成功只表示候选被送入模型，最终是否正确使用仍需检查输出和行为。&quot;,&quot;why&quot;:&quot;单靠“语义相似”可能漏掉重要但措辞不同的往事；只看最近又可能忽略久远的重要关系。三个分量体现这篇方法怎样分配有限注意力，而不是三种独立Memory。&quot;,&quot;example&quot;:&quot;论文图6中，询问Isabella最近期待什么时，派对准备比冰箱状态更应进入回答。教学上可以逐条检查“是否被召回、是否进了prompt、回答是否引用正确”，把存储、取用和效果拆开验证。&quot;,&quot;trace&quot;:&quot;论文v2 §4.1与图6给出三项分数、等权设置和prompt选择；《Generative Agents · new_retrieve》提供对应函数。正文数值说明以论文为准，不声称开源代码权重逐项相同。&quot;},{&quot;answer&quot;:&quot;控制首先来自研究者设定的角色种子、环境规则、prompt和反思触发条件，运行时再由架构与模型决定记录、检索和推断。用户可以扮演角色的inner voice施加指示，作者仓库也提供回放与演示入口。反思引用支撑记录有助于追溯，但论文没有因此建立完整的授权、用户同意、敏感信息隔离或删除证明。§8.3讨论伦理风险，讨论风险与实现防护应分别阅读。&quot;,&quot;why&quot;:&quot;谁能改变记忆，会影响Agent以后相信什么。研究演示中的可控角色与真实用户数据服务承担不同责任；能查看记录也不等于记录真实、访问合规或删除彻底。&quot;,&quot;example&quot;:&quot;教学推演：若把一段错误传言写进角色记忆，系统可能据此形成反思。检查来源能帮助定位问题；如要改造成真实助理，还需另外定义谁可写入、如何纠错和哪些记录不得跨用户读取。这个改造建议不是论文已验证的安全能力。&quot;,&quot;trace&quot;:&quot;论文v2 §3.1.2 User Controls、§4.2证据引用、§8.3 Ethics；《Generative Agents · 作者仓库与回放说明》的replay/demo说明。公开机制置信度高；生产治理结论仅限“所核材料未建立完整证明”。&quot;}]},{&quot;id&quot;:&quot;reflexion&quot;,&quot;title&quot;:&quot;Reflexion&quot;,&quot;date&quot;:&quot;2023-03-20 · 预印本首发；2023 · NeurIPS&quot;,&quot;summary&quot;:&quot;把一次失败的轨迹和反馈转成自然语言改进建议，保留下来指导同一任务的下一次尝试。改变的是模型收到的经验上下文，论文方法不更新模型权重。&quot;,&quot;why&quot;:&quot;它让“从错误中学习”成为可以逐步检查的过程：失败信号如何变成经验、经验如何保留、下一次动作是否利用它。适合与Voyager的可执行技能记忆对照阅读。&quot;,&quot;boundary&quot;:&quot;采用NeurIPS 2023正式论文与固定作者代码。论文中的长期记忆主要跨同一任务的多次尝试，不应直接等同跨用户、跨任意任务的长期知识库；本教程未重跑实验。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;reflexion-venue&quot;,&quot;reflexion-meta&quot;,&quot;reflexion-final&quot;,&quot;reflexion-hotpot&quot;,&quot;reflexion-alf&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://proceedings.neurips.cc/paper_files/paper/2023/hash/1b44b878bb782e6954cd888628510e90-Abstract-Conference.html&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;selectionEvidence&quot;:&quot;NeurIPS 2023正式发表，作者来自Northeastern、MIT和Princeton；公开框架、实验与任务代码。收录依据是可追溯的语言反馈学习机制和消融，而不是把历史基准成绩当作当前产品排名。&quot;,&quot;limitations&quot;:&quot;效果依赖评价信号是否可靠，以及模型能否正确解释失败。有限反思窗口会丢失较早经验，也可能在错误解释上反复打转。论文§5将向量/SQL扩展列为未来方向；不能据此说本方法已经实现了通用检索数据库。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;用语言反馈改进后续尝试的Agent研究&quot;,&quot;authors&quot;:&quot;正式版：Noah Shinn、Federico Cassano、Ashwin Gopinath、Karthik Narasimhan、Shunyu Yao&quot;,&quot;venue&quot;:&quot;NeurIPS 2023&quot;,&quot;artifact&quot;:&quot;正式论文、作者仓库与任务级代码&quot;,&quot;version&quot;:&quot;正式会议版；作者仓库218cf0ef1df84b05ce379dd4a8e47f17766733a0；2026-11-12静态核查；代码为2025-01-14后期快照，不视为2023论文实验配置&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;短期内容是本次尝试的动作、观察和结果；跨尝试保留的是Self-Reflection模型生成的文字经验，描述哪里出错、下一次应怎样改变。Evaluator提供成功/失败、分数或反馈，反思模型把它转成可执行的建议。作者称这部分为episodic memory；它不是自动确认正确的世界事实，也不是训练进权重的技能。&quot;,&quot;why&quot;:&quot;只有“失败了”很难指导下一次行为。保留具体原因和替代策略，才能让失败信息在环境重置后继续发挥作用；同时必须警惕模型把猜测的失败原因写成确定结论。&quot;,&quot;example&quot;:&quot;教学例子，依据§4.1报告的常见错误：Agent以为已拿到物品，实际没有，却继续执行后续步骤。反思可写成“拿取后先核对观察，再移动或加工”，比记录“任务失败”更能指导下一次。&quot;,&quot;trace&quot;:&quot;《Reflexion · NeurIPS 2023正式论文》§3 Actor/Evaluator/Self-reflection/Memory，§4.1 Analysis。例句为教程改写，不是作者原始轨迹。&quot;},{&quot;answer&quot;:&quot;记忆是模型外部的文本缓冲区，通过后续prompt重新进入模型。论文用有容量上限的滑动窗口，通常保留1至3条经验；各任务实现不同。HotPotQA代码把反思放在reflections列表和格式化字符串中，reset清空本次scratchpad而不一并清空反思。这里不需要向量库，也没有参数微调。 该HotPotQA快照的反思追加与格式化路径未见窗口截断；论文的容量设置不能自动套到这个后期实现。&quot;,&quot;why&quot;:&quot;“长期”描述经验跨越尝试的作用范围，不必意味着复杂数据库。分开文本载体、窗口容量和注入方式，能看清最小版本是怎样运行的，也能辨认加数据库属于后续扩展。&quot;,&quot;example&quot;:&quot;教学示意：第一次的轨迹很长，下一轮prompt只携带一条反思和新的scratchpad。程序重启后是否还能找回它，取决于运行脚本是否保存/恢复状态；不能仅凭Python列表就断言可跨进程持久化。&quot;,&quot;trace&quot;:&quot;《Reflexion · NeurIPS 2023正式论文》§3 Memory与容量Ω、§5；《Reflexion · HotPotQA记忆与提示词》reflect、reset、_build_agent_prompt。&quot;},{&quot;answer&quot;:&quot;核心组织单位是正在重试的任务或环境实例。ALFWorld代码把memory放在各自env配置里，并只为尚未成功、未跳过的环境生成反思；提示明确要求为同一个任务提出下一次计划。这能跨多次尝试积累线索，但不自动建立跨用户共享或跨任意任务的经验检索。&quot;,&quot;why&quot;:&quot;如果把某个房间的搜索经验用到另一个布局，原来有帮助的线索可能误导行动。先确定记忆属于哪道题或哪个环境，才能判断复用范围和何时应重置。&quot;,&quot;example&quot;:&quot;教学例子：在环境A发现某容器已搜索无果，下一轮可改查别处；新环境B的同名容器未必相同。论文机制支持前者，后者需要额外的迁移判断，不能把“跨尝试”写成“跨任务已验证通用”。&quot;,&quot;trace&quot;:&quot;《Reflexion · ALFWorld反思写入》_generate_reflection_query与update_memory；《Reflexion · NeurIPS 2023正式论文》§3、§4.1。权限与多租户不在该实验范围。&quot;},{&quot;answer&quot;:&quot;流程是执行一次任务、得到评价、生成反思、追加到经验记忆，再以这些经验开始下一次尝试。论文限制可见经验数量；ALFWorld代码的列表仍会追加旧记录，只把最近三条交给本次反思。因此“窗口里看不到”与“存储中已删除”不同，结束条件和保留数量也应按具体实验确认。&quot;,&quot;why&quot;:&quot;写入时机决定存的是已验证结果还是对失败的解释。容量限制节省上下文，却可能让早期重要教训消失；重试带来的提升还伴随额外模型与环境调用。&quot;,&quot;example&quot;:&quot;教学时间线：搜索失败 → 得到失败反馈 → 反思指出漏查抽屉 → 环境重置 → 携带教训重新搜索。编程实验最多保留一条经验，不应直接套用ALFWorld的三条窗口。&quot;,&quot;trace&quot;:&quot;《Reflexion · NeurIPS 2023正式论文》§3、§4.1、§4.3；《Reflexion · ALFWorld反思写入》env_configs[i][memory]追加与[-3:]切片。&quot;},{&quot;answer&quot;:&quot;Actor把反思文本与任务、本轮轨迹等一起读入prompt，再生成下一步动作或代码。HotPotQA的_build_agent_prompt明确填入reflections和scratchpad；没有一条独立的“检索后必定采纳”保证。论文的编程版本先用自生成测试反馈多轮修正，再报告基准测试结果，不能把报告的pass@1理解为只调用模型一次。&quot;,&quot;why&quot;:&quot;记忆只改变可见上下文，实际行为仍由模型生成。将“读到建议”与“执行了建议”分开，才能解释为什么写入成功仍可能没有改善结果；比较成绩时也要比较重试预算。&quot;,&quot;example&quot;:&quot;教学检查：两次生成使用相同题目，第二次增加“空输入应返回空列表”的反思，再观察生成的边界处理是否改变。仅检查prompt能证明建议被暴露，正确性还需独立测试。&quot;,&quot;trace&quot;:&quot;《Reflexion · HotPotQA记忆与提示词》_build_agent_prompt；《Reflexion · NeurIPS 2023正式论文》§4.3自生成测试和学习循环、Table1。示例不是复现实验。&quot;},{&quot;answer&quot;:&quot;研究者选择评价器、反思提示、重试预算和记忆窗口；模型提出具体反思。真实环境反馈、自生成测试和LLM评价的可靠性不同，错误反馈可能诱导错误记忆。论文讨论局部最优、测试困难和潜在滥用，但没有给出完整的用户授权、敏感信息删除或恶意记忆防护系统。&quot;,&quot;why&quot;:&quot;有一个Evaluator不等于有人确认了经验正确，更不等于权限已经受控。行为质量、工具安全和记忆内容的治理需要分别验证，尤其当经验会跨多次调用重复出现时。&quot;,&quot;example&quot;:&quot;教学反例：自生成测试漏掉负数输入，Agent可能把错误程序视为成功并停止改进。加入独立边界测试能发现这类问题，但这是部署建议；原论文不提供对任意代码或真实工具的安全保证。&quot;,&quot;trace&quot;:&quot;《Reflexion · NeurIPS 2023正式论文》§4.3错误测试分析、§5 Limitations、§6 Broader impact。控制边界与反例为基于机制的教程分析。&quot;}]},{&quot;id&quot;:&quot;memgpt&quot;,&quot;title&quot;:&quot;MemGPT · Towards LLMs as Operating Systems&quot;,&quot;date&quot;:&quot;v1 提交 2023-10-12；v2 修订 2024-02-12&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;summary&quot;:&quot;用操作系统式的虚拟上下文管理，把有限的主上下文与 recall、archival 等外部存储连接起来，让 Agent 自己决定何时读写和换入换出。&quot;,&quot;why&quot;:&quot;它是分层上下文管理和自主 Memory 操作的代表性研究方法：论文把“存储层级、容量压力、函数调用、长期对话结果”放在同一条可追踪链路里，适合把六问完整走一遍。&quot;,&quot;boundary&quot;:&quot;研究原型论文，不是当前产品的完整规格，也不是权限、删除或生产安全证明；实验结果是论文报告，本教程未复现。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;memgpt&quot;,&quot;memgpt:abs&quot;,&quot;memgpt:artifact&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/html/2310.08560v2&quot;,&quot;selectionEvidence&quot;:&quot;arXiv HTML v2 的 §§2.1–2.4 逐项说明 main context、working context、FIFO、recall/archival storage、queue eviction、function calls、pagination 与 heartbeat；§3 给出多会话对话和文档分析实验。作者和 Berkeley/AI 研究团队可定位，论文与实验入口公开。&quot;,&quot;limitations&quot;:&quot;论文把 recall storage 中被逐出的消息描述为 stored indefinitely，但没有给出通用 TTL、用户删除、访问控制、来源追溯或投毒防护协议；论文实验的模型、数据和部署配置不能直接外推到当前产品或所有部署。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;研究方法 / OS-inspired Agent Memory 原型&quot;,&quot;authors&quot;:&quot;Charles Packer、Sarah Wooders、Kevin Lin、Vivian Fang、Shishir G. Patil、Ion Stoica、Joseph E. Gonzalez&quot;,&quot;team&quot;:&quot;University of California, Berkeley；研究页面提供实验工件入口&quot;,&quot;venue&quot;:&quot;arXiv 预印本 v2（2024-02-12）&quot;,&quot;artifact&quot;:&quot;论文 HTML §§2–3 与 research.memgpt.ai 工件入口；本教程未运行代码或复现实验&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;MemGPT 不是按“事实/事件/技能”建立一棵统一内容树，而是先按上下文角色和存储层描述内容：system instructions 是静态控制说明；working context 保存对话中重要的用户事实、偏好和 persona 信息；FIFO queue 保存滚动消息、系统警告和函数输入输出；recall storage 保留消息历史；archival storage 保存任意长度的外部文本。这个设计把“要保留什么”与“当前是否能直接看到”分开。&quot;,&quot;why&quot;:&quot;如果只说“它保存聊天记录”，读者会看不出为什么还要有 working context 和 archival storage。先按内容在决策中的角色拆开，才能理解哪些信息要常驻、哪些信息可以离开上下文后再取回。&quot;,&quot;example&quot;:&quot;用户说“我下周要去夏威夷，喜欢安静的海滩”：偏好和人物信息可以整理进 working context；完整对话进入 recall；很长的资料文档放进 archival storage。&quot;,&quot;trace&quot;:&quot;MemGPT HTML §2.1 说明 system instructions、working context、FIFO 的组成和用途；§2.2 说明 recall storage；§2 的 archival storage 段落说明任意长度文本。论文的分类是该方法的分层设计，不是跨系统通用 taxonomy。&quot;},{&quot;answer&quot;:&quot;它的主要载体是两层：main context，也就是实际送入 LLM 的 prompt tokens；external context，也就是固定窗口之外的 recall database 和 archival storage。main context 内又有 system instructions、固定大小的可读写 working context 和 FIFO queue。论文实验的 archival storage 使用 PostgreSQL/pgvector 做向量搜索，但这个后端是实验配置，不能写成 MemGPT 的唯一物理实现。&quot;,&quot;why&quot;:&quot;“working context”既是概念上的工作区，也是 prompt 中的一段文本；“recall/archival”是外部存储。把逻辑层和实验后端分开，才能避免把数据库名称误当作 Memory 类型。&quot;,&quot;example&quot;:&quot;一次检索可以先在 PostgreSQL/pgvector 中找候选，再把结果追加回 FIFO queue；LLM 只会看到被重新放入 main context 的文本。&quot;,&quot;trace&quot;:&quot;§2 先区分 main context 与 external context；§2.1 说明 prompt 的三段；§3.2.1 说明 PostgreSQL、pgvector、HNSW 和 cosine similarity 是文档分析实验的配置。论文没有要求所有部署使用这些组件。&quot;},{&quot;answer&quot;:&quot;论文的主要主体是一个长期服务单个用户或 persona 的语言 Agent，也包含文档分析 Agent。对话实验围绕同一对 persona 的多次 session，目标是保持一致性和利用过去信息增强 engagement；文档实验则把 Wikipedia 文档放进 archival storage。论文没有为 team、tenant 或跨 Agent 共享定义访问拓扑。&quot;,&quot;why&quot;:&quot;同一套“长期记忆”在个人对话和文档分析中服务的对象不同。明确主体后，读者不会把论文里的单 Agent 记忆误读成已经解决的团队共享和租户隔离。&quot;,&quot;example&quot;:&quot;对话场景中，Agent 记住某个用户过去说过的偏好；文档场景中，Agent 检索 Wikipedia 文章。两者都用 archival storage，但主体和目标不同。&quot;,&quot;trace&quot;:&quot;论文摘要和 §3.1 的 Multi-Session Chat/长期 persona 设定支持对话主体；§3.2 的 Wikipedia/NaturalQuestions-Open 支持文档主体。team、tenant、consent 与跨 Agent 共享在论文范围内未定义。&quot;},{&quot;answer&quot;:&quot;生命周期由“写入、容量压力、换出、摘要、再检索”组成。新消息和模型输出先写入 recall；接近 warning token count 时，queue manager 发出 memory-pressure 警告，让 Agent 把重要内容写进 working context 或 archival storage；达到 flush token count 时，队列被逐出并生成递归摘要，原消息仍保留在 recall 中。模型还可以通过函数调用主动编辑和检索。论文把 recall 中的消息描述为 indefinitely 保存，但没有通用 TTL、版本回滚或物理删除流程。&quot;,&quot;why&quot;:&quot;这个问题的关键是区分“暂时离开上下文”和“真正遗忘”。MemGPT 的 eviction 解决容量，不等于删除；摘要解决当前窗口，不等于原始记录消失。&quot;,&quot;example&quot;:&quot;对话变长时，系统先提醒 Agent 把“用户过敏信息”写入 working context；随后 flush FIFO。下次需要时再通过 recall function 搜索被逐出的原消息。&quot;,&quot;trace&quot;:&quot;§2.2 描述 append、warning/flush token count、queue eviction、recursive summary 和 recall 持久化；§2.3 描述 self-directed edit/retrieval。论文没有给出 TTL、用户删除、冲突回滚或删除传播协议。&quot;},{&quot;answer&quot;:&quot;事实（论文架构）：外部内容必须被显式移入 main context，才能作为本次 LLM inference 的输入。MemGPT 用函数调用执行 recall/archival 搜索、把结果追加到队列，并用 pagination 避免一次检索撑爆上下文；request_heartbeat 和 function chaining 允许模型连续调用多个函数后再回答。因而“外部已经存着”与“本次调用实际看到了”是两个状态。&quot;,&quot;why&quot;:&quot;Memory 是否影响行为，取决于暴露链路而不只取决于存储。这个例子把 retrieval、context injection 和后续推理分开，正好解释为什么第五问要单独问。&quot;,&quot;example&quot;:&quot;用户问“上次旅行午餐吃了什么”：Agent 先用 recall function 搜索旧消息，分页取得候选，追加到 FIFO，再调用模型生成回答；如果不调用检索，archive 中的事实不会自动进入输入。&quot;,&quot;trace&quot;:&quot;§2 的 main/external context 与显式移入规则、§2.2 的 retrieved messages appended to queue、§2.3 的 pagination、§2.4 的 heartbeat/function chaining 支持这条暴露路径。&quot;},{&quot;answer&quot;:&quot;论文没有规定完整的读写权限、用户同意、来源审计、投毒防护、跨租户隔离或删除证明。它把写入和检索控制交给模型生成的 function calls，并由 parser 校验参数、把运行错误反馈给模型；这说明方法有操作控制环，但不等于治理策略。尤其是自主管理和“stored indefinitely”可能带来需要额外治理的风险。&quot;,&quot;why&quot;:&quot;研究原型常把“模型能否自己管理上下文”作为贡献，却没有同时解决生产系统的责任边界。把未说明项明确列出，能防止读者把 OS 比喻误读成安全规范。&quot;,&quot;example&quot;:&quot;外部治理建议（非论文自带能力）：应用可以在外层增加只读工具、用户删除接口或审计日志，但这些不是论文自动提供的能力；仅凭 function schema 不能证明谁有权调用它。&quot;,&quot;trace&quot;:&quot;§2.3 说明 parser、function schema 和 runtime error feedback；论文的架构与实验章节没有给出 IAM、consent、provenance、poisoning、retention 或 deletion protocol。因此标记为 not_specified，而不是“不支持”。&quot;}]},{&quot;id&quot;:&quot;voyager&quot;,&quot;title&quot;:&quot;Voyager&quot;,&quot;date&quot;:&quot;2023-05-25 · 预印本首发；2024-03 · TMLR&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;summary&quot;:&quot;在Minecraft中把成功完成任务的行动程序积累为技能库。后续任务先检索相关代码，再由模型组合和修正，最后交给环境执行；学习发生在外部程序库，不需要微调底模。&quot;,&quot;why&quot;:&quot;它把“记住怎么做”落实为可执行代码，适合观察程序性经验如何跨任务复用，也能看清保存技能与真正完成新任务之间还隔着检索、组合和验证。&quot;,&quot;boundary&quot;:&quot;TMLR发表身份由期刊官方目录确认；机制采用arXiv v2与作者仓库固定提交。实验环境是Minecraft和历史GPT-4/GPT-3.5配置，本教程没有重跑，也不将游戏内成绩推广到现实系统。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;voyager-meta&quot;,&quot;voyager-venue&quot;,&quot;voyager-paper&quot;,&quot;voyager-skills&quot;,&quot;voyager-runtime&quot;],&quot;checkedAt&quot;:&quot;2026-11-12&quot;,&quot;canonicalUrl&quot;:&quot;https://arxiv.org/html/2305.16291v2&quot;,&quot;selectionEvidence&quot;:&quot;TMLR 2024年3月正式发表；作者来自NVIDIA、Caltech、UT Austin、Stanford和UW Madison等机构。公开论文、提示词和代码，论文包含移除技能库的消融及新世界任务实验。收录理由是其可核对的技能积累机制；论文与作者代码为同源证据。&quot;,&quot;limitations&quot;:&quot;成功验证依赖模型对环境状态的判断，可能误判；程序正确性、跨环境泛化和执行安全都不是一次成功即可保证。论文§4报告模型调用开销、幻觉和验证误判等限制。可复用程序不等于通用知识库，也不是对模型参数的持续训练。&quot;,&quot;next&quot;:&quot;engineering&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;以可执行技能库为长期记忆的具身Agent研究&quot;,&quot;authors&quot;:&quot;Guanzhi Wang、Yuqi Xie、Yunfan Jiang、Ajay Mandlekar、Chaowei Xiao、Yuke Zhu、Linxi Fan、Anima Anandkumar&quot;,&quot;venue&quot;:&quot;Transactions on Machine Learning Research，2024年3月；ICLR 2025 Journal Track为后续展示&quot;,&quot;artifact&quot;:&quot;arXiv v2全文、作者项目与技能管理/执行代码&quot;,&quot;version&quot;:&quot;arXiv:2305.16291v2；MineDojo/Voyager提交55e45a880755d0c8c66ca7fb5fe7962ac8974f89；2026-11-12核查&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;最核心的长期内容是成功执行过的技能程序，以及描述该程序用途的文本。当前物品、位置、环境反馈、错误和critic意见用于本次决策与修正；自动课程还跟踪完成和失败的任务。这里的“技能记忆”保存的是一段能组织连续动作的方法，不是只记录“曾经做成了什么”的事件句子。&quot;,&quot;why&quot;:&quot;以后需要相同行为时，保留可调用程序能免去从零重建每一步；描述文本让系统知道何时值得找出它。若只保存结果，模型仍需重新发明操作方法；若只保存代码，又缺少便于语义检索的用途说明。&quot;,&quot;example&quot;:&quot;论文引言举出craftStoneShovel()、combatZombieWithSword()这类技能名。教学推演：以后要挖掘某种材料时，可利用已掌握的造工具方法；具体新任务仍要检查材料是否齐备，不能因为库里有函数就认定它一定能成功。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》引言、§2.1至§2.3；《Voyager · 技能存储与检索源码》skills中的code/description。技能角色是方法事实；复用情境为教学推演。&quot;},{&quot;answer&quot;:&quot;技能存在模型参数之外。论文用向量数据库组织技能：描述的embedding作为检索线索，返回对应程序。固定代码另把JavaScript程序、描述文本和skills.json落盘，并持久化Chroma索引；skills.json维护当前技能名到代码/描述的对应关系。代码是可执行载体，embedding是查找线索，两者不能互相替代。&quot;,&quot;why&quot;:&quot;这个结构解释了它如何跨模型调用保留能力，也解释了为什么没有参数微调仍能积累经验。文件与索引还必须保持一致，否则查到的名称可能指向缺失或错误的程序。&quot;,&quot;example&quot;:&quot;教学示意：描述“制作石铲”被编码进索引，命中后取回具体JavaScript函数。下一次模型看到的是程序文本，执行器运行的也是程序；它不会把向量本身当作Minecraft动作。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》§2.2；《Voyager · 技能存储与检索源码》__init__、add_new_skill、retrieve_skills及同步assert。数据库名是该固定实现的选择，不是所有程序性记忆的要求。&quot;},{&quot;answer&quot;:&quot;论文主体是一个探索Minecraft的Agent，其技能库可以跨任务使用，并在新世界任务实验中带入之前学到的技能。代码通过ckpt_dir或skill_library_dir指定这份库；实验还尝试将已学库交给AutoGPT使用。这说明程序工件可以迁移，但没有定义面向多个用户、组织或租户的通用授权协议。&quot;,&quot;why&quot;:&quot;“换任务仍然能用”与“谁都可以读”是不同问题。研究中的迁移实验有意复用技能，部署中的共享则还需要明确归属、可见范围和对执行环境的假设。&quot;,&quot;example&quot;:&quot;论文§3.3的新世界实验清空物品栏、换新世界，再使用既有技能完成未见任务。教学延伸：若两个机器人接口不同，不能只复制技能库就推定兼容；需要检查API与前置条件。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》§3.3新世界任务及AutoGPT+技能库对照；《Voyager · 技能进入模型与执行器》初始化skill_library_dir。机器人对照是边界例子，未做实验。&quot;},{&quot;answer&quot;:&quot;任务开始后先生成行动代码，执行并收集环境反馈、运行错误和critic意见，再迭代修正。论文设置单任务最多四轮代码生成；critic判定成功后才将新技能加入库。固定代码对同名技能更新当前映射与索引，同时以V2等后缀保存新的程序文件；它不是简单无条件追加所有尝试，也没有在该路径中实现完整的技能淘汰策略。&quot;,&quot;why&quot;:&quot;写入门槛决定哪些行为成为未来经验。若失败程序也直接进入技能库，之后可能反复重用错误；但critic本身会误判，所以“经过验证”仍不等于形式化证明。&quot;,&quot;example&quot;:&quot;教学流程：造工具失败 → 错误指出材料不够 → 修正程序并再次执行 → critic确认任务完成 → 保存技能。若同名函数后来被改进，当前映射可指向新版；旧文件留在磁盘不代表检索会自动遍历所有历史版本。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》§2.3及§4；《Voyager · 技能存储与检索源码》add_new_skill；《Voyager · 技能进入模型与执行器》learn中的success条件。旧文件与当前映射的区别由代码直接支持。&quot;},{&quot;answer&quot;:&quot;面临任务时，以任务建议和环境信息构成查询，从描述索引中取出相关技能，论文/默认实现最多取五个，库较小时相应减少。检索到的代码进入行动模型的提示词，帮助它生成或组合新程序；执行时env.step还获得已有程序库与控制原语，供程序调用。因此“模型看到哪些技能”和“执行器能调用哪些函数”是两个相连但不同的环节。&quot;,&quot;why&quot;:&quot;只说RAG检索会漏掉最关键的行动接口：文字代码需要被模型正确组合，并交给运行环境执行。也不能把最多五个检索结果误写成执行器只加载五个函数。&quot;,&quot;example&quot;:&quot;教学推演：为采矿检索造工具技能，把相关函数交给模型生成采矿流程；执行器接收完整可用程序集合。模型可能仍选错工具或忽略材料约束，最终是否成功要回到环境反馈判断。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》§2.2；《Voyager · 技能存储与检索源码》retrieve_skills与programs；《Voyager · 技能进入模型与执行器》reset构造system_message、step的env.step(programs=...)。&quot;},{&quot;answer&quot;:&quot;研究者设置环境、API、模型和提示词，自动课程提出任务，行动模型编写代码，critic决定是否成功并影响写入。公开方法主要控制任务与技能质量，未提供生产环境中的身份授权、恶意代码验证或敏感记忆删除保证。论文§4还提醒调用成本和幻觉；§7指出，把它用于物理机器人等场景时，需要人类增加安全约束。&quot;,&quot;why&quot;:&quot;一段记忆如果可以直接执行，错误的影响就可能从“回答不准”扩大为错误操作。成功判定、代码权限和数据权限应分别检查，不能用游戏任务通过来代替安全审查。&quot;,&quot;example&quot;:&quot;教学检查：将类似技能库用于真实文件操作前，先限制可调用接口和写入目录，再检查函数的副作用。这个要求是迁移到现实环境的设计推论，Voyager的Minecraft实验没有验证该部署方案。&quot;,&quot;trace&quot;:&quot;《Voyager · arXiv v2方法与实验》§2.3、§4、§7；《Voyager · 技能进入模型与执行器》的代码执行与成功门槛。控制者分工是事实，现实部署要求为教程推论。&quot;}]},{&quot;id&quot;:&quot;memorybank&quot;,&quot;title&quot;:&quot;MemoryBank&quot;,&quot;date&quot;:&quot;2024&quot;,&quot;researchKind&quot;:&quot;method&quot;,&quot;summary&quot;:&quot;把对话记录、事件摘要和用户信息组织成可检索的长期记忆，并探索衰减与强化。&quot;,&quot;why&quot;:&quot;它是较早把个性化、选择性保留和时间变化放进 Agent Memory 方法的代表性工作。&quot;,&quot;boundary&quot;:&quot;AAAI 2024 发表记录和作者仓库可定位；本教程未复现实验，完整六问待补。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;memorybank:1&quot;,&quot;memorybank:2&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;canonicalUrl&quot;:&quot;https://doi.org/10.1609/aaai.v38i17.29946&quot;}],&quot;engineering&quot;:[{&quot;id&quot;:&quot;agentcore-memory&quot;,&quot;title&quot;:&quot;Amazon Bedrock AgentCore Memory&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;AWS 托管 Agent Memory，文档区分短期和长期策略。&quot;,&quot;why&quot;:&quot;它展示云服务如何把 Memory 类型、策略和运行配置分开。&quot;,&quot;boundary&quot;:&quot;云服务行为受区域、版本和权限配置影响。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;amazon-bedrock-agentcore-memory&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html&quot;},{&quot;id&quot;:&quot;claude-code&quot;,&quot;title&quot;:&quot;Claude Code&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;Anthropic 的 coding agent，官方文档公开了 CLAUDE.md 与自动记忆机制。&quot;,&quot;why&quot;:&quot;官方产品文档和仓库提供可定位的 Memory 说明，且直接面向真实 coding workflow。&quot;,&quot;boundary&quot;:&quot;记录的是文档声明和公开文件边界；未运行当前版本。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;claude-code&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;selectionEvidence&quot;:&quot;官方 Memory 文档与仓库在 2026-11-11 可定位；纳入依据是公开机制清晰，不推断用户规模或效果。&quot;,&quot;limitations&quot;:&quot;内部检索、缓存、审计、删除传播和团队隔离细节未完全公开；版本行为可能变化。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;questions&quot;:[{&quot;answer&quot;:&quot;官方文档把两种机制分开：CLAUDE.md 或 AGENTS.md 是人写的持久指令与规则，auto memory 是 Claude 根据纠正、偏好和项目上下文写下的 learnings 与 patterns。它们都可能影响后续 coding calls，但内容角色不同：前者主要规定“应该怎么做”，后者主要保存“已经学到什么”。原始会话历史不等于这两类持久 Memory。&quot;,&quot;trace&quot;:&quot;Claude Code 官方 Memory 文档的 “CLAUDE.md vs auto memory” 表格与开头说明，明确列出写入主体、内容和使用场景。&quot;},{&quot;answer&quot;:&quot;可观察的承载包括项目、用户或组织级 Markdown 指令文件，以及按仓库维护的 auto memory 文件或目录。调用时，规则文件和自动记忆会作为上下文准备的一部分被读取；文档没有公开所有内部索引、缓存和选择实现。一个文件可以是权威记录，也可能只是给模型加载的文本，不能仅凭文件扩展名判断它的认知角色。&quot;,&quot;trace&quot;:&quot;官方文档的文件层级、auto memory storage location 和加载说明；内部索引、缓存和完整注入策略没有在该页公开。&quot;},{&quot;answer&quot;:&quot;范围至少分为用户级、项目级和组织级规则；auto memory 按仓库维护，并可跨 worktree 共享。项目约定可以进入版本控制并被团队共享，个人偏好通常留在用户环境；但文件可见性和团队权限还取决于实际文件系统、仓库和部署配置。跨会话持续不等于自动获得跨用户授权。&quot;,&quot;trace&quot;:&quot;官方文档的 scope 表格和 auto memory scope 说明；权限、租户隔离和组织治理不能从目录层级单独推出。&quot;},{&quot;answer&quot;:&quot;规则文件由人维护，也可以通过常规编辑流程更新；auto memory 会根据交互中的纠正、偏好和项目上下文积累学习。文档提供查看、审计和编辑入口，但没有把所有冲突合并、旧事实撤回、删除传播和保留期定义成公开协议。因此分析时要分别记录“谁写入”和“怎样停止继续影响”。&quot;,&quot;trace&quot;:&quot;官方文档的 “When to add to CLAUDE.md”、auto memory audit/edit 与 troubleshooting 小节；未公开的冲突和删除语义保持为 not_specified。&quot;},{&quot;answer&quot;:&quot;下一次调用通过启动时加载规则和自动记忆获得相关信息，也可以由 Agent 通过文件或工具主动查看。文档说明 auto memory 会加载一部分内容，不能据此说每个文件都会完整进入上下文；具体选择、截断、上下文预算和失败回退属于实现细节。写入文件、被读取、进入模型输入和改变行动是四个不同阶段。&quot;,&quot;trace&quot;:&quot;官方文档的 session start、loading、first 200 lines or 25KB 等说明；这些事实支持“存在加载路径”，不支持对内部排序策略的推断。&quot;},{&quot;answer&quot;:&quot;控制主体是 Claude Code 运行环境、用户和项目文件权限的组合。用户可以编辑或删除规则和自动记忆文件，但公开文档没有完整说明审计日志、跨租户共享、投毒防护、删除证明或组织级保留政策。这里应把“用户能改文件”与“系统能证明所有派生副本已停止影响”分开。&quot;,&quot;trace&quot;:&quot;官方文档的文件编辑/审计入口与 scope 说明；未说明项不作支持或不支持判断。&quot;}],&quot;canonicalUrl&quot;:&quot;https://code.claude.com/docs/en/memory&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;官方 coding agent / harness&quot;,&quot;maintainer&quot;:&quot;Anthropic&quot;,&quot;artifact&quot;:&quot;官方 Memory 文档、CLAUDE.md/AGENTS.md 规则文件说明与 auto memory 说明；本教程没有运行当前版本&quot;,&quot;version&quot;:&quot;文档版本未固定；页面按 2026-11-11 核对日期记录&quot;}},{&quot;id&quot;:&quot;claude-mem&quot;,&quot;title&quot;:&quot;Claude-Mem&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;面向 Claude Code 的外部记忆插件，公开仓库提供实现入口。&quot;,&quot;why&quot;:&quot;它展示插件如何把会话观察、摘要和检索接到 coding agent。&quot;,&quot;boundary&quot;:&quot;第三方插件的安全、版本和数据保留需单独核验。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;claude-mem&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/thedotmack/claude-mem&quot;},{&quot;id&quot;:&quot;crewai&quot;,&quot;title&quot;:&quot;CrewAI&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;多 Agent framework，公开 Memory 与协作相关配置。&quot;,&quot;why&quot;:&quot;它可用于观察团队范围、角色和共享记忆的工程取舍。&quot;,&quot;boundary&quot;:&quot;不同存储后端与版本配置会改变行为。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;crewai&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/crewAIInc/crewAI&quot;},{&quot;id&quot;:&quot;deep-agents&quot;,&quot;title&quot;:&quot;Deep Agents&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;LangChain 的高层 Agent harness，文档提供规划、文件系统和 Memory 机制。&quot;,&quot;why&quot;:&quot;它展示工程系统如何把长期任务、文件和摘要组合为可用 Memory。&quot;,&quot;boundary&quot;:&quot;文档级条目，版本和运行时行为需锁定。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;deep-agents&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/langchain-ai/deepagents&quot;},{&quot;id&quot;:&quot;google-adk&quot;,&quot;title&quot;:&quot;Google ADK&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;Google Agent Development Kit，提供会话和 Memory service 相关能力。&quot;,&quot;why&quot;:&quot;它补充 Agent framework 端的状态和长期 Memory 组合。&quot;,&quot;boundary&quot;:&quot;框架能力与具体部署配置需要分开。&quot;,&quot;status&quot;:&quot;pending&quot;,&quot;sources&quot;:[&quot;google-adk&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://github.com/google/adk-python&quot;},{&quot;id&quot;:&quot;google-memory-bank&quot;,&quot;title&quot;:&quot;Google Agent Platform Memory Bank&quot;,&quot;date&quot;:&quot;公开日期未说明&quot;,&quot;summary&quot;:&quot;Google Gemini Enterprise Agent Platform 的托管 Memory 服务：从 Sessions 或 Agent 事件提取、合并并保存长期记忆，再按 identity scope 做全量或相似度检索。&quot;,&quot;why&quot;:&quot;它是工程端很完整的托管样本：官方文档同时写出记忆内容、identity scope、自动提取与合并、异步写入、检索、TTL、revision、IAM 和数据驻留边界，能把研究里的六问落到可配置 API 和治理责任上。&quot;,&quot;boundary&quot;:&quot;本文只根据 Google Cloud 官方文档描述公开 API/配置语义；没有创建实例、调用服务或验证某个区域/版本的实际行为。治理建议不等于部署合规证明。&quot;,&quot;status&quot;:&quot;complete&quot;,&quot;sources&quot;:[&quot;google-agent-platform-memory-bank&quot;,&quot;google-memory-bank:generate&quot;,&quot;google-memory-bank:fetch&quot;,&quot;google-memory-bank:setup&quot;,&quot;google-memory-bank:revisions&quot;,&quot;google-memory-bank:iam&quot;,&quot;google-memory-bank:governance&quot;,&quot;google-memory-bank:data-residency&quot;],&quot;checkedAt&quot;:&quot;2026-11-11&quot;,&quot;realityNote&quot;:&quot;&quot;,&quot;canonicalUrl&quot;:&quot;https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank&quot;,&quot;selectionEvidence&quot;:&quot;官方概览和配套页面明确说明 managed persistent store、identity-scoped isolation、similarity retrieval、GenerateMemories/CreateMemory、Extraction/Consolidation、TTL、revisions、IAM conditions、VertexAiMemoryBankService、poisoning 与 data residency。收录依据是公开机制和治理边界可定位，不是用户规模或效果排名。&quot;,&quot;limitations&quot;:&quot;文档中的 IAM、TTL、revision 与区域控制需要结合具体项目、实例和版本配置；页面没有给出本教程可复现的性能数据，也不能从 feature list 推出物理删除传播、隐私合规或每个区域的默认行为。&quot;,&quot;next&quot;:&quot;benchmarks&quot;,&quot;profile&quot;:{&quot;kind&quot;:&quot;官方托管 Agent Memory 服务&quot;,&quot;maintainer&quot;:&quot;Google Cloud / Gemini Enterprise Agent Platform&quot;,&quot;artifact&quot;:&quot;官方 Memory Bank 概览、Generate/Fetch/Setup/Revisions/IAM 文档；本教程未创建实例或运行 API&quot;,&quot;version&quot;:&quot;官方文档页面快照 2026-11-11 UTC；服务行为随区域、版本和项目配置变化&quot;},&quot;questions&quot;:[{&quot;answer&quot;:&quot;Memory Bank 的基本单位是带 scope 的长期记忆事实或洞见。官方示例把对话中的用户偏好、历史和关键细节抽取成独立、自包含的 memory；GenerateMemories 从 session events 或多模态内容中提取，CreateMemory 允许 Agent 直接写入。它不是把完整 transcri
