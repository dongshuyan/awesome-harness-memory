function renderCompare(){return `${crumbs(&#x27;系统比较&#x27;)}&lt;h1&gt;看不同系统如何组合记忆能力。&lt;/h1&gt;&lt;p class=&quot;kn-note&quot;&gt;这里保留原始资料中的七组组合属性；“范围与期限”“表示与存储”等尚未逐系统拆核，不能把它们直接视为九个学习专题的独立能力声明。&lt;/p&gt;&lt;p class=&quot;kn-lead&quot;&gt;一次展开多个视角，查看真实文档描述。更完整的功能、限制和来源放在系统详情里；本页不把功能数量当成质量分数。&lt;/p&gt;&lt;div class=&quot;kn-filter&quot;&gt;&lt;label&gt;系统类别&lt;select id=&quot;kn-compare-group&quot;&gt;${options({all:&#x27;全部已核系统&#x27;,...Object.fromEntries(Object.entries(groupNames).filter(([g])=&gt;resources.some(r=&gt;r.status===&#x27;documented&#x27;&amp;&amp;r.group===g)))},state.compareGroup)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;fieldset class=&quot;kn-axis-select&quot;&gt;&lt;legend&gt;同时查看哪些视角&lt;/legend&gt;${axes.map(a=&gt;`&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-compare-axis=&quot;${a.id}&quot; ${state.compareAxes.includes(a.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${esc(a.name)}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/fieldset&gt;&lt;div id=&quot;kn-compare-results&quot;&gt;${compareTable()}&lt;/div&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;layers&quot;&gt;查看 Harness / Agent 记忆切片 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-status-filter=&quot;pending&quot;&gt;查看待核对象 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;立体图仅比较 Harness 与 Agent；独立记忆层、插件和框架继续保留在本目录。图中逐格附依据，未核属性显示问号。&lt;/p&gt;`;}
function renderLayers(){const graph={dimensions:navigation.graphDimensions};return `${crumbs(&#x27;图解探索&#x27;)}&lt;h1&gt;比较真实 Harness / Agent 的记忆组合。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;使用七组已有证据的属性切片比较真实对象。这是系统资料的选定投影，与学习导航的九个问题分别组织。勾选多个对象和维度、调整角度与间距，再点击格子查看条件与来源。独立记忆服务、插件和纯框架不作为这张图的主体。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;图中的七组属性，对应哪些学习专题？&lt;/summary&gt;${graph.dimensions.map(a=&gt;`&lt;div class=&quot;kn-projection-row&quot;&gt;&lt;strong&gt;${esc(a.name)}&lt;/strong&gt;&lt;div class=&quot;kn-actions&quot;&gt;${navigation.graphTopics[a.id].map(id=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-topic=&quot;${esc(id)}&quot;&gt;${esc(topicBy(id).title)} →&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;kn-note&quot;&gt;图中只展示已有逐格来源的属性，未覆盖全部理论分类。合并属性在专题中拆开解释；不据此补造系统能力。&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;查看完整系统目录与说明 →&lt;/button&gt;&lt;/div&gt;`;}
function renderAbout(){return `${crumbs(&#x27;来源与收录说明&#x27;)}&lt;h1&gt;让入口有依据，也让边界看得见。&lt;/h1&gt;&lt;div class=&quot;kn-detail-body&quot;&gt;&lt;h2&gt;本轮覆盖&lt;/h2&gt;&lt;p&gt;${coverageText()}&lt;/p&gt;&lt;p&gt;资源目录核对至 ${esc(catalogue.checked_utc)}，专题说明更新于 ${esc(knowledge.checked)}，结合此前目录、候选池、中文报告、用户提名和补充系统核对；不声称穷尽全部记忆系统。&lt;/p&gt;&lt;h2&gt;四种状态怎么读&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;基础资料已核：读过可定位的原始文档、README 或作品介绍，支持这里的基础说明；不代表运行验证或安全认证。&lt;/li&gt;&lt;li&gt;研究阅读入口：论文身份、摘要或相关章节已核，完整方法和实验还需继续阅读。&lt;/li&gt;&lt;li&gt;待核线索：名称、当前机制、证据深度或已知问题仍需查清，不计入已核系统。&lt;/li&gt;&lt;li&gt;历史资料：有参考价值，但不作为当前维护方案推荐。&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;分类与图解&lt;/h2&gt;&lt;p&gt;九个问题是编者阅读导航；分类树明确标出研究来源，不是唯一分类。资料共同出现不表示存在实际数据流。立体切片展示真实 Harness 与 Agent，按属性标注公开资料依据和配置条件；没有依据的格子保留问号。&lt;/p&gt;&lt;h2&gt;占比和效果&lt;/h2&gt;&lt;p&gt;精选目录不能代表研究或商业市场分布。比例统计还需要可复现的采样范围、时间、检索式、分母和重叠规则。本轮没有运行 Benchmark，也没有生成统一效果排名。&lt;/p&gt;&lt;h2&gt;README 与交互页&lt;/h2&gt;&lt;p&gt;README 保留研究问题导航、按需路线、对象目录和静态图片，可以独立阅读；完整交互可部署到 GitHub Pages 或独立站点。在线入口由 GitHub Pages 提供。&lt;/p&gt;&lt;/div&gt;`;}
function renderNotFound(){return `${crumbs(&#x27;页面不存在&#x27;)}&lt;div class=&quot;kn-empty&quot;&gt;&lt;h1&gt;找不到这个课程页面&lt;/h1&gt;&lt;p&gt;链接 &lt;code&gt;${esc(state.routePath||&#x27;&#x27;)}&lt;/code&gt; 没有对应的课程章节或条目。页面不会默默跳到另一个对象。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn kn-tutorial-primary&quot; data-go=&quot;tutorial-home&quot;&gt;回到课程首页 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-research&quot;&gt;浏览 Research →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}

function topicBy(id){return knowledge.topics.find(t=&gt;t.id===(knowledge.aliases[id]||id))||knowledge.topics[0];}
function sourceLinks(ids){return `&lt;ul class=&quot;kn-source-links&quot;&gt;${[...new Set((ids||[]).filter(Boolean))].map(id=&gt;{const s=knowledge.sources[id];if(!s)return &#x27;&#x27;;const meta=[s.year,s.evidence].filter(Boolean).join(&#x27; · &#x27;);return `&lt;li&gt;&lt;a href=&quot;${esc(s.url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;${esc(s.label)} ↗&lt;/a&gt;${meta?`&lt;small&gt;${esc(meta)}&lt;/small&gt;`:&#x27;&#x27;}&lt;/li&gt;`;}).join(&#x27;&#x27;)}&lt;/ul&gt;`;}
function flow(steps){return `&lt;ol class=&quot;kn-flow&quot; aria-label=&quot;帮助理解的示意&quot;&gt;${steps.map(s=&gt;`&lt;li&gt;${esc(s)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;`;}
function comicStrip(t){const steps=(t.steps||[t.what,t.when,t.use||t.purpose,t.example]).filter(Boolean).slice(0,4);const icons=[&#x27;✍&#x27;,&#x27;🧠&#x27;,&#x27;↗&#x27;,&#x27;✓&#x27;];return `&lt;ol class=&quot;kn-comic&quot; aria-label=&quot;漫画式理解示意&quot;&gt;${steps.map((s,i)=&gt;`&lt;li class=&quot;kn-comic-panel&quot;&gt;&lt;span class=&quot;kn-comic-icon&quot; aria-hidden=&quot;true&quot;&gt;${icons[i%icons.length]}&lt;/span&gt;&lt;span class=&quot;kn-comic-step&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;p&gt;${esc(s)}&lt;/p&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;`;}
function explanation(t,{type=false,heading=&#x27;h2&#x27;}={}){
 const titleTag=heading===&#x27;h3&#x27;?&#x27;h3&#x27;:&#x27;h2&#x27;;
 return `&lt;article class=&quot;kn-explanation&quot;&gt;&lt;header&gt;&lt;p class=&quot;kn-kicker&quot;&gt;${esc(t.en)}&lt;/p&gt;&lt;${titleTag}&gt;${esc(t.zh)}&lt;/${titleTag}&gt;&lt;/header&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(t.def||t.definition)}&lt;/p&gt;${t.enDefinition?`&lt;p class=&quot;kn-english&quot;&gt;${esc(t.enDefinition)}&lt;/p&gt;`:&#x27;&#x27;}&lt;details class=&quot;kn-expand&quot;&gt;&lt;summary&gt;展开解释与具体例子&lt;/summary&gt;&lt;dl class=&quot;kn-explain-fields&quot;&gt;${t.what?`&lt;dt&gt;${type?&#x27;记录什么&#x27;:&#x27;涉及什么&#x27;}&lt;/dt&gt;&lt;dd&gt;${esc(t.what)}&lt;/dd&gt;`:&#x27;&#x27;}${t.when?`&lt;dt&gt;什么时候用&lt;/dt&gt;&lt;dd&gt;${esc(t.when)}&lt;/dd&gt;`:&#x27;&#x27;}${(t.use||t.purpose)?`&lt;dt&gt;用来做什么&lt;/dt&gt;&lt;dd&gt;${esc(t.use||t.purpose)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;&lt;div class=&quot;kn-example&quot;&gt;&lt;h3&gt;用一个例子理解&lt;/h3&gt;&lt;p&gt;${esc(t.example)}&lt;/p&gt;${comicStrip(t)}&lt;small&gt;帮助理解的例子，由编者构造；不作为系统效果证据。&lt;/small&gt;&lt;/div&gt;&lt;p class=&quot;kn-boundary&quot;&gt;&lt;strong&gt;容易混淆的地方：&lt;/strong&gt;${esc(t.boundary)}&lt;/p&gt;&lt;/details&gt;&lt;details class=&quot;kn-expand&quot;&gt;&lt;summary&gt;定义依据与原始来源&lt;/summary&gt;${sourceLinks(t.sources)}&lt;/details&gt;${t.resources?.length?`&lt;div class=&quot;kn-section&quot;&gt;&lt;h3&gt;继续看方法与实现&lt;/h3&gt;${refs(t.resources)}&lt;p class=&quot;kn-note&quot;&gt;这些是相关阅读入口。具体能力、配置条件与核对程度见每条资料，不表示它们实现了本专题的所有做法。&lt;/p&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/article&gt;`;
}
function frameworkList(){return Object.entries(knowledge.frameworks||{}).sort((a,b)=&gt;(a[1].order||99)-(b[1].order||99));}
function frameworkCategories(id){const f=knowledge.frameworks[id]||{};if(Array.isArray(f.categories))return f.categories;return [];}
function frameworkCategoryIds(id){return frameworkCategories(id).map(c=&gt;c.id);}
function frameworkCategoryData(cat){if(cat?.typeId)return knowledge.types[cat.typeId]||cat;if(cat?.term)return knowledge.terms[cat.term]||cat;return cat||{};}
function contentMethods(){return Object.fromEntries((knowledge.draftTaxonomy?.items||[]).map(m=&gt;[m.id,m]));}
function contentMethod(id){const methods=contentMethods();return methods[id]||Object.values(methods)[0];}
function frameworkSummary(f){return `&lt;span class=&quot;kn-framework-meta&quot;&gt;&lt;span&gt;${esc(f.status||&#x27;&#x27;)}&lt;/span&gt;&lt;span&gt;证据：${esc(f.confidence||&#x27;待定&#x27;)}&lt;/span&gt;&lt;span&gt;${esc(f.kind||&#x27;&#x27;)}&lt;/span&gt;&lt;/span&gt;`;}
function frameworkChooser(){return `&lt;div class=&quot;kn-framework-chooser&quot; role=&quot;group&quot; aria-label=&quot;主流分类方式&quot;&gt;${frameworkList().map(([id,f],i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-framework-card ${state.framework===id?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-framework=&quot;${esc(id)}&quot; aria-pressed=&quot;${state.framework===id}&quot;&gt;&lt;span class=&quot;kn-framework-index&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span class=&quot;kn-framework-card-copy&quot;&gt;&lt;strong&gt;${esc(f.name)}&lt;/strong&gt;&lt;small&gt;${esc(f.en)}&lt;/small&gt;${frameworkSummary(f)}&lt;/span&gt;&lt;span class=&quot;kn-framework-arrow&quot; aria-hidden=&quot;true&quot;&gt;${state.framework===id?&#x27;●&#x27;:&#x27;→&#x27;}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function categoryView(cat,selected){const raw=frameworkCategoryData(cat);const definition=cat.definition||raw.def||raw.definition||&#x27;&#x27;;const example=cat.example||raw.example||&#x27;&#x27;;const boundary=cat.boundary||raw.boundary||&#x27;&#x27;;const detail={...raw,zh:cat.zh||raw.zh,en:cat.en||raw.en,def:definition,example};const open=selected&amp;&amp;state.categoryOpen;return `&lt;details class=&quot;kn-framework-category&quot; ${open?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary data-framework-category=&quot;${esc(cat.id)}&quot; aria-current=&quot;${selected?&#x27;true&#x27;:&#x27;false&#x27;}&quot;&gt;&lt;span&gt;&lt;strong&gt;${esc(cat.zh||raw.zh||cat.id)}&lt;/strong&gt;&lt;small&gt;${esc(cat.en||raw.en||&#x27;&#x27;)}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;kn-category-marker&quot; aria-hidden=&quot;true&quot;&gt;${selected?&#x27;●&#x27;:&#x27;＋&#x27;}&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;kn-framework-category-body&quot;&gt;&lt;p&gt;${esc(definition)}&lt;/p&gt;${raw.what||raw.when||raw.use?`&lt;dl class=&quot;kn-explain-fields&quot;&gt;${raw.what?`&lt;dt&gt;记录什么&lt;/dt&gt;&lt;dd&gt;${esc(raw.what)}&lt;/dd&gt;`:&#x27;&#x27;}${raw.when?`&lt;dt&gt;什么时候用&lt;/dt&gt;&lt;dd&gt;${esc(raw.when)}&lt;/dd&gt;`:&#x27;&#x27;}${raw.use?`&lt;dt&gt;用来做什么&lt;/dt&gt;&lt;dd&gt;${esc(raw.use)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;`:&#x27;&#x27;}&lt;div class=&quot;kn-example&quot;&gt;&lt;strong&gt;教学例子&lt;/strong&gt;&lt;p&gt;${esc(example)}&lt;/p&gt;&lt;/div&gt;${boundary?`&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;边界：&lt;/strong&gt;${esc(boundary)}&lt;/p&gt;`:&#x27;&#x27;}${raw.evidenceLevel||raw.standardization?`&lt;dl class=&quot;kn-term-evidence&quot;&gt;&lt;dt&gt;证据等级&lt;/dt&gt;&lt;dd&gt;${esc(raw.evidenceLevel||&#x27;未分级&#x27;)}&lt;/dd&gt;&lt;dt&gt;标准化状态&lt;/dt&gt;&lt;dd&gt;${esc(raw.standardization||&#x27;原文未说明&#x27;)}&lt;/dd&gt;${raw.evidenceSummary?`&lt;dt&gt;来源说明&lt;/dt&gt;&lt;dd&gt;${esc(raw.evidenceSummary)}&lt;/dd&gt;`:&#x27;&#x27;}&lt;/dl&gt;`:&#x27;&#x27;}${(cat.sources||raw.sources)?.length?`&lt;details class=&quot;kn-category-sources&quot;&gt;&lt;summary&gt;查看该类别的来源&lt;/summary&gt;${sourceLinks(cat.sources||raw.sources)}&lt;/details&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/details&gt;`;}
function frameworkCategoryTree(f){const by=Object.fromEntries(frameworkCategories(state.framework).map(c=&gt;[c.id,c]));if(f.dimensions)return f.dimensions.map(dim=&gt;`&lt;section class=&quot;kn-dimension&quot;&gt;&lt;div class=&quot;kn-dimension-head&quot;&gt;&lt;h4&gt;${esc(dim.zh)} &lt;small&gt;${esc(dim.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(dim.description)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;例子：${esc(dim.example)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-framework-category-grid&quot;&gt;${dim.categories.map(c=&gt;categoryView(c,state.frameworkCategory===c.id)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;);return f.roots.map(id=&gt;{const root=by[id];const childIds=f.children?.[id]||[];return `&lt;div class=&quot;kn-category-branch&quot;&gt;${categoryView(root,state.frameworkCategory===root.id)}${childIds.length?`&lt;div class=&quot;kn-category-children&quot; aria-label=&quot;${esc(root.zh)}的子类别&quot;&gt;${childIds.map(cid=&gt;categoryView(by[cid],state.frameworkCategory===cid)).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}).join(&#x27;&#x27;);}
function frameworkFacts(f){const facts=f.sourceFacts||{};const guide=f.readerGuide||{};return `&lt;div class=&quot;kn-framework-evidence&quot;&gt;&lt;section&gt;&lt;h4&gt;来源事实&lt;/h4&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;分类依据&lt;/dt&gt;&lt;dd&gt;${esc(facts.classificationBasis||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;内部关系&lt;/dt&gt;&lt;dd&gt;${esc(facts.categoryRelations||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;结构证据&lt;/dt&gt;&lt;dd&gt;${esc(facts.structureEvidence||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;实证支持&lt;/dt&gt;&lt;dd&gt;${esc(facts.empiricalSupport||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;原文声称的适用范围&lt;/dt&gt;&lt;dd&gt;${esc(facts.scope||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;原文声称的限制&lt;/dt&gt;&lt;dd&gt;${esc(facts.limitations||&#x27;&#x27;)}&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;&lt;section&gt;&lt;h4&gt;编者解释&lt;/h4&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;适用场景&lt;/dt&gt;&lt;dd&gt;${esc(guide.scenarios||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;侧重点&lt;/dt&gt;&lt;dd&gt;${esc(guide.focus||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;优势&lt;/dt&gt;&lt;dd&gt;${esc(guide.advantages||&#x27;&#x27;)}&lt;/dd&gt;&lt;dt&gt;代价&lt;/dt&gt;&lt;dd&gt;${esc(guide.tradeoffs||&#x27;&#x27;)}&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;&lt;/div&gt;`;}
function sourceScenarioCard(s){return `&lt;details class=&quot;kn-source-scenario&quot;&gt;&lt;summary&gt;${esc(s.title)} &lt;small&gt;${esc(s.location)}&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;kn-scenario-body&quot;&gt;&lt;div class=&quot;kn-note&quot;&gt;来源：${sourceLinks([s.source])}&lt;/div&gt;&lt;dl class=&quot;kn-scenario-facts&quot;&gt;&lt;dt&gt;场景背景&lt;/dt&gt;&lt;dd&gt;${esc(s.background)}&lt;/dd&gt;&lt;dt&gt;记忆内容&lt;/dt&gt;&lt;dd&gt;${esc(s.memory)}&lt;/dd&gt;&lt;dt&gt;承载与表示&lt;/dt&gt;&lt;dd&gt;${esc(s.storage)}&lt;/dd&gt;&lt;dt&gt;写入触发与主体&lt;/dt&gt;&lt;dd&gt;${esc(s.write)}&lt;/dd&gt;&lt;dt&gt;读取与注入&lt;/dt&gt;&lt;dd&gt;${esc(s.read)}&lt;/dd&gt;&lt;dt&gt;更新、压缩或遗忘&lt;/dt&gt;&lt;dd&gt;${esc(s.maintenance)}&lt;/dd&gt;&lt;dt&gt;原文效果或定性结论&lt;/dt&gt;&lt;dd&gt;${esc(s.effect)}&lt;/dd&gt;&lt;dt&gt;与相邻类别的区别&lt;/dt&gt;&lt;dd&gt;${esc(s.contrast)}&lt;/dd&gt;&lt;dt&gt;证据性质&lt;/dt&gt;&lt;dd&gt;${esc(s.evidence)}&lt;/dd&gt;&lt;/dl&gt;&lt;/div&gt;&lt;/details&gt;`;}
function selectedFrameworkDetail(){const f=knowledge.frameworks[state.framework];return `&lt;section class=&quot;kn-selected-framework&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(f.name)}&lt;/h3&gt;&lt;p&gt;${esc(f.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-selected-badge&quot;&gt;当前查看&lt;/span&gt;&lt;/div&gt;${frameworkSummary(f)}&lt;p class=&quot;kn-framework-intro&quot;&gt;${esc(f.intro)}&lt;/p&gt;${frameworkFacts(f)}&lt;details class=&quot;kn-framework-sources&quot;&gt;&lt;summary&gt;查看出处、年份与证据说明&lt;/summary&gt;${sourceLinks(f.sources||[f.source])}&lt;/details&gt;&lt;div class=&quot;kn-category-heading&quot;&gt;&lt;h4&gt;这套分类方式自己的类别&lt;/h4&gt;&lt;p&gt;点击类别可展开定义、教学例子和边界；类别只在当前分类方式内部解释。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-framework-category-tree&quot;&gt;${frameworkCategoryTree(f)}&lt;/div&gt;&lt;div class=&quot;kn-category-heading&quot;&gt;&lt;h4&gt;有来源的场景与证据边界&lt;/h4&gt;&lt;p&gt;以下案例逐项说明来源事实、编者映射和原文未说明部分。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-source-scenarios&quot;&gt;${(f.sourceScenarios||[]).map(sourceScenarioCard).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function contentIndexNav(){const idx=knowledge.contentIndex;return `&lt;section class=&quot;kn-content-index&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(idx.title)}&lt;/h3&gt;&lt;p&gt;${esc(idx.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;分类外导航索引&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;${esc(idx.description)}&lt;/p&gt;${idx.groups.map(g=&gt;`&lt;section class=&quot;kn-content-group&quot;&gt;&lt;div class=&quot;kn-content-group-head&quot;&gt;&lt;h4&gt;${esc(g.zh)} &lt;small&gt;${esc(g.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(g.note)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-content-buttons&quot;&gt;${g.items.map(id=&gt;{const m=contentMethod(id);return `&lt;button type=&quot;button&quot; class=&quot;kn-content-card ${state.memoryType===id?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-content-type=&quot;${esc(id)}&quot; aria-pressed=&quot;${state.memoryType===id}&quot;&gt;&lt;strong&gt;${esc(m.zh)}&lt;/strong&gt;&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;span&gt;${esc(m.definition)}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;`;}
function draftTaxonomySection(){const draft=knowledge.draftTaxonomy;return `&lt;section class=&quot;kn-draft-taxonomy&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;${esc(draft.title)}&lt;/h3&gt;&lt;p&gt;${esc(draft.en)}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-pending-badge&quot;&gt;${esc(draft.status)}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;${esc(draft.intro)}&lt;/p&gt;&lt;dl class=&quot;kn-framework-facts&quot;&gt;&lt;dt&gt;形成依据&lt;/dt&gt;&lt;dd&gt;${esc(draft.rationale)}&lt;/dd&gt;&lt;dt&gt;当前限制&lt;/dt&gt;&lt;dd&gt;${esc(draft.limitation)}&lt;/dd&gt;&lt;/dl&gt;&lt;div class=&quot;kn-draft-items&quot;&gt;${draft.items.map(item=&gt;`&lt;article id=&quot;types-${esc(item.id)}&quot;&gt;&lt;h4&gt;${esc(item.zh)} &lt;small&gt;${esc(item.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(item.definition)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;边界：${esc(item.boundary)}&lt;/p&gt;${sourceLinks(item.sources)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function contentIndexSection(){const selected=contentMethod(state.memoryType);return `&lt;section class=&quot;kn-content-outside&quot;&gt;${contentIndexNav()}&lt;section class=&quot;kn-selected-content&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;当前选中的索引项&lt;/h3&gt;&lt;p&gt;这里是分类外导航内容，不把它当作某套正式分类的下级。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${selected?explanation(selected,{type:true,heading:&#x27;h3&#x27;}):&#x27;&#x27;}&lt;/section&gt;&lt;/section&gt;`;}
function mappingState(value){return value||&#x27;none&#x27;;}
function mappingLabel(value){return ({direct:&#x27;直接对应&#x27;,parent:&#x27;上层包含&#x27;,related:&#x27;有关联&#x27;,possible:&#x27;可落入&#x27;,unclear:&#x27;待核&#x27;,none:&#x27;无直接对应&#x27;})[value]||&#x27;无直接对应&#x27;;}
function mappingSymbol(value){return ({direct:&#x27;●&#x27;,parent:&#x27;◆&#x27;,related:&#x27;◐&#x27;,possible:&#x27;◇&#x27;,unclear:&#x27;?&#x27;,none:&#x27;—&#x27;})[value]||&#x27;—&#x27;;}
function taxonomyCrosswalk(){const f=knowledge.frameworks[state.framework];const categories=frameworkCategories(state.framework);const groups=[...new Set(categories.map(c=&gt;c.dimension||&#x27;当前分类&#x27;))];const mapping=knowledge.contentIndex.mappings?.[state.framework]||{};const methods=contentMethods();return `&lt;section class=&quot;kn-crosswalk&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;交叉映射：典型记忆内容 × 当前分类方式&lt;/h3&gt;&lt;p&gt;行是 5+2 内容索引，列是“${esc(f.name)}”自己的类别&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;${esc(knowledge.contentIndex.mappingStatus||&#x27;编者映射 · 待验证&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;这里比较的是“典型内容”与当前分类方式的交叉关系。它不表示不同分类方式之间的父子关系；其中 ◆ 只表示当前分类方式内部的上层类别与该内容的包含关系。短横线（—）表示当前没有直接对应标注，不等同于已经证明不存在。&lt;/p&gt;&lt;div class=&quot;kn-crosswalk-wrap&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;典型记忆内容与分类方式交叉映射&quot;&gt;&lt;table&gt;&lt;caption class=&quot;kn-sr&quot;&gt;典型记忆内容与当前分类方式的交叉映射&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;典型记忆内容&lt;/th&gt;${categories.map(c=&gt;`&lt;th scope=&quot;col&quot;&gt;&lt;span&gt;${esc(c.zh)}&lt;/span&gt;&lt;small&gt;${esc(c.en)}&lt;/small&gt;&lt;em&gt;${esc(c.dimension||&#x27;&#x27;)}&lt;/em&gt;&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${knowledge.contentIndex.groups.flatMap(g=&gt;g.items).map(id=&gt;{const m=methods[id];const row=mapping[id]||{};return `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-content-type=&quot;${esc(id)}&quot;&gt;${esc(m.zh)}&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;/button&gt;&lt;/th&gt;${categories.map(c=&gt;{const s=mappingState(row[c.id]);return `&lt;td class=&quot;kn-map-${s}&quot;&gt;&lt;span class=&quot;kn-sr&quot;&gt;${esc(mappingLabel(s))}&lt;/span&gt;${mappingSymbol(s)}&lt;/td&gt;`;}).join(&#x27;&#x27;)}&lt;/tr&gt;`;}).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;kn-map-legend&quot;&gt;&lt;span class=&quot;kn-map-direct&quot;&gt;●&lt;/span&gt;直接对应　&lt;span class=&quot;kn-map-parent&quot;&gt;◆&lt;/span&gt;上层包含　&lt;span class=&quot;kn-map-related&quot;&gt;◐&lt;/span&gt;有关联　&lt;span class=&quot;kn-map-possible&quot;&gt;◇&lt;/span&gt;可落入　&lt;span class=&quot;kn-map-unclear&quot;&gt;?&lt;/span&gt;待核　&lt;span class=&quot;kn-map-none&quot;&gt;—&lt;/span&gt;未标注直接对应&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;${groups.length&gt;1?`列头中的小字说明三维或工程术语族内部的子轴：${esc(groups.join(&#x27;、&#x27;))}。`:&#x27;&#x27;}这些符号是导航关系和证据边界，不是性能分数。&lt;/p&gt;&lt;/section&gt;`;}
function relatedResearchPerspectives(){const updates=(knowledge.updates||[]).filter(u=&gt;u.id!==&#x27;foundation-3d&#x27;);if(!updates.length)return &#x27;&#x27;;return `&lt;section class=&quot;kn-updates&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;相关研究视角&lt;/h3&gt;&lt;p&gt;补充研究问题，不并入上面的分类树&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;这些工作讨论结构、生命周期、成本和图记忆等其他问题。它们可以帮助继续研究，但不与四套主流分类方式抢同一个层级。&lt;/p&gt;&lt;div class=&quot;kn-update-grid&quot;&gt;${updates.map(u=&gt;`&lt;article class=&quot;kn-update-card&quot;&gt;&lt;div class=&quot;kn-update-meta&quot;&gt;&lt;span&gt;${esc(u.year)}&lt;/span&gt;&lt;span&gt;研究视角&lt;/span&gt;&lt;/div&gt;&lt;h4&gt;${esc(u.title)} &lt;small&gt;${esc(u.en)}&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;${esc(u.summary)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;与分类页面的关系：&lt;/strong&gt;${esc(u.relation)}&lt;/p&gt;${sourceLinks(u.sources)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;}
function topicNavigation(a){return `&lt;nav class=&quot;kn-topic-nav&quot; aria-label=&quot;分类与方法专题&quot;&gt;${knowledge.topics.map((t,i)=&gt;`&lt;button type=&quot;button&quot; data-topic=&quot;${t.id}&quot; ${a.id===t.id?&#x27;aria-current=&quot;location&quot;&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;${esc(t.short)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;}
function renderLegacyHome(){return `&lt;section class=&quot;kn-hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;kn-kicker&quot;&gt;A field guide to agent memory&lt;/p&gt;&lt;h1&gt;先理解记忆，&lt;br&gt;再找到适合的方法。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;从记忆分类、技术路线到实际系统，连接论文、代码与评测。为学习、选型和自己的 Harness 设计建立知识全景。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-path&quot;&gt;&lt;strong&gt;从这里开始&lt;/strong&gt;&lt;p&gt;认识记忆 → 理解方法 → 找到实现 → 检查证据&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-topic=&quot;types&quot;&gt;进入记忆分类 →&lt;/button&gt;&lt;p class=&quot;kn-note&quot;&gt;也可以从顶部直接查需求、找资源或比较系统。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;九个问题，读懂记忆系统&lt;/h2&gt;&lt;p&gt;每个问题各管一件事，点击进入专题&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-atlas&quot;&gt;${knowledge.topics.map((t,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-axis&quot; data-topic=&quot;${t.id}&quot;&gt;&lt;span class=&quot;kn-num&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${esc(t.title)}&lt;/strong&gt;&lt;small&gt;${esc(t.en)}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;kn-preview&quot;&gt;${esc(t.intro)}&lt;/span&gt;&lt;span class=&quot;kn-arrow&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;九个问题是本仓库的阅读导航，会随研究修订。记忆分类展示具名分类方式；其他专题分别描述控制、范围、期限、表示、存储、维护、使用和权限。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;同一份记忆，可以从不同问题理解&lt;/h2&gt;&lt;div class=&quot;kn-example&quot;&gt;&lt;p&gt;例如“项目做到第三步，明天继续”：它可以是当前工作状态，按项目组织，写成笔记并存到文件中，保留到任务结束，下次会话再读入。&lt;/p&gt;${flow([&#x27;记录任务进度&#x27;,&#x27;按项目保存&#x27;,&#x27;下次读回继续&#x27;])}&lt;p class=&quot;kn-note&quot;&gt;“记忆分类”回答它是什么；其余专题分别说明谁控制、如何组织、怎样保存与使用。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;继续走向方法与实现&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;kn-quick&quot;&gt;&lt;article&gt;&lt;h3&gt;有具体需求&lt;/h3&gt;&lt;p&gt;跨会话继续工作、记住用户偏好、复用经验，从需求找到阅读路线。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;needs&quot;&gt;按需查找 →&lt;/button&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;找论文与系统&lt;/h3&gt;&lt;p&gt;${resources.length} 项资料保留功能、亮点、边界和原始来源。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;library&quot;&gt;资源目录 →&lt;/button&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;看系统如何组合&lt;/h3&gt;&lt;p&gt;先了解方法，再比较真实 Harness 与 Agent 采用的做法；独立记忆层另见资源目录。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;layers&quot;&gt;图解探索 →&lt;/button&gt;&lt;a class=&quot;kn-text-btn&quot; href=&quot;https://dongshuyan.github.io/awesome-harness-memory/report/index.html&quot;&gt;研究 × 工程报告 →&lt;/a&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;`;}
function renderTaxonomy(){return `&lt;section class=&quot;kn-taxonomy&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;有来源的分类入口&lt;/h2&gt;&lt;p&gt;四套入口并列展示，按来源清晰度和当前证据状态排序&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kn-note&quot;&gt;正式分类模块&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;先选择一套分类方式。展开后只显示这套方式自己的来源事实、类别结构和场景；分类外草案、索引、交叉映射与相关研究另行展示。&lt;/p&gt;${frameworkChooser()}${selectedFrameworkDetail()}&lt;/section&gt;${draftTaxonomySection()}${contentIndexSection()}${taxonomyCrosswalk()}${relatedResearchPerspectives()}`;}
function renderTopic(){const a=topicBy(state.topic),chosen=a.methods.find(m=&gt;m.id===state.method)||a.methods[0];return `${crumbs(&#x27;分类与方法&#x27;)}${topicNavigation(a)}&lt;div class=&quot;kn-topic-title&quot;&gt;&lt;h1&gt;${esc(a.title)}&lt;/h1&gt;&lt;span&gt;${esc(a.en)}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(a.intro)}&lt;/p&gt;&lt;p class=&quot;kn-english&quot;&gt;${esc(a.enIntro)}&lt;/p&gt;&lt;p class=&quot;kn-boundary&quot;&gt;${esc(a.boundary)}&lt;/p&gt;${a.id===&#x27;types&#x27;?renderTaxonomy():`&lt;details class=&quot;kn-topic-example&quot;&gt;&lt;summary&gt;先用一个例子理解这个问题&lt;/summary&gt;&lt;p&gt;${esc(a.example)}&lt;/p&gt;${sourceLinks(a.sources)}&lt;/details&gt;`}${a.id===&#x27;types&#x27;?&#x27;&#x27;:`&lt;section class=&quot;kn-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;方法与做法&lt;/h2&gt;&lt;p&gt;直接选择一项，无需逐页翻找&lt;/p&gt;&lt;/div&gt;&lt;nav class=&quot;kn-method-nav&quot; aria-label=&quot;选择具体方法&quot;&gt;${a.methods.map(m=&gt;`&lt;button type=&quot;button&quot; data-method=&quot;${m.id}&quot; aria-current=&quot;${chosen.id===m.id?&#x27;true&#x27;:&#x27;false&#x27;}&quot;&gt;${esc(m.zh)}&lt;small&gt;${esc(m.en)}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;${explanation(chosen)}&lt;/section&gt;`}&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;继续检验与比较&lt;/h2&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;evaluation&quot;&gt;评测与证据 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;系统资料对照 →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;}

function tutorialSourceLinks(ids){

function tutorialHome(){
  const counts=tutorialCounts();
  return `${crumbs(&#x27;Agent Memory 教程&#x27;)}&lt;section class=&quot;kn-tutorial-hero&quot;&gt;&lt;div&gt;&lt;p class=&quot;kn-kicker&quot;&gt;Agent Memory · 教程&lt;/p&gt;&lt;h1&gt;从六个问题开始，学会读懂 Memory。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;这是一条面向初学者的课程路径：先建立跨系统的观察方法，再逐步阅读 Research、工程、Benchmark 和真实文化作品。每个条目都保留来源、日期和证据边界。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn kn-tutorial-primary&quot; data-go=&quot;tutorial-lesson&quot;&gt;开始第一课 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-research&quot;&gt;先看 Research 清单&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;kn-tutorial-callout&quot;&gt;&lt;strong&gt;完成主路径后，你能做什么？&lt;/strong&gt;&lt;p&gt;面对一个新的 Agent/Harness/Memory 方法，先说明它是什么、为什么值得看，再用六问写出可复核的答案，并指出未知项。&lt;/p&gt;&lt;/aside&gt;&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;课程主路径&lt;/h2&gt;&lt;p&gt;每一站都回答“为什么现在学它”，再交给下一站。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-course-path&quot;&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-lesson&quot;&gt;&lt;b&gt;01&lt;/b&gt;&lt;strong&gt;第一课&lt;/strong&gt;&lt;span&gt;用六问认识任意 Memory&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-concepts&quot;&gt;&lt;b&gt;02&lt;/b&gt;&lt;strong&gt;概念辨析&lt;/strong&gt;&lt;span&gt;分清 Context、RAG、Checkpoint&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-research&quot;&gt;&lt;b&gt;03&lt;/b&gt;&lt;strong&gt;Research&lt;/strong&gt;&lt;span&gt;研究者如何提出方法&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-engineering&quot;&gt;&lt;b&gt;04&lt;/b&gt;&lt;strong&gt;工程&lt;/strong&gt;&lt;span&gt;系统如何把 Memory 做出来&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-benchmarks&quot;&gt;&lt;b&gt;05&lt;/b&gt;&lt;strong&gt;Benchmark&lt;/strong&gt;&lt;span&gt;评测测到了什么&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-culture&quot;&gt;&lt;b&gt;06&lt;/b&gt;&lt;strong&gt;文学与影视&lt;/strong&gt;&lt;span&gt;用真实作品做思想实验&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;当前精选工作集&lt;/h2&gt;&lt;p&gt;已知公开日期倒序；日期未说明的条目置后，数量服务于学习，不构成排名。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-tutorial-stats&quot;&gt;${[[&#x27;research&#x27;,&#x27;Research&#x27;],[&#x27;engineering&#x27;,&#x27;工程&#x27;],[&#x27;benchmarks&#x27;,&#x27;Benchmark&#x27;],[&#x27;culture&#x27;,&#x27;文学与影视&#x27;]].map(([id,label])=&gt;`&lt;button type=&quot;button&quot; class=&quot;kn-tutorial-stat&quot; data-go=&quot;${id===&#x27;culture&#x27;?&#x27;tutorial-culture&#x27;:`tutorial-${id}`}&quot; &gt;&lt;strong&gt;${counts[id].total}&lt;/strong&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;small&gt;${counts[id].complete} 个完整样板 · ${counts[id].pending} 个待完善&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;先看几张图&lt;/h2&gt;&lt;p&gt;图是学习辅助，不把完成度或覆盖率当成质量分数。&lt;/p&gt;&lt;/div&gt;${tutorialVisualizationCards()}&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section kn-tutorial-next&quot;&gt;&lt;h2&gt;主路径之后&lt;/h2&gt;&lt;div class=&quot;kn-tutorial-links&quot;&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-human&quot;&gt;人类记忆背景 →&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-topics&quot;&gt;横向专题与工具实践 →&lt;/button&gt;&lt;button type=&quot;button&quot; data-go=&quot;tutorial-compare&quot;&gt;后置比较工具 →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;
}
function tutorialVizGraphic(id){
  const palette=[&#x27;#2f6f5e&#x27;,&#x27;#b08a35&#x27;,&#x27;#7a9e9a&#x27;,&#x27;#b66a4c&#x27;,&#x27;#6f8191&#x27;,&#x27;#8b6f8e&#x27;];
  if(id===&#x27;course-path&#x27;){
    const labels=[&#x27;六问&#x27;,&#x27;概念&#x27;,&#x27;Research&#x27;,&#x27;工程&#x27;,&#x27;评测&#x27;,&#x27;文化&#x27;];

  }

    return `&lt;svg viewBox=&quot;0 0 ${width} ${height}&quot; role=&quot;img&quot; aria-label=&quot;每个教程条目对应的六问完成矩阵&quot;&gt;&lt;text x=&quot;4&quot; y=&quot;10&quot; font-size=&quot;8&quot; fill=&quot;var(--muted-foreground)&quot;&gt;绿色：该条目已完成六问；灰色：待完善&lt;/text&gt;${axisLabels.map((label,j)=&gt;`&lt;text x=&quot;${102+j*38}&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;var(--muted-foreground)&quot;&gt;${label}&lt;/text&gt;`).join(&#x27;&#x27;)}${entries.map(({category,entry},i)=&gt;{const y=top+i*rowHeight,done=entry.status===&#x27;complete&#x27;;return `&lt;text x=&quot;4&quot; y=&quot;${y+9}&quot; font-size=&quot;7.5&quot; fill=&quot;var(--foreground)&quot;&gt;${esc(entry.title).slice(0,13)}&lt;/text&gt;${axisLabels.map((_,j)=&gt;`&lt;rect x=&quot;${85+j*38}&quot; y=&quot;${y}&quot; width=&quot;33&quot; height=&quot;10&quot; rx=&quot;2&quot; fill=&quot;${done?&#x27;var(--viz-series-3)&#x27;:&#x27;var(--muted)&#x27;}&quot; opacity=&quot;${done?&#x27;.78&#x27;:&#x27;.65&#x27;}&quot;/&gt;`).join(&#x27;&#x27;)}&lt;text x=&quot;328&quot; y=&quot;${y+8}&quot; font-size=&quot;7&quot; fill=&quot;var(--muted-foreground)&quot;&gt;${esc(category===&#x27;benchmarks&#x27;?&#x27;评测&#x27;:category===&#x27;engineering&#x27;?&#x27;工程&#x27;:category===&#x27;culture&#x27;?&#x27;文化&#x27;:&#x27;研究&#x27;)}&lt;/text&gt;`;}).join(&#x27;&#x27;)}&lt;text x=&quot;180&quot; y=&quot;${height-2}&quot; text-anchor=&quot;middle&quot; font-size=&quot;8&quot; fill=&quot;var(--muted-foreground)&quot;&gt;完成状态是教程内容进度，不是对象质量&lt;/text&gt;&lt;/svg&gt;`;
  }

    const rowsMarkup=rows.map((entry,i)=&gt;{const y=15+i*13;const cells=ids.map((id,j)=&gt;`&lt;rect x=&quot;${65+j*47}&quot; y=&quot;${y}&quot; width=&quot;11&quot; height=&quot;11&quot; rx=&quot;2&quot; fill=&quot;${(entry.coverage||[]).includes(id)?&#x27;var(--viz-series-3)&#x27;:&#x27;var(--muted)&#x27;}&quot;/&gt;`).join(&#x27;&#x27;);return `&lt;text x=&quot;4&quot; y=&quot;${y+9}&quot; font-size=&quot;8&quot; fill=&quot;var(--foreground)&quot;&gt;${esc(entry.title).slice(0,9)}&lt;/text&gt;${cells}`;}).join(&#x27;&#x27;);

    return `&lt;svg viewBox=&quot;0 0 360 122&quot; role=&quot;img&quot; aria-label=&quot;各类教程条目的证据状态&quot;&gt;&lt;text x=&quot;4&quot; y=&quot;12&quot; font-size=&quot;9&quot; fill=&quot;var(--muted-foreground)&quot;&gt;当前内容状态，不是对象质量&lt;/text&gt;${rows.map(([label,items],i)=&gt;{const y=25+i*23,total=items.length,complete=items.filter(e=&gt;e.status===&#x27;complete&#x27;).length;const width=Math.max(1,260*complete/Math.max(total,1));return `&lt;text x=&quot;4&quot; y=&quot;${y+10}&quot; font-size=&quot;10&quot; fill=&quot;var(--foreground)&quot;&gt;${esc(label)}&lt;/text&gt;&lt;rect x=&quot;65&quot; y=&quot;${y}&quot; width=&quot;260&quot; height=&quot;13&quot; rx=&quot;3&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;rect x=&quot;65&quot; y=&quot;${y}&quot; width=&quot;${width}&quot; height=&quot;13&quot; rx=&quot;3&quot; fill=&quot;var(--viz-series-2)&quot;/&gt;&lt;text x=&quot;333&quot; y=&quot;${y+10}&quot; text-anchor=&quot;end&quot; font-size=&quot;9&quot; fill=&quot;var(--muted-foreground)&quot;&gt;${complete} 完成 / ${total-complete} 待补&lt;/text&gt;`;}).join(&#x27;&#x27;)}&lt;/svg&gt;`;
  }
  return &#x27;&#x27;;
}
function tutorialVisualizationCards(){
  return `&lt;div class=&quot;kn-tutorial-viz-grid&quot;&gt;${tutorial.visualizations.map(v=&gt;`&lt;article class=&quot;kn-tutorial-viz-card&quot;&gt;&lt;div class=&quot;kn-viz-mark&quot;&gt;◈&lt;/div&gt;&lt;h3&gt;${esc(v.title)}&lt;/h3&gt;&lt;div class=&quot;kn-tutorial-viz-graphic&quot;&gt;${tutorialVizGraphic(v.id)}&lt;/div&gt;&lt;p&gt;${esc(v.purpose)}&lt;/p&gt;&lt;small&gt;${esc(v.note)}&lt;/small&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-go=&quot;tutorial-topics&quot;&gt;在专题页查看 →&lt;/button&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
}
function tutorialLesson(){
  const proofSources={research:[&#x27;coala&#x27;,&#x27;survey&#x27;,&#x27;foundation-agent-taxonomy-arxiv&#x27;],engineering:[&#x27;langgraph&#x27;,&#x27;claude-code&#x27;,&#x27;graphiti&#x27;],benchmarks:[&#x27;longmemeval&#x27;,&#x27;locomo&#x27;,&#x27;memoryagentbench&#x27;]};
  return `${crumbs(&#x27;第一课 · 六问&#x27;)}&lt;div class=&quot;kn-tutorial-lesson-layout&quot;&gt;&lt;aside class=&quot;kn-tutorial-toc&quot; aria-label=&quot;第一课目录&quot;&gt;&lt;strong&gt;第一课&lt;/strong&gt;${tutorial.questions.map((q,i)=&gt;`&lt;a href=&quot;#tutorial-q-${q.id}&quot;&gt;${i+1}. ${esc(q.short)}&lt;/a&gt;`).join(&#x27;&#x27;)}&lt;a href=&quot;#tutorial-why-six&quot;&gt;为什么是六问&lt;/a&gt;&lt;/aside&gt;&lt;article class=&quot;kn-tutorial-lesson&quot;&gt;&lt;p class=&quot;kn-kicker&quot;&gt;第一课 · 核心方法&lt;/p&gt;&lt;h1&gt;用六个问题认识任意 Memory。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;你不需要先背一棵分类树。先问六件事，就能把不同论文、产品和系统放到同一张理解地图上。&lt;/p&gt;&lt;div class=&quot;kn-tutorial-callout&quot;&gt;&lt;strong&gt;完成这课后&lt;/strong&gt;&lt;p&gt;给你一个新系统，你应该能写出六个短答案，并说清楚“保存了”“被取回了”“改变了行为”不是同一件事。&lt;/p&gt;&lt;/div&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-tutorial-kicker&quot;&gt;00 · 先看一个问题&lt;/div&gt;&lt;h2&gt;同一段信息，为什么下一次调用可能记得，也可能忘记？&lt;/h2&gt;&lt;p&gt;假设 Agent 在周一得知“项目使用 Python 3.12”。如果下一次调用只拿到当前消息，它可能不知道；如果系统把信息写入文件、在调用前检索并注入上下文，它可能知道；如果旧版本仍被检索出来，它还可能做出错误决定。六问把这条链拆开。&lt;/p&gt;&lt;div class=&quot;kn-tutorial-example&quot;&gt;&lt;strong&gt;先猜一猜&lt;/strong&gt;&lt;p&gt;这里至少涉及保存内容、承载位置、下一次如何拿到、旧信息如何失效四个不同问题。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;${tutorial.questions.map((q,i)=&gt;`&lt;section class=&quot;kn-tutorial-section&quot; id=&quot;tutorial-q-${q.id}&quot;&gt;&lt;div class=&quot;kn-tutorial-kicker&quot;&gt;0${i+1} · ${esc(q.en)}&lt;/div&gt;&lt;h2&gt;${esc(q.title)}&lt;/h2&gt;&lt;p&gt;${esc(q.what)}&lt;/p&gt;&lt;div class=&quot;kn-tutorial-two-col&quot;&gt;&lt;div&gt;&lt;h3&gt;为什么要问&lt;/h3&gt;&lt;p&gt;${esc(q.why)}&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;遇到新系统怎么回答&lt;/h3&gt;&lt;p&gt;${esc(q.how)}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kn-tutorial-example&quot;&gt;&lt;strong&gt;例子&lt;/strong&gt;&lt;p&gt;${esc(q.example)}&lt;/p&gt;&lt;/div&gt;&lt;details class=&quot;kn-tutorial-evidence&quot;&gt;&lt;summary&gt;这不是拍脑袋：证据与推导&lt;/summary&gt;&lt;p&gt;${esc(q.evidence)}&lt;/p&gt;${q.confidence?`&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;置信度：&lt;/strong&gt;${esc(q.confidence)}&lt;/p&gt;`:&#x27;&#x27;}${tutorialSourceLinks(q.sources||[])}&lt;/details&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;检查点：&lt;/strong&gt;${esc(q.check)}&lt;/p&gt;&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;section class=&quot;kn-tutorial-section kn-tutorial-proof&quot; id=&quot;tutorial-why-six&quot;&gt;&lt;div class=&quot;kn-tutorial-kicker&quot;&gt;07 · 论证&lt;/div&gt;&lt;h2&gt;为什么是这六个问题？&lt;/h2&gt;&lt;p&gt;六问不是某一篇论文规定的唯一 taxonomy，而是把研究框架、工程文档和 Benchmark 共同暴露出来的差异压缩成一条初学者可操作的学习路径。下面把事实、来源和推导分开。&lt;/p&gt;&lt;div class=&quot;kn-tutorial-proof-grid&quot;&gt;&lt;article&gt;&lt;h3&gt;事实 1 · 研究框架反复拆开不同层面&lt;/h3&gt;&lt;p&gt;CoALA 区分 working memory 与长期 episodic/semantic/procedural；Forms–Functions–Dynamics 区分形式、功能和动态；Foundation Agent Memory 同时讨论 substrate、认知机制、主体和操作。&lt;/p&gt;${tutorialSourceLinks(proofSources.research)}&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;推导：&lt;/strong&gt;它们的树不同，但都在回答内容、载体、主体、变化和使用这几类不同问题。&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;事实 2 · 工程系统把同样的差异写成不同名词&lt;/h3&gt;&lt;p&gt;LangGraph 把 state、checkpoint、store 分开；Claude Code 公开项目/用户级文件与自动记忆；Graphiti 讨论关系、时间和检索。工程术语不统一，但读者仍需要分别知道保存什么、放在哪里、归谁、如何更新和怎样进入下一次调用。&lt;/p&gt;${tutorialSourceLinks(proofSources.engineering)}&lt;/article&gt;&lt;article&gt;&lt;h3&gt;事实 3 · Benchmark 多测结果，少测内部设计&lt;/h3&gt;&lt;p&gt;LongMemEval、LoCoMo、MemoryAgentBench 等主要观察长期交互、检索、更新或冲突解决后的任务结果；它们通常不能单独证明载体、权限、删除传播或治理。第 5 问与 Benchmark 的结果连接，第 2、3、6 问则帮助读者看清评测遗漏。&lt;/p&gt;${tutorialSourceLinks(proofSources.benchmarks)}&lt;/article&gt;&lt;article&gt;&lt;h3&gt;推导 · 保持少而不丢关键链路&lt;/h3&gt;&lt;p&gt;把内容和载体合并会混淆“事实”和“文件”；把范围和治理合并会混淆“归谁”和“谁有权”；把生命周期和暴露合并会混淆“更新了”和“被用上了”。继续细拆会得到版本、索引、TTL、权限等子问题，但它们可以作为六问的回答字段保留。&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;结论边界：&lt;/strong&gt;这是有来源的描述性工作集，置信度为中等；目前没有学习者实验证明它是唯一最小集合、数学上完全正交或覆盖所有未来系统。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;kn-tutorial-callout&quot;&gt;&lt;strong&gt;结论&lt;/strong&gt;&lt;p&gt;六问覆盖理解一个 Memory 系统所需的主要机制链路，同时把更细的工程问题放到每一问内部。它不是数学上证明的唯一最小集合；遇到新证据时可以修订，但修订必须保留来源和反例。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;h2&gt;下一课：先辨析相邻概念&lt;/h2&gt;&lt;p&gt;现在已经知道要问什么，下一步先分清 Context、RAG、Checkpoint 和语义 Memory，再去读 Research、工程和 Benchmark。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn kn-tutorial-primary&quot; data-go=&quot;tutorial-concepts&quot;&gt;进入相关概念辨析 →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/article&gt;&lt;/div&gt;`;
}
function tutorialConcepts(){
  return `${crumbs(&#x27;相关概念辨析&#x27;)}&lt;p class=&quot;kn-kicker&quot;&gt;桥接课 · 不增加第七问&lt;/p&gt;&lt;h1&gt;先把容易混淆的词分开。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;这些机制可能参与 Memory，但它们各自回答的问题不同。每张卡都说明“是什么、为什么混淆、不能推出什么”。&lt;/p&gt;&lt;div class=&quot;kn-tutorial-concept-grid&quot;&gt;${tutorial.concepts.map(c=&gt;`&lt;article class=&quot;kn-tutorial-concept&quot;&gt;&lt;h2&gt;${esc(c.title)}&lt;/h2&gt;&lt;div&gt;&lt;strong&gt;它是什么&lt;/strong&gt;&lt;p&gt;${esc(c.what)}&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;为什么容易混淆&lt;/strong&gt;&lt;p&gt;${esc(c.confusion)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-tutorial-caution&quot;&gt;&lt;strong&gt;这里不能推出&lt;/strong&gt;&lt;p&gt;${esc(c.not)}&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;h2&gt;准备进入三类材料&lt;/h2&gt;&lt;p&gt;Research 解释研究者如何提出方法，工程条目解释系统如何落地，Benchmark 解释现有评测测到了什么、遗漏了什么。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-research&quot;&gt;读 Research →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-engineering&quot;&gt;看工程 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-benchmarks&quot;&gt;看 Benchmark →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;
}
function tutorialEntryCard(category,entry){
  return `&lt;article class=&quot;kn-tutorial-entry-card&quot;&gt;&lt;div class=&quot;kn-tutorial-entry-meta&quot;&gt;&lt;span&gt;${esc(entry.date)}&lt;/span&gt;${tutorialTag(entry)}&lt;/div&gt;&lt;h2&gt;${esc(entry.title)}&lt;/h2&gt;&lt;p&gt;${esc(entry.summary)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;${esc(entry.why)}&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-tutorial-entry=&quot;${esc(category)}:${esc(entry.id)}&quot;&gt;${entry.status===&#x27;complete&#x27;?&#x27;阅读完整六问 →&#x27;:&#x27;查看条目与待补清单 →&#x27;}&lt;/button&gt;&lt;/article&gt;`;
}
function tutorialResearchCandidates(){
  const candidates=tutorial.researchCandidates||[];
  if(!candidates.length)return &#x27;&#x27;;
  return `&lt;section class=&quot;kn-tutorial-section kn-tutorial-candidates&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;待筛研究候选&lt;/h2&gt;&lt;p&gt;这些线索保留自前期调研，但目前以综述重叠、来源深度或全文核验不足为由暂不计入精选清单。它们不是六问样板，也不参与数量统计。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-tutorial-entry-list&quot;&gt;${candidates.map(entry=&gt;`&lt;article class=&quot;kn-tutorial-entry-card&quot;&gt;&lt;div class=&quot;kn-tutorial-entry-meta&quot;&gt;&lt;span&gt;${esc(entry.date)}&lt;/span&gt;&lt;span class=&quot;kn-tag kn-tutorial-pending&quot;&gt;待筛候选&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;${esc(entry.title)}&lt;/h2&gt;&lt;p&gt;${esc(entry.summary)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;保留理由：&lt;/strong&gt;${esc(entry.why)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;&lt;strong&gt;当前边界：&lt;/strong&gt;${esc(entry.boundary)}&lt;/p&gt;${tutorialSourceLinks(entry.sources)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;
}
function tutorialIndex(category){
  const entries=tutorialSortedEntries(category);
  const labels={research:&#x27;Research：研究者如何提出 Memory 方法&#x27;,engineering:&#x27;工程：系统如何把 Memory 做出来&#x27;,benchmarks:&#x27;Benchmark：现有评测测到了什么&#x27;,culture:&#x27;文学与影视：真实作品里的 Memory 思想实验&#x27;,humanMemory:&#x27;人类记忆背景&#x27;};
  const intros={research:&#x27;精选研究按公开日期倒序排列。每个条目先说明研究问题、纳入依据和证据边界，再进入六问。综述不超过必要数量，具体方法保留原文与代码入口。&#x27;,engineering:&#x27;精选 Agent、Harness、框架、独立 Memory 系统和托管服务按公开日期倒序排列。工程条目区分官方文档、公开代码、观察结果和未说明项。&#x27;,benchmarks:&#x27;评测能力和系统设计是两个视角。每个 Benchmark 都说明目标能力、任务协议、指标和它与六问的交集；空白不等于不支持。&#x27;,culture:&#x27;这里只收录真实的小说、短篇、电影或剧集。它们是类比和思想实验，不进入 Research、工程或评测证据。&#x27;,humanMemory:&#x27;人类记忆背景用于解释情景、语义、程序、工作记忆、遗忘和巩固等术语，不把人类认知直接当作 Agent 工程证明。&#x27;};
  const count=entries.length, complete=entries.filter(e=&gt;e.status===&#x27;complete&#x27;).length;
  return `${crumbs(tutorialCategoryLabel(category))}&lt;section class=&quot;kn-tutorial-index-hero&quot;&gt;&lt;p class=&quot;kn-kicker&quot;&gt;${esc(tutorialCategoryLabel(category))}&lt;/p&gt;&lt;h1&gt;${esc(labels[category]||tutorialCategoryLabel(category))}&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(intros[category]||&#x27;按课程路径阅读条目。&#x27;)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;${count} 个条目 · ${complete} 个完整样板 · ${count-complete} 个待完善。已知公开日期倒序，日期未说明的条目置后；这不是排名。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-tutorial-entry-list&quot;&gt;${entries.map(e=&gt;tutorialEntryCard(category,e)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;${category===&#x27;research&#x27;?tutorialResearchCandidates():&#x27;&#x27;}${category===&#x27;benchmarks&#x27;?tutorialBenchmarkViz():&#x27;&#x27;}${category===&#x27;research&#x27;||category===&#x27;engineering&#x27;?`&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;h2&gt;如何读这一类&lt;/h2&gt;&lt;div class=&quot;kn-tutorial-reading-guide&quot;&gt;&lt;p&gt;&lt;strong&gt;第一步：&lt;/strong&gt;先看基本信息和纳入依据，确认它为什么进入精选工作集。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;第二步：&lt;/strong&gt;打开已完成样板，沿六问阅读；待完善条目只作为导航，不把缺失内容补成事实。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;第三步：&lt;/strong&gt;从来源链接回到原文、代码或官方文档，记录版本和访问日期。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}`;
}
function tutorialBenchmarkViz(){
  const ids=[&#x27;content&#x27;,&#x27;substrate&#x27;,&#x27;scope&#x27;,&#x27;lifecycle&#x27;,&#x27;exposure&#x27;,&#x27;governance&#x27;];
  const labels=Object.fromEntries(tutorial.questions.map(q=&gt;[q.id,q.short]));
  const rows=(tutorial.entries.benchmarks||[]).map(e=&gt;{const covered=e.coverage||[];return `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${esc(e.title)}&lt;small&gt;${tutorialStatus(e)}&lt;/small&gt;&lt;/th&gt;${ids.map(id=&gt;`&lt;td class=&quot;${covered.includes(id)?&#x27;kn-viz-hit&#x27;:&#x27;kn-viz-empty&#x27;}&quot; title=&quot;${covered.includes(id)?&#x27;资料或任务与此方向有关&#x27;:&#x27;当前未标注覆盖&#x27;}&quot;&gt;${covered.includes(id)?&#x27;●&#x27;:&#x27;·&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`;}).join(&#x27;&#x27;);
  return `&lt;section class=&quot;kn-tutorial-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;Benchmark × 六问&lt;/h2&gt;&lt;p&gt;这张表看“评测结果与哪一问有关”，不把 Benchmark 变成六问本身。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kn-table-wrap kn-tutorial-matrix&quot;&gt;&lt;table&gt;&lt;caption class=&quot;kn-sr&quot;&gt;Benchmark 与六问的关联矩阵&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Benchmark&lt;/th&gt;${ids.map(id=&gt;`&lt;th&gt;${esc(labels[id])}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;● 表示当前资料或任务描述存在关联；· 表示未标注或未评估，不表示能力不存在。&lt;/p&gt;&lt;/section&gt;`;
}
function tutorialDetail(){
  const category=state.tutorialCategory; const entry=tutorialEntryBy(category,state.tutorialEntry);
  if(!entry) return `${crumbs(&#x27;条目详情&#x27;)}&lt;div class=&quot;kn-empty&quot;&gt;&lt;h1&gt;找不到这个条目&lt;/h1&gt;&lt;p&gt;请回到对应入口选择一个已列出的对象。未知条目不会默默回退到其他样本。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;tutorial-home&quot;&gt;回到教程首页 →&lt;/button&gt;&lt;/div&gt;`;
  const answers=entry.questions||[];
  const evidence=entry.selectionEvidence||&#x27;当前只有导航级来源，纳入依据和证据位置待补。&#x27;;
  const publicDate=entry.date||&#x27;公开日期未说明&#x27;;

deletion&quot;,&quot;source&quot;:&quot;strands-state&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;governance.control&quot;,&quot;operation.forget&quot;],&quot;note&quot;:&quot;可禁用记忆；删除会话目录与删除长期记忆目录是不同操作。&quot;,&quot;section&quot;:&quot;Deletion / Turn memory off&quot;,&quot;source&quot;:&quot;strands-state&quot;}],&quot;displayName&quot;:&quot;Strands Harness&quot;,&quot;name&quot;:&quot;Strands Harness&quot;},{&quot;id&quot;:&quot;openhands-agent&quot;,&quot;resourceId&quot;:&quot;openhands&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;openhands&quot;,&quot;note&quot;:&quot;指 Software Agent SDK 中可运行的 Agent＋Conversation；不把整个 SDK 或 Agent Canvas UI 当作同一对象。长期记忆边界仍待核。&quot;,&quot;historical&quot;:false,&quot;claims&quot;:[{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;content.context&quot;,&quot;scope.session&quot;],&quot;note&quot;:&quot;官方示例以 Agent、Conversation 和 workspace 执行任务；此处只确认会话任务上下文。&quot;,&quot;section&quot;:&quot;Quick Start / Repository boundaries&quot;,&quot;source&quot;:&quot;openhands&quot;}],&quot;displayName&quot;:&quot;OpenHands Agent&quot;,&quot;name&quot;:&quot;OpenHands Agent&quot;},{&quot;id&quot;:&quot;openhands-cli&quot;,&quot;resourceId&quot;:&quot;openhands&quot;,&quot;kind&quot;:&quot;harness&quot;,&quot;identitySource&quot;:&quot;openhands-cli&quot;,&quot;note&quot;:&quot;原 CLI 已停止积极维护，官方推荐 Agent Canvas；保留历史对照，不作为维护中的推荐。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;owner.runtime&quot;,&quot;scope.session&quot;,&quot;use.fixed&quot;],&quot;note&quot;:&quot;CLI 提供 --resume 按 ID 或最近会话恢复；持久长期记忆的具体机制待核。&quot;,&quot;section&quot;:&quot;Resume Conversations&quot;,&quot;source&quot;:&quot;openhands-cli&quot;}],&quot;displayName&quot;:&quot;OpenHands CLI&quot;,&quot;name&quot;:&quot;OpenHands CLI&quot;},{&quot;id&quot;:&quot;continue&quot;,&quot;resourceId&quot;:&quot;continue&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;continue&quot;,&quot;note&quot;:&quot;README 明确仓库不再积极维护、对用户只读；记忆属性未完成核实。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[],&quot;name&quot;:&quot;Continue&quot;},{&quot;id&quot;:&quot;roo-code&quot;,&quot;resourceId&quot;:&quot;roo-code&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;roo-code&quot;,&quot;note&quot;:&quot;仓库已归档，仅作历史 Agent 对照；未用旧版功能推断当前能力。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[],&quot;name&quot;:&quot;Roo Code&quot;}]}&lt;/script&gt;
&lt;script id=&quot;harness-layers-script&quot;&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const root = document.getElementById(&#x27;memory-colored-layers&#x27;);
  const data = JSON.parse(document.getElementById(&#x27;harness-map-data&#x27;).textContent);
  const q = s =&gt; root.querySelector(s);
  const dims = data.dimensions, systems = data.systems;
  const names = {yes:&#x27;文档明确说明&#x27;, config:&#x27;需配置 / 特定条件&#x27;, unknown:&#x27;尚未核实&#x27;, no:&#x27;该范围明确不提供&#x27;};
  const symbols = {yes:&#x27;✓&#x27;, config:&#x27;△&#x27;, unknown:&#x27;?&#x27;, no:&#x27;×&#x27;};
  const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const state = {layers:dims.map((_,i)=&gt;i), visible:systems.map(s=&gt;s.id), system:&#x27;all&#x27;, view:&#x27;layers&#x27;, angle:-3, gap:100};
  const visibleSystems = () =&gt; systems.filter(s =&gt; state.visible.includes(s.id));
  const cell = (s, property) =&gt; s.claims.find(c=&gt;c.features.includes(property)) || {status:&#x27;unknown&#x27;, note:&#x27;当前资料尚不足以确认这一属性；不能据此判断不支持。&#x27;};
  const label = s =&gt; s.name + (s.historical ? &#x27;（历史）&#x27; : &#x27;&#x27;);
  const sourceLink = (id, text) =&gt; `&lt;a href=&quot;${esc(data.sources[id].url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;${esc(text || data.sources[id].label)} ↗&lt;/a&gt;`;
  let evidenceRequested = false;
  // The standalone host grows the iframe to its content height. Position dialogs
  // inside the visible part of that frame, not the centre of the entire document.
  window.addEventListener(&#x27;message&#x27;, event =&gt; {
    if (!evidenceRequested || event.source !== window.parent || event.data?.type !== &#x27;harness:viewport&#x27;) return;
    const {top, height} = event.data;
    if (!Number.isFinite(top) || !Number.isFinite(height) || height &lt;= 0) return;
    const dialog = q(&#x27;#cl-evidence&#x27;);
    dialog.style.maxHeight = Math.max(100, height - 32) + &#x27;px&#x27;;
    if (!dialog.open) {
      dialog.style.top = top + 16 + &#x27;px&#x27;;
      dialog.showModal();
      window.parent.postMessage({type:&#x27;harness:dialog-shown&#x27;}, &#x27;*&#x27;);
    }
    dialog.style.top = top + Math.max(16, (height - dialog.getBoundingClientRect().height) / 2) + &#x27;px&#x27;;
  });
  q(&#x27;#cl-evidence&#x27;).addEventListener(&#x27;close&#x27;, () =&gt; {
    evidenceRequested = false;
    window.parent.postMessage({type:&#x27;harness:dialog&#x27;, open:false}, &#x27;*&#x27;);
  });
  q(&#x27;#cl-subtitle&#x27;).textContent = `${systems.length} 个真实 Harness / Agent · 7 个视角 · ${systems.filter(s=&gt;s.historical).length} 个历史项目已标记 · ${data.checked}。${data.scope}`;
  q(&#x27;#cl-layer-controls&#x27;).innerHTML = dims.map((d,i)=&gt;`&lt;label class=&quot;form-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-layer=&quot;${i}&quot; checked&gt;&lt;span&gt;${i+1} ${esc(d.name)}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  q(&#x27;#cl-object-controls&#x27;).innerHTML = systems.map(s=&gt;`&lt;label class=&quot;form-check&quot; title=&quot;${esc(s.note)}&quot;&gt;&lt;input type=&quot;checkbox&quot; data-object=&quot;${esc(s.id)}&quot; checked&gt;&lt;span&gt;${esc(label(s))}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  q(&#x27;#cl-system&#x27;).innerHTML = &#x27;&lt;option value=&quot;all&quot;&gt;全部对象，不单独高亮&lt;/option&gt;&#x27; + systems.map(s=&gt;`&lt;option value=&quot;${esc(s.id)}&quot;&gt;${esc(label(s))}&lt;/option&gt;`).join(&#x27;&#x27;);

  function showEvidence(systemId, property) {
    const s = systems.find(x=&gt;x.id===systemId);
    const dim = dims.find(d=&gt;d.options.some(o=&gt;o.id===property));
    const option = dim.options.find(o=&gt;o.id===property), c = cell(s, property);
    q(&#x27;#cl-evidence-title&#x27;).textContent = `${s.name} · ${option.name}`;
    q(&#x27;#cl-evidence-body&#x27;).innerHTML = `&lt;p&gt;&lt;span class=&quot;cl-chip&quot; data-status=&quot;${c.status}&quot;&gt;${symbols[c.status]}&lt;/span&gt; &lt;strong&gt;${names[c.status]}&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;${esc(c.note)}&lt;/p&gt;&lt;dl&gt;&lt;dt&gt;这一属性指什么&lt;/dt&gt;&lt;dd&gt;${esc(option.definition)}&lt;/dd&gt;&lt;dt&gt;对象与配置范围&lt;/dt&gt;&lt;dd&gt;${esc(s.note)}&lt;/dd&gt;&lt;dt&gt;${c.source ? &#x27;判断依据&#x27; : &#x27;对象资料（尚不能证明该属性）&#x27;}&lt;/dt&gt;&lt;dd&gt;${sourceLink(c.source || s.identitySource)}${c.source ? `&lt;br&gt;${esc(c.section)} · ${esc(data.sources[c.source].kind)} · 核对 ${esc(data.sources[c.source].checked)}` : &#x27;&#x27;}&lt;/dd&gt;&lt;/dl&gt;&lt;p class=&quot;text-small&quot;&gt;图中为公开资料的属性映射，未运行这些系统或验证效果。各项可以重叠，不按色块数量排名。&lt;/p&gt;`;
    evidenceRequested = true;
    window.parent.postMessage({type:&#x27;harness:dialog&#x27;, open:true}, &#x27;*&#x27;);
  }

  let lastWidth = 0;
  function draw() {
    const svg = q(&#x27;#cl-scene&#x27;), shown = visibleSystems();
    const viewport = Math.max(250, q(&#x27;#cl-scroll&#x27;).clientWidth); lastWidth = viewport;
    const width = Math.max(viewport, 185 + shown.length * 132);
    const front = state.view===&#x27;front&#x27;, theta=(front?0:state.angle)*Math.PI/180;
    const co=Math.cos(theta), si=Math.sin(theta), elevation=front?1:.62;
    const rowDepth=36, planeDepth=rowDepth*Math.max(...dims.map(d=&gt;d.options.length));
    const planeWidth=(width-175-Math.abs(si)*planeDepth)/co, cellWidth=planeWidth/Math.max(1,shown.length);
    const project=(x,y)=&gt;[x*co-y*si,(x*si+y*co)*elevation];
    const corners=[[0,0],[planeWidth,0],[planeWidth,planeDepth],[0,planeDepth]].map(([x,y])=&gt;project(x,y));
    const minX=Math.min(...corners.map(p=&gt;p[0])), minY=Math.min(...corners.map(p=&gt;p[1]));
    const planeHeight=Math.max(...corners.map(p=&gt;p[1]))-minY;
    const gap=front?planeHeight+75:32+(planeHeight+75-32)*state.gap/100;
    const compact=!front&amp;&amp;gap&lt;planeHeight+55, top=70-minY, originX=150-minX;
    const pos=(x,y,k)=&gt;{const p=project(x,y);return [originX+p[0],top+p[1]+k*gap];};
    const points=ps=&gt;ps.map(p=&gt;p.map(v=&gt;v.toFixed(2)).join(&#x27;,&#x27;)).join(&#x27; &#x27;);
    const height=state.layers.length&amp;&amp;shown.length?Math.ceil(planeHeight+(state.layers.length-1)*gap+100):95;
    svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`); svg.style.width=`${width}px`; svg.style.height=`${height}px`;
    let markup=&#x27;&lt;title id=&quot;cl-scene-title&quot;&gt;真实 Harness 与 Agent 的记忆属性&lt;/title&gt;&lt;desc id=&quot;cl-scene-description&quot;&gt;列为真实对象，层为研究视角，行是属性。点击格子查看来源；下方有可用键盘操作的文字对照。&lt;/desc&gt;&#x27;;
    if (!shown.length || !state.layers.length) {
      svg.innerHTML=markup+`&lt;text x=&quot;12&quot; y=&quot;38&quot;&gt;${!shown.length?&#x27;请勾选至少一个对比对象。&#x27;:&#x27;请选择至少一个维度层。&#x27;}&lt;/text&gt;`; return;
    }
    const focusIndex=shown.findIndex(s=&gt;s.id===state.system);
    if (!front&amp;&amp;state.layers.length&gt;1&amp;&amp;focusIndex&gt;=0) {
      const a=pos((focusIndex+.5)*cellWidth,planeDepth/2,0),b=pos((focusIndex+.5)*cellWidth,planeDepth/2,state.layers.length-1);
      markup+=`&lt;line class=&quot;track&quot; x1=&quot;${a[0]}&quot; y1=&quot;${a[1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot;/&gt;`;
    }
    for(let k=state.layers.length-1;k&gt;=0;k--) {
      const d=state.layers[k],dim=dims[d],sheet=[[0,0],[planeWidth,0],[planeWidth,planeDepth],[0,planeDepth]].map(([x,y])=&gt;pos(x,y,k));
      markup+=`&lt;g data-layer-index=&quot;${d}&quot;&gt;&lt;polygon class=&quot;sheet&quot; points=&quot;${points(sheet)}&quot;/&gt;`;
      shown.forEach((s,i)=&gt;dim.options.forEach((o,j)=&gt;{
        const c=cell(s,o.id),x0=i*cellWidth+2,x1=(i+1)*cellWidth-2,y0=j*rowDepth+2,y1=(j+1)*rowDepth-2;
        const shape=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([x,y])=&gt;pos(x,y,k)),center=pos((i+.5)*cellWidth,(j+.5)*rowDepth,k);
        markup+=`&lt;g class=&quot;cl-cell&quot; data-system=&quot;${esc(s.id)}&quot; data-property=&quot;${o.id}&quot;&gt;&lt;title&gt;${esc(`${s.name} · ${o.name}：${names[c.status]}。点击查看依据`)}&lt;/title&gt;&lt;polygon class=&quot;status-cell&quot; data-status=&quot;${c.status}&quot; points=&quot;${points(shape)}&quot;/&gt;&lt;text class=&quot;cell-symbol&quot; x=&quot;${center[0]}&quot; y=&quot;${center[1]+4.5}&quot; text-anchor=&quot;middle&quot;&gt;${symbols[c.status]}&lt;/text&gt;&lt;/g&gt;`;
      }));
      if(focusIndex&gt;=0) {
        const i=focusIndex,outline=[[i*cellWidth,0],[(i+1)*cellWidth,0],[(i+1)*cellWidth,planeDepth],[i*cellWidth,planeDepth]].map(([x,y])=&gt;pos(x,y,k));
        markup+=`&lt;polygon class=&quot;selected-column&quot; points=&quot;${points(outline)}&quot;/&gt;`;
      }
      markup+=&#x27;&lt;/g&gt;&#x27;;
    }
    state.layers.forEach((d,k)=&gt;{
      const dim=dims[d]; markup+=`&lt;text class=&quot;layer-title&quot; x=&quot;8&quot; y=&quot;${k*gap+25}&quot;&gt;${d+1} ${esc(dim.name)}&lt;/text&gt;`;
      if(!compact||k===0) shown.forEach((s,i)=&gt;{
        const p=pos((i+.5)*cellWidth,-32,k), words=s.name.split(&#x27; &#x27;);
        let lines=[s.name];
        if(s.name.length&gt;15&amp;&amp;words.length&gt;1) lines=[words.slice(0,-1).join(&#x27; &#x27;),words.at(-1)];
        if(s.historical)lines.push(&#x27;历史项目&#x27;);
        markup+=`&lt;text class=&quot;system-label ${state.system===s.id?&#x27;selected&#x27;:&#x27;&#x27;}&quot; x=&quot;${p[0]}&quot; y=&quot;${p[1]}&quot; text-anchor=&quot;middle&quot;&gt;${lines.map((line,n)=&gt;`&lt;tspan x=&quot;${p[0]}&quot; dy=&quot;${n?15:0}&quot;&gt;${esc(line)}&lt;/tspan&gt;`).join(&#x27;&#x27;)}&lt;/text&gt;`;
