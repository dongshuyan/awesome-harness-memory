&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

    &quot;codex-visualization-widget-state&quot;,
  );

    Object.assign(

      {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,

    };

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }

        } catch (error) {

          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

                pendingStateWrites.delete(id);

                  pending.resolve();
                } else {

        ]);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    { capture: true },
  );

    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      return;

  syncTheme();

function renderTopic(){const a=axisBy(state.topic);return `${crumbs(a.name)}&lt;div class=&quot;kn-topic-title&quot;&gt;&lt;h1&gt;${a.name}&lt;/h1&gt;&lt;span&gt;${a.sub}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kn-lead&quot;&gt;${a.intro}&lt;/p&gt;&lt;div class=&quot;kn-definition&quot;&gt;&lt;div&gt;&lt;strong&gt;先分清这件事&lt;/strong&gt;&lt;p&gt;${a.boundary}&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;用一个生活例子理解&lt;/strong&gt;&lt;details&gt;&lt;summary&gt;展开例子&lt;/summary&gt;&lt;p&gt;${a.example}&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;div class=&quot;kn-section-head&quot;&gt;&lt;h2&gt;方向与做法&lt;/h2&gt;&lt;p&gt;每项资料保留功能、亮点与来源说明&lt;/p&gt;&lt;/div&gt;${a.methods.map(m=&gt;`&lt;article class=&quot;kn-method&quot;&gt;&lt;div&gt;&lt;span class=&quot;kn-group&quot;&gt;${m[0]}&lt;/span&gt;&lt;h3&gt;${m[1]}&lt;/h3&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;${m[2]}&lt;/p&gt;&lt;p class=&quot;kn-caveat&quot;&gt;使用时要看：${m[3]}&lt;/p&gt;${refs(m[4])}&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;kn-note&quot;&gt;资料关联由编者整理，表示值得从这里继续阅读；不表示每个条目实现了本专题的全部做法。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;怎样检查这一方向有没有用？&lt;/h2&gt;${refs(a.eval)}&lt;div class=&quot;kn-actions&quot;&gt;&lt;button class=&quot;kn-btn&quot; type=&quot;button&quot; data-go=&quot;evaluation&quot;&gt;查看评测设计与比较条件 →&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;本方向的更多资料&lt;/h2&gt;${refs(resources.filter(r=&gt;r.axes.includes(a.id)&amp;&amp;r.status!==&#x27;pending&#x27;).map(r=&gt;r.id))}&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;接着理解相关问题&lt;/h2&gt;${axisLinks(a.related)}&lt;/section&gt;`;}
function renderNeeds(){return `${crumbs(&#x27;按需查找&#x27;)}&lt;h1&gt;从你想解决的问题出发。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;先找到相关方向，再看代表资料。这些是阅读路线，不保证某个系统开箱即用地解决全部需求。&lt;/p&gt;&lt;div class=&quot;kn-cases&quot;&gt;${needs.map(n=&gt;`&lt;article class=&quot;kn-case&quot;&gt;&lt;h2&gt;${n.title}&lt;/h2&gt;&lt;p&gt;${n.text}&lt;/p&gt;${axisLinks(n.axes)}${refs(n.refs)}&lt;p&gt;可接着看这些评测：&lt;/p&gt;${refs(n.bench)}&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function renderEvaluation(){return `${crumbs(&#x27;评测与证据&#x27;)}&lt;h1&gt;记忆有没有用，要看测的是什么。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;Benchmark（评测基准）本身也是研究对象。先判断它测哪些能力、用了什么任务，再看报告的结果。&lt;/p&gt;&lt;div class=&quot;kn-eval-list&quot;&gt;${evaluations.map(e=&gt;`&lt;article&gt;&lt;h2&gt;${e.title}&lt;/h2&gt;&lt;p&gt;${e.text}&lt;/p&gt;${refs(e.refs)}&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-topic=&quot;${e.axis}&quot;&gt;回到相关概念：${axisBy(e.axis).name} →&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;kn-protocol&quot;&gt;&lt;h3&gt;比较结果前，先对齐条件&lt;/h3&gt;&lt;p&gt;任务与数据版本、模型、输入与检索预算、写入方式、评分方法、时间和费用。问答分数不能直接当成工具执行成功率。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;生活例子：为什么两张成绩单不能直接比较？&lt;/summary&gt;&lt;p&gt;一位同学做开卷题，另一位做闭卷题，即使都写着“90 分”，也不能只看数字判断谁掌握得更好。评测任务、提供的信息和计算开销同样需要说明。&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-kind=&quot;benchmarks&quot;&gt;浏览目录中的全部评测 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;查看系统资料的比较方式 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;本页整理评测目标与条件，没有运行 Benchmark，也不提供统一排行榜。&lt;/p&gt;`;}
function statusTag(r){return `&lt;span class=&quot;kn-tag kn-status-${esc(r.status)}&quot;&gt;${esc(statusNames[r.status])}&lt;/span&gt;`;}
function coverageText(){const n=s=&gt;resources.filter(r=&gt;r.status===s).length;return `${resources.length} 项独立条目：${n(&#x27;documented&#x27;)} 项基础资料已核、${n(&#x27;reading&#x27;)} 项研究阅读入口、${n(&#x27;pending&#x27;)} 项待核、${n(&#x27;historical&#x27;)} 项历史资料。其中 ${resources.filter(r=&gt;r.types.includes(&#x27;systems&#x27;)&amp;&amp;r.status===&#x27;documented&#x27;).length} 个系统的基础功能有原始资料支持。`;}
function resourceRows(items){return items.map(r=&gt;`&lt;article class=&quot;kn-resource&quot;&gt;&lt;h3&gt;&lt;button type=&quot;button&quot; data-resource=&quot;${esc(r.id)}&quot;&gt;${esc(r.title)} →&lt;/button&gt;&lt;/h3&gt;&lt;div class=&quot;kn-tags&quot;&gt;${statusTag(r)}${tagHtml(r)}&lt;/div&gt;&lt;p&gt;${esc(first(r.summary))}&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;);}
function filteredResources(){const q=cleanQuery(state.query);return resources.filter(r=&gt;(state.kind===&#x27;all&#x27;||r.types.includes(state.kind))&amp;&amp;(state.status===&#x27;all&#x27;||r.status===state.status)&amp;&amp;(state.group===&#x27;all&#x27;||r.group===state.group)&amp;&amp;(!q||cleanQuery([r.title,r.summary,r.highlight,r.kind,...r.aliases,...r.types.map(t=&gt;labels[t])].join(&#x27; &#x27;)).includes(q)));}
function libraryList(){const list=filteredResources();return `&lt;p class=&quot;kn-count&quot; role=&quot;status&quot;&gt;当前 ${list.length} 项 / 目录共 ${resources.length} 项。类型可重叠，顺序不代表排名。&lt;/p&gt;&lt;div class=&quot;kn-section&quot;&gt;${list.length?resourceRows(list):&#x27;&lt;div class=&quot;kn-empty&quot;&gt;&lt;h2&gt;当前条件没有匹配项&lt;/h2&gt;&lt;p&gt;这只说明本轮目录没有找到，不表示这样的方案不存在。也可以查看待核线索。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-clear&gt;清除检索条件&lt;/button&gt;&lt;/div&gt;&#x27;}&lt;/div&gt;`;}
function options(values,current){return Object.entries(values).map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${current===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${esc(t)}&lt;/option&gt;`).join(&#x27;&#x27;);}
function renderLibrary(){return `${crumbs(&#x27;资源目录&#x27;)}&lt;h1&gt;找到值得继续读的资料。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;功能、亮点与限制放在一起看，再进入论文、仓库或官方文档。&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;${coverageText()} 核对至 2026-11-07 UTC；未运行这些系统或复现评测。&lt;/p&gt;&lt;div class=&quot;kn-filter&quot;&gt;&lt;label&gt;按名称、别名或内容查找&lt;input id=&quot;kn-search&quot; type=&quot;search&quot; maxlength=&quot;150&quot; placeholder=&quot;例如：PI、ClaudeMem、Codex、用户偏好&quot; value=&quot;${esc(state.query)}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;kn-type-select&quot;&gt;资源类型&lt;select id=&quot;kn-type&quot;&gt;${options({all:&#x27;全部类型&#x27;,...labels},state.kind)}&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;kn-type-select&quot;&gt;资料状态&lt;select id=&quot;kn-status&quot;&gt;${options({all:&#x27;全部状态&#x27;,...statusNames},state.status)}&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;kn-type-select&quot;&gt;系统类别&lt;select id=&quot;kn-group&quot;&gt;${options({all:&#x27;不限系统类别&#x27;,...groupNames},state.group)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;h2 class=&quot;kn-sr&quot;&gt;匹配的资源&lt;/h2&gt;&lt;div id=&quot;kn-library-results&quot;&gt;${libraryList()}&lt;/div&gt;`;}
function renderResource(){const r=map[state.resource];const related=axes.filter(a=&gt;r.axes.includes(a.id)||a.methods.some(m=&gt;m[4].includes(r.id))||a.eval.includes(r.id));return `&lt;div class=&quot;kn-breadcrumb&quot;&gt;&lt;button type=&quot;button&quot; data-back&gt;← 返回上一页&lt;/button&gt;&lt;span aria-hidden=&quot;true&quot;&gt;/&lt;/span&gt;&lt;span&gt;资源详情&lt;/span&gt;&lt;/div&gt;&lt;div&gt;${statusTag(r)}${tagHtml(r)}&lt;/div&gt;&lt;h1&gt;${esc(r.title)}&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;${esc(r.kind)}&lt;/p&gt;&lt;div class=&quot;kn-detail-body&quot;&gt;&lt;h2&gt;${r.types.includes(&#x27;fiction&#x27;)?&#x27;作品设定&#x27;:&#x27;它做什么&#x27;}&lt;/h2&gt;&lt;p&gt;${esc(r.summary)}&lt;/p&gt;&lt;h2&gt;值得看的地方&lt;/h2&gt;&lt;p&gt;${esc(r.highlight)}&lt;/p&gt;&lt;h2&gt;使用与阅读边界&lt;/h2&gt;&lt;p&gt;${esc(r.limit)}&lt;/p&gt;${r.types.includes(&#x27;systems&#x27;)?`&lt;p&gt;&lt;strong&gt;提供方式：&lt;/strong&gt;${esc(r.support)}&lt;/p&gt;&lt;details&gt;&lt;summary&gt;展开七个视角下的已核描述&lt;/summary&gt;&lt;dl class=&quot;kn-facts&quot;&gt;${axes.map(a=&gt;`&lt;dt&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-topic=&quot;${a.id}&quot;&gt;${esc(a.name)}&lt;/button&gt;&lt;/dt&gt;&lt;dd&gt;${esc(r.facts[a.id]||&#x27;尚未核清；不能据此判断支持或不支持。&#x27;)}&lt;/dd&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;&lt;/details&gt;`:&#x27;&#x27;}${r.analogy?`&lt;h2&gt;它启发了什么问题？&lt;/h2&gt;&lt;p&gt;${esc(r.analogy)}&lt;/p&gt;&lt;p class=&quot;kn-note&quot;&gt;编者类比，不是科学或工程效果证据。&lt;/p&gt;`:&#x27;&#x27;}&lt;h2&gt;从原始来源继续&lt;/h2&gt;${r.sources.length?`&lt;ul class=&quot;kn-sources&quot;&gt;${r.sources.map(s=&gt;`&lt;li&gt;&lt;a href=&quot;${esc(s.url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;${esc(s.label)} ↗&lt;/a&gt;&lt;small&gt;${esc(new URL(s.url).hostname)}&lt;/small&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`:&#x27;&lt;p&gt;名称尚未唯一定位，目前不填造项目链接。&lt;/p&gt;&#x27;}&lt;p class=&quot;kn-note&quot;&gt;核对日期：${esc(r.checked)}。${esc(r.verification)}&lt;/p&gt;${r.publication?`&lt;p class=&quot;kn-note&quot;&gt;发表信息：${esc(r.publication)}&lt;/p&gt;`:&#x27;&#x27;}${r.versionNote?`&lt;details&gt;&lt;summary&gt;版本与证据范围&lt;/summary&gt;&lt;p&gt;${esc(r.versionNote)}&lt;/p&gt;&lt;/details&gt;`:&#x27;&#x27;}&lt;/div&gt;${related.length?`&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;在知识全景中的阅读位置&lt;/h2&gt;${axisLinks(related.map(a=&gt;a.id))}&lt;p class=&quot;kn-note&quot;&gt;阅读关联不表示实现了该方向的全部方法。&lt;/p&gt;&lt;/section&gt;`:&#x27;&#x27;}&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;library&quot;&gt;浏览全部资源 →&lt;/button&gt;${r.types.includes(&#x27;systems&#x27;)?&#x27;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;进一步比较系统 →&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;}
function renderExtensions(){return `${crumbs(&#x27;人类记忆与文艺&#x27;)}&lt;h1&gt;把记忆放到更广的视野里。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;人类记忆按科学问题阅读，文学影视按设定与启发阅读。与 AI 的联系需要单独论证。&lt;/p&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;认知现象与关键脑机制&lt;/h2&gt;&lt;p class=&quot;kn-note&quot;&gt;涵盖记忆系统、痕迹、巩固、遗忘和前瞻记忆。多数目前为摘要级入口；作者提出的扩展分类不当作公认分类。&lt;/p&gt;${resourceRows(resources.filter(r=&gt;r.types.includes(&#x27;human&#x27;)))}&lt;/section&gt;&lt;section class=&quot;kn-section&quot;&gt;&lt;h2&gt;文学与影视&lt;/h2&gt;&lt;p class=&quot;kn-note&quot;&gt;设定和编者类比不作为工程效果证据。每项可进入作品原始介绍。&lt;/p&gt;${resourceRows(resources.filter(r=&gt;r.types.includes(&#x27;fiction&#x27;)))}&lt;/section&gt;`;}
function compareTable(){const rows=resources.filter(r=&gt;r.types.includes(&#x27;systems&#x27;)&amp;&amp;r.status===&#x27;documented&#x27;&amp;&amp;(state.compareGroup===&#x27;all&#x27;||r.group===state.compareGroup));const chosen=axes.filter(a=&gt;state.compareAxes.includes(a.id));return `&lt;p class=&quot;kn-count&quot; role=&quot;status&quot;&gt;${rows.length} 个系统 · ${chosen.length} 个视角。每格为原始资料所支持的描述；“未核”不等于不支持。&lt;/p&gt;${chosen.length?`&lt;div class=&quot;kn-table-wrap&quot;&gt;&lt;table&gt;&lt;caption class=&quot;kn-sr&quot;&gt;系统的文档属性对照；不是性能排名&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;系统 / 提供方式&lt;/th&gt;${chosen.map(a=&gt;`&lt;th scope=&quot;col&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-topic=&quot;${a.id}&quot;&gt;${esc(a.name)}&lt;/button&gt;&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(r=&gt;`&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-text-btn&quot; data-resource=&quot;${r.id}&quot;&gt;${esc(r.title)} ↗&lt;/button&gt;&lt;small&gt;${esc(r.support)}&lt;/small&gt;&lt;/th&gt;${chosen.map(a=&gt;`&lt;td&gt;${esc(r.facts[a.id]||&#x27;未核&#x27;)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`:&#x27;&lt;p class=&quot;kn-empty&quot;&gt;请至少选择一个视角；系统类别选择已保留。&lt;/p&gt;&#x27;}`;}
function renderCompare(){return `${crumbs(&#x27;系统比较&#x27;)}&lt;h1&gt;看不同系统如何组合记忆能力。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;一次展开多个视角，查看真实文档描述。更完整的功能、限制和来源放在系统详情里；本页不把功能数量当成质量分数。&lt;/p&gt;&lt;div class=&quot;kn-filter&quot;&gt;&lt;label&gt;系统类别&lt;select id=&quot;kn-compare-group&quot;&gt;${options({all:&#x27;全部已核系统&#x27;,...Object.fromEntries(Object.entries(groupNames).filter(([g])=&gt;resources.some(r=&gt;r.status===&#x27;documented&#x27;&amp;&amp;r.group===g)))},state.compareGroup)}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;fieldset class=&quot;kn-axis-select&quot;&gt;&lt;legend&gt;同时查看哪些视角&lt;/legend&gt;${axes.map(a=&gt;`&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-compare-axis=&quot;${a.id}&quot; ${state.compareAxes.includes(a.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${esc(a.name)}&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;/fieldset&gt;&lt;div id=&quot;kn-compare-results&quot;&gt;${compareTable()}&lt;/div&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;layers&quot;&gt;查看 Harness / Agent 记忆切片 →&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-status-filter=&quot;pending&quot;&gt;查看待核对象 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;kn-note&quot;&gt;立体图仅比较 Harness 与 Agent；独立记忆层、插件和框架继续保留在本目录。图中逐格附依据，未核属性显示问号。&lt;/p&gt;`;}
function renderLayers(){return `${crumbs(&#x27;图解探索&#x27;)}&lt;h1&gt;比较真实 Harness / Agent 的记忆组合。&lt;/h1&gt;&lt;p class=&quot;kn-lead&quot;&gt;把真实对象放在相同的七个视角下。勾选多个对象和维度、调整角度与间距，再点击格子查看条件与来源。独立记忆服务、插件和纯框架不作为这张图的主体。&lt;/p&gt;&lt;div class=&quot;kn-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;kn-btn&quot; data-go=&quot;compare&quot;&gt;查看完整系统目录与说明 →&lt;/button&gt;&lt;/div&gt;`;}
function renderAbout(){return `${crumbs(&#x27;来源与收录说明&#x27;)}&lt;h1&gt;让入口有依据，也让边界看得见。&lt;/h1&gt;&lt;div class=&quot;kn-detail-body&quot;&gt;&lt;h2&gt;本轮覆盖&lt;/h2&gt;&lt;p&gt;${coverageText()}&lt;/p&gt;&lt;p&gt;这是截至 2026-11-07 UTC 的阶段性导航，结合此前目录、候选池、中文报告、用户提名和补充系统核对；不声称穷尽全部记忆系统。&lt;/p&gt;&lt;h2&gt;四种状态怎么读&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;基础资料已核：读过可定位的原始文档、README 或作品介绍，支持这里的基础说明；不代表运行验证或安全认证。&lt;/li&gt;&lt;li&gt;研究阅读入口：论文身份、摘要或相关章节已核，完整方法和实验还需继续阅读。&lt;/li&gt;&lt;li&gt;待核线索：名称、当前机制、证据深度或已知问题仍需查清，不计入已核系统。&lt;/li&gt;&lt;li&gt;历史资料：有参考价值，但不作为当前维护方案推荐。&lt;/li&gt;&lt;/ul&gt;&lt;h2&gt;分类与图解&lt;/h2&gt;&lt;p&gt;七问是可交叉的编者导航框架，不是唯一分类。资料共同出现不表示存在实际数据流。立体切片展示真实 Harness 与 Agent，按属性标注公开资料依据和配置条件；没有依据的格子保留问号。&lt;/p&gt;&lt;h2&gt;占比和效果&lt;/h2&gt;&lt;p&gt;精选目录不能代表研究或商业市场分布。比例统计还需要可复现的采样范围、时间、检索式、分母和重叠规则。本轮没有运行 Benchmark，也没有生成统一效果排名。&lt;/p&gt;&lt;h2&gt;README 与交互页&lt;/h2&gt;&lt;p&gt;README 保留七问、按需路线、对象目录和静态图片，可以独立阅读；完整交互可部署到 GitHub Pages 或独立站点。在线版本已通过 GitHub Pages 发布。&lt;/p&gt;&lt;/div&gt;`;}

const renderers={home:renderHome,topic:renderTopic,needs:renderNeeds,library:renderLibrary,resource:renderResource,evaluation:renderEvaluation,extensions:renderExtensions,compare:renderCompare,layers:renderLayers,about:renderAbout};
function render(){main.innerHTML=renderers[state.view]();root.querySelector(&quot;#kn-layers-host&quot;).hidden=state.view!==&quot;layers&quot;;const active=state.view===&#x27;topic&#x27;?&#x27;home&#x27;:state.view===&#x27;resource&#x27;?(state.from===&#x27;topic&#x27;?&#x27;home&#x27;:state.from):state.view;root.querySelectorAll(&#x27;.kn-nav button&#x27;).forEach(b=&gt;{if(b.dataset.go===active)b.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);else b.removeAttribute(&#x27;aria-current&#x27;);});}
function go(view,extra={}){trail.push({...state});if(trail.length&gt;30)trail.shift();state=normal({...state,...extra,view});render();save();announce(main.querySelector(&#x27;h1&#x27;)?.textContent||&#x27;页面已更新&#x27;);const target=main.querySelector(&#x27;.kn-breadcrumb button&#x27;)||root.querySelector(&#x27;.kn-nav button[aria-current=page]&#x27;);target?.focus({preventScroll:true});main.scrollIntoView({block:&#x27;start&#x27;,behavior:&#x27;instant&#x27;});}
root.addEventListener(&#x27;click&#x27;,event=&gt;{const b=event.target.closest(&#x27;button&#x27;);if(!b||!root.contains(b))return;
 if(b.hasAttribute(&#x27;data-back&#x27;)){state=trail.pop()||normal({...state,view:state.from});render();save();const target=main.querySelector(&#x27;.kn-breadcrumb button&#x27;)||root.querySelector(&#x27;.kn-nav button[aria-current=page]&#x27;);target?.focus({preventScroll:true});main.scrollIntoView({block:&#x27;start&#x27;,behavior:&#x27;instant&#x27;});return;}
 if(b.hasAttribute(&#x27;data-clear&#x27;)){state.query=&#x27;&#x27;;state.kind=&#x27;all&#x27;;state.status=&#x27;all&#x27;;state.group=&#x27;all&#x27;;render();save();announce(`已清除条件，当前 ${resources.length} 项资源`);root.querySelector(&#x27;#kn-search&#x27;).focus({preventScroll:true});return;}
 if(b.dataset.topic){go(&#x27;topic&#x27;,{topic:b.dataset.topic});return;}
 if(b.dataset.resource){go(&#x27;resource&#x27;,{resource:b.dataset.resource,from:state.view});return;}
 if(b.dataset.kind){go(&#x27;library&#x27;,{kind:b.dataset.kind,query:&#x27;&#x27;,group:&#x27;all&#x27;,status:&#x27;all&#x27;});return;}
 if(b.dataset.statusFilter){go(&#x27;library&#x27;,{status:b.dataset.statusFilter,kind:&#x27;all&#x27;,group:&#x27;all&#x27;,query:&#x27;&#x27;});return;}
 if(b.dataset.go)go(b.dataset.go);
});
root.addEventListener(&#x27;input&#x27;,event=&gt;{if(event.target.id===&#x27;kn-search&#x27;){state.query=event.target.value.slice(0,150);root.querySelector(&#x27;#kn-library-results&#x27;).innerHTML=libraryList();announce(`当前找到 ${filteredResources().length} 项资源`);}});
root.addEventListener(&#x27;change&#x27;,event=&gt;{const fields={&#x27;kn-type&#x27;:&#x27;kind&#x27;,&#x27;kn-status&#x27;:&#x27;status&#x27;,&#x27;kn-group&#x27;:&#x27;group&#x27;};if(fields[event.target.id]){state[fields[event.target.id]]=event.target.value;root.querySelector(&#x27;#kn-library-results&#x27;).innerHTML=libraryList();announce(`当前找到 ${filteredResources().length} 项资源`);save();}else if(event.target.dataset.compareAxis){const a=event.target.dataset.compareAxis;state.compareAxes=event.target.checked?[...new Set([...state.compareAxes,a])]:state.compareAxes.filter(x=&gt;x!==a);root.querySelector(&#x27;#kn-compare-results&#x27;).innerHTML=compareTable();save();}else if(event.target.id===&#x27;kn-compare-group&#x27;){state.compareGroup=event.target.value;root.querySelector(&#x27;#kn-compare-results&#x27;).innerHTML=compareTable();save();}else if(event.target.id===&#x27;kn-search&#x27;)save();});
window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{const incoming=event.detail?.globals?.widgetState?.privateContent;if(incoming){const next=normal(incoming);if(JSON.stringify(next)===JSON.stringify(state))return;state=next;trail=[];render();}});
render();
})();

ness&quot;},{&quot;id&quot;:&quot;openhands-agent&quot;,&quot;resourceId&quot;:&quot;openhands&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;openhands&quot;,&quot;note&quot;:&quot;指 Software Agent SDK 中可运行的 Agent＋Conversation；不把整个 SDK 或 Agent Canvas UI 当作同一对象。长期记忆边界仍待核。&quot;,&quot;historical&quot;:false,&quot;claims&quot;:[{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;content.context&quot;,&quot;scope.session&quot;],&quot;note&quot;:&quot;官方示例以 Agent、Conversation 和 workspace 执行任务；此处只确认会话任务上下文。&quot;,&quot;section&quot;:&quot;Quick Start / Repository boundaries&quot;,&quot;source&quot;:&quot;openhands&quot;}],&quot;displayName&quot;:&quot;OpenHands Agent&quot;,&quot;name&quot;:&quot;OpenHands Agent&quot;},{&quot;id&quot;:&quot;openhands-cli&quot;,&quot;resourceId&quot;:&quot;openhands&quot;,&quot;kind&quot;:&quot;harness&quot;,&quot;identitySource&quot;:&quot;openhands-cli&quot;,&quot;note&quot;:&quot;原 CLI 已停止积极维护，官方推荐 Agent Canvas；保留历史对照，不作为维护中的推荐。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;owner.runtime&quot;,&quot;scope.session&quot;,&quot;use.fixed&quot;],&quot;note&quot;:&quot;CLI 提供 --resume 按 ID 或最近会话恢复；持久长期记忆的具体机制待核。&quot;,&quot;section&quot;:&quot;Resume Conversations&quot;,&quot;source&quot;:&quot;openhands-cli&quot;}],&quot;displayName&quot;:&quot;OpenHands CLI&quot;,&quot;name&quot;:&quot;OpenHands CLI&quot;},{&quot;id&quot;:&quot;continue&quot;,&quot;resourceId&quot;:&quot;continue&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;continue&quot;,&quot;note&quot;:&quot;README 明确仓库不再积极维护、对用户只读；记忆属性未完成核实。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[],&quot;name&quot;:&quot;Continue&quot;},{&quot;id&quot;:&quot;roo-code&quot;,&quot;resourceId&quot;:&quot;roo-code&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;roo-code&quot;,&quot;note&quot;:&quot;仓库已归档，仅作历史 Agent 对照；未用旧版功能推断当前能力。&quot;,&quot;historical&quot;:true,&quot;claims&quot;:[],&quot;name&quot;:&quot;Roo Code&quot;},{&quot;id&quot;:&quot;agent-qa&quot;,&quot;resourceId&quot;:&quot;agent-qa&quot;,&quot;kind&quot;:&quot;agent&quot;,&quot;identitySource&quot;:&quot;agent-qa&quot;,&quot;note&quot;:&quot;QA Agent 的证据驱动应用记忆；本地晋升与 CI 提案分开。依据在线文档，未运行验证；部分限制在文档中标为 v0.2。&quot;,&quot;historical&quot;:false,&quot;claims&quot;:[{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;owner.runtime&quot;,&quot;content.facts&quot;,&quot;content.experience&quot;,&quot;content.rules&quot;,&quot;scope.project&quot;,&quot;form.files&quot;],&quot;note&quot;:&quot;运行环境把应用事实、警示与流程保存为项目知识目录中的文件，按产品组织；另有人工编写的 QA 规则。跨工作区供给仍依赖本地索引和证据。&quot;,&quot;section&quot;:&quot;What it remembers / Where it lives / Limits in v0.2&quot;,&quot;source&quot;:&quot;agent-qa-memory&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;form.records&quot;,&quot;form.graph&quot;],&quot;note&quot;:&quot;文本记录是事实来源；本地 SQLite 索引保存全文检索、锚点、记录关系与运行结果。索引不提交到 git。&quot;,&quot;section&quot;:&quot;Three layers&quot;,&quot;source&quot;:&quot;agent-qa-architecture&quot;},{&quot;status&quot;:&quot;config&quot;,&quot;features&quot;:[&quot;form.vector&quot;],&quot;note&quot;:&quot;语义向量检索取决于本地模型是否可用；文档标注 v0.2 默认 lexical-only，不自动下载完整嵌入模型。每个测试的简报不使用向量排序。&quot;,&quot;section&quot;:&quot;Search levels&quot;,&quot;source&quot;:&quot;agent-qa-architecture&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;operation.extract&quot;,&quot;operation.update&quot;],&quot;note&quot;:&quot;判定结束后从证据生成候选，由检查与晋升门控决定是否供后续测试使用；旧记录可被替换。CI 不自动晋升，人工纠正另行处理。&quot;,&quot;section&quot;:&quot;What becomes a candidate / The curator / The promotion gate / Local runs and CI&quot;,&quot;source&quot;:&quot;agent-qa-learning&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;use.fixed&quot;,&quot;use.auto&quot;],&quot;note&quot;:&quot;每个测试开始前装配固定简报：人工规则优先，相关警示与事实按作用域、信任和锚点匹配排序；索引缺失时仅供给规则。&quot;,&quot;section&quot;:&quot;The brief / What gets in, and in what order / The index comes first&quot;,&quot;source&quot;:&quot;agent-qa-serving&quot;},{&quot;status&quot;:&quot;config&quot;,&quot;features&quot;:[&quot;use.demand&quot;],&quot;note&quot;:&quot;步骤内的 memory.search / memory.read 要求模型支持工具、图像以及至少 16,384 token 的上下文窗口。&quot;,&quot;section&quot;:&quot;Memory tools&quot;,&quot;source&quot;:&quot;agent-qa-serving&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;governance.trace&quot;],&quot;note&quot;:&quot;记录包保存运行和步骤来源、追加式结果日志、检查结果以及文件完整性哈希；信任和状态由日志推导。&quot;,&quot;section&quot;:&quot;Files in a record / Status / Trust&quot;,&quot;source&quot;:&quot;agent-qa-records&quot;},{&quot;status&quot;:&quot;yes&quot;,&quot;features&quot;:[&quot;owner.human&quot;,&quot;operation.forget&quot;,&quot;governance.control&quot;],&quot;note&quot;:&quot;人可确认、拒绝、遗忘记录或回滚学习批次；遗忘会退出搜索，purge 可删除本机记录，但不会改写 git 历史。&quot;,&quot;section&quot;:&quot;Correct / Roll back a batch / Purge a record&quot;,&quot;source&quot;:&quot;agent-qa-inspect&quot;}],&quot;name&quot;:&quot;agent-qa / memidex&quot;}]}&lt;/script&gt;
&lt;script id=&quot;harness-layers-script&quot;&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const root = document.getElementById(&#x27;memory-colored-layers&#x27;);
  const data = JSON.parse(document.getElementById(&#x27;harness-map-data&#x27;).textContent);
  const q = s =&gt; root.querySelector(s);
  const dims = data.dimensions, systems = data.systems;
  const names = {yes:&#x27;文档明确说明&#x27;, config:&#x27;需配置 / 特定条件&#x27;, unknown:&#x27;尚未核实&#x27;, no:&#x27;该范围明确不提供&#x27;};
  const symbols = {yes:&#x27;✓&#x27;, config:&#x27;△&#x27;, unknown:&#x27;?&#x27;, no:&#x27;×&#x27;};
  const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const state = {layers:dims.map((_,i)=&gt;i), visible:systems.map(s=&gt;s.id), system:&#x27;all&#x27;, view:&#x27;layers&#x27;, angle:-3, gap:100};
  const visibleSystems = () =&gt; systems.filter(s =&gt; state.visible.includes(s.id));
  const cell = (s, property) =&gt; s.claims.find(c=&gt;c.features.includes(property)) || {status:&#x27;unknown&#x27;, note:&#x27;当前资料尚不足以确认这一属性；不能据此判断不支持。&#x27;};
  const label = s =&gt; s.name + (s.historical ? &#x27;（历史）&#x27; : &#x27;&#x27;);
  const sourceLink = (id, text) =&gt; `&lt;a href=&quot;${esc(data.sources[id].url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;${esc(text || data.sources[id].label)} ↗&lt;/a&gt;`;
  let evidenceRequested = false;
  // The standalone host grows the iframe to its content height. Position dialogs
  // inside the visible part of that frame, not the centre of the entire document.
  window.addEventListener(&#x27;message&#x27;, event =&gt; {
    if (!evidenceRequested || event.source !== window.parent || event.data?.type !== &#x27;harness:viewport&#x27;) return;
    const {top, height} = event.data;
    if (!Number.isFinite(top) || !Number.isFinite(height) || height &lt;= 0) return;
    const dialog = q(&#x27;#cl-evidence&#x27;);
    dialog.style.maxHeight = Math.max(100, height - 32) + &#x27;px&#x27;;
    if (!dialog.open) {
      dialog.style.top = top + 16 + &#x27;px&#x27;;
      dialog.showModal();
      window.parent.postMessage({type:&#x27;harness:dialog-shown&#x27;}, &#x27;*&#x27;);
    }
    dialog.style.top = top + Math.max(16, (height - dialog.getBoundingClientRect().height) / 2) + &#x27;px&#x27;;
  });
  q(&#x27;#cl-evidence&#x27;).addEventListener(&#x27;close&#x27;, () =&gt; {
    evidenceRequested = false;
    window.parent.postMessage({type:&#x27;harness:dialog&#x27;, open:false}, &#x27;*&#x27;);
  });
  q(&#x27;#cl-subtitle&#x27;).textContent = `${systems.length} 个真实 Harness / Agent · 7 个视角 · ${systems.filter(s=&gt;s.historical).length} 个历史项目已标记 · ${data.checked}。${data.scope}`;
  q(&#x27;#cl-layer-controls&#x27;).innerHTML = dims.map((d,i)=&gt;`&lt;label class=&quot;form-check&quot;&gt;&lt;input type=&quot;checkbox&quot; data-layer=&quot;${i}&quot; checked&gt;&lt;span&gt;${i+1} ${esc(d.name)}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  q(&#x27;#cl-object-controls&#x27;).innerHTML = systems.map(s=&gt;`&lt;label class=&quot;form-check&quot; title=&quot;${esc(s.note)}&quot;&gt;&lt;input type=&quot;checkbox&quot; data-object=&quot;${esc(s.id)}&quot; checked&gt;&lt;span&gt;${esc(label(s))}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  q(&#x27;#cl-system&#x27;).innerHTML = &#x27;&lt;option value=&quot;all&quot;&gt;全部对象，不单独高亮&lt;/option&gt;&#x27; + systems.map(s=&gt;`&lt;option value=&quot;${esc(s.id)}&quot;&gt;${esc(label(s))}&lt;/option&gt;`).join(&#x27;&#x27;);

  function showEvidence(systemId, property) {
    const s = systems.find(x=&gt;x.id===systemId);
    const dim = dims.find(d=&gt;d.options.some(o=&gt;o.id===property));
    const option = dim.options.find(o=&gt;o.id===property), c = cell(s, property);
    q(&#x27;#cl-evidence-title&#x27;).textContent = `${s.name} · ${option.name}`;
    q(&#x27;#cl-evidence-body&#x27;).innerHTML = `&lt;p&gt;&lt;span class=&quot;cl-chip&quot; data-status=&quot;${c.status}&quot;&gt;${symbols[c.status]}&lt;/span&gt; &lt;strong&gt;${names[c.status]}&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;${esc(c.note)}&lt;/p&gt;&lt;dl&gt;&lt;dt&gt;这一属性指什么&lt;/dt&gt;&lt;dd&gt;${esc(option.definition)}&lt;/dd&gt;&lt;dt&gt;对象与配置范围&lt;/dt&gt;&lt;dd&gt;${esc(s.note)}&lt;/dd&gt;&lt;dt&gt;${c.source ? &#x27;判断依据&#x27; : &#x27;对象资料（尚不能证明该属性）&#x27;}&lt;/dt&gt;&lt;dd&gt;${sourceLink(c.source || s.identitySource)}${c.source ? `&lt;br&gt;${esc(c.section)} · ${esc(data.sources[c.source].kind)} · 核对 ${esc(data.sources[c.source].checked)}` : &#x27;&#x27;}&lt;/dd&gt;&lt;/dl&gt;&lt;p class=&quot;text-small&quot;&gt;图中为公开资料的属性映射，未运行这些系统或验证效果。各项可以重叠，不按色块数量排名。&lt;/p&gt;`;
    evidenceRequested = true;
    window.parent.postMessage({type:&#x27;harness:dialog&#x27;, open:true}, &#x27;*&#x27;);
  }

  let lastWidth = 0;
  function draw() {
    const svg = q(&#x27;#cl-scene&#x27;), shown = visibleSystems();
    const viewport = Math.max(250, q(&#x27;#cl-scroll&#x27;).clientWidth); lastWidth = viewport;
    const width = Math.max(viewport, 185 + shown.length * 132);
    const front = state.view===&#x27;front&#x27;, theta=(front?0:state.angle)*Math.PI/180;
    const co=Math.cos(theta), si=Math.sin(theta), elevation=front?1:.62;
    const rowDepth=36, planeDepth=rowDepth*Math.max(...dims.map(d=&gt;d.options.length));
    const planeWidth=(width-175-Math.abs(si)*planeDepth)/co, cellWidth=planeWidth/Math.max(1,shown.length);
    const project=(x,y)=&gt;[x*co-y*si,(x*si+y*co)*elevation];
    const corners=[[0,0],[planeWidth,0],[planeWidth,planeDepth],[0,planeDepth]].map(([x,y])=&gt;project(x,y));
    const minX=Math.min(...corners.map(p=&gt;p[0])), minY=Math.min(...corners.map(p=&gt;p[1]));
    const planeHeight=Math.max(...corners.map(p=&gt;p[1]))-minY;
    const gap=front?planeHeight+75:32+(planeHeight+75-32)*state.gap/100;
    const compact=!front&amp;&amp;gap&lt;planeHeight+55, top=70-minY, originX=150-minX;
    const pos=(x,y,k)=&gt;{const p=project(x,y);return [originX+p[0],top+p[1]+k*gap];};
    const points=ps=&gt;ps.map(p=&gt;p.map(v=&gt;v.toFixed(2)).join(&#x27;,&#x27;)).join(&#x27; &#x27;);
    const height=state.layers.length&amp;&amp;shown.length?Math.ceil(planeHeight+(state.layers.length-1)*gap+100):95;
    svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`); svg.style.width=`${width}px`; svg.style.height=`${height}px`;
    let markup=&#x27;&lt;title id=&quot;cl-scene-title&quot;&gt;真实 Harness 与 Agent 的记忆属性&lt;/title&gt;&lt;desc id=&quot;cl-scene-description&quot;&gt;列为真实对象，层为研究视角，行是属性。点击格子查看来源；下方有可用键盘操作的文字对照。&lt;/desc&gt;&#x27;;
    if (!shown.length || !state.layers.length) {
      svg.innerHTML=markup+`&lt;text x=&quot;12&quot; y=&quot;38&quot;&gt;${!shown.length?&#x27;请勾选至少一个对比对象。&#x27;:&#x27;请选择至少一个维度层。&#x27;}&lt;/text&gt;`; return;
    }
    const focusIndex=shown.findIndex(s=&gt;s.id===state.system);
    if (!front&amp;&amp;state.layers.length&gt;1&amp;&amp;focusIndex&gt;=0) {
      const a=pos((focusIndex+.5)*cellWidth,planeDepth/2,0),b=pos((focusIndex+.5)*cellWidth,planeDepth/2,state.layers.length-1);
      markup+=`&lt;line class=&quot;track&quot; x1=&quot;${a[0]}&quot; y1=&quot;${a[1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot;/&gt;`;
    }
    for(let k=state.layers.length-1;k&gt;=0;k--) {
      const d=state.layers[k],dim=dims[d],sheet=[[0,0],[planeWidth,0],[planeWidth,planeDepth],[0,planeDepth]].map(([x,y])=&gt;pos(x,y,k));
      markup+=`&lt;g data-layer-index=&quot;${d}&quot;&gt;&lt;polygon class=&quot;sheet&quot; points=&quot;${points(sheet)}&quot;/&gt;`;
      shown.forEach((s,i)=&gt;dim.options.forEach((o,j)=&gt;{
        const c=cell(s,o.id),x0=i*cellWidth+2,x1=(i+1)*cellWidth-2,y0=j*rowDepth+2,y1=(j+1)*rowDepth-2;
        const shape=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([x,y])=&gt;pos(x,y,k)),center=pos((i+.5)*cellWidth,(j+.5)*rowDepth,k);
        markup+=`&lt;g class=&quot;cl-cell&quot; data-system=&quot;${esc(s.id)}&quot; data-property=&quot;${o.id}&quot;&gt;&lt;title&gt;${esc(`${s.name} · ${o.name}：${names[c.status]}。点击查看依据`)}&lt;/title&gt;&lt;polygon class=&quot;status-cell&quot; data-status=&quot;${c.status}&quot; points=&quot;${points(shape)}&quot;/&gt;&lt;text class=&quot;cell-symbol&quot; x=&quot;${center[0]}&quot; y=&quot;${center[1]+4.5}&quot; text-anchor=&quot;middle&quot;&gt;${symbols[c.status]}&lt;/text&gt;&lt;/g&gt;`;
      }));
      if(focusIndex&gt;=0) {
