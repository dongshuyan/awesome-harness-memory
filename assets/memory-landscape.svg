<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">从七个问题理解 Agent Memory</title><desc id="desc">七个可交叉的导航视角，引向方法、系统、论文和评测。</desc><rect width="1000" height="760" fill="#f8f9f6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#23332e"><text x="46" y="58" font-size="28" font-weight="600">从七个问题理解 Memory</text><text x="46" y="92" font-size="17" fill="#586861">先看全景与方法，再进入原始资料、系统和评测。</text><text x="46" y="143" font-size="17" fill="#176c55">01</text><text x="94" y="143" font-size="20">谁在管理记忆？</text><text x="94" y="170" font-size="16" fill="#586861">Agent · Harness · 记忆服务 · 应用</text><line x1="46" x2="950" y1="187" y2="187" stroke="#dce3dc"/><text x="46" y="219" font-size="17" fill="#176c55">02</text><text x="94" y="219" font-size="20">记住什么？</text><text x="94" y="246" font-size="16" fill="#586861">事件 · 事实 · 流程 · 经验 · 关系</text><line x1="46" x2="950" y1="263" y2="263" stroke="#dce3dc"/><text x="46" y="295" font-size="17" fill="#176c55">03</text><text x="94" y="295" font-size="20">为谁保存，保留多久？</text><text x="94" y="322" font-size="16" fill="#586861">会话 · 项目 · 用户 · 团队 · 保留期</text><line x1="46" x2="950" y1="339" y2="339" stroke="#dce3dc"/><text x="46" y="371" font-size="17" fill="#176c55">04</text><text x="94" y="371" font-size="20">用什么保存和查找？</text><text x="94" y="398" font-size="16" fill="#586861">文件 · 结构化记录 · 检查点 · 索引 · 图</text><line x1="46" x2="950" y1="415" y2="415" stroke="#dce3dc"/><text x="46" y="447" font-size="17" fill="#176c55">05</text><text x="94" y="447" font-size="20">怎样形成和维护记忆？</text><text x="94" y="474" font-size="16" fill="#586861">记录 · 提取 · 整理 · 检索 · 修订 · 遗忘</text><line x1="46" x2="950" y1="491" y2="491" stroke="#dce3dc"/><text x="46" y="523" font-size="17" fill="#176c55">06</text><text x="94" y="523" font-size="20">记忆怎样进入下一次行动？</text><text x="94" y="550" font-size="16" fill="#586861">自动预载 · 主动查询 · 常驻 · 按需 · 行动</text><line x1="46" x2="950" y1="567" y2="567" stroke="#dce3dc"/><text x="46" y="599" font-size="17" fill="#176c55">07</text><text x="94" y="599" font-size="20">怎样让记忆可追溯、可控制？</text><text x="94" y="626" font-size="16" fill="#586861">权限 · 来源 · 冲突 · 撤销 · 投毒</text><line x1="46" x2="950" y1="643" y2="643" stroke="#dce3dc"/><text x="46" y="714" font-size="16" fill="#586861">可交叉的导航视角 · 非唯一分类 · 非七个必备模块</text></g></svg>