<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Nine questions about agent memory</title><desc id="desc">A source-labelled learning guide, from memory types to methods and implementations.</desc>
<rect width="1120" height="690" rx="12" fill="#f8f9f6"/><style>text{font-family:system-ui,PingFang SC,Microsoft YaHei,sans-serif;fill:#23332e}.h{font-size:29px;font-weight:650}.n{font-size:15px;fill:#176c55}.t{font-size:18px;font-weight:600}.s{font-size:13px;fill:#586861}</style>
<text x="32" y="48" class="h">Understand memory. Find a useful approach.</text>
<text x="32" y="80" class="s">TYPES → METHODS → SYSTEMS → EVIDENCE</text>
<rect x="32" y="110" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="50" y="138" class="n">01</text><text x="50" y="171" class="t">Memory Types</text>
<text x="50" y="201" class="s">Working and long-term; episodic, semantic,</text>
<text x="50" y="220" class="s">procedural; an alternative functional view</text>
<rect x="397" y="110" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="415" y="138" class="n">02</text><text x="415" y="171" class="t">Memory Control</text>
<text x="415" y="201" class="s">Agent decisions, harness triggers, component</text>
<text x="415" y="220" class="s">responsibilities</text>
<rect x="762" y="110" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="780" y="138" class="n">03</text><text x="780" y="171" class="t">Memory Scope</text>
<text x="780" y="201" class="s">Thread, task, project, user, agent, team</text>
<rect x="32" y="277" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="50" y="305" class="n">04</text><text x="50" y="338" class="t">Memory Retention</text>
<text x="50" y="368" class="s">Temporary or persistent retention, TTL,</text>
<text x="50" y="387" class="s">retention policies</text>
<rect x="397" y="277" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="415" y="305" class="n">05</text><text x="415" y="338" class="t">Memory Representation</text>
<text x="415" y="368" class="s">Raw records, summaries, fields, graphs,</text>
<text x="415" y="387" class="s">parameters, latent representations</text>
<rect x="762" y="277" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="780" y="305" class="n">06</text><text x="780" y="338" class="t">Memory Storage</text>
<text x="780" y="368" class="s">Runtime state, files, databases, checkpoints</text>
<rect x="32" y="444" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="50" y="472" class="n">07</text><text x="50" y="505" class="t">Memory Formation &amp; Update</text>
<text x="50" y="535" class="s">Recording, extraction, consolidation,</text>
<text x="50" y="554" class="s">revision, compaction, deletion</text>
<rect x="397" y="444" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="415" y="472" class="n">08</text><text x="415" y="505" class="t">Memory Retrieval &amp; Use</text>
<text x="415" y="535" class="s">Retrieval, selection, pinned context,</text>
<text x="415" y="554" class="s">on-demand reading, action</text>
<rect x="762" y="444" width="350" height="150" rx="6" fill="white" stroke="#dce3dc"/><text x="780" y="472" class="n">09</text><text x="780" y="505" class="t">Memory Access &amp; Trust</text>
<text x="780" y="535" class="s">Permissions, sharing, provenance,</text>
<text x="780" y="554" class="s">revocation, poisoning</text>
<text x="32" y="657" class="s">Editorial learning questions · named research taxonomies · no universal or exhaustive classification implied</text></svg>
