<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Seven questions about agent memory</title><desc id="desc">Seven overlapping perspectives linking methods, systems, papers, and evaluations.</desc><rect width="1000" height="760" fill="#f8f9f6"/><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif" fill="#23332e"><text x="46" y="58" font-size="28" font-weight="600">Seven questions about memory</text><text x="46" y="92" font-size="17" fill="#586861">Understand the landscape, then follow methods, systems, and original sources.</text><text x="46" y="143" font-size="17" fill="#176c55">01</text><text x="94" y="143" font-size="20">Who manages memory?</text><text x="94" y="170" font-size="16" fill="#586861">Agent · Harness · Memory service · Application</text><line x1="46" x2="950" y1="187" y2="187" stroke="#dce3dc"/><text x="46" y="219" font-size="17" fill="#176c55">02</text><text x="94" y="219" font-size="20">What is remembered?</text><text x="94" y="246" font-size="16" fill="#586861">Events · Facts · Procedures · Experience · Relations</text><line x1="46" x2="950" y1="263" y2="263" stroke="#dce3dc"/><text x="46" y="295" font-size="17" fill="#176c55">03</text><text x="94" y="295" font-size="20">Who is it for, and how long does it last?</text><text x="94" y="322" font-size="16" fill="#586861">Session · Project · User · Team · Retention</text><line x1="46" x2="950" y1="339" y2="339" stroke="#dce3dc"/><text x="46" y="371" font-size="17" fill="#176c55">04</text><text x="94" y="371" font-size="20">How is it stored and found?</text><text x="94" y="398" font-size="16" fill="#586861">Files · Records · Checkpoints · Indexes · Graphs</text><line x1="46" x2="950" y1="415" y2="415" stroke="#dce3dc"/><text x="46" y="447" font-size="17" fill="#176c55">05</text><text x="94" y="447" font-size="20">How is it formed and maintained?</text><text x="94" y="474" font-size="16" fill="#586861">Record · Extract · Consolidate · Retrieve · Revise · Forget</text><line x1="46" x2="950" y1="491" y2="491" stroke="#dce3dc"/><text x="46" y="523" font-size="17" fill="#176c55">06</text><text x="94" y="523" font-size="20">How does it inform the next action?</text><text x="94" y="550" font-size="16" fill="#586861">Preload · Query · Persistent context · On demand · Action</text><line x1="46" x2="950" y1="567" y2="567" stroke="#dce3dc"/><text x="46" y="599" font-size="17" fill="#176c55">07</text><text x="94" y="599" font-size="20">How is it traced and controlled?</text><text x="94" y="626" font-size="16" fill="#586861">Permissions · Provenance · Conflicts · Revocation · Poisoning</text><line x1="46" x2="950" y1="643" y2="643" stroke="#dce3dc"/><text x="46" y="714" font-size="16" fill="#586861">Overlapping perspectives, not a unique taxonomy or seven required modules</text></g></svg>